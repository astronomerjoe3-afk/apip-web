  <text x="72" y="98" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
    <tspan x="72" dy="0">Lock Mode and Slide Mode both stay</tspan>
    <tspan x="72" dy="38">close-packed</tspan>
  </text>
  <text x="72" y="170" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="72" dy="0">Solids keep fixed positions.</tspan>
    <tspan x="72" dy="28">Liquids keep closeness but let neighbors swap.</tspan>
  </text>

