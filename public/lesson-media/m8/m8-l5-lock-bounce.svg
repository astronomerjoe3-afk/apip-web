<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="lock-blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="lock-green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
    <marker id="lock-purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Critical Angle and Total Internal Reflection</text>
    <text x="42" y="96" fill="#475569" font-size="19">All three cases use the same Guide Line. The angle decides whether the ray escapes, skims, or reflects back inside.</text>

    <rect x="34" y="126" width="832" height="394" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="54" y="150" width="250" height="346" rx="24" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="2"/>
    <rect x="326" y="150" width="250" height="346" rx="24" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="2"/>
    <rect x="598" y="150" width="250" height="346" rx="24" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="2"/>

    <text x="80" y="186" fill="#0369A1" font-size="21" font-weight="700">Below the critical angle</text>
    <rect x="78" y="202" width="202" height="76" rx="18" fill="#DBEAFE"/>
    <rect x="78" y="278" width="202" height="160" rx="18" fill="#D6F5F0"/>
    <text x="96" y="242" fill="#1D4ED8" font-size="17" font-weight="700">less dense medium</text>
    <text x="96" y="330" fill="#166534" font-size="17" font-weight="700">denser medium</text>
    <line x1="180" y1="208" x2="180" y2="430" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="100" y1="278" x2="258" y2="278" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="396" x2="180" y2="278" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#lock-blue-arrow)"/>
    <line x1="180" y1="278" x2="238" y2="228" stroke="#047857" stroke-width="7" stroke-linecap="round" marker-end="url(#lock-green-arrow)"/>
    <text x="94" y="456" fill="#334155" font-size="16">A refracted ray still leaves the denser medium.</text>

    <text x="354" y="186" fill="#B45309" font-size="21" font-weight="700">At the critical angle</text>
    <rect x="350" y="202" width="202" height="76" rx="18" fill="#DBEAFE"/>
    <rect x="350" y="278" width="202" height="160" rx="18" fill="#D6F5F0"/>
    <text x="368" y="242" fill="#1D4ED8" font-size="17" font-weight="700">less dense medium</text>
    <text x="368" y="330" fill="#166534" font-size="17" font-weight="700">denser medium</text>
    <line x1="452" y1="208" x2="452" y2="430" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="372" y1="278" x2="530" y2="278" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="392" y1="392" x2="452" y2="278" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#lock-blue-arrow)"/>
    <line x1="452" y1="278" x2="526" y2="278" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>
    <text x="362" y="456" fill="#334155" font-size="16">The refracted ray skims exactly along the boundary.</text>

    <text x="626" y="186" fill="#7C3AED" font-size="21" font-weight="700">Above the critical angle</text>
    <rect x="622" y="202" width="202" height="76" rx="18" fill="#DBEAFE"/>
    <rect x="622" y="278" width="202" height="160" rx="18" fill="#D6F5F0"/>
    <text x="640" y="242" fill="#1D4ED8" font-size="17" font-weight="700">less dense medium</text>
    <text x="640" y="330" fill="#166534" font-size="17" font-weight="700">denser medium</text>
    <line x1="724" y1="208" x2="724" y2="430" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="644" y1="278" x2="802" y2="278" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
    <line x1="664" y1="388" x2="724" y2="278" stroke="#2563EB" stroke-width="7" stroke-linecap="round" marker-end="url(#lock-blue-arrow)"/>
    <line x1="724" y1="278" x2="792" y2="382" stroke="#7C3AED" stroke-width="7" stroke-linecap="round" marker-end="url(#lock-purple-arrow)"/>
    <text x="642" y="456" fill="#334155" font-size="16">No refracted ray forms; the ray reflects back inside.</text>
  </g>
</svg>
