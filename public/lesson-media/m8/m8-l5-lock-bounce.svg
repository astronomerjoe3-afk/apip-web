<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#ECFEFF"/>
  <text x="48" y="64" fill="#0F172A" font-size="34" font-weight="700">Escape Edge and Lock-Bounce</text>
  <text x="48" y="108" fill="#475569" font-size="20">Critical-angle reasoning is strongest when escape, skim, and total internal reflection stay in one picture.</text>
  <rect x="48" y="148" width="804" height="308" rx="28" fill="#CFFAFE" stroke="#06B6D4" stroke-width="4"/>
  <line x1="84" y1="300" x2="816" y2="300" stroke="#0F172A" stroke-width="4"/>
  <line x1="450" y1="148" x2="450" y2="456" stroke="#0891B2" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M450 300 L360 410" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 300 H640" stroke="#D97706" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 300 L310 206" stroke="#7C3AED" stroke-width="10" stroke-linecap="round"/>
  <text x="82" y="188" fill="#0369A1" font-size="22" font-weight="700">Escape below the limit</text>
  <text x="82" y="224" fill="#D97706" font-size="22" font-weight="700">Skim at the critical angle</text>
  <text x="82" y="260" fill="#7C3AED" font-size="22" font-weight="700">Lock-Bounce above the limit</text>
  <text x="82" y="418" fill="#334155" font-size="22">Total internal reflection needs the correct medium direction as well as the angle condition.</text>
</svg>
