<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="spread-blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="spread-green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Diverging Lens: Virtual Image Ray Diagram</text>
    <text x="42" y="96" fill="#475569" font-size="19">Real rays spread after the lens. Dashed backward extensions show the upright virtual image.</text>

    <rect x="34" y="126" width="832" height="394" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="54" y="150" width="610" height="346" rx="26" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="2"/>
    <rect x="684" y="150" width="162" height="346" rx="26" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/>

    <line x1="86" y1="334" x2="636" y2="334" stroke="#CBD5E1" stroke-width="4"/>
    <text x="500" y="324" fill="#475569" font-size="17" font-weight="600">principal axis</text>
    <path d="M430 228 C404 254 404 414 430 440" stroke="#60A5FA" stroke-width="4" fill="none"/>
    <path d="M430 228 C456 254 456 414 430 440" stroke="#60A5FA" stroke-width="4" fill="none"/>
    <circle cx="430" cy="334" r="5" fill="#0F172A"/>
    <text x="444" y="322" fill="#334155" font-size="16" font-weight="700">optical center</text>

    <circle cx="300" cy="334" r="6" fill="#0F172A"/>
    <circle cx="220" cy="334" r="6" fill="#0F172A"/>
    <circle cx="560" cy="334" r="6" fill="#0F172A"/>
    <circle cx="640" cy="334" r="6" fill="#0F172A"/>
    <text x="294" y="362" fill="#334155" font-size="17" font-weight="700">F</text>
    <text x="208" y="362" fill="#334155" font-size="17" font-weight="700">2F</text>
    <text x="552" y="362" fill="#334155" font-size="17" font-weight="700">F</text>
    <text x="628" y="362" fill="#334155" font-size="17" font-weight="700">2F</text>

    <line x1="170" y1="334" x2="170" y2="244" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <line x1="162" y1="252" x2="178" y2="252" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <polygon points="170,226 154,256 186,256" fill="#2563EB"/>
    <text x="134" y="362" fill="#1D4ED8" font-size="18" font-weight="700">object</text>

    <line x1="170" y1="244" x2="430" y2="244" stroke="#2563EB" stroke-width="6" stroke-linecap="round"/>
    <line x1="430" y1="244" x2="624" y2="186" stroke="#2563EB" stroke-width="6" stroke-linecap="round" marker-end="url(#spread-blue-arrow)"/>
    <line x1="430" y1="244" x2="300" y2="334" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>

    <line x1="170" y1="244" x2="430" y2="334" stroke="#0F766E" stroke-width="6" stroke-linecap="round"/>
    <line x1="430" y1="334" x2="624" y2="388" stroke="#0F766E" stroke-width="6" stroke-linecap="round" marker-end="url(#spread-green-arrow)"/>
    <line x1="430" y1="334" x2="322" y2="296" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 8" stroke-linecap="round"/>

    <line x1="322" y1="334" x2="322" y2="296" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8"/>
    <line x1="314" y1="304" x2="330" y2="304" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8"/>
    <polygon points="322,278 306,308 338,308" fill="#7C3AED"/>
    <text x="258" y="362" fill="#6D28D9" font-size="18" font-weight="700">virtual image</text>

    <text x="702" y="190" fill="#0F172A" font-size="22" font-weight="700">Ray rules</text>
    <text x="702" y="236" fill="#334155" font-size="17">1. Parallel ray</text>
    <text x="702" y="260" fill="#334155" font-size="17">refracts as if from F.</text>
    <text x="702" y="316" fill="#334155" font-size="17">2. Central ray</text>
    <text x="702" y="340" fill="#334155" font-size="17">continues straight.</text>
    <text x="702" y="410" fill="#0F172A" font-size="19" font-weight="700">Only the dashed extensions meet,</text>
    <text x="702" y="434" fill="#0F172A" font-size="19" font-weight="700">so the image is virtual.</text>
  </g>
</svg>
