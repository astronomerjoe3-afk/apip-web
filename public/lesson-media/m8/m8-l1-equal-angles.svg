<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m8-equal-blue-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2563EB"/>
    </marker>
    <marker id="m8-equal-green-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Equal Angles to the Guide Line</text>
    <text x="42" y="96" fill="#475569" font-size="19">Reflection is symmetry about the normal. Read both angles from the same perpendicular reference line.</text>

    <rect x="34" y="128" width="832" height="392" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="58" y="154" width="518" height="340" rx="26" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <rect x="602" y="154" width="230" height="340" rx="26" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="3"/>

    <rect x="118" y="178" width="164" height="38" rx="19" fill="#DBEAFE"/>
    <rect x="336" y="178" width="170" height="38" rx="19" fill="#D1FAE5"/>
    <rect x="252" y="196" width="116" height="38" rx="19" fill="#E0F2FE"/>
    <text x="140" y="203" dy="0.35em" fill="#1D4ED8" font-size="18" font-weight="700">incoming route</text>
    <text x="360" y="203" dy="0.35em" fill="#047857" font-size="18" font-weight="700">reflected route</text>
    <text x="276" y="221" fill="#0369A1" font-size="18" font-weight="700">Guide Line</text>

    <line x1="126" y1="360" x2="510" y2="360" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <text x="235" y="396" fill="#475569" font-size="19" font-weight="600">mirror surface</text>

    <line x1="318" y1="190" x2="318" y2="470" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <circle cx="318" cy="360" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>

    <line x1="186" y1="212" x2="318" y2="360" stroke="#2563EB" stroke-width="10" stroke-linecap="round" marker-end="url(#m8-equal-blue-arrow)"/>
    <line x1="318" y1="360" x2="450" y2="212" stroke="#0F766E" stroke-width="10" stroke-linecap="round" marker-end="url(#m8-equal-green-arrow)"/>

    <path d="M318 278 A82 82 0 0 0 262 310" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M318 278 A82 82 0 0 1 374 310" stroke="#0F766E" stroke-width="4" fill="none" stroke-linecap="round"/>

    <rect x="156" y="286" width="148" height="40" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="332" y="286" width="154" height="40" rx="18" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="174" y="311" fill="#1D4ED8" font-size="17" font-weight="700">incident angle i</text>
    <text x="350" y="311" fill="#047857" font-size="17" font-weight="700">reflected angle r</text>

    <text x="220" y="338" fill="#1D4ED8" font-size="21" font-weight="700">40 deg</text>
    <text x="386" y="338" fill="#047857" font-size="21" font-weight="700">40 deg</text>

    <path d="M318 360 V332 H346" stroke="#64748B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="112" y="420" width="412" height="48" rx="18" fill="#FFFFFF" stroke="#D6E4F5" stroke-width="2"/>
    <text x="318" y="450" fill="#0F172A" font-size="20" font-weight="700" text-anchor="middle">Both angles are measured from the same Guide Line.</text>

    <text x="630" y="194" fill="#0F172A" font-size="24" font-weight="700">Read the diagram in order</text>

    <circle cx="630" cy="240" r="14" fill="#DBEAFE"/>
    <circle cx="630" cy="300" r="14" fill="#DBEAFE"/>
    <circle cx="630" cy="360" r="14" fill="#DBEAFE"/>
    <text x="630" y="245" fill="#1D4ED8" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text x="630" y="305" fill="#1D4ED8" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text x="630" y="365" fill="#1D4ED8" font-size="16" font-weight="700" text-anchor="middle">3</text>

    <text x="658" y="246" fill="#334155" font-size="18">Draw the Guide Line through the hit point.</text>
    <text x="658" y="306" fill="#334155" font-size="18">Measure the incident angle to that line.</text>
    <text x="658" y="366" fill="#334155" font-size="18">Match it on the reflected side.</text>

    <rect x="646" y="410" width="140" height="50" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="716" y="442" fill="#0F172A" font-size="28" font-weight="700" text-anchor="middle">i = r</text>
  </g>
</svg>
