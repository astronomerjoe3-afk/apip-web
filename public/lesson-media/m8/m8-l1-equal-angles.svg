<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m8-equal-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#2563EB"/>
    </marker>
    <marker id="m8-equal-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0F766E"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="32" fill="#F8FAFC"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="44" y="58" fill="#0F172A" font-size="34" font-weight="700">Equal Angles to the Guide Line</text>
    <text x="44" y="96" fill="#475569" font-size="20">Measure both angles from the normal through the point of incidence, not from the mirror surface.</text>

    <rect x="40" y="128" width="820" height="382" rx="30" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="64" y="152" width="508" height="326" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <rect x="596" y="152" width="236" height="326" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

    <line x1="118" y1="344" x2="520" y2="344" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <text x="216" y="378" fill="#475569" font-size="19" font-weight="600">mirror surface</text>
    <line x1="320" y1="188" x2="320" y2="448" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 12"/>
    <circle cx="320" cy="344" r="12" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>

    <line x1="176" y1="188" x2="320" y2="344" stroke="#2563EB" stroke-width="10" stroke-linecap="round" marker-end="url(#m8-equal-blue)"/>
    <line x1="320" y1="344" x2="464" y2="188" stroke="#0F766E" stroke-width="10" stroke-linecap="round" marker-end="url(#m8-equal-green)"/>

    <path d="M320 258 A88 88 0 0 0 264 288" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M320 258 A88 88 0 0 1 376 288" stroke="#0F766E" stroke-width="4" fill="none" stroke-linecap="round"/>

    <rect x="116" y="166" width="156" height="38" rx="19" fill="#DBEAFE"/>
    <rect x="368" y="166" width="158" height="38" rx="19" fill="#D1FAE5"/>
    <text x="136" y="191" fill="#1D4ED8" font-size="19" font-weight="700">incoming route</text>
    <text x="388" y="191" fill="#047857" font-size="19" font-weight="700">reflected route</text>

    <rect x="270" y="200" width="100" height="34" rx="17" fill="#E0F2FE"/>
    <text x="286" y="223" fill="#0369A1" font-size="18" font-weight="700">Guide Line</text>

    <rect x="188" y="258" width="110" height="36" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <rect x="342" y="258" width="110" height="36" rx="18" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="205" y="282" fill="#1D4ED8" font-size="18" font-weight="700">i = 40 deg</text>
    <text x="359" y="282" fill="#047857" font-size="18" font-weight="700">r = 40 deg</text>

    <text x="620" y="190" fill="#0F172A" font-size="22" font-weight="700">Read it in three steps</text>
    <circle cx="624" cy="228" r="12" fill="#DBEAFE"/>
    <circle cx="624" cy="282" r="12" fill="#DBEAFE"/>
    <circle cx="624" cy="336" r="12" fill="#DBEAFE"/>
    <text x="620" y="233" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">1</text>
    <text x="620" y="287" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">2</text>
    <text x="620" y="341" fill="#1D4ED8" font-size="15" font-weight="700" text-anchor="middle">3</text>
    <text x="646" y="234" fill="#334155" font-size="17">Draw the Guide Line through the hit point.</text>
    <text x="646" y="288" fill="#334155" font-size="17">Measure the incident angle to that line.</text>
    <text x="646" y="342" fill="#334155" font-size="17">Set the reflected angle equal to it.</text>

    <rect x="618" y="384" width="190" height="42" rx="18" fill="#E0F2FE"/>
    <text x="713" y="411" fill="#0F172A" font-size="24" font-weight="700" text-anchor="middle">i = r</text>
    <rect x="108" y="404" width="420" height="50" rx="18" fill="#FFFFFF" opacity="0.96"/>
    <text x="318" y="435" fill="#334155" font-size="20" text-anchor="middle">Both angles are measured from the same Guide Line.</text>
  </g>
</svg>
