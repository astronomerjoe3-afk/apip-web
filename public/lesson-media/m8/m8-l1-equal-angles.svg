<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#F8FAFC"/>
  <text x="48" y="64" fill="#0F172A" font-size="34" font-weight="700">Equal Angles to the Guide Line</text>
  <text x="48" y="108" fill="#475569" font-size="20">Read the incoming and outgoing angles from the same perpendicular reference line.</text>

  <rect x="64" y="148" width="772" height="308" rx="28" fill="#EFF6FF" stroke="#60A5FA" stroke-width="4"/>
  <line x1="170" y1="318" x2="730" y2="318" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
  <line x1="450" y1="164" x2="450" y2="442" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 12"/>

  <path d="M288 170 L450 318" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 318 L612 170" stroke="#0F766E" stroke-width="10" stroke-linecap="round"/>
  <circle cx="450" cy="318" r="10" fill="#F59E0B"/>

  <path d="M450 230 C420 246 402 270 394 296" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <path d="M450 230 C480 246 498 270 506 296" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>

  <text x="320" y="182" fill="#1D4ED8" font-size="20" font-weight="700">Incoming route</text>
  <text x="523" y="182" fill="#0F766E" font-size="20" font-weight="700">Reflected route</text>
  <text x="470" y="192" fill="#0369A1" font-size="19" font-weight="700">Guide Line</text>
  <text x="346" y="262" fill="#1D4ED8" font-size="18">same angle in</text>
  <text x="494" y="262" fill="#0F766E" font-size="18">same angle out</text>
  <text x="314" y="344" fill="#475569" font-size="18">Mirror surface</text>

  <rect x="110" y="378" width="298" height="48" rx="20" fill="white"/>
  <rect x="492" y="378" width="298" height="48" rx="20" fill="white"/>
  <text x="136" y="409" fill="#334155" font-size="18">Use the Guide Line before naming any angle.</text>
  <text x="525" y="409" fill="#334155" font-size="18">The reflected angle matches the incoming one.</text>
</svg>
