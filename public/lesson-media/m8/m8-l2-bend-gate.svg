<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="bend-blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="bend-green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Refraction: Toward or Away from the Guide Line</text>
    <text x="42" y="96" fill="#475569" font-size="19">The boundary changes the ray speed. The source still sets the frequency, so the bending comes from the new medium.</text>

    <rect x="34" y="126" width="832" height="394" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="58" y="154" width="370" height="340" rx="28" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="3"/>
    <rect x="472" y="154" width="370" height="340" rx="28" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="3"/>

    <text x="86" y="194" fill="#0F172A" font-size="22" font-weight="700">Entering a slower medium</text>
    <rect x="86" y="210" width="314" height="100" rx="18" fill="#DBEAFE"/>
    <rect x="86" y="310" width="314" height="140" rx="18" fill="#DCFCE7"/>
    <text x="110" y="246" fill="#1D4ED8" font-size="19" font-weight="700">faster medium</text>
    <text x="110" y="350" fill="#166534" font-size="19" font-weight="700">slower medium</text>
    <line x1="244" y1="214" x2="244" y2="446" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="204" y="238" fill="#0369A1" font-size="17" font-weight="700">Guide Line</text>
    <line x1="120" y1="310" x2="366" y2="310" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <line x1="138" y1="232" x2="244" y2="310" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#bend-blue-arrow)"/>
    <line x1="244" y1="310" x2="294" y2="424" stroke="#047857" stroke-width="8" stroke-linecap="round" marker-end="url(#bend-green-arrow)"/>
    <path d="M244 254 A56 56 0 0 0 206 284" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M244 366 A56 56 0 0 1 266 416" stroke="#047857" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="180" y="286" fill="#1D4ED8" font-size="18" font-weight="700">i</text>
    <text x="274" y="400" fill="#047857" font-size="18" font-weight="700">r</text>
    <rect x="112" y="454" width="262" height="28" rx="14" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="243" y="473" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">r is smaller, so the ray bends toward the Guide Line.</text>

    <text x="500" y="194" fill="#0F172A" font-size="22" font-weight="700">Entering a faster medium</text>
    <rect x="500" y="210" width="314" height="100" rx="18" fill="#DCFCE7"/>
    <rect x="500" y="310" width="314" height="140" rx="18" fill="#DBEAFE"/>
    <text x="524" y="246" fill="#166534" font-size="19" font-weight="700">slower medium</text>
    <text x="524" y="350" fill="#1D4ED8" font-size="19" font-weight="700">faster medium</text>
    <line x1="658" y1="214" x2="658" y2="446" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <text x="618" y="238" fill="#0369A1" font-size="17" font-weight="700">Guide Line</text>
    <line x1="534" y1="310" x2="780" y2="310" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <line x1="566" y1="422" x2="658" y2="310" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#bend-blue-arrow)"/>
    <line x1="658" y1="310" x2="778" y2="232" stroke="#047857" stroke-width="8" stroke-linecap="round" marker-end="url(#bend-green-arrow)"/>
    <path d="M658 374 A64 64 0 0 0 612 416" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M658 246 A88 88 0 0 1 738 274" stroke="#047857" stroke-width="4" fill="none" stroke-linecap="round"/>
    <text x="604" y="410" fill="#1D4ED8" font-size="18" font-weight="700">i</text>
    <text x="734" y="272" fill="#047857" font-size="18" font-weight="700">r</text>
    <rect x="526" y="454" width="262" height="28" rx="14" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="657" y="473" fill="#0F172A" font-size="16" font-weight="700" text-anchor="middle">r is larger, so the ray bends away from the Guide Line.</text>
  </g>
</svg>
