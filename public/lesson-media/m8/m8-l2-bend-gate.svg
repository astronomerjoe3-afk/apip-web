<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#F8FAFC"/>
  <text x="48" y="64" fill="#0F172A" font-size="34" font-weight="700">Bend Gates, Fast Zones, and Slow Zones</text>
  <text x="48" y="108" fill="#475569" font-size="20">Refraction changes route direction because light speed changes across the boundary.</text>
  <rect x="48" y="148" width="804" height="308" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <rect x="450" y="148" width="402" height="308" rx="0" fill="#DCFCE7"/>
  <line x1="450" y1="148" x2="450" y2="456" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M450 290 L320 210" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M450 290 L570 230" stroke="#16A34A" stroke-width="10" stroke-linecap="round"/>
  <text x="88" y="190" fill="#1D4ED8" font-size="22" font-weight="700">Fast zone</text>
  <text x="548" y="190" fill="#166534" font-size="22" font-weight="700">Slow zone</text>
  <text x="476" y="234" fill="#0369A1" font-size="20" font-weight="700">Guide Line</text>
  <text x="88" y="404" fill="#334155" font-size="22">Toward the Guide Line means the new zone is slower.</text>
  <text x="88" y="440" fill="#334155" font-size="22">Away from the Guide Line means the new zone is faster.</text>
</svg>
