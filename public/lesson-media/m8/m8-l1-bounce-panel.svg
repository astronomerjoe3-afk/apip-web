<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="mirror-blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="mirror-green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/>
    </marker>
    <marker id="mirror-purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="33" font-weight="700">Plane Mirror: Surface Rule and Image Rule</text>
    <text x="42" y="95" fill="#475569" font-size="18">Use one view for surface geometry and another for the virtual image behind the mirror.</text>

    <rect x="34" y="126" width="832" height="356" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="50" y="144" width="388" height="320" rx="26" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3"/>
    <rect x="462" y="144" width="388" height="320" rx="26" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/>

    <text x="74" y="178" fill="#0F172A" font-size="23" font-weight="700">1. What the mirror does at the hit point</text>
    <line x1="102" y1="334" x2="390" y2="334" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <line x1="246" y1="198" x2="246" y2="426" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <circle cx="246" cy="334" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="144" y1="218" x2="246" y2="334" stroke="#2563EB" stroke-width="9" stroke-linecap="round" marker-end="url(#mirror-blue-arrow)"/>
    <line x1="246" y1="334" x2="348" y2="218" stroke="#0F766E" stroke-width="9" stroke-linecap="round" marker-end="url(#mirror-green-arrow)"/>
    <path d="M246 252 A78 78 0 0 0 194 280" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M246 252 A78 78 0 0 1 298 280" stroke="#0F766E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="120" y="200" width="126" height="34" rx="17" fill="#DBEAFE"/>
    <rect x="248" y="200" width="126" height="34" rx="17" fill="#D1FAE5"/>
    <text x="137" y="222" fill="#1D4ED8" font-size="17" font-weight="700">incoming route</text>
    <text x="267" y="222" fill="#047857" font-size="17" font-weight="700">reflected route</text>
    <text x="188" y="286" fill="#1D4ED8" font-size="18" font-weight="700">i</text>
    <text x="296" y="286" fill="#047857" font-size="18" font-weight="700">r</text>
    <text x="224" y="360" fill="#334155" font-size="18" font-weight="600">mirror surface</text>
    <rect x="84" y="388" width="320" height="48" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="244" y="418" fill="#0F172A" font-size="20" font-weight="700" text-anchor="middle">Angles are read from the Guide Line.</text>

    <text x="486" y="178" fill="#0F172A" font-size="23" font-weight="700">2. Where the image appears to come from</text>
    <line x1="652" y1="192" x2="652" y2="414" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <text x="631" y="432" fill="#475569" font-size="18">mirror</text>

    <line x1="548" y1="364" x2="548" y2="252" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#mirror-blue-arrow)"/>
    <line x1="542" y1="260" x2="554" y2="260" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <text x="520" y="386" fill="#1D4ED8" font-size="18" font-weight="700">object</text>

    <path d="M548 252 L652 266 L596 312" stroke="#0F766E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M548 252 L652 350 L596 312" stroke="#2563EB" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M652 266 L754 252" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 10" fill="none" stroke-linecap="round"/>
    <path d="M652 350 L754 364" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 10" fill="none" stroke-linecap="round"/>

    <circle cx="596" cy="312" r="14" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
    <circle cx="602" cy="312" r="6" fill="#334155"/>
    <text x="578" y="288" fill="#334155" font-size="17" font-weight="700">eye</text>

    <line x1="756" y1="364" x2="756" y2="252" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" marker-end="url(#mirror-purple-arrow)"/>
    <line x1="750" y1="260" x2="762" y2="260" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
    <text x="706" y="386" fill="#6D28D9" font-size="18" font-weight="700">virtual image</text>

    <rect x="506" y="392" width="300" height="44" rx="18" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="656" y="420" fill="#0F172A" font-size="18" font-weight="700" text-anchor="middle">Dashed extensions place the virtual image.</text>
  </g>
</svg>
