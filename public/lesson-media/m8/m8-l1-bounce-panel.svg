<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#F8FAFC"/>
  <text x="48" y="64" fill="#0F172A" font-size="34" font-weight="700">Bounce Panel and Guide Line</text>
  <text x="48" y="108" fill="#475569" font-size="20">Reflection is read from the Guide Line normal, not from the mirror surface.</text>
  <rect x="48" y="148" width="360" height="308" rx="28" fill="#E0F2FE" stroke="#38BDF8" stroke-width="4"/>
  <rect x="500" y="148" width="352" height="308" rx="28" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="4"/>
  <rect x="218" y="182" width="14" height="230" rx="7" fill="#94A3B8"/>
  <line x1="225" y1="182" x2="225" y2="412" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="10 10"/>
  <path d="M224 286 L132 208" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M224 286 L316 208" stroke="#0F766E" stroke-width="10" stroke-linecap="round"/>
  <path d="M224 286 L304 286" stroke="#A855F7" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="86" y="188" fill="#0369A1" font-size="20" font-weight="700">Mirror geometry</text>
  <text x="78" y="430" fill="#334155" font-size="19">Incident and reflected angles match around the Guide Line.</text>
  <text x="530" y="188" fill="#6D28D9" font-size="20" font-weight="700">Image status</text>
  <text x="530" y="236" fill="#334155" font-size="26">Ghost image</text>
  <text x="530" y="276" fill="#334155" font-size="22">Found by backward extensions</text>
  <text x="530" y="316" fill="#334155" font-size="22">Not real light behind the mirror</text>
  <text x="530" y="366" fill="#334155" font-size="22">Surface angles must be converted</text>
  <text x="530" y="406" fill="#334155" font-size="22">before the mirror rule is used.</text>
</svg>
