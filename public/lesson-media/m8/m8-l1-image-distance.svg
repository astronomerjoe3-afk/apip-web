<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m8-distance-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#059669"/>
    </marker>
    <marker id="m8-distance-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="900" height="560" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Plane-Mirror Distance Rule</text>
    <text x="42" y="96" fill="#475569" font-size="19">Measure the object and image distances perpendicular to the mirror. They match exactly.</text>

    <rect x="50" y="136" width="800" height="362" rx="28" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <line x1="450" y1="170" x2="450" y2="448" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <text x="424" y="474" fill="#475569" font-size="20" font-weight="600">mirror</text>

    <line x1="234" y1="404" x2="234" y2="256" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
    <line x1="226" y1="264" x2="242" y2="264" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
    <polygon points="234,238 218,268 250,268" fill="#2563EB"/>
    <text x="188" y="432" fill="#1D4ED8" font-size="21" font-weight="700">object</text>

    <line x1="666" y1="404" x2="666" y2="256" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 8"/>
    <line x1="658" y1="264" x2="674" y2="264" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" stroke-dasharray="10 8"/>
    <polygon points="666,238 650,268 682,268" fill="#7C3AED"/>
    <text x="612" y="432" fill="#6D28D9" font-size="21" font-weight="700">virtual image</text>

    <line x1="234" y1="256" x2="666" y2="256" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 8"/>
    <line x1="234" y1="420" x2="666" y2="420" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 8"/>

    <line x1="246" y1="212" x2="438" y2="212" stroke="#059669" stroke-width="4" marker-start="url(#m8-distance-green)" marker-end="url(#m8-distance-green)"/>
    <line x1="462" y1="212" x2="654" y2="212" stroke="#D97706" stroke-width="4" marker-start="url(#m8-distance-orange)" marker-end="url(#m8-distance-orange)"/>
    <text x="342" y="198" fill="#059669" font-size="19" font-weight="700" text-anchor="middle">object distance</text>
    <text x="558" y="198" fill="#D97706" font-size="19" font-weight="700" text-anchor="middle">image distance</text>

    <text x="342" y="238" fill="#059669" font-size="22" font-weight="700" text-anchor="middle">5 cm</text>
    <text x="558" y="238" fill="#D97706" font-size="22" font-weight="700" text-anchor="middle">5 cm</text>

    <rect x="182" y="446" width="538" height="34" rx="16" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2"/>
    <text x="451" y="468" fill="#92400E" font-size="18" font-weight="700" text-anchor="middle">The image is the same distance behind the mirror as the object is in front.</text>
  </g>
</svg>
