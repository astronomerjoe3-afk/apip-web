<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="distance-green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#047857"/>
    </marker>
    <marker id="distance-orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#B45309"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Plane-Mirror Distance Symmetry</text>
    <text x="42" y="96" fill="#475569" font-size="18">Object distance and image distance are equal when measured perpendicular to a plane mirror.</text>

    <rect x="34" y="126" width="832" height="356" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="74" y="158" width="752" height="292" rx="24" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="2"/>

    <line x1="450" y1="176" x2="450" y2="430" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <text x="430" y="446" fill="#475569" font-size="18">mirror</text>

    <line x1="248" y1="382" x2="248" y2="238" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <line x1="242" y1="246" x2="254" y2="246" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <text x="214" y="404" fill="#1D4ED8" font-size="19" font-weight="700">object</text>

    <line x1="652" y1="382" x2="652" y2="238" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 8"/>
    <line x1="646" y1="246" x2="658" y2="246" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 8"/>
    <text x="592" y="404" fill="#6D28D9" font-size="19" font-weight="700">virtual image</text>

    <line x1="264" y1="200" x2="434" y2="200" stroke="#047857" stroke-width="4" marker-start="url(#distance-green-arrow)" marker-end="url(#distance-green-arrow)"/>
    <line x1="466" y1="200" x2="636" y2="200" stroke="#B45309" stroke-width="4" marker-start="url(#distance-orange-arrow)" marker-end="url(#distance-orange-arrow)"/>
    <text x="349" y="188" fill="#047857" font-size="20" font-weight="700" text-anchor="middle">5 cm</text>
    <text x="551" y="188" fill="#B45309" font-size="20" font-weight="700" text-anchor="middle">5 cm</text>

    <line x1="248" y1="238" x2="450" y2="238" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 8"/>
    <line x1="450" y1="238" x2="652" y2="238" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="6 8"/>

    <rect x="288" y="382" width="332" height="42" rx="17" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
    <text x="454" y="409" fill="#92400E" font-size="21" font-weight="700" text-anchor="middle">Perpendicular distance rule: d_o = d_i</text>
  </g>
</svg>
