<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#F8FAFC"/>
  <text x="48" y="64" fill="#0F172A" font-size="34" font-weight="700">Plane-Mirror Symmetry</text>
  <text x="48" y="108" fill="#475569" font-size="20">The image forms the same distance behind the mirror as the object sits in front.</text>

  <rect x="64" y="148" width="772" height="308" rx="28" fill="#FFFBEB" stroke="#FBBF24" stroke-width="4"/>
  <rect x="446" y="176" width="18" height="248" rx="9" fill="#94A3B8"/>
  <text x="420" y="446" fill="#475569" font-size="18">Mirror</text>

  <line x1="262" y1="350" x2="262" y2="244" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <line x1="238" y1="350" x2="286" y2="350" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <polygon points="262,226 244,260 280,260" fill="#2563EB"/>
  <text x="196" y="388" fill="#1D4ED8" font-size="20" font-weight="700">Object</text>

  <line x1="648" y1="350" x2="648" y2="244" stroke="#A855F7" stroke-width="10" stroke-dasharray="12 10" stroke-linecap="round"/>
  <line x1="624" y1="350" x2="672" y2="350" stroke="#A855F7" stroke-width="10" stroke-dasharray="12 10" stroke-linecap="round"/>
  <polygon points="648,226 630,260 666,260" fill="#A855F7"/>
  <text x="574" y="388" fill="#7C3AED" font-size="20" font-weight="700">Image</text>

  <line x1="278" y1="196" x2="434" y2="196" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  <polygon points="278,196 294,188 294,204" fill="#0F766E"/>
  <polygon points="434,196 418,188 418,204" fill="#0F766E"/>
  <text x="320" y="182" fill="#0F766E" font-size="20" font-weight="700">5 cm</text>

  <line x1="478" y1="196" x2="634" y2="196" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <polygon points="478,196 494,188 494,204" fill="#D97706"/>
  <polygon points="634,196 618,188 618,204" fill="#D97706"/>
  <text x="520" y="182" fill="#D97706" font-size="20" font-weight="700">5 cm</text>

  <text x="134" y="422" fill="#334155" font-size="19">Same distance in front of the mirror.</text>
  <text x="536" y="422" fill="#334155" font-size="19">Same distance behind the mirror.</text>
</svg>
