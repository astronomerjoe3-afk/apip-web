  <path d="M652 360 L758 332" stroke="#0F766E" stroke-width="4" stroke-dasharray="10 10"/>
  <circle cx="758" cy="308" r="10" fill="#A855F7"/>
  <text x="78" y="430" fill="#334155" font-size="20">Real routes cross at the image.</text>
  <text x="512" y="430" fill="#334155" font-size="20">Extensions locate the ghost image.</text>
