  <line x1="88" y1="308" x2="380" y2="308" stroke="#CBD5E1" stroke-width="4"/>
  <ellipse cx="236" cy="308" rx="18" ry="72" fill="#C4B5FD"/>
  <path d="M118 308 H236" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M236 308 L340 256" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M118 308 L236 260" stroke="#0F766E" stroke-width="10" stroke-linecap="round"/>
  <path d="M236 260 L340 256" stroke="#0F766E" stroke-width="10" stroke-linecap="round"/>
  <circle cx="340" cy="256" r="10" fill="#D97706"/>
  <text x="512" y="188" fill="#7C3AED" font-size="22" font-weight="700">Ghost Meeting Point sketch</text>
  <rect x="652" y="192" width="12" height="220" rx="6" fill="#94A3B8"/>
  <path d="M544 284 L652 256" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
