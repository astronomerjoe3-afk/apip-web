<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="33" font-weight="700">Surface Reading vs Guide Line Conversion</text>
    <text x="42" y="96" fill="#475569" font-size="18">A surface angle must be converted before you apply the reflection rule.</text>

    <rect x="34" y="126" width="832" height="356" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="50" y="146" width="384" height="320" rx="26" fill="#FEF2F2" stroke="#F87171" stroke-width="3"/>
    <rect x="466" y="146" width="384" height="320" rx="26" fill="#ECFDF5" stroke="#34D399" stroke-width="3"/>

    <text x="76" y="178" fill="#991B1B" font-size="23" font-weight="700">Common trap</text>
    <line x1="102" y1="320" x2="386" y2="320" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <line x1="210" y1="220" x2="298" y2="320" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <path d="M298 307 A70 70 0 0 0 233 306" stroke="#DC2626" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="122" y="236" width="188" height="36" rx="18" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <text x="216" y="259" fill="#DC2626" font-size="22" font-weight="700" text-anchor="middle">20 deg to surface</text>
    <rect x="84" y="362" width="316" height="54" rx="18" fill="#FFFFFF" stroke="#FECACA" stroke-width="2"/>
    <text x="242" y="391" fill="#334155" font-size="19" text-anchor="middle">That is not yet the incident angle.</text>
    <text x="242" y="414" fill="#334155" font-size="19" text-anchor="middle">It was measured to the mirror, not the Guide Line.</text>

    <text x="492" y="178" fill="#065F46" font-size="23" font-weight="700">Correct conversion</text>
    <line x1="518" y1="320" x2="802" y2="320" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <line x1="660" y1="198" x2="660" y2="428" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 10"/>
    <line x1="572" y1="220" x2="660" y2="320" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <path d="M660 252 A82 82 0 0 0 606 297" stroke="#10B981" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M660 306 A56 56 0 0 1 608 306" stroke="#DC2626" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M660 320 V294 H686" stroke="#64748B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="550" y="228" width="220" height="36" rx="18" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="660" y="251" fill="#047857" font-size="22" font-weight="700" text-anchor="middle">70 deg to Guide Line</text>
    <rect x="558" y="338" width="204" height="36" rx="18" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="2"/>
    <text x="660" y="361" fill="#DC2626" font-size="22" font-weight="700" text-anchor="middle">20 deg to surface</text>
    <rect x="548" y="392" width="224" height="36" rx="18" fill="#DCFCE7"/>
    <text x="660" y="415" fill="#166534" font-size="21" font-weight="700" text-anchor="middle">20 deg + 70 deg = 90 deg</text>
  </g>
</svg>
