<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="520" rx="32" fill="#F8FAFC"/>
  <text x="48" y="64" fill="#0F172A" font-size="34" font-weight="700">Surface Angle Trap vs Guide Line Conversion</text>
  <text x="48" y="108" fill="#475569" font-size="20">A surface angle is not wrong, but it must be converted before the reflection rule is used.</text>

  <rect x="48" y="148" width="378" height="308" rx="28" fill="#FEF2F2" stroke="#F87171" stroke-width="4"/>
  <rect x="474" y="148" width="378" height="308" rx="28" fill="#ECFDF5" stroke="#34D399" stroke-width="4"/>

  <text x="84" y="188" fill="#B91C1C" font-size="22" font-weight="700">Common trap</text>
  <line x1="96" y1="324" x2="378" y2="324" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
  <path d="M198 218 L276 324" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M278 310 C248 300 225 302 206 316" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <text x="132" y="286" fill="#DC2626" font-size="20" font-weight="700">20 deg to surface</text>
  <text x="110" y="378" fill="#334155" font-size="19">Do not call this the incident angle</text>
  <text x="120" y="404" fill="#334155" font-size="19">until it is converted to the Guide Line.</text>

  <text x="510" y="188" fill="#047857" font-size="22" font-weight="700">Correct move</text>
  <line x1="522" y1="324" x2="804" y2="324" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
  <line x1="664" y1="194" x2="664" y2="414" stroke="#0EA5E9" stroke-width="4" stroke-dasharray="12 12"/>
  <path d="M584 218 L664 324" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M664 238 C630 252 610 278 602 308" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <path d="M664 308 C642 300 620 304 594 316" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <text x="574" y="280" fill="#047857" font-size="20" font-weight="700">70 deg to Guide Line</text>
  <text x="548" y="352" fill="#DC2626" font-size="20" font-weight="700">20 deg to surface</text>
  <text x="566" y="394" fill="#334155" font-size="19">Surface angle + Guide Line angle = 90 deg.</text>
</svg>
