<svg width="900" height="520" viewBox="0 0 900 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ghost-blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="ghost-purple-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Why the Plane-Mirror Image is Virtual</text>
    <text x="42" y="96" fill="#475569" font-size="18">Real reflected light reaches the eye in front of the mirror. Dashed extensions locate the apparent source.</text>

    <rect x="34" y="126" width="832" height="356" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="54" y="152" width="792" height="304" rx="24" fill="#F8FAFC" stroke="#D6E4F5" stroke-width="2"/>

    <line x1="458" y1="178" x2="458" y2="430" stroke="#94A3B8" stroke-width="10" stroke-linecap="round"/>
    <text x="435" y="446" fill="#475569" font-size="18">mirror</text>

    <line x1="230" y1="384" x2="230" y2="236" stroke="#2563EB" stroke-width="8" stroke-linecap="round" marker-end="url(#ghost-blue-arrow)"/>
    <line x1="224" y1="244" x2="236" y2="244" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>
    <text x="196" y="404" fill="#1D4ED8" font-size="19" font-weight="700">object</text>

    <circle cx="316" cy="238" r="16" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
    <circle cx="322" cy="238" r="7" fill="#334155"/>
    <text x="296" y="208" fill="#334155" font-size="17" font-weight="700">eye</text>

    <path d="M230 236 L458 258 L316 238" stroke="#2563EB" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M230 236 L458 340 L316 238" stroke="#0F766E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M458 258 L650 236" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 10" fill="none" stroke-linecap="round"/>
    <path d="M458 340 L650 384" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 10" fill="none" stroke-linecap="round"/>

    <line x1="650" y1="384" x2="650" y2="236" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" marker-end="url(#ghost-purple-arrow)"/>
    <line x1="644" y1="244" x2="656" y2="244" stroke="#7C3AED" stroke-width="8" stroke-linecap="round"/>
    <text x="590" y="404" fill="#6D28D9" font-size="19" font-weight="700">virtual image</text>

    <rect x="90" y="392" width="294" height="40" rx="16" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
    <text x="237" y="417" fill="#0F172A" font-size="17" font-weight="700" text-anchor="middle">Solid rays show the light that reaches the eye.</text>

    <rect x="504" y="392" width="278" height="40" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="643" y="417" fill="#0F172A" font-size="18" font-weight="700" text-anchor="middle">Dashed lines are extensions only.</text>
  </g>
</svg>
