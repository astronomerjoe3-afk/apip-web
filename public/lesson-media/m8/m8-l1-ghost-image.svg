<svg width="900" height="560" viewBox="0 0 900 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="560" rx="32" fill="#F8FBFF"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="42" y="58" fill="#0F172A" font-size="34" font-weight="700">Why the Plane-Mirror Image is Virtual</text>
    <text x="42" y="96" fill="#475569" font-size="19">Real reflected rays stay in front of the mirror. Dashed backward extensions show where the image appears to be.</text>

    <rect x="34" y="126" width="832" height="392" rx="30" fill="#FFFFFF" stroke="#D9E2F1" stroke-width="2"/>
    <rect x="60" y="154" width="780" height="338" rx="28" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="3"/>

    <line x1="462" y1="184" x2="462" y2="462" stroke="#94A3B8" stroke-width="12" stroke-linecap="round"/>
    <text x="438" y="486" fill="#475569" font-size="20" font-weight="600">mirror</text>

    <line x1="198" y1="424" x2="198" y2="286" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <line x1="190" y1="294" x2="206" y2="294" stroke="#2563EB" stroke-width="9" stroke-linecap="round"/>
    <polygon points="198,268 182,298 214,298" fill="#2563EB"/>
    <text x="156" y="452" fill="#1D4ED8" font-size="20" font-weight="700">object</text>

    <circle cx="334" cy="318" r="18" fill="#FFFFFF" stroke="#334155" stroke-width="4"/>
    <circle cx="340" cy="318" r="6" fill="#334155"/>
    <text x="314" y="286" fill="#475569" font-size="18">eye</text>

    <path d="M198 286 L462 274 L334 318" stroke="#2563EB" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M198 286 L462 390 L334 318" stroke="#0F766E" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M462 274 L708 260" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 8" fill="none" stroke-linecap="round"/>
    <path d="M462 390 L708 286" stroke="#7C3AED" stroke-width="4" stroke-dasharray="10 8" fill="none" stroke-linecap="round"/>

    <line x1="708" y1="424" x2="708" y2="286" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8"/>
    <line x1="700" y1="416" x2="716" y2="416" stroke="#7C3AED" stroke-width="8" stroke-linecap="round" stroke-dasharray="10 8"/>
    <polygon points="708,268 692,298 724,298" fill="#7C3AED"/>
    <text x="644" y="452" fill="#6D28D9" font-size="20" font-weight="700">virtual image</text>

    <rect x="88" y="180" width="188" height="40" rx="18" fill="#DBEAFE"/>
    <rect x="554" y="180" width="222" height="40" rx="18" fill="#E9D5FF"/>
    <text x="182" y="206" fill="#1D4ED8" font-size="18" font-weight="700" text-anchor="middle">real reflected rays</text>
    <text x="665" y="206" fill="#6D28D9" font-size="18" font-weight="700" text-anchor="middle">dashed backward extensions</text>

    <rect x="150" y="438" width="262" height="36" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <rect x="506" y="438" width="268" height="36" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
    <text x="281" y="461" fill="#334155" font-size="17" text-anchor="middle">only real rays reach the eye</text>
    <text x="640" y="461" fill="#334155" font-size="17" text-anchor="middle">only extensions meet behind the mirror</text>
  </g>
</svg>
