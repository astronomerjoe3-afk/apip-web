  <path d="M456 334 L644 240" stroke="#0F766E" stroke-width="4" stroke-dasharray="12 12"/>
  <line x1="644" y1="334" x2="644" y2="240" stroke="#A855F7" stroke-width="10" stroke-linecap="round"/>
  <line x1="622" y1="334" x2="666" y2="334" stroke="#A855F7" stroke-width="10" stroke-linecap="round"/>
