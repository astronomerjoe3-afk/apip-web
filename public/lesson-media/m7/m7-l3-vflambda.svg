<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F8FBFF"/>
  <rect x="32" y="32" width="1136" height="696" rx="32" fill="#FFFFFF" stroke="#C7DAF8" stroke-width="4"/>
  <text x="70" y="94" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Beat Rate, Pulse Gap, and Ripple Run</text>
  <text x="70" y="138" fill="#475569" font-family="Arial, sans-serif" font-size="22">Wave speed combines how often fronts are launched with how far apart matching fronts are.</text>

  <rect x="78" y="200" width="300" height="254" rx="28" fill="#EEF6FF" stroke="#60A5FA" stroke-width="4"/>
  <rect x="450" y="200" width="300" height="254" rx="28" fill="#F5F3FF" stroke="#A78BFA" stroke-width="4"/>
  <rect x="822" y="200" width="300" height="254" rx="28" fill="#ECFDF5" stroke="#34D399" stroke-width="4"/>
  <text x="112" y="248" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="28" font-weight="700">Beat Rate</text>
  <text x="484" y="248" fill="#6D28D9" font-family="Arial, sans-serif" font-size="28" font-weight="700">Pulse Gap</text>
  <text x="856" y="248" fill="#047857" font-family="Arial, sans-serif" font-size="28" font-weight="700">Ripple Run</text>

  <text x="112" y="314" fill="#334155" font-family="Arial, sans-serif" font-size="22">How many fronts launch</text>
  <text x="112" y="346" fill="#334155" font-family="Arial, sans-serif" font-size="22">each second from the source</text>

  <line x1="500" y1="336" x2="700" y2="336" stroke="#6D28D9" stroke-width="10" stroke-linecap="round"/>
  <line x1="540" y1="302" x2="540" y2="370" stroke="#6D28D9" stroke-width="10" stroke-linecap="round"/>
  <line x1="660" y1="302" x2="660" y2="370" stroke="#6D28D9" stroke-width="10" stroke-linecap="round"/>
  <text x="486" y="414" fill="#334155" font-family="Arial, sans-serif" font-size="22">Spacing between matching fronts</text>

  <line x1="860" y1="336" x2="1044" y2="336" stroke="#10B981" stroke-width="14" stroke-linecap="round"/>
  <polygon points="1044,336 1014,316 1014,356" fill="#10B981"/>
  <text x="848" y="414" fill="#334155" font-family="Arial, sans-serif" font-size="22">How quickly the front crosses</text>

  <rect x="250" y="510" width="700" height="108" rx="28" fill="#E8F0FF"/>
  <text x="348" y="566" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="34" font-weight="700">v = f x lambda</text>
  <text x="304" y="606" fill="#334155" font-family="Arial, sans-serif" font-size="22">Wave speed comes from launch rate multiplied by front spacing.</text>
</svg>
