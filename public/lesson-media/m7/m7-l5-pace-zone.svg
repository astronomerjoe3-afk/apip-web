<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F8FBFF"/>
  <rect x="32" y="32" width="1136" height="696" rx="32" fill="#FFFFFF" stroke="#C7DAF8" stroke-width="4"/>
  <text x="70" y="94" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Pace Zone refraction</text>
  <text x="70" y="138" fill="#475569" font-family="Arial, sans-serif" font-size="22">A new medium changes wave speed. The source keeps frequency fixed, so wavelength changes and the front turns.</text>

  <rect x="88" y="194" width="468" height="408" rx="30" fill="#DBEAFE" stroke="#60A5FA" stroke-width="4"/>
  <rect x="644" y="194" width="468" height="408" rx="30" fill="#DCFCE7" stroke="#4ADE80" stroke-width="4"/>
  <text x="122" y="246" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="28" font-weight="700">Zone A</text>
  <text x="678" y="246" fill="#15803D" font-family="Arial, sans-serif" font-size="28" font-weight="700">Zone B</text>
  <line x1="600" y1="218" x2="600" y2="578" stroke="#0F172A" stroke-width="6" stroke-dasharray="12 12"/>

  <line x1="214" y1="506" x2="600" y2="370" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  <line x1="600" y1="370" x2="968" y2="316" stroke="#22C55E" stroke-width="14" stroke-linecap="round"/>
  <text x="174" y="322" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="22">longer wavelength</text>
  <text x="770" y="292" fill="#15803D" font-family="Arial, sans-serif" font-size="22">shorter wavelength in slower zone</text>

  <text x="122" y="556" fill="#334155" font-family="Arial, sans-serif" font-size="22">frequency stays source-set</text>
  <text x="122" y="586" fill="#334155" font-family="Arial, sans-serif" font-size="22">speed changes with the medium</text>
  <text x="678" y="556" fill="#334155" font-family="Arial, sans-serif" font-size="22">front bends because one side</text>
  <text x="678" y="586" fill="#334155" font-family="Arial, sans-serif" font-size="22">enters the new speed zone first</text>

  <rect x="202" y="632" width="796" height="72" rx="24" fill="#E8F0FF"/>
  <text x="246" y="676" fill="#334155" font-family="Arial, sans-serif" font-size="24">Refraction = turn caused by a speed change in a new medium, while frequency stays fixed.</text>
</svg>
