<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F8FBFF"/>
  <rect x="32" y="32" width="1136" height="696" rx="32" fill="#FFFFFF" stroke="#C7DAF8" stroke-width="4"/>
  <text x="70" y="94" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Bounce Wall reflection</text>
  <text x="70" y="138" fill="#475569" font-family="Arial, sans-serif" font-size="22">Reflection is a boundary bounce. Both angles are measured from the normal, not from the wall surface.</text>

  <rect x="90" y="194" width="1020" height="398" rx="30" fill="#EEF2FF" stroke="#93C5FD" stroke-width="4"/>
  <line x1="640" y1="236" x2="640" y2="548" stroke="#0F172A" stroke-width="10"/>
  <line x1="430" y1="392" x2="850" y2="392" stroke="#94A3B8" stroke-width="6" stroke-dasharray="12 12"/>
  <text x="664" y="408" fill="#475569" font-family="Arial, sans-serif" font-size="22">normal</text>

  <line x1="278" y1="250" x2="640" y2="392" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  <line x1="640" y1="392" x2="1002" y2="250" stroke="#22C55E" stroke-width="14" stroke-linecap="round"/>
  <text x="220" y="238" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="24" font-weight="700">incident front</text>
  <text x="818" y="238" fill="#15803D" font-family="Arial, sans-serif" font-size="24" font-weight="700">reflected front</text>

  <path d="M520 392 A90 90 0 0 1 566 314" stroke="#1D4ED8" stroke-width="6" fill="none"/>
  <path d="M714 314 A90 90 0 0 1 760 392" stroke="#15803D" stroke-width="6" fill="none"/>
  <text x="482" y="334" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="20">incident angle</text>
  <text x="714" y="334" fill="#15803D" font-family="Arial, sans-serif" font-size="20">reflected angle</text>

  <rect x="222" y="620" width="756" height="72" rx="24" fill="#E8F0FF"/>
  <text x="276" y="664" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="24" font-weight="700">Reflection rule:</text>
  <text x="480" y="664" fill="#334155" font-family="Arial, sans-serif" font-size="24">angle of incidence = angle of reflection</text>
</svg>
