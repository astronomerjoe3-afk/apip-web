<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="36" fill="#F8FBFF"/>
  <rect x="32" y="32" width="1136" height="696" rx="32" fill="#FFFFFF" stroke="#C7DAF8" stroke-width="4"/>
  <text x="70" y="94" fill="#0F172A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Traveling pattern, local pad motion</text>
  <text x="70" y="138" fill="#475569" font-family="Arial, sans-serif" font-size="22">The front crosses the stadium, but each pad only pulses around its own place.</text>

  <rect x="82" y="190" width="1036" height="362" rx="28" fill="#EEF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="112" y="238" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Front travel across the Signal-Stadium</text>
  <line x1="126" y1="450" x2="1038" y2="450" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <line x1="146" y1="316" x2="754" y2="316" stroke="#22C55E" stroke-width="18" stroke-linecap="round"/>
  <polygon points="754,316 720,294 720,338" fill="#22C55E"/>
  <text x="152" y="284" fill="#166534" font-family="Arial, sans-serif" font-size="22" font-weight="700">Wavefront direction</text>

  <circle cx="176" cy="450" r="20" fill="#CBD5E1"/>
  <circle cx="302" cy="450" r="20" fill="#CBD5E1"/>
  <circle cx="428" cy="382" r="20" fill="#2563EB"/>
  <circle cx="554" cy="450" r="20" fill="#CBD5E1"/>
  <circle cx="680" cy="450" r="20" fill="#CBD5E1"/>
  <circle cx="806" cy="450" r="20" fill="#CBD5E1"/>
  <circle cx="932" cy="450" r="20" fill="#CBD5E1"/>
  <text x="364" y="360" fill="#2563EB" font-family="Arial, sans-serif" font-size="20" font-weight="700">One pad pulses locally</text>
  <line x1="428" y1="432" x2="428" y2="396" stroke="#2563EB" stroke-width="8" stroke-linecap="round"/>

  <rect x="828" y="236" width="226" height="124" rx="24" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
  <text x="856" y="282" fill="#166534" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pattern travels</text>
  <text x="856" y="318" fill="#334155" font-family="Arial, sans-serif" font-size="20">Front reaches later pads</text>

  <rect x="828" y="390" width="226" height="124" rx="24" fill="#DBEAFE" stroke="#3B82F6" stroke-width="4"/>
  <text x="856" y="436" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pads stay local</text>
  <text x="856" y="472" fill="#334155" font-family="Arial, sans-serif" font-size="20">They pulse, then settle again</text>

  <rect x="98" y="590" width="1004" height="92" rx="26" fill="#E8F0FF"/>
  <text x="132" y="632" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Core wave rule:</text>
  <text x="298" y="632" fill="#334155" font-family="Arial, sans-serif" font-size="22">The pattern travels through the medium, while each point in the medium only moves locally.</text>
</svg>
