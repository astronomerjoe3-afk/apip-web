  <text x="728" y="566" fill="#166534" font-family="Arial, sans-serif" font-size="22">Local motion is parallel</text>

  <rect x="112" y="610" width="956" height="74" rx="24" fill="#EEF2FF"/>
  <text x="146" y="656" fill="#334155" font-family="Arial, sans-serif" font-size="22">Transverse means local motion across the travel direction. Longitudinal means local motion along the travel direction.</text>
