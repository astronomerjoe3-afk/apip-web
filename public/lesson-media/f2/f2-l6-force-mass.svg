<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Force and mass</title>
  <desc id="desc">Two trolleys of different mass pushed by the same force, showing different accelerations.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Same force, different mass</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">
    <tspan x="70" dy="0">The same push changes a lighter trolley more.</tspan>
    <tspan x="70" dy="30">More mass means more resistance to the change in motion.</tspan>
  </text>
  <g transform="translate(70 220)">
    <rect width="500" height="340" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="54" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Light trolley</text>
    <rect x="90" y="180" width="170" height="80" rx="20" fill="#bae6fd" stroke="#0ea5e9" stroke-width="6"/>
    <circle cx="130" cy="278" r="20" fill="#334155"/>
    <circle cx="220" cy="278" r="20" fill="#334155"/>
    <path d="M70 140 H240" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
    <path d="M190 108 L292 140 L190 172" fill="#f97316"/>
    <path d="M280 150 H410" stroke="#0f766e" stroke-width="16" stroke-linecap="round"/>
    <path d="M360 118 L458 150 L360 182" fill="#0f766e"/>
    <text x="74" y="112" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#c2410c">Same force</text>
    <text x="282" y="118" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Larger acceleration</text>
  </g>
  <g transform="translate(630 220)">
    <rect width="500" height="340" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="54" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Heavy trolley</text>
    <rect x="90" y="160" width="220" height="100" rx="20" fill="#cbd5e1" stroke="#64748b" stroke-width="6"/>
    <rect x="126" y="126" width="60" height="34" rx="8" fill="#94a3b8"/>
    <rect x="196" y="126" width="60" height="34" rx="8" fill="#94a3b8"/>
    <circle cx="142" cy="278" r="20" fill="#334155"/>
    <circle cx="258" cy="278" r="20" fill="#334155"/>
    <path d="M70 140 H240" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
    <path d="M190 108 L292 140 L190 172" fill="#f97316"/>
    <path d="M332 150 H420" stroke="#0f766e" stroke-width="16" stroke-linecap="round"/>
    <path d="M372 118 L470 150 L372 182" fill="#0f766e"/>
    <text x="74" y="112" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#c2410c">Same force</text>
    <text x="284" y="118" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Smaller acceleration</text>
  </g>
</svg>
