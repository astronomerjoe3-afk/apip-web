<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Velocity-time graph</title>
  <desc id="desc">A velocity-time graph showing a sloping section and a shaded area under a horizontal section.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Velocity-time graph</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">
    <tspan x="70" dy="0">Slope tells acceleration,</tspan>
    <tspan x="70" dy="30">while the shaded area under the graph adds up displacement.</tspan>
  </text>
  <g transform="translate(90 200)">
    <rect width="1020" height="420" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <path d="M120 340 V80 M120 340 H920" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 280 L340 160 L620 160" fill="none" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M340 340 V160 H620 V340 Z" fill="#bae6fd" opacity="0.75"/>
    <text x="22" y="86" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">velocity</text>
    <text x="878" y="392" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">time</text>
    <text x="196" y="146" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Slope = acceleration</text>
    <text x="416" y="252" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Area = displacement</text>
    <path d="M210 228 L270 188" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
    <path d="M252 178 L292 174 L274 210" fill="#dc2626"/>
  </g>
</svg>
