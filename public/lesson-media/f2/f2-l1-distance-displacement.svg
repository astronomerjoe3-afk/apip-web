<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Distance and displacement</title>
  <desc id="desc">A bent walking route contrasted with a straight displacement arrow from start to finish.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Distance and displacement</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">The route can bend and double back, but displacement is always the straight start-to-finish change.</text>
  <g transform="translate(70 210)">
    <rect width="1060" height="390" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <circle cx="140" cy="290" r="18" fill="#0f766e"/>
    <circle cx="900" cy="180" r="18" fill="#1d4ed8"/>
    <path d="M140 290 L360 180 L560 320 L720 140 L900 180" fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M140 290 L900 180" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
    <path d="M850 152 L944 162 L874 224" fill="#0f766e"/>
    <text x="92" y="338" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Start</text>
    <text x="864" y="232" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Finish</text>
    <text x="398" y="116" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c2410c">Distance follows the full route</text>
    <text x="414" y="370" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Displacement is the straight arrow</text>
    <text x="94" y="72" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">A return leg adds distance but can reduce the net displacement.</text>
  </g>
</svg>
