<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Distance-time graph check</title>
  <desc id="desc">A labelled distance-time graph with segment A steep, segment B flat, and segment C shallower for reflection use.</desc>
  <rect width="1200" height="760" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Distance-time graph check</text>
  <text x="70" y="146" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">
    <tspan x="70" dy="0">Use the slope of each segment to explain what the traveller is doing.</tspan>
    <tspan x="70" dy="30">Which segment is fastest? Which segment shows a stop?</tspan>
  </text>
  <g transform="translate(90 220)">
    <rect width="1020" height="450" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <path d="M130 360 V90 M130 360 H910" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M130 360 L390 170 L610 170 L880 110" fill="none" stroke="#0f766e" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M390 170 H610" stroke="#2563eb" stroke-width="10" stroke-dasharray="12 10"/>
    <circle cx="130" cy="360" r="10" fill="#0f766e"/>
    <circle cx="390" cy="170" r="10" fill="#0f766e"/>
    <circle cx="610" cy="170" r="10" fill="#0f766e"/>
    <circle cx="880" cy="110" r="10" fill="#0f766e"/>
    <text x="28" y="96" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">distance</text>
    <text x="900" y="428" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">time</text>
    <g>
      <circle cx="300" cy="126" r="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="4"/>
      <text x="290" y="135" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0369a1">A</text>
      <text x="230" y="88" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0369a1">Steep segment</text>
    </g>
    <g>
      <circle cx="500" cy="126" r="26" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
      <text x="490" y="135" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">B</text>
      <text x="454" y="86" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Flat section</text>
    </g>
    <g>
      <circle cx="758" cy="92" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
      <text x="748" y="101" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#15803d">C</text>
      <text x="694" y="52" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#15803d">Shallower segment</text>
    </g>
    <text x="170" y="410" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#475569">A: distance rises quickly</text>
    <text x="430" y="410" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#475569">B: distance stays unchanged</text>
    <text x="650" y="396" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#475569">
      <tspan x="650" dy="0">C: distance rises</tspan>
      <tspan x="650" dy="24">slowly</tspan>
    </text>
  </g>
</svg>
