<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Resultant force</title>
  <desc id="desc">A tug-of-war style diagram with equal and unequal pulls showing the resultant force.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Balanced and unbalanced forces</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Equal opposite pulls cancel. Unequal pulls leave a resultant force in the larger direction.</text>
  <g transform="translate(70 220)">
    <rect width="500" height="340" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="36" y="54" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Balanced</text>
    <path d="M110 190 H390" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <path d="M260 190 H130" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M180 158 L82 190 L180 222" fill="#2563eb"/>
    <path d="M240 190 H370" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M320 158 L418 190 L320 222" fill="#2563eb"/>
    <text x="110" y="268" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">5 N left</text>
    <text x="304" y="268" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">5 N right</text>
    <text x="126" y="308" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Resultant = 0 N</text>
  </g>
  <g transform="translate(630 220)">
    <rect width="500" height="340" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="36" y="54" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Unbalanced</text>
    <path d="M110 190 H390" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <path d="M250 190 H150" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M196 158 L102 190 L196 222" fill="#2563eb"/>
    <path d="M240 190 H430" stroke="#f97316" stroke-width="18" stroke-linecap="round"/>
    <path d="M382 158 L476 190 L382 222" fill="#f97316"/>
    <path d="M190 110 H372" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
    <path d="M322 82 L424 110 L322 138" fill="#0f766e"/>
    <text x="118" y="268" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">6 N left</text>
    <text x="312" y="268" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">10 N right</text>
    <text x="168" y="72" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Resultant points right</text>
  </g>
</svg>
