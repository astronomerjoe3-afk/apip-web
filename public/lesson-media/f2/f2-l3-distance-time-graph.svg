<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Distance-time graph</title>
  <desc id="desc">A distance-time graph with a steep section, a flat section, and a shallow section.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Distance-time graph</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">
    <tspan x="70" dy="0">Steeper segments mean faster motion.</tspan>
    <tspan x="70" dy="30">Flat segments mean the distance is not changing.</tspan>
  </text>
  <g transform="translate(90 200)">
    <rect width="1020" height="420" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <path d="M120 340 V80 M120 340 H900" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M120 340 L340 170 L520 170 L760 110" fill="none" stroke="#0f766e" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="24" y="86" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">distance</text>
    <text x="860" y="392" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">time</text>
    <text x="210" y="146" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Steep = faster</text>
    <text x="368" y="154" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2563eb">Flat = stopped</text>
    <text x="612" y="86" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Shallow = slower</text>
    <path d="M340 170 H520" stroke="#2563eb" stroke-width="10" stroke-dasharray="10 10"/>
  </g>
</svg>
