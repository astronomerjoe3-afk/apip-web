<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Velocity and acceleration</title>
  <desc id="desc">A long initial velocity arrow, a shorter final velocity arrow, and an opposite acceleration arrow.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Velocity and acceleration</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">
    <tspan x="70" dy="0">Compare the starting and finishing velocity arrows first.</tspan>
    <tspan x="70" dy="30">Acceleration comes from how the velocity arrow changes.</tspan>
  </text>
  <g transform="translate(70 220)">
    <rect width="1060" height="360" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <path d="M120 170 H980" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <path d="M180 120 H700" stroke="#1d4ed8" stroke-width="18" stroke-linecap="round"/>
    <path d="M642 88 L744 120 L642 152" fill="#1d4ed8"/>
    <path d="M180 230 H480" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
    <path d="M428 198 L528 230 L428 262" fill="#2563eb"/>
    <path d="M620 290 H360" stroke="#dc2626" stroke-width="16" stroke-linecap="round"/>
    <path d="M408 258 L304 290 L408 322" fill="#dc2626"/>
    <text x="164" y="108" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Initial velocity</text>
    <text x="164" y="214" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2563eb">Final velocity</text>
    <text x="594" y="322" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#dc2626">
      <tspan x="594" dy="0">Acceleration points opposite</tspan>
      <tspan x="594" dy="30">the change in velocity</tspan>
    </text>
    <text x="620" y="62" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">
      <tspan x="620" dy="0">If the final arrow is shorter but still points</tspan>
      <tspan x="620" dy="24">in the same positive direction, the</tspan>
      <tspan x="620" dy="24">acceleration is negative in that sign convention.</tspan>
    </text>
  </g>
</svg>