<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Flow Tracker</title>
  <desc id="desc">A Doppler ultrasound diagram showing higher return frequency for motion toward the probe and lower for motion away.</desc>
  <rect width="1200" height="800" fill="#f9fbff"/>
  <rect x="44" y="34" width="1112" height="732" rx="36" fill="#f1f5ff" stroke="#d8def8" stroke-width="4"/>
  <text x="84" y="112" fill="#172554" font-size="56" font-weight="700">Doppler Shifts Reveal Flow</text>
  <text x="84" y="164" fill="#475569" font-size="28">Compare the returned frequency with the transmitted one before naming flow direction.</text>
  <rect x="128" y="292" width="58" height="126" rx="22" fill="#2563eb"/>
  <ellipse cx="860" cy="356" rx="96" ry="54" fill="#cfe6ff"/>
  <line x1="186" y1="356" x2="764" y2="356" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <line x1="764" y1="356" x2="186" y2="464" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
  <text x="124" y="254" fill="#1d4ed8" font-size="34" font-weight="700">Probe</text>
  <text x="770" y="270" fill="#0f172a" font-size="34" font-weight="700">Moving target</text>
  <text x="432" y="326" fill="#1d4ed8" font-size="28">transmitted pulse</text>
  <text x="430" y="520" fill="#0f766e" font-size="28">returned echo</text>
  <rect x="100" y="596" width="304" height="98" rx="24" fill="#ffffff"/>
  <rect x="448" y="596" width="304" height="98" rx="24" fill="#ffffff"/>
  <rect x="796" y="596" width="304" height="98" rx="24" fill="#ffffff"/>
  <text x="126" y="636" fill="#0f172a" font-size="28">Toward probe = higher</text>
  <text x="126" y="670" fill="#0f172a" font-size="28">returned frequency</text>
  <text x="478" y="636" fill="#0f172a" font-size="28">Away from probe = lower</text>
  <text x="478" y="670" fill="#0f172a" font-size="28">returned frequency</text>
  <text x="822" y="636" fill="#0f172a" font-size="28">Doppler extends echo</text>
  <text x="822" y="670" fill="#0f172a" font-size="28">imaging into flow tracking</text>
</svg>
