<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Beacon Launch</title>
  <desc id="desc">A vibrating sound source launches compressions and rarefactions into nearby air.</desc>
  <rect width="1200" height="800" fill="#f8fbff"/>
  <rect x="44" y="34" width="1112" height="732" rx="36" fill="#eef6ff" stroke="#c7dbf7" stroke-width="4"/>
  <text x="84" y="112" fill="#172554" font-size="56" font-weight="700">A Vibrating Scout Beacon Launches Sound</text>
  <text x="84" y="164" fill="#475569" font-size="28">The source must wiggle first. Nearby air begins the squeeze-release relay.</text>
  <rect x="126" y="256" width="116" height="208" rx="48" fill="#2563eb"/>
  <rect x="126" y="494" width="116" height="46" rx="20" fill="#1e3a8a"/>
  <path d="M278 360 C336 300 388 300 446 360 C504 420 556 420 614 360 C672 300 724 300 782 360 C840 420 892 420 950 360" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M278 412 C336 472 388 472 446 412 C504 352 556 352 614 412 C672 472 724 472 782 412 C840 352 892 352 950 412" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round"/>
  <text x="112" y="598" fill="#1d4ed8" font-size="32" font-weight="700">Scout Beacon</text>
  <text x="320" y="292" fill="#0f766e" font-size="30" font-weight="700">First squeeze band</text>
  <text x="626" y="530" fill="#475569" font-size="30" font-weight="700">release band</text>
  <rect x="98" y="640" width="300" height="84" rx="24" fill="#ffffff" opacity="0.96"/>
  <rect x="440" y="640" width="300" height="84" rx="24" fill="#ffffff" opacity="0.96"/>
  <rect x="782" y="640" width="300" height="84" rx="24" fill="#ffffff" opacity="0.96"/>
  <text x="130" y="688" fill="#0f172a" font-size="28">No vibration means no new sound.</text>
  <text x="476" y="676" fill="#0f172a" font-size="28">Source rate sets</text>
  <text x="476" y="708" fill="#0f172a" font-size="28">the launched frequency.</text>
  <text x="812" y="676" fill="#0f172a" font-size="28">The pattern travels;</text>
  <text x="812" y="708" fill="#0f172a" font-size="28">the air is not fired across.</text>
</svg>
