<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Echo Map</title>
  <desc id="desc">A probe sends a pulse to a boundary and receives an echo return, showing the divide-by-two depth logic.</desc>
  <rect width="1200" height="800" fill="#f8fbff"/>
  <rect x="44" y="34" width="1112" height="732" rx="36" fill="#eef6ff" stroke="#d3e3f8" stroke-width="4"/>
  <text x="84" y="112" fill="#172554" font-size="56" font-weight="700">Echo Returns Place Hidden Boundaries</text>
  <text x="84" y="164" fill="#475569" font-size="28">The scanner times a pulse out and an echo back, then halves the path to get the boundary depth.</text>
  <rect x="120" y="286" width="64" height="124" rx="22" fill="#2563eb"/>
  <rect x="922" y="244" width="28" height="252" rx="14" fill="#f59e0b"/>
  <line x1="184" y1="348" x2="922" y2="348" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <line x1="922" y1="348" x2="184" y2="472" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
  <text x="120" y="254" fill="#1d4ed8" font-size="34" font-weight="700">Probe</text>
  <text x="866" y="212" fill="#b45309" font-size="34" font-weight="700">Boundary</text>
  <text x="410" y="318" fill="#1d4ed8" font-size="28">outgoing pulse</text>
  <text x="396" y="528" fill="#0f766e" font-size="28">echo return</text>
  <rect x="120" y="598" width="284" height="88" rx="24" fill="#ffffff"/>
  <rect x="458" y="598" width="284" height="88" rx="24" fill="#ffffff"/>
  <rect x="796" y="598" width="284" height="88" rx="24" fill="#ffffff"/>
  <text x="148" y="646" fill="#0f172a" font-size="28">Echo time = out + back</text>
  <text x="484" y="634" fill="#0f172a" font-size="28">Depth uses one-way</text>
  <text x="484" y="666" fill="#0f172a" font-size="28">distance only.</text>
  <text x="824" y="634" fill="#0f172a" font-size="28">Many echoes build</text>
  <text x="824" y="666" fill="#0f172a" font-size="28">a map, not one clue.</text>
</svg>
