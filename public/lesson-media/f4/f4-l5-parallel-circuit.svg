<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Split routes keep the same push but share the flow</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">In parallel, each branch gets the same voltage and the branch currents add to the total.</text>
  <rect x="86" y="268" width="200" height="120" rx="28" fill="#DBEAFE" stroke="#93C5FD" stroke-width="6"/>
  <text x="120" y="322" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Source station</text>
  <text x="155" y="356" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">12 V supply</text>
  <path d="M286 328H430" stroke="#2563EB" stroke-width="20" stroke-linecap="round"/>
  <path d="M430 328V248H760" stroke="#2563EB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M430 328V486H760" stroke="#2563EB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="760" y="196" width="210" height="108" rx="24" fill="#E0F2FE" stroke="#38BDF8" stroke-width="5"/>
  <text x="826" y="242" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Branch A</text>
  <text x="804" y="278" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">12 V, current 2 A</text>
  <rect x="760" y="432" width="210" height="108" rx="24" fill="#FEF3C7" stroke="#FBBF24" stroke-width="5"/>
  <text x="826" y="478" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Branch B</text>
  <text x="804" y="514" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">12 V, current 1 A</text>
  <path d="M970 248H1070V486H970" stroke="#2563EB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="468" y="230" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Same push across each branch</text>
  <text x="444" y="598" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Total current = 3 A</text>
  <text x="334" y="638" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Adding another route lowers overall difficulty and raises the total stream rate.</text>
</svg>
