<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">One route means one shared stream</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">In series, every section of the route carries the same current.</text>
  <rect x="96" y="230" width="200" height="130" rx="28" fill="#DBEAFE" stroke="#93C5FD" stroke-width="6"/>
  <text x="128" y="286" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Source station</text>
  <text x="160" y="322" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">12 V supply</text>
  <path d="M296 296H430" stroke="#2563EB" stroke-width="20" stroke-linecap="round"/>
  <path d="M430 296L388 262V330L430 296Z" fill="#2563EB"/>
  <rect x="430" y="236" width="170" height="120" rx="24" fill="#E0F2FE" stroke="#38BDF8" stroke-width="5"/>
  <text x="484" y="286" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Route A</text>
  <text x="474" y="324" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">2 ohms</text>
  <path d="M600 296H742" stroke="#2563EB" stroke-width="20" stroke-linecap="round"/>
  <path d="M742 296L700 262V330L742 296Z" fill="#2563EB"/>
  <rect x="742" y="236" width="170" height="120" rx="24" fill="#FEF3C7" stroke="#FBBF24" stroke-width="5"/>
  <text x="794" y="286" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Route B</text>
  <text x="784" y="324" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">4 ohms</text>
  <path d="M912 296H1016" stroke="#2563EB" stroke-width="20" stroke-linecap="round"/>
  <path d="M1016 296V472H180V360" stroke="#2563EB" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="402" y="430" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Current everywhere = 2 A</text>
  <text x="356" y="494" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Voltage share on Route A = 4 V</text>
  <text x="356" y="530" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Voltage share on Route B = 8 V</text>
  <text x="356" y="600" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="24">More total difficulty means a smaller shared stream rate.</text>
</svg>
