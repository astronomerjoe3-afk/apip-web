<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Potential difference is energy per charge</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">The Flow-Grid source station gives every packet the same energy boost.</text>
  <rect x="88" y="210" width="260" height="360" rx="28" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="6"/>
  <text x="132" y="272" fill="#4338CA" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Before the station</text>
  <circle cx="218" cy="380" r="52" fill="#CBD5E1"/>
  <text x="164" y="388" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">1 C packet</text>
  <text x="146" y="466" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Energy carried:</text>
  <text x="165" y="500" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="24">2 J per C</text>
  <rect x="456" y="210" width="280" height="360" rx="28" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <text x="498" y="272" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Source station</text>
  <circle cx="594" cy="380" r="52" fill="#0EA5E9"/>
  <text x="540" y="388" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">1 C packet</text>
  <text x="510" y="466" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Energy after boost:</text>
  <text x="522" y="500" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="24">8 J per C</text>
  <text x="514" y="536" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Potential difference = 6 V</text>
  <rect x="844" y="210" width="260" height="360" rx="28" fill="#FEF3C7" stroke="#FBBF24" stroke-width="6"/>
  <text x="914" y="272" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Lamp</text>
  <circle cx="974" cy="380" r="52" fill="#F59E0B"/>
  <text x="920" y="388" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">1 C packet</text>
  <text x="892" y="466" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">After the device:</text>
  <text x="921" y="500" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="24">2 J per C</text>
  <path d="M350 380H448" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/>
  <path d="M448 380L406 346V414L448 380Z" fill="#2563EB"/>
  <path d="M738 380H836" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/>
  <path d="M836 380L794 346V414L836 380Z" fill="#2563EB"/>
  <text x="70" y="648" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Key idea:</text>
  <text x="228" y="648" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Voltage tells how much energy each coulomb gains or loses, not how many coulombs move.</text>
</svg>
