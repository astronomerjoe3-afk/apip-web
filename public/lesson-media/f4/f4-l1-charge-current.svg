  <text x="70" y="88" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Closed route keeps one stream rate</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">The Flow-Grid source station keeps the packet stream moving around one complete route.</text>
  <rect x="90" y="220" width="220" height="140" rx="28" fill="#DBEAFE" stroke="#93C5FD" stroke-width="6"/>
  <text x="130" y="286" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Source station</text>
  <text x="130" y="324" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Pushes charge around</text>
  <text x="130" y="352" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">the closed route.</text>
  <rect x="820" y="232" width="220" height="120" rx="26" fill="#FEF3C7" stroke="#FBBF24" stroke-width="6"/>
  <text x="876" y="288" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Lamp</text>
  <text x="862" y="324" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Transfers energy,</text>
  <text x="850" y="350" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">but does not use current up.</text>
