  <text x="696" y="592" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Current = 3 A</text>
  <text x="90" y="654" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Key idea:</text>
  <text x="228" y="654" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">In one closed route, the same stream rate passes every checkpoint.</text>
