<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Closed route keeps one stream rate</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">The Flow-Grid source station keeps the packet stream moving around one complete route.</text>

  <rect x="70" y="210" width="250" height="155" rx="30" fill="#DBEAFE" stroke="#93C5FD" stroke-width="6"/>
  <text x="105" y="274" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Source station</text>
  <text x="105" y="312" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Pushes charge around</text>
  <text x="105" y="340" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">the closed route.</text>

  <rect x="820" y="232" width="220" height="120" rx="26" fill="#FEF3C7" stroke="#FBBF24" stroke-width="6"/>
  <text x="876" y="288" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Lamp</text>
  <text x="862" y="324" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">Transfers energy,</text>
  <text x="850" y="350" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="20">but does not use current up.</text>

  <path d="M340 300H770" stroke="#2563EB" stroke-width="22" stroke-linecap="round"/>
  <path d="M770 300L720 260V340L770 300Z" fill="#2563EB"/>
  <path d="M930 490H300" stroke="#2563EB" stroke-width="22" stroke-linecap="round"/>
  <path d="M300 490L350 450V530L300 490Z" fill="#2563EB"/>
  <path d="M210 490V372" stroke="#2563EB" stroke-width="22" stroke-linecap="round"/>
  <path d="M210 372C210 332 250 300 295 300H340" stroke="#2563EB" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M930 352V490" stroke="#2563EB" stroke-width="22" stroke-linecap="round"/>

  <circle cx="420" cy="250" r="16" fill="#0EA5E9"/>
  <circle cx="470" cy="250" r="16" fill="#0EA5E9"/>
  <circle cx="520" cy="250" r="16" fill="#0EA5E9"/>
  <circle cx="570" cy="250" r="16" fill="#0EA5E9"/>
  <circle cx="620" cy="250" r="16" fill="#0EA5E9"/>
  <circle cx="670" cy="250" r="16" fill="#0EA5E9"/>

  <rect x="360" y="530" width="220" height="100" rx="26" fill="#E0F2FE" stroke="#38BDF8" stroke-width="5"/>
  <text x="392" y="576" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Checkpoint A</text>
  <text x="406" y="612" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Current = 3 A</text>

  <rect x="650" y="530" width="220" height="100" rx="26" fill="#E0F2FE" stroke="#38BDF8" stroke-width="5"/>
  <text x="682" y="576" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Checkpoint B</text>
  <text x="696" y="612" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Current = 3 A</text>

  <text x="90" y="676" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Key idea:</text>
  <text x="228" y="676" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">In one closed route, the same stream rate passes every checkpoint.</text>
