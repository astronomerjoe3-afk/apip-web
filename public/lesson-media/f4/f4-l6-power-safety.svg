<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#172554" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Power, energy, and safety work together</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">The Flow-Grid safety gate must open when the packet stream becomes dangerously large.</text>
  <rect x="90" y="210" width="430" height="400" rx="28" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="6"/>
  <text x="134" y="270" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Safe route</text>
  <text x="134" y="326" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">12 V and 2 A</text>
  <text x="134" y="364" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Power = 24 W</text>
  <text x="134" y="402" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Run for 10 s -> 240 J</text>
  <rect x="146" y="470" width="240" height="26" rx="13" fill="#10B981"/>
  <text x="134" y="550" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Fuse limit 6 A: route stays closed</text>
  <rect x="678" y="210" width="430" height="400" rx="28" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="6"/>
  <text x="722" y="270" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Overloaded route</text>
  <text x="722" y="326" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">12 V and 8 A</text>
  <text x="722" y="364" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Power = 96 W</text>
  <text x="722" y="402" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Much faster heating risk</text>
  <rect x="734" y="470" width="240" height="26" rx="13" fill="#DC2626"/>
  <path d="M986 458V536" stroke="#B91C1C" stroke-width="12" stroke-linecap="round"/>
  <path d="M1010 458V536" stroke="#B91C1C" stroke-width="12" stroke-linecap="round"/>
  <text x="722" y="550" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Fuse limit 6 A: safety gate trips</text>
  <text x="70" y="656" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Key idea:</text>
    <text x="228" y="648" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">
    <tspan x="228" dy="0">Power is energy transferred each second, total energy depends on time, and safety depends on</tspan>
    <tspan x="228" dy="30">stopping excessive current before overheating damages the circuit.</tspan>
  </text>
</svg>
