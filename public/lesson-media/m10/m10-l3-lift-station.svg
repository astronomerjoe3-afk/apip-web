<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#172554" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Voltage is the boost each carrier gets</text>
  <text x="60" y="138" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="24">
    <tspan x="60" dy="0">The source gives energy per charge.</tspan>
    <tspan x="60" dy="30">It does not store a tank of current waiting to be poured out.</tspan>
  </text>

  <rect x="76" y="214" width="1048" height="392" rx="34" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4"/>
  <rect x="128" y="324" width="180" height="132" rx="30" fill="#DBEAFE"/>
  <rect x="446" y="288" width="308" height="200" rx="36" fill="#BBF7D0"/>
  <rect x="892" y="324" width="180" height="132" rx="30" fill="#FDE68A"/>
  <text x="158" y="304" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">carrier in</text>
  <text x="512" y="336" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Lift station</text>
  <text x="500" y="388" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="30">boost per token</text>
  <text x="490" y="438" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">V = delta E / Q</text>
  <text x="914" y="304" fill="#92400E" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">carrier out</text>
  <line x1="310" y1="390" x2="430" y2="390" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  <line x1="760" y1="390" x2="880" y2="390" stroke="#16A34A" stroke-width="14" stroke-linecap="round"/>
  <polygon points="430,390 394,366 394,414" fill="#2563EB"/>
  <polygon points="880,390 844,366 844,414" fill="#16A34A"/>
  <rect x="234" y="518" width="732" height="58" rx="22" fill="#FFFFFF" stroke="#DCFCE7" stroke-width="3"/>
  <text x="264" y="556" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Voltage = energy per charge, not the same thing as current.</text>
</svg>
