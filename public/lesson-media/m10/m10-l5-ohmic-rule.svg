<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#172554" font-family="Georgia, serif" font-size="54" font-weight="700">Ohmic routes obey the simple rate rule</text>
  <text x="60" y="138" fill="#475569" font-family="Georgia, serif" font-size="26">For an ohmic route, current increases with voltage and decreases with resistance.</text>

  <rect x="82" y="204" width="470" height="402" rx="32" fill="#EFF6FF" stroke="#60A5FA" stroke-width="4"/>
  <text x="126" y="256" fill="#1D4ED8" font-family="Georgia, serif" font-size="32" font-weight="700">Fixed resistance</text>
  <text x="126" y="316" fill="#0F172A" font-family="Georgia, serif" font-size="30">6 V with 3 ohms -&gt; 2 A</text>
  <text x="126" y="376" fill="#0F172A" font-family="Georgia, serif" font-size="30">12 V with 3 ohms -&gt; 4 A</text>
  <rect x="124" y="456" width="364" height="88" rx="28" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
  <text x="154" y="510" fill="#1E293B" font-family="Georgia, serif" font-size="30" font-weight="700">More boost, same drag -&gt; more current</text>

  <rect x="648" y="204" width="470" height="402" rx="32" fill="#ECFDF5" stroke="#34D399" stroke-width="4"/>
  <text x="692" y="256" fill="#047857" font-family="Georgia, serif" font-size="32" font-weight="700">Fixed voltage</text>
  <text x="692" y="316" fill="#0F172A" font-family="Georgia, serif" font-size="30">12 V with 3 ohms -&gt; 4 A</text>
  <text x="692" y="376" fill="#0F172A" font-family="Georgia, serif" font-size="30">12 V with 6 ohms -&gt; 2 A</text>
  <rect x="690" y="456" width="366" height="88" rx="28" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="3"/>
  <text x="716" y="510" fill="#1E293B" font-family="Georgia, serif" font-size="30" font-weight="700">Same boost, more drag -&gt; less current</text>
</svg>
