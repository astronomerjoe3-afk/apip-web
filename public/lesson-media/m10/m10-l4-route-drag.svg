<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#172554" font-family="Georgia, serif" font-size="54" font-weight="700">Resistance belongs to the route</text>
  <text x="60" y="138" fill="#475569" font-family="Georgia, serif" font-size="26">Material and geometry matter. Longer routes usually give more drag, while wider routes usually give less.</text>

  <rect x="82" y="206" width="472" height="396" rx="32" fill="#EFF6FF" stroke="#60A5FA" stroke-width="4"/>
  <text x="126" y="258" fill="#1D4ED8" font-family="Georgia, serif" font-size="32" font-weight="700">Lower resistance route</text>
  <rect x="132" y="350" width="340" height="42" rx="21" fill="#38BDF8"/>
  <text x="142" y="332" fill="#0F172A" font-family="Georgia, serif" font-size="24" font-weight="700">Shorter and wider</text>
  <text x="142" y="454" fill="#1E293B" font-family="Georgia, serif" font-size="28">Carriers meet less route drag here.</text>

  <rect x="646" y="206" width="472" height="396" rx="32" fill="#FEF2F2" stroke="#F87171" stroke-width="4"/>
  <text x="690" y="258" fill="#B91C1C" font-family="Georgia, serif" font-size="32" font-weight="700">Higher resistance route</text>
  <rect x="694" y="314" width="340" height="24" rx="12" fill="#0F766E"/>
  <rect x="694" y="382" width="340" height="24" rx="12" fill="#115E59"/>
  <rect x="694" y="450" width="340" height="24" rx="12" fill="#134E4A"/>
  <text x="704" y="288" fill="#0F172A" font-family="Georgia, serif" font-size="24" font-weight="700">Longer, narrower, rougher</text>
  <text x="704" y="538" fill="#1E293B" font-family="Georgia, serif" font-size="28">Carriers meet more route drag here.</text>
</svg>
