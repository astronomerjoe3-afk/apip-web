<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#172554" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Resistance belongs to the route</text>
  <text x="60" y="138" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="24">
    <tspan x="60" dy="0">Material and geometry matter. Longer routes usually give more drag,</tspan>
    <tspan x="60" dy="30">while wider routes usually give less.</tspan>
  </text>

  <rect x="82" y="206" width="472" height="396" rx="32" fill="#EFF6FF" stroke="#60A5FA" stroke-width="4"/>
  <text x="126" y="258" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Lower resistance route</text>
  <rect x="132" y="350" width="340" height="42" rx="21" fill="#38BDF8"/>
  <text x="142" y="332" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Shorter and wider</text>
  <text x="142" y="454" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="24">Carriers meet less route drag here.</text>

  <rect x="646" y="206" width="472" height="396" rx="32" fill="#FEF2F2" stroke="#F87171" stroke-width="4"/>
  <text x="690" y="258" fill="#B91C1C" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Higher resistance route</text>
  <line x1="704" y1="324" x2="1012" y2="324" stroke="#0F766E" stroke-width="18" stroke-linecap="round"/>
  <line x1="1012" y1="324" x2="1012" y2="396" stroke="#115E59" stroke-width="12" stroke-linecap="round"/>
  <line x1="1012" y1="396" x2="718" y2="396" stroke="#115E59" stroke-width="18" stroke-linecap="round"/>
  <line x1="718" y1="396" x2="718" y2="468" stroke="#134E4A" stroke-width="12" stroke-linecap="round"/>
  <line x1="718" y1="468" x2="1012" y2="468" stroke="#134E4A" stroke-width="18" stroke-linecap="round"/>
  <text x="704" y="288" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Longer, narrower, rougher</text>
  <text x="704" y="538" fill="#1E293B" font-family="Arial, Helvetica, sans-serif" font-size="24">Carriers meet more route drag here.</text>
</svg>
