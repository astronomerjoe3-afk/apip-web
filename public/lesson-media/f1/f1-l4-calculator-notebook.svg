<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Calculator display versus recorded answer</title>
  <desc id="desc">A calculator display of 0.02050 leads to a lab notebook entry of 0.0205 after checking how many digits the measurement justifies.</desc>
  <rect width="1200" height="700" rx="36" fill="#f8fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Calculator display versus recorded answer</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">A screen can show extra digits. Your notebook should keep only the digits the measurement supports.</text>

  <g transform="translate(90 220)">
    <rect width="300" height="320" rx="34" fill="#1e293b"/>
    <rect x="34" y="34" width="232" height="86" rx="18" fill="#e2e8f0"/>
    <text x="150" y="92" text-anchor="middle" font-size="52" font-family="Consolas, monospace" fill="#0f172a">0.02050</text>
    <text x="150" y="270" text-anchor="middle" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#ffffff">Calculator display</text>
    <text x="150" y="306" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#cbd5e1">Shows every computed digit</text>
  </g>

  <g>
    <path d="M448 380 H700" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
    <path d="M664 350 L700 380 L664 410" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="470" y="244" width="212" height="96" rx="24" fill="#ecfdf5" stroke="#86efac" stroke-width="3"/>
    <text x="576" y="284" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#166534">Before recording, ask:</text>
    <text x="576" y="316" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#166534">How many digits are justified?</text>
  </g>

  <g transform="translate(760 190)">
    <rect width="290" height="380" rx="26" fill="#ffffff" stroke="#94a3b8" stroke-width="5"/>
    <text x="34" y="58" font-size="26" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Lab notebook</text>
    <line x1="34" y1="112" x2="256" y2="112" stroke="#dbe4ef" stroke-width="4"/>
    <line x1="34" y1="162" x2="256" y2="162" stroke="#dbe4ef" stroke-width="4"/>
    <line x1="34" y1="212" x2="256" y2="212" stroke="#dbe4ef" stroke-width="4"/>
    <text x="34" y="284" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Recorded answer:</text>
    <text x="34" y="344" font-size="58" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">0.0205</text>
    <text x="34" y="380" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#0f766e">Keep only justified digits.</text>
  </g>
</svg>
