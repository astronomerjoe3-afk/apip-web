<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Random error and zero error need different fixes</title>
  <desc id="desc">The left panel shows readings scattered around the same best value, which is random error. The right panel shows a scale starting from the wrong zero, which adds the same offset every time and must be corrected.</desc>
  <rect width="1200" height="730" rx="36" fill="#f8fbff"/>
  <text x="60" y="80" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Same bad reading? No. These errors leave different patterns.</text>
  <text x="60" y="122" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Random error changes from one reading to the next. Zero error starts the instrument in the wrong place before any measurement begins.</text>

  <g transform="translate(64 156)">
    <rect width="1072" height="522" rx="34" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>

    <rect x="372" y="20" width="328" height="40" rx="20" fill="#eff6ff"/>
    <text x="536" y="46" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Different pattern -&gt; different fix</text>

    <g transform="translate(34 82)">
      <rect width="470" height="392" rx="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="30" y="42" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Random error</text>
      <text x="30" y="78" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Repeated readings jump around, but they still cluster around the same best value.</text>

      <text x="30" y="124" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Small scatter around the best value</text>
      <line x1="44" y1="160" x2="420" y2="160" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
      <line x1="232" y1="128" x2="232" y2="194" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6 6"/>
      <text x="244" y="134" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">best value</text>
      <circle cx="198" cy="154" r="12" fill="#0f766e"/>
      <circle cx="222" cy="168" r="12" fill="#0f766e"/>
      <circle cx="250" cy="151" r="12" fill="#0f766e"/>
      <circle cx="276" cy="162" r="12" fill="#0f766e"/>
      <text x="30" y="210" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Tighter clustering means smaller random uncertainty.</text>

      <text x="30" y="260" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c2410c">Larger scatter around the same best value</text>
      <line x1="44" y1="296" x2="420" y2="296" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
      <line x1="232" y1="264" x2="232" y2="330" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6 6"/>
      <circle cx="110" cy="286" r="12" fill="#f97316"/>
      <circle cx="182" cy="309" r="12" fill="#f97316"/>
      <circle cx="282" cy="281" r="12" fill="#f97316"/>
      <circle cx="360" cy="304" r="12" fill="#f97316"/>
      <text x="30" y="346" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Average repeated readings to reduce the effect of random scatter.</text>
      <text x="30" y="374" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Averaging helps because the reading-to-reading error changes sign and size.</text>
    </g>

    <g transform="translate(568 82)">
      <rect width="470" height="392" rx="30" fill="#fffdf2" stroke="#fde68a" stroke-width="3"/>
      <text x="30" y="42" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Zero error</text>
      <text x="30" y="78" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#475569">The instrument starts from the wrong zero, so every later reading is shifted by the same amount.</text>

      <text x="30" y="124" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Correct zero before measuring</text>
      <rect x="46" y="144" width="320" height="34" rx="17" fill="#e2e8f0"/>
      <line x1="86" y1="144" x2="86" y2="178" stroke="#475569" stroke-width="4"/>
      <line x1="176" y1="144" x2="176" y2="178" stroke="#475569" stroke-width="4"/>
      <line x1="266" y1="144" x2="266" y2="178" stroke="#475569" stroke-width="4"/>
      <rect x="36" y="132" width="54" height="58" rx="16" fill="#22c55e" opacity="0.9"/>
      <text x="46" y="214" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Pointer begins at 0, so the scale starts honestly.</text>

      <text x="30" y="266" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c2410c">Shifted zero adds a constant offset</text>
      <rect x="46" y="286" width="320" height="34" rx="17" fill="#e2e8f0"/>
      <line x1="86" y1="286" x2="86" y2="320" stroke="#475569" stroke-width="4"/>
      <line x1="176" y1="286" x2="176" y2="320" stroke="#475569" stroke-width="4"/>
      <line x1="266" y1="286" x2="266" y2="320" stroke="#475569" stroke-width="4"/>
      <rect x="76" y="274" width="54" height="58" rx="16" fill="#f59e0b" opacity="0.95"/>
      <line x1="86" y1="346" x2="118" y2="346" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="132" y="352" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">Same positive offset is added every time.</text>

      <rect x="30" y="362" width="406" height="18" rx="9" fill="#fef3c7"/>
      <text x="34" y="380" font-size="17" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">Example: true reading 4.20 cm -&gt; faulty scale shows 4.25 cm each time</text>
      <text x="30" y="408" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Averaging repeated readings will not remove a constant offset.</text>
      <text x="30" y="434" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#516277">You must correct for the offset or recalibrate the instrument.</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
