<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">Random error and zero error need different fixes</title>
  <desc id="desc">The left panel shows readings scattered around the same best value, which is random error. The right panel shows a scale starting from the wrong zero, which adds the same offset every time and must be corrected.</desc>
  <rect width="1200" height="770" rx="36" fill="#f8fbff"/>
  <text x="60" y="80" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Same bad reading? No. These errors leave different patterns.</text>
  <text x="60" y="122" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Random error changes from one reading to the next.</text>
  <text x="60" y="152" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Zero error starts the instrument in the wrong place before any measurement begins.</text>

  <g transform="translate(64 184)">
    <rect width="1072" height="534" rx="34" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>

    <rect x="372" y="20" width="328" height="40" rx="20" fill="#eff6ff"/>
    <text x="536" y="46" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Different pattern -&gt; different fix</text>

    <g transform="translate(34 82)">
      <rect width="470" height="408" rx="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="30" y="42" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Random error</text>
      <text x="30" y="78" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#475569">
        <tspan x="30" y="78">Repeated readings jump around, but they still cluster</tspan>
        <tspan x="30" dy="26">around the same best value.</tspan>
      </text>

      <text x="30" y="136" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Small scatter around the best value</text>
      <line x1="44" y1="172" x2="420" y2="172" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
      <line x1="232" y1="140" x2="232" y2="206" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6 6"/>
      <text x="244" y="146" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">best value</text>
      <circle cx="198" cy="166" r="12" fill="#0f766e"/>
      <circle cx="222" cy="180" r="12" fill="#0f766e"/>
      <circle cx="250" cy="163" r="12" fill="#0f766e"/>
      <circle cx="276" cy="174" r="12" fill="#0f766e"/>
      <text x="30" y="224" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Tighter clustering means smaller random uncertainty.</text>

      <text x="30" y="276" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c2410c">Larger scatter around the same best value</text>
      <line x1="44" y1="312" x2="420" y2="312" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
      <line x1="232" y1="280" x2="232" y2="346" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="6 6"/>
      <circle cx="110" cy="302" r="12" fill="#f97316"/>
      <circle cx="182" cy="325" r="12" fill="#f97316"/>
      <circle cx="282" cy="297" r="12" fill="#f97316"/>
      <circle cx="360" cy="320" r="12" fill="#f97316"/>
      <text x="30" y="364" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#334155">
        <tspan x="30" y="364">Average repeated readings to reduce the</tspan>
        <tspan x="30" dy="24">effect of random scatter.</tspan>
      </text>
      <text x="30" y="416" font-size="17" font-family="Segoe UI, Arial, sans-serif" fill="#516277">
        <tspan x="30" y="416">Averaging helps because the reading-to-reading error</tspan>
        <tspan x="30" dy="22">changes sign and size.</tspan>
      </text>
    </g>

    <g transform="translate(568 82)">
      <rect width="470" height="408" rx="30" fill="#fffdf2" stroke="#fde68a" stroke-width="3"/>
      <text x="30" y="42" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Zero error</text>
      <text x="30" y="78" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#475569">
        <tspan x="30" y="78">The instrument starts from the wrong zero, so every</tspan>
        <tspan x="30" dy="26">later reading is shifted by the same amount.</tspan>
      </text>

      <text x="30" y="136" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Correct zero before measuring</text>
      <rect x="46" y="152" width="320" height="34" rx="17" fill="#e2e8f0"/>
      <line x1="86" y1="152" x2="86" y2="186" stroke="#475569" stroke-width="4"/>
      <line x1="176" y1="152" x2="176" y2="186" stroke="#475569" stroke-width="4"/>
      <line x1="266" y1="152" x2="266" y2="186" stroke="#475569" stroke-width="4"/>
      <rect x="36" y="140" width="54" height="58" rx="16" fill="#22c55e" opacity="0.9"/>
      <text x="46" y="222" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Pointer begins at 0, so the scale starts honestly.</text>

      <text x="30" y="272" font-size="19" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#c2410c">Shifted zero adds a constant offset</text>
      <rect x="46" y="288" width="320" height="34" rx="17" fill="#e2e8f0"/>
      <line x1="86" y1="288" x2="86" y2="322" stroke="#475569" stroke-width="4"/>
      <line x1="176" y1="288" x2="176" y2="322" stroke="#475569" stroke-width="4"/>
      <line x1="266" y1="288" x2="266" y2="322" stroke="#475569" stroke-width="4"/>
      <rect x="76" y="276" width="54" height="58" rx="16" fill="#f59e0b" opacity="0.95"/>
      <line x1="86" y1="348" x2="118" y2="348" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="132" y="354" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">Same positive offset is added every time.</text>

      <rect x="30" y="366" width="406" height="40" rx="12" fill="#fef3c7"/>
      <text x="36" y="384" font-size="15" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">
        <tspan x="36" y="384">Example: true reading 4.20 cm -&gt;</tspan>
        <tspan x="36" dy="18">faulty scale shows 4.25 cm each time</tspan>
      </text>
      <text x="30" y="432" font-size="17" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Averaging repeated readings will not remove a constant offset.</text>
      <text x="30" y="456" font-size="17" font-family="Segoe UI, Arial, sans-serif" fill="#516277">You must correct for the offset or recalibrate the instrument.</text>
    </g>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
