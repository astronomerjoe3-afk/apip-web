<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Metric system ladder</title>
  <desc id="desc">A metric ladder showing kilo, metre, centi, and milli units with example measurement cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Metric unit ladder</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Move down to smaller units, move up to larger units.</text>
  <g transform="translate(120 210)">
    <rect x="0" y="280" width="920" height="90" rx="24" fill="#dbeafe"/>
    <rect x="60" y="200" width="760" height="90" rx="24" fill="#bfdbfe"/>
    <rect x="140" y="120" width="600" height="90" rx="24" fill="#93c5fd"/>
    <rect x="250" y="40" width="380" height="90" rx="24" fill="#60a5fa"/>
    <text x="410" y="100" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">kilo-</text>
    <text x="440" y="178" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">metre</text>
    <text x="440" y="258" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">centi-</text>
    <text x="460" y="338" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">milli-</text>
    <path d="M930 95 L1000 95" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
    <path d="M980 70 L1020 95 L980 120" fill="none" stroke="#0f766e" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="945" y="52" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#0f766e">number grows</text>
    <path d="M1030 325 L960 325" stroke="#b45309" stroke-width="14" stroke-linecap="round"/>
    <path d="M980 300 L940 325 L980 350" fill="none" stroke="#b45309" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="905" y="375" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#b45309">number shrinks</text>
  </g>
  <g transform="translate(780 170)">
    <rect width="290" height="160" rx="28" fill="#ffffff" stroke="#d1e3ff" stroke-width="4"/>
    <text x="28" y="50" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Examples</text>
    <text x="28" y="92" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">2.5 km = 2500 m</text>
    <text x="28" y="128" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">35 cm = 0.35 m</text>
  </g>
</svg>
