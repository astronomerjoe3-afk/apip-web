<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Metric system ladder</title>
  <desc id="desc">A metric ladder showing kilo, metre, centi, and milli with example conversions and separate vertical arrows that explain how the number changes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="36" fill="url(#bg)"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Metric unit ladder</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Move down to smaller units. Move up to larger units.</text>

  <g transform="translate(90 210)">
    <rect x="0" y="280" width="800" height="90" rx="24" fill="#dbeafe"/>
    <rect x="60" y="200" width="680" height="90" rx="24" fill="#bfdbfe"/>
    <rect x="140" y="120" width="540" height="90" rx="24" fill="#93c5fd"/>
    <rect x="240" y="40" width="380" height="90" rx="24" fill="#60a5fa"/>
    <text x="430" y="100" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">kilo-</text>
    <text x="400" y="178" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">metre (m)</text>
    <text x="410" y="258" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">centi-</text>
    <text x="420" y="338" text-anchor="middle" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f172a">milli-</text>
  </g>

  <g transform="translate(660 78)">
    <rect width="300" height="188" rx="28" fill="#ffffff" stroke="#d1e3ff" stroke-width="4"/>
    <text x="28" y="52" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Examples</text>
    <text x="28" y="98" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">2.5 km = 2500 m</text>
    <text x="28" y="136" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">35 cm = 0.35 m</text>
    <text x="28" y="174" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">8 mm = 0.008 m</text>
  </g>

  <g>
    <text x="1010" y="310" text-anchor="end" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#0f766e">Move down to</text>
    <text x="1010" y="338" text-anchor="end" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#0f766e">smaller units</text>
    <text x="1010" y="370" text-anchor="end" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">number grows</text>
    <path d="M1040 286 V536" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
    <path d="M1018 506 L1040 536 L1062 506" fill="none" stroke="#0f766e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <text x="1110" y="430" text-anchor="end" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#b45309">Move up to</text>
    <text x="1110" y="458" text-anchor="end" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#b45309">larger units</text>
    <text x="1110" y="490" text-anchor="end" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#b45309">number shrinks</text>
    <path d="M1138 604 V354" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
    <path d="M1116 384 L1138 354 L1160 384" fill="none" stroke="#b45309" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
