<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Significant figures and rounding</title>
  <desc id="desc">A worked rounding example beside a calculator and notebook to show that only justified digits should be reported.</desc>
  <rect width="1200" height="700" rx="36" fill="#fffaf5"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Significant figures and rounding</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Keep only the digits your measurement can honestly support.</text>
  <g transform="translate(70 210)">
    <rect width="520" height="360" rx="28" fill="#ffffff" stroke="#f3d0a6" stroke-width="4"/>
    <text x="34" y="58" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Rounding the last kept digit</text>
    <text x="48" y="136" font-size="62" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">3.4768</text>
    <rect x="250" y="86" width="70" height="78" rx="18" fill="#dbeafe"/>
    <rect x="332" y="86" width="70" height="78" rx="18" fill="#fde68a"/>
    <text x="48" y="210" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Keep 3.47, then look at the next digit.</text>
    <text x="48" y="248" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Next digit 6 means round up to 3.48.</text>
    <text x="48" y="296" font-size="42" font-family="Consolas, monospace" font-weight="700" fill="#0f766e">3.48</text>
  </g>
  <g transform="translate(650 210)">
    <rect width="480" height="360" rx="28" fill="#ffffff" stroke="#f3d0a6" stroke-width="4"/>
    <text x="34" y="58" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Calculator vs notebook</text>
    <rect x="44" y="102" width="170" height="220" rx="24" fill="#1e293b"/>
    <rect x="68" y="126" width="122" height="52" rx="12" fill="#e2e8f0"/>
    <text x="129" y="161" text-anchor="middle" font-size="32" font-family="Consolas, monospace" fill="#0f172a">0.02050</text>
    <rect x="270" y="102" width="150" height="220" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <line x1="294" y1="144" x2="394" y2="144" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="294" y1="188" x2="394" y2="188" stroke="#cbd5e1" stroke-width="4"/>
    <line x1="294" y1="232" x2="394" y2="232" stroke="#cbd5e1" stroke-width="4"/>
    <text x="292" y="280" font-size="26" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Report justified digits</text>
  </g>
</svg>
