<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Round by checking the next digit</title>
  <desc id="desc">A significant figures diagram that rounds 3.4768 to 3.48 by highlighting the last kept digit 7 and the next digit 6.</desc>
  <rect width="1200" height="700" rx="36" fill="#fffaf5"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Round by checking the next digit</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Keep the required digits, inspect the next digit, then decide whether to round up.</text>

  <g transform="translate(80 210)">
    <rect width="1040" height="400" rx="30" fill="#ffffff" stroke="#f3d0a6" stroke-width="4"/>

    <g transform="translate(56 56)">
      <rect x="0" y="0" width="216" height="52" rx="18" fill="#eff6ff"/>
      <text x="108" y="34" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Target: 2 decimal places</text>

      <g transform="translate(0 86)">
        <rect x="166" y="-78" width="70" height="106" rx="18" fill="#dbeafe"/>
        <rect x="232" y="-78" width="70" height="106" rx="18" fill="#fde68a"/>
        <text x="0" y="0" font-size="108" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">3</text>
        <text x="62" y="0" font-size="108" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">.</text>
        <text x="106" y="0" font-size="108" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">4</text>
        <text x="176" y="0" font-size="108" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">7</text>
        <text x="242" y="0" font-size="108" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">6</text>
        <text x="308" y="0" font-size="108" font-family="Consolas, monospace" font-weight="700" fill="#0f172a">8</text>

        <text x="201" y="-102" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2563eb">last kept digit</text>
        <path d="M201 -94 V-54" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
        <text x="267" y="-102" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#b45309">next digit</text>
        <path d="M267 -94 V-54" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>

        <path d="M0 40 H220" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
        <path d="M0 40 V58" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
        <path d="M220 40 V58" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
        <text x="110" y="92" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#2563eb">Keep 3.47</text>
      </g>
    </g>

    <g transform="translate(510 58)">
      <rect width="476" height="136" rx="24" fill="#fffbeb" stroke="#fcd34d" stroke-width="3"/>
      <text x="28" y="44" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#92400e">Decision</text>
      <text x="28" y="86" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#78350f">The next digit is 6, so it is 5 or more.</text>
      <text x="28" y="118" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#78350f">Round the last kept digit 7 up to 8.</text>
    </g>

    <path d="M432 324 H618" stroke="#0f766e" stroke-width="10" stroke-linecap="round"/>
    <path d="M584 296 L618 324 L584 352" fill="none" stroke="#0f766e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(650 240)">
      <rect width="324" height="128" rx="26" fill="#ecfdf5" stroke="#86efac" stroke-width="3"/>
      <text x="28" y="42" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#166534">Rounded answer</text>
      <text x="28" y="100" font-size="74" font-family="Consolas, monospace" font-weight="700" fill="#0f766e">3.48</text>
    </g>
  </g>
</svg>
