<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Density picture</title>
  <desc id="desc">Blocks of equal size with different masses and a floating versus sinking comparison.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Density and floating</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Density compares how much mass is packed into the same amount of space.</text>
  <g transform="translate(70 210)">
    <rect width="520" height="360" rx="28" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="58" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Equal size, different mass</text>
    <rect x="84" y="128" width="130" height="130" rx="18" fill="#93c5fd"/>
    <rect x="304" y="128" width="130" height="130" rx="18" fill="#2563eb"/>
    <text x="149" y="306" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">lighter block</text>
    <text x="369" y="306" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">heavier block</text>
    <text x="56" y="348" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Same volume, but more mass packed in means greater density.</text>
  </g>
  <g transform="translate(650 210)">
    <rect width="480" height="360" rx="28" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="58" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Float or sink</text>
    <rect x="44" y="170" width="392" height="120" rx="24" fill="#bfdbfe"/>
    <rect x="118" y="130" width="110" height="60" rx="16" fill="#fbbf24"/>
    <circle cx="338" cy="276" r="54" fill="#334155"/>
    <text x="78" y="342" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Less dense than the fluid -> floats</text>
    <text x="78" y="372" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">More dense than the fluid -> sinks</text>
  </g>
</svg>
