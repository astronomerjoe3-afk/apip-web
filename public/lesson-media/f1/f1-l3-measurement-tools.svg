<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">One object measured with three tools</title>
  <desc id="desc">The same rod is measured with a ruler, a caliper, and a micrometer. The object does not change, but finer tool divisions justify more digits and smaller uncertainty.</desc>
  <rect width="1200" height="720" rx="36" fill="#f8fbff"/>
  <text x="58" y="78" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">One object, three tools, three levels of detail</text>
  <text x="58" y="120" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#516277">The rod stays the same. Only the tool resolution changes how many digits and how much uncertainty you can justify.</text>

  <g transform="translate(62 154)">
    <rect width="1076" height="506" rx="34" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>

    <rect x="346" y="22" width="384" height="42" rx="21" fill="#eff6ff"/>
    <text x="538" y="49" text-anchor="middle" font-size="23" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Same rod -&gt; finer scale -&gt; more justified detail</text>

    <g transform="translate(34 86)">
      <rect width="308" height="366" rx="30" fill="#fffdf2" stroke="#f5cf65" stroke-width="3"/>
      <text x="30" y="40" font-size="27" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Ruler</text>
      <text x="30" y="71" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Good for rough length checks.</text>

      <text x="30" y="108" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#92400e">Smallest division: 0.1 cm (1 mm)</text>
      <rect x="34" y="134" width="240" height="34" rx="17" fill="#fde68a"/>
      <path d="M58 134 V168 M90 134 V150 M122 134 V168 M154 134 V150 M186 134 V168 M218 134 V150 M250 134 V168" stroke="#92400e" stroke-width="4"/>

      <text x="30" y="205" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Same metal rod</text>
      <rect x="72" y="220" width="146" height="28" rx="14" fill="#93c5fd"/>

      <text x="30" y="290" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Most justified reading: 4.3 cm</text>
      <text x="30" y="324" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">Reasonable uncertainty: +/- 0.05 cm</text>
      <text x="30" y="352" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Only one decimal place is supported here.</text>
    </g>

    <g transform="translate(384 86)">
      <rect width="308" height="366" rx="30" fill="#f5fbff" stroke="#bfdbfe" stroke-width="3"/>
      <text x="30" y="40" font-size="27" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Caliper</text>
      <text x="30" y="71" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Useful for smaller diameters and thicknesses.</text>

      <text x="30" y="108" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Smallest division: 0.01 cm</text>
      <rect x="36" y="216" width="236" height="20" rx="10" fill="#475569"/>
      <path d="M82 156 V280 M182 156 V280" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
      <path d="M62 174 V264 M100 174 V264 M164 174 V264 M202 174 V264" stroke="#0f766e" stroke-width="4"/>

      <text x="30" y="205" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Same metal rod</text>
      <rect x="84" y="210" width="146" height="32" rx="16" fill="#93c5fd" opacity="0.9"/>

      <text x="30" y="290" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Most justified reading: 4.28 cm</text>
      <text x="30" y="324" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#0f766e">Reasonable uncertainty: +/- 0.005 cm</text>
      <text x="30" y="352" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#516277">The finer scale supports an extra digit.</text>
    </g>

    <g transform="translate(734 86)">
      <rect width="308" height="366" rx="30" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="30" y="40" font-size="27" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Micrometer</text>
      <text x="30" y="71" font-size="19" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Best when the object is very small.</text>

      <text x="30" y="108" font-size="18" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#475569">Smallest division: 0.001 cm</text>
      <circle cx="84" cy="190" r="56" fill="none" stroke="#475569" stroke-width="18"/>
      <rect x="128" y="174" width="94" height="32" rx="16" fill="#94a3b8"/>
      <rect x="206" y="156" width="50" height="68" rx="18" fill="#64748b"/>

      <text x="30" y="205" font-size="16" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Same metal rod</text>
      <rect x="124" y="236" width="118" height="30" rx="15" fill="#93c5fd" opacity="0.9"/>

      <text x="30" y="290" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Most justified reading: 4.276 cm</text>
      <text x="30" y="324" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Reasonable uncertainty: +/- 0.0005 cm</text>
      <text x="30" y="352" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Tiny divisions support the finest detail.</text>
    </g>

    <rect x="202" y="470" width="672" height="28" rx="14" fill="#eff6ff"/>
    <text x="538" y="490" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Better tool resolution does not change the rod; it changes how precisely you can report it.</text>
  </g>
</svg>
