<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Float or sink depends on density</title>
  <desc id="desc">A floating block is less dense than the fluid, while a sinking block is more dense than the fluid.</desc>
  <rect width="1200" height="700" rx="36" fill="#f8fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Float or sink depends on density</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Compare the object density with the fluid density, not just the object mass.</text>

  <g transform="translate(92 214)">
    <rect width="1016" height="386" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>

    <g transform="translate(58 44)">
      <rect width="390" height="300" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
      <text x="28" y="46" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Object less dense than fluid</text>
      <rect x="34" y="138" width="322" height="126" rx="28" fill="#bfdbfe"/>
      <line x1="34" y1="138" x2="356" y2="138" stroke="#60a5fa" stroke-width="5"/>
      <rect x="134" y="94" width="120" height="74" rx="18" fill="#fbbf24"/>
      <text x="195" y="118" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">0.8 g/cm^3</text>
      <text x="195" y="220" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#166534">object density &lt; fluid density</text>
      <text x="195" y="258" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#166534">It floats.</text>
    </g>

    <g transform="translate(568 44)">
      <rect width="390" height="300" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
      <text x="28" y="46" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Object more dense than fluid</text>
      <rect x="34" y="138" width="322" height="126" rx="28" fill="#bfdbfe"/>
      <line x1="34" y1="138" x2="356" y2="138" stroke="#60a5fa" stroke-width="5"/>
      <circle cx="286" cy="248" r="56" fill="#334155"/>
      <text x="162" y="220" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#b45309">object density &gt; fluid density</text>
      <text x="162" y="258" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#b45309">It sinks.</text>
      <text x="286" y="258" text-anchor="middle" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#e2e8f0">1.4 g/cm^3</text>
    </g>

    <rect x="228" y="338" width="560" height="34" rx="17" fill="#f8fafc"/>
    <text x="508" y="362" text-anchor="middle" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Fluid density here: 1.0 g/cm^3</text>
  </g>
</svg>
