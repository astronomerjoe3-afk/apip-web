<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Vectors and scalars</title>
  <desc id="desc">An arrow on a map contrasted with a thermometer scale to show vectors and scalars.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Vectors and scalars</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Vectors need magnitude and direction. Scalars need magnitude only.</text>
  <g transform="translate(70 210)">
    <rect width="500" height="360" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="54" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Arrow on a map</text>
    <rect x="40" y="90" width="420" height="230" rx="18" fill="#e0f2fe"/>
    <path d="M80 150 H420 M80 220 H420 M80 290 H420 M140 110 V310 M240 110 V310 M340 110 V310" stroke="#93c5fd" stroke-width="4"/>
    <path d="M140 280 L360 160" stroke="#0f766e" stroke-width="18" stroke-linecap="round"/>
    <path d="M332 148 L410 132 L372 202" fill="#0f766e"/>
    <text x="48" y="342" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Arrow length = magnitude</text>
    <text x="48" y="372" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Arrow direction = where it points</text>
  </g>
  <g transform="translate(630 210)">
    <rect width="500" height="360" rx="30" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="54" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Thermometer reading</text>
    <rect x="214" y="106" width="74" height="182" rx="36" fill="#eff6ff" stroke="#94a3b8" stroke-width="6"/>
    <circle cx="251" cy="320" r="52" fill="#ef4444"/>
    <rect x="235" y="146" width="32" height="165" rx="16" fill="#ef4444"/>
    <path d="M315 130 H362 M315 170 H362 M315 210 H362 M315 250 H362" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <text x="382" y="138" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">40</text>
    <text x="382" y="178" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">30</text>
    <text x="382" y="218" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">20</text>
    <text x="382" y="258" font-size="20" font-family="Segoe UI, Arial, sans-serif" fill="#334155">10</text>
    <text x="44" y="342" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Temperature shows how much, not which way</text>
    <text x="44" y="372" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">That makes it scalar</text>
  </g>
</svg>
