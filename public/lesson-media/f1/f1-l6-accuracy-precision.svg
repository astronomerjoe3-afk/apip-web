<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Accuracy and precision</title>
  <desc id="desc">A target board illustrating accurate and precise shots beside a trustworthy measurement report.</desc>
  <rect width="1200" height="700" rx="36" fill="#f7fbff"/>
  <text x="70" y="96" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Accuracy, precision, and trust</text>
  <text x="70" y="144" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#516277">Good measurement work aims for readings that are close to the true value and agree with one another.</text>
  <g transform="translate(70 210)">
    <rect width="520" height="360" rx="28" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="58" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Target board</text>
    <circle cx="250" cy="208" r="120" fill="#fee2e2"/>
    <circle cx="250" cy="208" r="82" fill="#fecaca"/>
    <circle cx="250" cy="208" r="44" fill="#ef4444"/>
    <circle cx="250" cy="208" r="10" fill="#7f1d1d"/>
    <circle cx="388" cy="168" r="10" fill="#0f766e"/>
    <circle cx="404" cy="184" r="10" fill="#0f766e"/>
    <circle cx="390" cy="200" r="10" fill="#0f766e"/>
    <circle cx="246" cy="206" r="10" fill="#1d4ed8"/>
    <circle cx="258" cy="218" r="10" fill="#1d4ed8"/>
    <circle cx="238" cy="220" r="10" fill="#1d4ed8"/>
    <text x="42" y="332" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Tight cluster away from centre = precise but inaccurate</text>
    <text x="42" y="362" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Cluster near centre = accurate and precise</text>
  </g>
  <g transform="translate(650 210)">
    <rect width="480" height="360" rx="28" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>
    <text x="34" y="58" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Trustworthy report</text>
    <rect x="52" y="102" width="320" height="210" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    <text x="78" y="146" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Tool: Vernier caliper</text>
    <text x="78" y="190" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Reading: 12.40 mm</text>
    <text x="78" y="234" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Uncertainty: +/- 0.05 mm</text>
    <text x="78" y="278" font-size="24" font-family="Segoe UI, Arial, sans-serif" fill="#334155">Repeat trials: close agreement</text>
    <text x="54" y="344" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#334155">State the tool, the value, and the uncertainty.</text>
  </g>
</svg>
