<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Same object, different justified detail</title>
  <desc id="desc">Three measuring tools view the same object. The ruler has the coarsest divisions, the caliper is finer, and the micrometer screw gauge is finest, so each tool supports a different justified reading and uncertainty.</desc>
  <rect width="1200" height="760" rx="36" fill="#f8fbff"/>

  <text x="60" y="82" font-size="30" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Same object, different justified detail</text>
  <text x="60" y="124" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#516277">A better instrument does not change the object.</text>
  <text x="60" y="154" font-size="22" font-family="Segoe UI, Arial, sans-serif" fill="#516277">It changes the smallest division, the justified digits, and the uncertainty you can report honestly.</text>

  <g transform="translate(62 186)">
    <rect width="1076" height="516" rx="34" fill="#ffffff" stroke="#d8e6f7" stroke-width="4"/>

    <rect x="314" y="22" width="448" height="40" rx="20" fill="#eff6ff"/>
    <text x="538" y="48" text-anchor="middle" font-size="22" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#1d4ed8">Same rod -&gt; finer scale -&gt; more justified detail</text>

    <g transform="translate(34 92)">
      <rect width="1008" height="108" rx="26" fill="#fffdf2" stroke="#f5cf65" stroke-width="3"/>
      <text x="30" y="38" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Ruler</text>
      <text x="30" y="68" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Coarse scale for rough checks on larger objects.</text>
      <text x="30" y="92" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#92400e">Smallest division: 0.1 cm (1 mm)</text>

      <rect x="390" y="34" width="248" height="28" rx="14" fill="#fde68a"/>
      <path d="M414 34 V62 M446 34 V50 M478 34 V62 M510 34 V50 M542 34 V62 M574 34 V50 M606 34 V62" stroke="#92400e" stroke-width="4"/>
      <rect x="410" y="72" width="150" height="18" rx="9" fill="#93c5fd"/>

      <text x="686" y="40" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Justified reading</text>
      <text x="686" y="66" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#334155">4.3 cm</text>
      <text x="686" y="94" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#92400e">Reasonable uncertainty: +/- 0.05 cm</text>
    </g>

    <g transform="translate(34 216)">
      <rect width="1008" height="108" rx="26" fill="#f5fbff" stroke="#bfdbfe" stroke-width="3"/>
      <text x="30" y="38" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Caliper</text>
      <text x="30" y="68" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Finer jaws help with smaller diameters and thicknesses.</text>
      <text x="30" y="92" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#0f766e">Smallest division: 0.01 cm</text>

      <rect x="390" y="52" width="248" height="18" rx="9" fill="#475569"/>
      <rect x="430" y="18" width="16" height="86" rx="8" fill="#0f766e"/>
      <rect x="560" y="18" width="16" height="86" rx="8" fill="#0f766e"/>
      <rect x="446" y="42" width="114" height="28" rx="14" fill="#93c5fd" opacity="0.9"/>

      <text x="686" y="40" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Justified reading</text>
      <text x="686" y="66" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#334155">4.28 cm</text>
      <text x="686" y="94" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#0f766e">Reasonable uncertainty: +/- 0.005 cm</text>
    </g>

    <g transform="translate(34 340)">
      <rect width="1008" height="126" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
      <text x="30" y="38" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#10233f">Micrometer screw gauge</text>
      <text x="30" y="68" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Best when the object is very small and tiny differences matter.</text>
      <text x="30" y="92" font-size="17" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#475569">Smallest division: 0.001 cm</text>

      <path d="M424 32 C388 32 388 102 424 102" fill="none" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
      <line x1="424" y1="32" x2="492" y2="32" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
      <line x1="424" y1="102" x2="492" y2="102" stroke="#475569" stroke-width="18" stroke-linecap="round"/>
      <rect x="482" y="58" width="44" height="18" rx="9" fill="#93c5fd"/>
      <rect x="526" y="50" width="92" height="34" rx="17" fill="#64748b"/>
      <rect x="612" y="46" width="48" height="42" rx="14" fill="#94a3b8"/>

      <text x="686" y="40" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Justified reading</text>
      <text x="686" y="66" font-size="28" font-family="Segoe UI, Arial, sans-serif" font-weight="700" fill="#334155">4.276 cm</text>
      <text x="686" y="94" font-size="18" font-family="Segoe UI, Arial, sans-serif" fill="#475569">Reasonable uncertainty: +/- 0.0005 cm</text>
      <text x="390" y="118" font-size="15" font-family="Segoe UI, Arial, sans-serif" fill="#64748b">Same object, smallest measuring gap, finest supported detail.</text>
    </g>
  </g>
</svg>
