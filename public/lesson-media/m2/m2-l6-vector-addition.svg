<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="64" y="86" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Vector addition is not the same as plain algebraic addition.</text>
  <text x="64" y="128" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Perpendicular components rebuild a diagonal resultant. Ordinary signed addition only works when the arrows already lie on the same axis.</text>

  <rect x="72" y="182" width="1056" height="468" rx="30" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>

  <rect x="96" y="210" width="620" height="412" rx="28" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="3"/>
  <text x="128" y="258" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Vector addition</text>
  <text x="128" y="292" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="20">Tip-to-tail rebuilding for perpendicular components</text>

  <line x1="170" y1="548" x2="170" y2="292" stroke="#334155" stroke-width="4"/>
  <line x1="170" y1="548" x2="506" y2="548" stroke="#334155" stroke-width="4"/>

  <line x1="170" y1="548" x2="410" y2="548" stroke="#0EA5E9" stroke-width="16" stroke-linecap="round"/>
  <polygon points="410,548 378,530 378,566" fill="#0EA5E9"/>
  <text x="226" y="514" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">8 N east</text>

  <line x1="410" y1="548" x2="410" y2="308" stroke="#22C55E" stroke-width="16" stroke-linecap="round"/>
  <polygon points="410,308 394,338 426,338" fill="#22C55E"/>
  <text x="438" y="438" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">15 N north</text>

  <line x1="170" y1="548" x2="410" y2="308" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  <polygon points="410,308 374,314 396,346" fill="#F97316"/>
  <text x="214" y="390" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">17 N resultant</text>

  <circle cx="170" cy="548" r="8" fill="#0F172A"/>
  <circle cx="410" cy="548" r="8" fill="#0F172A"/>
  <circle cx="410" cy="308" r="8" fill="#0F172A"/>

  <rect x="126" y="572" width="556" height="34" rx="17" fill="#DBEAFE"/>
  <text x="164" y="595" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Read the single start-to-finish diagonal. That is the vector sum.</text>

  <rect x="752" y="210" width="332" height="412" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3"/>
  <text x="784" y="258" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Plain addition only works</text>
  <text x="784" y="292" fill="#7C2D12" font-family="Segoe UI, Arial, sans-serif" font-size="20">when the arrows already share one axis</text>

  <line x1="812" y1="382" x2="914" y2="382" stroke="#0EA5E9" stroke-width="14" stroke-linecap="round"/>
  <polygon points="914,382 888,368 888,396" fill="#0EA5E9"/>
  <text x="820" y="352" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">8 N east</text>

  <text x="932" y="388" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">+</text>

  <line x1="968" y1="382" x2="1088" y2="382" stroke="#F97316" stroke-width="14" stroke-linecap="round"/>
  <polygon points="1088,382 1062,368 1062,396" fill="#F97316"/>
  <text x="970" y="352" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">15 N east</text>

  <line x1="812" y1="470" x2="1088" y2="470" stroke="#2563EB" stroke-width="16" stroke-linecap="round"/>
  <polygon points="1088,470 1058,454 1058,486" fill="#2563EB"/>
  <text x="844" y="438" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">23 N east</text>

  <rect x="784" y="514" width="268" height="78" rx="20" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="2"/>
  <text x="806" y="544" fill="#991B1B" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Wrong move for M2_L6:</text>
  <text x="806" y="570" fill="#7F1D1D" font-family="Segoe UI, Arial, sans-serif" font-size="18">8 N east + 15 N north is not 23 N</text>
  <text x="806" y="592" fill="#7F1D1D" font-family="Segoe UI, Arial, sans-serif" font-size="18">because the directions differ.</text>
</svg>
