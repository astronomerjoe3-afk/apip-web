<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Carry Score is conserved across a closed Dock Exchange.</text>
  <text x="60" y="124" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">The total belongs to the system. What changes is how that total is shared after docking.</text>
  <rect x="74" y="182" width="1052" height="454" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="112" y="230" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Before docking</text>
  <rect x="156" y="312" width="164" height="88" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <text x="196" y="364" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">3 kg craft</text>
  <line x1="340" y1="356" x2="514" y2="356" stroke="#0EA5E9" stroke-width="18" stroke-linecap="round"/>
  <polygon points="514,356 480,334 480,378" fill="#0EA5E9"/>
  <text x="350" y="318" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">4 m/s right</text>
  <rect x="664" y="312" width="164" height="88" rx="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
  <text x="712" y="364" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">1 kg pod</text>
  <text x="148" y="474" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Carry Score A = 12 kg m/s</text>
  <text x="664" y="474" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Carry Score B = 0 kg m/s</text>
  <rect x="410" y="530" width="382" height="70" rx="20" fill="#DCFCE7"/>
  <text x="452" y="573" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Closed-system total = 12 kg m/s</text>
</svg>
