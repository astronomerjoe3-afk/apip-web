<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="64" y="86" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Dock Exchange conserves the system total, not each craft's own speed.</text>
  <text x="64" y="128" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Module 2 raises collision reasoning to a whole-system ledger rather than a one-object story.</text>

  <rect x="72" y="182" width="500" height="468" rx="30" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="106" y="230" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Before docking</text>
  <rect x="126" y="316" width="170" height="86" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <text x="164" y="368" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">3 kg craft</text>
  <line x1="314" y1="360" x2="474" y2="360" stroke="#0EA5E9" stroke-width="18" stroke-linecap="round"/>
  <polygon points="474,360 442,342 442,378" fill="#0EA5E9"/>
  <text x="318" y="318" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">4 m/s</text>
  <rect x="404" y="316" width="118" height="86" rx="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
  <text x="430" y="368" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">1 kg</text>
  <text x="126" y="516" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Momentum before = 12 kg m/s</text>

  <rect x="628" y="182" width="500" height="468" rx="30" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4"/>
  <text x="662" y="230" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">After docking</text>
  <rect x="736" y="334" width="242" height="86" rx="22" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
  <text x="780" y="386" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">4 kg joined craft</text>
  <line x1="736" y1="474" x2="904" y2="474" stroke="#22C55E" stroke-width="18" stroke-linecap="round"/>
  <polygon points="904,474 872,456 872,492" fill="#22C55E"/>
  <text x="740" y="536" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Shared speed = 3 m/s</text>
</svg>
