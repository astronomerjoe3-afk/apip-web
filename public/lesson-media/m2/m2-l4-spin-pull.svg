<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="64" y="86" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Torque compares push size with perpendicular reach from the pivot.</text>
  <text x="64" y="128" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Module 2 makes turning a geometry-and-force story instead of treating torque as a renamed force.</text>

  <rect x="72" y="182" width="500" height="468" rx="30" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="106" y="230" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Centered push</text>
  <circle cx="252" cy="414" r="18" fill="#0F172A"/>
  <line x1="252" y1="414" x2="468" y2="414" stroke="#64748B" stroke-width="12" stroke-linecap="round"/>
  <line x1="252" y1="414" x2="428" y2="414" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  <polygon points="428,414 396,396 396,432" fill="#F97316"/>
  <text x="122" y="530" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Line of action passes through the pivot.</text>
  <text x="176" y="572" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Spin Pull = 0 N m</text>

  <rect x="628" y="182" width="500" height="468" rx="30" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="662" y="230" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Off-center push</text>
  <circle cx="808" cy="414" r="18" fill="#0F172A"/>
  <line x1="808" y1="414" x2="1020" y2="414" stroke="#64748B" stroke-width="12" stroke-linecap="round"/>
  <line x1="920" y1="318" x2="1080" y2="318" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  <polygon points="1080,318 1048,300 1048,336" fill="#F97316"/>
  <line x1="808" y1="414" x2="808" y2="318" stroke="#22C55E" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="702" y="530" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Same push, larger reach, bigger turning effect.</text>
  <text x="774" y="572" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Spin Pull = force x reach</text>
</svg>
