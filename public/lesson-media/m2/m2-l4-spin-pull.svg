<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Spin Pull depends on force and perpendicular reach.</text>
  <text x="60" y="124" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">A push through the pivot gives zero turning effect. Moving the same push farther away increases torque.</text>
  <rect x="80" y="190" width="480" height="430" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="118" y="238" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Centered push</text>
  <circle cx="320" cy="412" r="18" fill="#0F172A"/>
  <line x1="320" y1="412" x2="500" y2="412" stroke="#64748B" stroke-width="12" stroke-linecap="round"/>
  <line x1="320" y1="412" x2="470" y2="412" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  <polygon points="470,412 436,390 436,434" fill="#F97316"/>
  <text x="158" y="518" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Line of action passes through pivot</text>
  <text x="238" y="558" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Spin Pull = 0 N m</text>
  <rect x="638" y="190" width="480" height="430" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="676" y="238" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Off-center push</text>
  <circle cx="878" cy="412" r="18" fill="#0F172A"/>
  <line x1="878" y1="412" x2="1046" y2="412" stroke="#64748B" stroke-width="12" stroke-linecap="round"/>
  <line x1="938" y1="326" x2="1080" y2="326" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
  <polygon points="1080,326 1046,304 1046,348" fill="#F97316"/>
  <line x1="878" y1="412" x2="878" y2="326" stroke="#22C55E" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="930" y="518" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Same force, larger perpendicular reach</text>
  <text x="808" y="558" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Spin Pull = force x reach</text>
</svg>
