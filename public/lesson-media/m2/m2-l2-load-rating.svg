  <text x="198" y="368" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">2 kg</text>
  <line x1="354" y1="360" x2="500" y2="360" stroke="#F97316" stroke-width="18" stroke-linecap="round"/>
