<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="64" y="86" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">The same Master Arrow does not buy the same acceleration on every craft.</text>
  <text x="64" y="128" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Module 2 separates force-pair equality from response size by keeping the mass term visible.</text>

  <rect x="70" y="182" width="470" height="468" rx="30" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="104" y="230" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Light craft</text>
  <rect x="132" y="316" width="168" height="86" rx="22" fill="#DBEAFE" stroke="#2563EB" stroke-width="4"/>
  <text x="186" y="368" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">2 kg</text>
  <line x1="326" y1="360" x2="478" y2="360" stroke="#22C55E" stroke-width="18" stroke-linecap="round"/>
  <polygon points="478,360 446,342 446,378" fill="#22C55E"/>
  <text x="320" y="320" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">12 N Master Arrow</text>
  <rect x="132" y="466" width="256" height="18" rx="9" fill="#0EA5E9"/>
  <text x="132" y="534" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Motion Shift = 6 m/s^2</text>

  <rect x="660" y="182" width="470" height="468" rx="30" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="694" y="230" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Heavy craft</text>
  <rect x="722" y="316" width="168" height="86" rx="22" fill="#FFEDD5" stroke="#F97316" stroke-width="4"/>
  <text x="776" y="368" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">6 kg</text>
  <line x1="916" y1="360" x2="1068" y2="360" stroke="#22C55E" stroke-width="18" stroke-linecap="round"/>
  <polygon points="1068,360 1036,342 1036,378" fill="#22C55E"/>
  <text x="910" y="320" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">12 N Master Arrow</text>
  <rect x="722" y="466" width="120" height="18" rx="9" fill="#F59E0B"/>
  <text x="722" y="534" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Motion Shift = 2 m/s^2</text>
</svg>
