<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="64" y="82" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Stability depends on where the Balance Core line lands</text>
  <text x="64" y="118" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">relative to the support zone.</text>
  <text x="64" y="154" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Module 2 turns stability into a geometry rule rather than a vague 'heavier means safer' idea.</text>

  <rect x="70" y="182" width="470" height="468" rx="30" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="104" y="230" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Narrow support</text>
  <rect x="206" y="506" width="176" height="20" rx="10" fill="#F59E0B"/>
  <rect x="232" y="322" width="140" height="152" rx="20" fill="#FED7AA" stroke="#F97316" stroke-width="4"/>
  <circle cx="346" cy="366" r="16" fill="#0EA5E9"/>
  <line x1="346" y1="366" x2="346" y2="526" stroke="#0EA5E9" stroke-width="6" stroke-dasharray="12 10"/>
  <line x1="206" y1="496" x2="206" y2="536" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="382" y1="496" x2="382" y2="536" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
  <line x1="354" y1="552" x2="374" y2="552" stroke="#F97316" stroke-width="4" stroke-linecap="round"/>
  <polygon points="346,552 356,546 356,558" fill="#F97316"/>
  <polygon points="382,552 372,546 372,558" fill="#F97316"/>
  <text x="254" y="580" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">small edge margin</text>
  <text x="118" y="608" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Small margin before</text>
  <text x="118" y="636" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">the line reaches the edge.</text>

  <rect x="660" y="182" width="470" height="468" rx="30" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4"/>
  <text x="694" y="230" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Wide support</text>
  <rect x="704" y="506" width="386" height="20" rx="10" fill="#22C55E"/>
  <rect x="824" y="322" width="140" height="152" rx="20" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
  <circle cx="938" cy="366" r="16" fill="#0EA5E9"/>
  <line x1="938" y1="366" x2="938" y2="526" stroke="#0EA5E9" stroke-width="6" stroke-dasharray="12 10"/>
  <line x1="704" y1="496" x2="704" y2="536" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
  <line x1="1090" y1="496" x2="1090" y2="536" stroke="#22C55E" stroke-width="4" stroke-linecap="round"/>
  <line x1="946" y1="552" x2="1082" y2="552" stroke="#16A34A" stroke-width="4" stroke-linecap="round"/>
  <polygon points="938,552 948,546 948,558" fill="#16A34A"/>
  <polygon points="1090,552 1080,546 1080,558" fill="#16A34A"/>
  <text x="866" y="580" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">larger edge margin</text>
  <text x="716" y="608" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">The same load now sits safely</text>
  <text x="716" y="636" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">inside the support zone.</text>
</svg>
