<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="60" y="84" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="32" font-weight="700">Balance depends on where the Balance Core sits over the Footprint Zone.</text>
  <text x="60" y="124" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Moving cargo shifts the Balance Core. A wider base gives more margin before the weight line reaches the edge.</text>
  <rect x="74" y="182" width="470" height="454" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="112" y="230" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Narrow support</text>
  <rect x="178" y="318" width="260" height="34" rx="16" fill="#F59E0B"/>
  <rect x="238" y="248" width="140" height="80" rx="18" fill="#FED7AA" stroke="#F97316" stroke-width="4"/>
  <circle cx="364" cy="272" r="16" fill="#0EA5E9"/>
  <line x1="364" y1="272" x2="364" y2="352" stroke="#0EA5E9" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="126" y="438" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Balance Core line is close to the edge.</text>
  <text x="126" y="478" fill="#9A3412" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Small tipping margin</text>
  <rect x="656" y="182" width="470" height="454" rx="28" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4"/>
  <text x="694" y="230" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Wide support</text>
  <rect x="720" y="318" width="340" height="34" rx="16" fill="#22C55E"/>
  <rect x="798" y="248" width="140" height="80" rx="18" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
  <circle cx="924" cy="272" r="16" fill="#0EA5E9"/>
  <line x1="924" y1="272" x2="924" y2="352" stroke="#0EA5E9" stroke-width="6" stroke-dasharray="12 10"/>
  <text x="704" y="438" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">The same load now sits safely inside the zone.</text>
  <text x="764" y="478" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Larger stability margin</text>
</svg>
