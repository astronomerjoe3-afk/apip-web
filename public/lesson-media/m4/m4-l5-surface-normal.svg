<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" rx="36" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1208" height="648" rx="32" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="4"/>
  <text x="88" y="118" fill="#0F172A" font-family="Arial, sans-serif" font-size="46" font-weight="700">Pressure at a point, force on a patch</text>
  <text x="88" y="168" fill="#475569" font-family="Arial, sans-serif" font-size="24">At one depth the pressure matches. The force due to pressure stays perpendicular to the chosen surface.</text>

  <rect x="80" y="216" width="1120" height="430" rx="30" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="4"/>
  <rect x="410" y="238" width="460" height="44" rx="22" fill="#DBEAFE"/>
  <text x="456" y="268" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Same depth keeps the pressure the same at each dot.</text>
  <line x1="136" y1="430" x2="1144" y2="430" stroke="#94A3B8" stroke-width="4" stroke-dasharray="10 10"/>

  <rect x="112" y="290" width="300" height="300" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="146" y="334" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="34" font-weight="700">Wall patch</text>
  <text x="146" y="366" fill="#475569" font-family="Arial, sans-serif" font-size="22">Vertical surface</text>
  <circle cx="194" cy="430" r="14" fill="#0F172A"/>
  <line x1="214" y1="430" x2="288" y2="430" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <polygon points="288,430 264,416 264,444" fill="#16A34A"/>
  <line x1="328" y1="360" x2="328" y2="502" stroke="#F97316" stroke-width="16" stroke-linecap="round"/>
  <text x="146" y="532" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Normal force</text>
  <text x="146" y="560" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">points sideways.</text>

  <rect x="490" y="290" width="300" height="300" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="528" y="334" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="34" font-weight="700">Floor patch</text>
  <text x="528" y="366" fill="#475569" font-family="Arial, sans-serif" font-size="22">Horizontal surface</text>
  <circle cx="640" cy="430" r="14" fill="#0F172A"/>
  <line x1="640" y1="450" x2="640" y2="486" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <polygon points="640,486 626,462 654,462" fill="#16A34A"/>
  <line x1="564" y1="508" x2="716" y2="508" stroke="#F59E0B" stroke-width="16" stroke-linecap="round"/>
  <text x="522" y="532" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Normal force</text>
  <text x="522" y="560" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">points straight down.</text>

  <rect x="868" y="290" width="300" height="300" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="896" y="334" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="34" font-weight="700">Slanted patch</text>
  <text x="896" y="366" fill="#475569" font-family="Arial, sans-serif" font-size="22">Tilt the surface</text>
  <circle cx="948" cy="430" r="14" fill="#0F172A"/>
  <line x1="966" y1="448" x2="1022" y2="504" stroke="#16A34A" stroke-width="12" stroke-linecap="round"/>
  <polygon points="1022,504 996,496 1016,476" fill="#16A34A"/>
  <line x1="1056" y1="514" x2="1144" y2="424" stroke="#FB7185" stroke-width="16" stroke-linecap="round"/>
  <text x="894" y="532" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">Normal force</text>
  <text x="894" y="560" fill="#0F172A" font-family="Arial, sans-serif" font-size="24">tilts with the patch.</text>

  <rect x="260" y="612" width="760" height="38" rx="18" fill="#E2E8F0"/>
  <text x="302" y="638" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Pressure belongs to the dot. Force follows the surface normal.</text>
</svg>
