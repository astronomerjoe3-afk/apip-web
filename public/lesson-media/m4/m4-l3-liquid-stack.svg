<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" rx="36" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1208" height="648" rx="32" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="4"/>
  <text x="88" y="118" fill="#0F172A" font-family="Arial, sans-serif" font-size="52" font-weight="700">Liquid pressure grows with the layer stack</text>
  <text x="88" y="172" fill="#475569" font-family="Arial, sans-serif" font-size="30">Deeper patches have more liquid above them. Denser liquids make each layer heavier.</text>

  <rect x="112" y="228" width="424" height="360" rx="30" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <line x1="160" y1="284" x2="488" y2="284" stroke="#2563EB" stroke-width="6"/>
  <circle cx="468" cy="380" r="16" fill="#F97316"/>
  <line x1="468" y1="284" x2="468" y2="380" stroke="#F97316" stroke-width="6" stroke-dasharray="10 10"/>
  <text x="156" y="260" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="38" font-weight="700">Shallow patch</text>
  <text x="156" y="500" fill="#0F172A" font-family="Arial, sans-serif" font-size="34">Small layer stack above</text>
  <text x="156" y="544" fill="#0F172A" font-family="Arial, sans-serif" font-size="32">Lower pressure</text>

  <rect x="744" y="228" width="424" height="360" rx="30" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <line x1="792" y1="284" x2="1120" y2="284" stroke="#2563EB" stroke-width="6"/>
  <circle cx="1100" cy="474" r="16" fill="#16A34A"/>
  <line x1="1100" y1="284" x2="1100" y2="474" stroke="#16A34A" stroke-width="6" stroke-dasharray="10 10"/>
  <text x="788" y="260" fill="#166534" font-family="Arial, sans-serif" font-size="38" font-weight="700">Deeper patch</text>
  <text x="788" y="500" fill="#0F172A" font-family="Arial, sans-serif" font-size="34">Taller liquid stack above</text>
  <text x="788" y="544" fill="#0F172A" font-family="Arial, sans-serif" font-size="32">Higher pressure</text>

  <rect x="180" y="620" width="920" height="54" rx="22" fill="#E2E8F0"/>
  <text x="228" y="656" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="32" font-weight="700">Hydrostatic rule: p depends on density, g, and depth - not tank width.</text>
</svg>
