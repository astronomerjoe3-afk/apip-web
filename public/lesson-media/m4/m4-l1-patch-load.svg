<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" rx="36" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1208" height="648" rx="32" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="4"/>
  <text x="88" y="118" fill="#0F172A" font-family="Arial, sans-serif" font-size="54" font-weight="700">Pressure is crowded push per patch</text>
  <text x="88" y="172" fill="#475569" font-family="Arial, sans-serif" font-size="30">The same total push can overload a small footprint because fewer patches share it.</text>

  <rect x="96" y="228" width="436" height="340" rx="30" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <text x="142" y="282" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="42" font-weight="700">Narrow footprint</text>
  <rect x="230" y="424" width="168" height="46" rx="22" fill="#3B82F6"/>
  <rect x="270" y="360" width="88" height="60" rx="22" fill="#BFDBFE" stroke="#2563EB" stroke-width="6"/>
  <line x1="314" y1="332" x2="314" y2="360" stroke="#2563EB" stroke-width="18" stroke-linecap="round"/>
  <polygon points="314,332 292,354 336,354" fill="#2563EB"/>
  <text x="170" y="520" fill="#0F172A" font-family="Arial, sans-serif" font-size="36">600 N on 3 patches</text>
  <text x="170" y="564" fill="#0F172A" font-family="Arial, sans-serif" font-size="34">200 N per patch</text>

  <rect x="748" y="228" width="436" height="340" rx="30" fill="#DCFCE7" stroke="#4ADE80" stroke-width="6"/>
  <text x="800" y="282" fill="#166534" font-family="Arial, sans-serif" font-size="42" font-weight="700">Wide footprint</text>
  <rect x="850" y="424" width="232" height="46" rx="22" fill="#22C55E"/>
  <rect x="922" y="374" width="88" height="50" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="6"/>
  <line x1="966" y1="332" x2="966" y2="374" stroke="#16A34A" stroke-width="18" stroke-linecap="round"/>
  <polygon points="966,332 944,354 988,354" fill="#16A34A"/>
  <text x="822" y="520" fill="#0F172A" font-family="Arial, sans-serif" font-size="36">600 N on 8 patches</text>
  <text x="822" y="564" fill="#0F172A" font-family="Arial, sans-serif" font-size="34">75 N per patch</text>

  <rect x="168" y="606" width="944" height="54" rx="22" fill="#E2E8F0"/>
  <text x="212" y="642" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="32" font-weight="700">Same push, fewer patches -> higher patch load -> higher pressure.</text>
</svg>
