<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" rx="36" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1208" height="648" rx="32" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="4"/>
  <text x="88" y="118" fill="#0F172A" font-family="Arial, sans-serif" font-size="48" font-weight="700">Sky blanket and total pressure</text>
  <text x="88" y="168" fill="#475569" font-family="Arial, sans-serif" font-size="23">Lower altitude means more air above. Below an open liquid surface, total pressure adds air load and liquid load.</text>

  <rect x="80" y="216" width="1120" height="432" rx="30" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="4"/>
  <rect x="112" y="292" width="300" height="302" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="146" y="334" fill="#166534" font-family="Arial, sans-serif" font-size="34" font-weight="700">Sea-level station</text>
  <text x="146" y="366" fill="#475569" font-family="Arial, sans-serif" font-size="22">More sky blanket above</text>
  <rect x="150" y="390" width="226" height="60" rx="22" fill="#DBEAFE"/>
  <line x1="190" y1="392" x2="190" y2="448" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="190,448 176,424 204,424" fill="#38BDF8"/>
  <line x1="262" y1="392" x2="262" y2="448" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="262,448 248,424 276,424" fill="#38BDF8"/>
  <line x1="334" y1="392" x2="334" y2="448" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="334,448 320,424 348,424" fill="#38BDF8"/>
  <rect x="220" y="452" width="84" height="78" rx="14" fill="#BFDBFE" stroke="#2563EB" stroke-width="6"/>
  <line x1="170" y1="534" x2="354" y2="534" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <text x="146" y="556" fill="#0F172A" font-family="Arial, sans-serif" font-size="22">Higher p_atm</text>
  <text x="146" y="580" fill="#0F172A" font-family="Arial, sans-serif" font-size="22">because more air presses down.</text>

  <rect x="490" y="292" width="300" height="302" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="528" y="334" fill="#166534" font-family="Arial, sans-serif" font-size="34" font-weight="700">High station</text>
  <text x="528" y="366" fill="#475569" font-family="Arial, sans-serif" font-size="22">Less sky blanket above</text>
  <line x1="548" y1="534" x2="732" y2="534" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <polygon points="582,534 638,438 694,534" fill="#D6D3D1" stroke="#A8A29E" stroke-width="6" stroke-linejoin="round"/>
  <line x1="610" y1="400" x2="610" y2="444" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="610,444 596,420 624,420" fill="#38BDF8"/>
  <line x1="666" y1="408" x2="666" y2="444" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="666,444 652,420 680,420" fill="#38BDF8"/>
  <rect x="618" y="418" width="24" height="22" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="4"/>
  <text x="526" y="556" fill="#0F172A" font-family="Arial, sans-serif" font-size="22">Lower p_atm</text>
  <text x="526" y="580" fill="#0F172A" font-family="Arial, sans-serif" font-size="22">because the air column is smaller.</text>

  <rect x="868" y="292" width="300" height="302" rx="28" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="4"/>
  <text x="898" y="334" fill="#166534" font-family="Arial, sans-serif" font-size="34" font-weight="700">Open liquid patch</text>
  <text x="898" y="366" fill="#475569" font-family="Arial, sans-serif" font-size="22">Air load plus liquid stack</text>
  <path d="M932 392 H1104 V548 H972 V438 H932 Z" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <line x1="932" y1="438" x2="1104" y2="438" stroke="#2563EB" stroke-width="6"/>
  <line x1="976" y1="392" x2="976" y2="430" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="976,430 962,406 990,406" fill="#38BDF8"/>
  <line x1="1032" y1="392" x2="1032" y2="430" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <polygon points="1032,430 1018,406 1046,406" fill="#38BDF8"/>
  <circle cx="1060" cy="512" r="14" fill="#16A34A"/>
  <line x1="1060" y1="438" x2="1060" y2="512" stroke="#16A34A" stroke-width="6" stroke-dasharray="10 10"/>
  <rect x="890" y="544" width="256" height="32" rx="16" fill="#E2E8F0"/>
  <text x="905" y="566" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="18" font-weight="700">total pressure = p_atm + rho g h</text>

  <rect x="270" y="612" width="740" height="38" rx="18" fill="#E2E8F0"/>
  <text x="312" y="638" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Atmosphere sets p_atm. Below an open surface, add rho g h.</text>
</svg>
