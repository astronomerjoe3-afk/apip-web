<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" rx="36" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1208" height="648" rx="32" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="4"/>
  <text x="88" y="118" fill="#0F172A" font-family="Arial, sans-serif" font-size="52" font-weight="700">Air is part of the Patch-Dome too</text>
  <text x="88" y="172" fill="#475569" font-family="Arial, sans-serif" font-size="30">Atmospheric pressure comes from the sky blanket above. Open-liquid total pressure adds the air load to the liquid stack.</text>

  <rect x="102" y="236" width="420" height="334" rx="30" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <rect x="192" y="310" width="108" height="76" rx="22" fill="#BFDBFE" stroke="#2563EB" stroke-width="6"/>
  <line x1="246" y1="386" x2="246" y2="514" stroke="#64748B" stroke-width="6"/>
  <line x1="174" y1="514" x2="334" y2="514" stroke="#64748B" stroke-width="8" stroke-linecap="round"/>
  <text x="144" y="284" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="38" font-weight="700">Sea-level station</text>
  <text x="140" y="548" fill="#0F172A" font-family="Arial, sans-serif" font-size="32">More sky blanket above</text>
  <text x="140" y="590" fill="#0F172A" font-family="Arial, sans-serif" font-size="30">Higher atmospheric pressure</text>

  <rect x="716" y="236" width="460" height="334" rx="30" fill="#DCFCE7" stroke="#4ADE80" stroke-width="6"/>
  <path d="M826 334 H1084 V550 H888 V390 H826 Z" fill="#DBEAFE" stroke="#60A5FA" stroke-width="6"/>
  <line x1="826" y1="390" x2="1084" y2="390" stroke="#2563EB" stroke-width="6"/>
  <circle cx="1046" cy="494" r="16" fill="#16A34A"/>
  <line x1="1046" y1="390" x2="1046" y2="494" stroke="#16A34A" stroke-width="6" stroke-dasharray="10 10"/>
  <text x="756" y="284" fill="#166534" font-family="Arial, sans-serif" font-size="38" font-weight="700">Open liquid patch</text>
  <text x="756" y="548" fill="#0F172A" font-family="Arial, sans-serif" font-size="32">Total pressure = p_atm + rhogh</text>

  <rect x="146" y="622" width="986" height="46" rx="20" fill="#E2E8F0"/>
  <text x="186" y="654" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Lower altitude -> more air above -> more atmospheric pressure. Open-liquid pressure adds air and liquid together.</text>
</svg>
