<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" fill="none">
  <rect width="1280" height="720" rx="36" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1208" height="648" rx="32" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="88" y="118" fill="#0F172A" font-family="Arial, sans-serif" font-size="52" font-weight="700">Design from a pressure limit</text>
  <text x="88" y="172" fill="#475569" font-family="Arial, sans-serif" font-size="30">A safe floor patch-load limit tells you the minimum area the load needs.</text>

  <rect x="96" y="236" width="482" height="276" rx="28" fill="#FEF3C7" stroke="#F59E0B" stroke-width="6"/>
  <text x="140" y="292" fill="#B45309" font-family="Arial, sans-serif" font-size="40" font-weight="700">Unsafe first design</text>
  <text x="140" y="348" fill="#0F172A" font-family="Arial, sans-serif" font-size="34">900 N on 0.20 m^2</text>
  <text x="140" y="396" fill="#B91C1C" font-family="Arial, sans-serif" font-size="34">Pressure = 4500 Pa</text>
  <text x="140" y="446" fill="#B91C1C" font-family="Arial, sans-serif" font-size="32">Fails a 3000 Pa floor limit</text>

  <rect x="706" y="236" width="478" height="276" rx="28" fill="#DCFCE7" stroke="#4ADE80" stroke-width="6"/>
  <text x="752" y="292" fill="#166534" font-family="Arial, sans-serif" font-size="40" font-weight="700">Rescued design</text>
  <text x="752" y="348" fill="#0F172A" font-family="Arial, sans-serif" font-size="34">900 N on 0.30 m^2</text>
  <text x="752" y="396" fill="#166534" font-family="Arial, sans-serif" font-size="34">Pressure = 3000 Pa</text>
  <text x="752" y="446" fill="#166534" font-family="Arial, sans-serif" font-size="32">Just safe at the pressure limit</text>

  <rect x="140" y="562" width="1000" height="78" rx="28" fill="#E0F2FE"/>
  <text x="198" y="612" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Planner rule: required area = total push / safe pressure limit.</text>
</svg>
