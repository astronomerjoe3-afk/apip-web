<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">
  <rect width="720" height="380" rx="28" fill="#F8FAFC"/>
  <text x="44" y="54" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="700">Reflection check: compare force-time areas.</text>
  <line x1="76" y1="316" x2="660" y2="316" stroke="#94A3B8" stroke-width="4"/>
  <line x1="76" y1="86" x2="76" y2="316" stroke="#94A3B8" stroke-width="4"/>
  <rect x="120" y="126" width="70" height="190" fill="#2563EB" fill-opacity="0.38" stroke="#2563EB" stroke-width="4"/>
  <text x="138" y="110" fill="#2563EB" font-size="20" font-family="Arial, sans-serif" font-weight="700">A</text>
  <rect x="278" y="200" width="140" height="116" fill="#0F766E" fill-opacity="0.38" stroke="#0F766E" stroke-width="4"/>
  <text x="336" y="184" fill="#0F766E" font-size="20" font-family="Arial, sans-serif" font-weight="700">B</text>
  <rect x="496" y="238" width="94" height="78" fill="#F97316" fill-opacity="0.38" stroke="#F97316" stroke-width="4"/>
  <text x="534" y="222" fill="#F97316" font-size="20" font-family="Arial, sans-serif" font-weight="700">C</text>
  <text fill="#475569" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">
    <tspan x="155" y="344">A: taller force,</tspan>
    <tspan x="155" y="364">shorter time</tspan>
  </text>
  <text fill="#475569" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">
    <tspan x="348" y="344">B: same area</tspan>
    <tspan x="348" y="364">as A</tspan>
  </text>
  <text fill="#475569" font-size="16" font-family="Arial, sans-serif" text-anchor="middle">
    <tspan x="543" y="344">C: smaller</tspan>
    <tspan x="543" y="364">impulse</tspan>
  </text>
</svg>