  <line x1="74" y1="282" x2="280" y2="282" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="230" x2="286" y2="230" stroke="#2563EB" stroke-width="12" stroke-linecap="round"/>
  <polygon points="286,230 252,210 252,250" fill="#2563EB"/>
  <text x="196" y="200" fill="#2563EB" font-size="18" font-family="Arial, sans-serif" font-weight="700">Force</text>
  <text x="92" y="316" fill="#0F766E" font-size="18" font-family="Arial, sans-serif" font-weight="700">Work &gt; 0 J</text>
