<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">
  <rect width="720" height="380" rx="28" fill="#F8FAFC"/>
  <text x="44" y="54" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="700">Work transfers energy when force causes motion.</text>
  <rect x="44" y="96" width="290" height="230" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
