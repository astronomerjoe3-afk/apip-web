  <text x="436" y="192" fill="#DC2626" font-size="18" font-family="Arial, sans-serif" font-weight="700">Force present</text>
  <text x="412" y="316" fill="#0F766E" font-size="18" font-family="Arial, sans-serif" font-weight="700">Work = 0 J</text>
  <text x="408" y="342" fill="#475569" font-size="16" font-family="Arial, sans-serif">No displacement in the force direction.</text>
