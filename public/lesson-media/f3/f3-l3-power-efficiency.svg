<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">
  <rect width="720" height="380" rx="28" fill="#F8FAFC"/>
  <text x="44" y="54" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="700">Power is rate. Efficiency is useful fraction.</text>
  <rect x="70" y="110" width="210" height="190" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <text x="96" y="146" fill="#0F172A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Input energy</text>
  <rect x="98" y="182" width="150" height="36" rx="12" fill="#2563EB"/>
  <text x="110" y="206" fill="#FFFFFF" font-size="18" font-family="Arial, sans-serif" font-weight="700">800 J in</text>
  <text x="96" y="256" fill="#475569" font-size="16" font-family="Arial, sans-serif">Time sets power.</text>
  <text x="96" y="278" fill="#475569" font-size="16" font-family="Arial, sans-serif">Less time = more power.</text>
  <rect x="304" y="110" width="170" height="190" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <text x="332" y="146" fill="#0F172A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Machine</text>
  <rect x="350" y="174" width="78" height="78" rx="18" fill="#E2E8F0"/>
  <circle cx="389" cy="214" r="20" stroke="#64748B" stroke-width="10"/>
  <rect x="502" y="110" width="148" height="190" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="4"/>
  <text x="528" y="146" fill="#0F172A" font-size="22" font-family="Arial, sans-serif" font-weight="700">Outputs</text>
  <rect x="530" y="182" width="84" height="30" rx="10" fill="#10B981"/>
  <text x="540" y="202" fill="#FFFFFF" font-size="16" font-family="Arial, sans-serif" font-weight="700">Useful</text>
  <rect x="530" y="226" width="62" height="28" rx="10" fill="#F97316"/>
  <text x="540" y="245" fill="#FFFFFF" font-size="15" font-family="Arial, sans-serif" font-weight="700">Wasted</text>
  <text x="526" y="278" fill="#475569" font-size="16" font-family="Arial, sans-serif">Useful / input</text>
  <text x="526" y="300" fill="#475569" font-size="16" font-family="Arial, sans-serif">gives efficiency.</text>
  <line x1="280" y1="198" x2="326" y2="198" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <polygon points="326,198 296,180 296,216" fill="#2563EB"/>
  <line x1="474" y1="198" x2="516" y2="198" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
  <polygon points="516,198 486,180 486,216" fill="#10B981"/>
</svg>
