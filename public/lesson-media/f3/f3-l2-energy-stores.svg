<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">
  <rect width="720" height="380" rx="28" fill="#F8FAFC"/>
  <text x="44" y="54" fill="#0F172A" font-size="28" font-family="Arial, sans-serif" font-weight="700">Kinetic energy grows with speed; GPE grows with height.</text>
  <path d="M70 300 L300 300 L430 170 L640 170" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="210" cy="280" r="28" fill="#F59E0B"/>
  <circle cx="510" cy="150" r="28" fill="#2563EB"/>
  <line x1="164" y1="280" x2="104" y2="280" stroke="#F59E0B" stroke-width="12" stroke-linecap="round"/>
  <polygon points="104,280 136,260 136,300" fill="#F59E0B"/>
  <text x="82" y="246" fill="#F59E0B" font-size="18" font-family="Arial, sans-serif" font-weight="700">Fast at low height</text>
  <text x="84" y="324" fill="#475569" font-size="16" font-family="Arial, sans-serif">Large kinetic energy</text>
  <text x="444" y="110" fill="#2563EB" font-size="18" font-family="Arial, sans-serif" font-weight="700">High on the ramp</text>
  <text x="444" y="136" fill="#475569" font-size="16" font-family="Arial, sans-serif">Large gravitational PE</text>
  <rect x="76" y="88" width="190" height="92" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="96" y="120" fill="#0F172A" font-size="18" font-family="Arial, sans-serif" font-weight="700">Kinetic energy</text>
  <text x="96" y="148" fill="#475569" font-size="16" font-family="Arial, sans-serif">Depends on mass and speed.</text>
  <text x="96" y="170" fill="#475569" font-size="16" font-family="Arial, sans-serif">Speed is squared.</text>
  <rect x="448" y="220" width="200" height="100" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <text x="468" y="252" fill="#0F172A" font-size="18" font-family="Arial, sans-serif" font-weight="700">Gravitational PE</text>
  <text x="468" y="280" fill="#475569" font-size="16" font-family="Arial, sans-serif">Depends on mass, g,</text>
  <text x="468" y="302" fill="#475569" font-size="16" font-family="Arial, sans-serif">and height.</text>
</svg>
