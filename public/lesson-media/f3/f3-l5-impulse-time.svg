<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" fill="none">
  <rect width="720" height="380" rx="28" fill="#F8FAFC"/>
  <text x="44" y="46" fill="#0F172A" font-size="24" font-family="Arial, sans-serif" font-weight="700">Same impulse can come from different</text>
  <text x="44" y="76" fill="#0F172A" font-size="24" font-family="Arial, sans-serif" font-weight="700">force-time shapes.</text>
  <line x1="76" y1="316" x2="660" y2="316" stroke="#94A3B8" stroke-width="4"/>
  <line x1="76" y1="82" x2="76" y2="316" stroke="#94A3B8" stroke-width="4"/>
  <rect x="126" y="126" width="92" height="190" fill="#2563EB" fill-opacity="0.35" stroke="#2563EB" stroke-width="4"/>
  <rect x="306" y="198" width="184" height="118" fill="#0F766E" fill-opacity="0.35" stroke="#0F766E" stroke-width="4"/>
  <text x="126" y="108" fill="#2563EB" font-size="18" font-family="Arial, sans-serif" font-weight="700">Large force, short time</text>
  <text x="306" y="180" fill="#0F766E" font-size="18" font-family="Arial, sans-serif" font-weight="700">Smaller force, longer time</text>
  <text x="124" y="344" fill="#475569" font-size="16" font-family="Arial, sans-serif">Equal shaded area = equal impulse</text>
  <text x="508" y="344" fill="#475569" font-size="16" font-family="Arial, sans-serif">Longer stop can reduce force</text>
</svg>
