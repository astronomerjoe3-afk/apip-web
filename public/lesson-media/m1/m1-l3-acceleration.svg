<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="28" fill="#fff1f2"/>
  <rect x="24" y="24" width="852" height="472" rx="24" fill="#fff" stroke="#fda4af"/>
  <text x="56" y="70" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Signed velocity change</text>
  <text x="56" y="102" font-family="Arial" font-size="18" fill="#475569">Acceleration is signed change in velocity divided by time.</text>
  <text x="118" y="170" font-family="Arial" font-size="18" font-weight="700" fill="#334155">Choose east as positive</text>
  <line x1="112" y1="280" x2="642" y2="280" stroke="#0f172a" stroke-width="4"/>
  <path d="M380 220 L540 220" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <polygon points="540,220 516,208 516,232" fill="#0ea5e9"/>
  <text x="394" y="198" font-family="Arial" font-size="18" font-weight="700" fill="#0c4a6e">initial velocity = +8 m/s</text>
  <path d="M380 344 L470 344" stroke="#f43f5e" stroke-width="10" stroke-linecap="round"/>
  <polygon points="470,344 446,332 446,356" fill="#f43f5e"/>
  <text x="394" y="376" font-family="Arial" font-size="18" font-weight="700" fill="#9f1239">final velocity = +2 m/s</text>
  <rect x="664" y="164" width="166" height="196" rx="16" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="690" y="200" font-family="Arial" font-size="20" font-weight="700" fill="#881337">Worked rate</text>
  <text x="688" y="236" font-family="Arial" font-size="18" fill="#881337">delta v = +2 - +8</text>
  <text x="688" y="264" font-family="Arial" font-size="18" fill="#881337">delta v = -6 m/s</text>
  <text x="688" y="304" font-family="Arial" font-size="18" fill="#881337">time = 3 s</text>
  <text x="688" y="336" font-family="Arial" font-size="18" fill="#881337">a = -6 / 3</text>
  <text x="688" y="364" font-family="Arial" font-size="18" font-weight="700" fill="#881337">a = -2 m/s^2</text>
</svg>
