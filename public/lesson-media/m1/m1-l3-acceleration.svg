<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Boost shift reads the change in the pace arrow, not a feeling of fast.</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Signed acceleration becomes clearer when students compare arrows before and after the interval with one chosen positive direction.</text>
  <rect x="70" y="188" width="500" height="456" rx="28" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="4"/>
  <text x="102" y="236" fill="#BE185D" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Signed pace arrows</text>
  <text x="126" y="312" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">East chosen as positive</text>
  <path d="M164 390H322" stroke="#1D4ED8" stroke-width="14" stroke-linecap="round"/>
  <path d="M322 390L286 364V416L322 390Z" fill="#1D4ED8"/>
  <text x="148" y="428" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">u = +8 m/s</text>
  <path d="M164 510H250" stroke="#16A34A" stroke-width="14" stroke-linecap="round"/>
  <path d="M250 510L214 484V536L250 510Z" fill="#16A34A"/>
  <text x="148" y="548" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">v = +3 m/s</text>
  <text x="126" y="584" fill="#7C3AED" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    <tspan x="126" dy="0">Boost shift points negative because</tspan>
    <tspan x="126" dy="28">the velocity change is negative.</tspan>
  </text>
  <rect x="620" y="188" width="508" height="456" rx="28" fill="#EEF2FF" stroke="#C4B5FD" stroke-width="4"/>
  <text x="652" y="236" fill="#5B21B6" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Counterexample</text>
  <path d="M998 356H792" stroke="#DC2626" stroke-width="14" stroke-linecap="round"/>
  <path d="M792 356L828 330V382L792 356Z" fill="#DC2626"/>
  <text x="804" y="396" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">u = -8 m/s</text>
  <path d="M930 492H792" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
  <path d="M792 492L828 466V518L792 492Z" fill="#F59E0B"/>
  <text x="804" y="532" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">v = -3 m/s</text>
  <text x="664" y="332" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Same negative direction, smaller speed</text>
  <text x="664" y="566" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">
    <tspan x="664" dy="0">Positive acceleration can slow the avatar down</tspan>
    <tspan x="664" dy="28">if it is already moving negative.</tspan>
  </text>
</svg>
