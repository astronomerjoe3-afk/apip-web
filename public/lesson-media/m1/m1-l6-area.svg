<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Area hunter: each strip under the pace log is progress earned.</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">This is the Module 1 leap: students stop seeing area as a shape and start seeing it as accumulated motion.</text>
  <rect x="84" y="188" width="580" height="456" rx="28" fill="#FFFBEB" stroke="#FCD34D" stroke-width="4"/>
  <text x="118" y="236" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Pace log with area</text>
  <line x1="174" y1="556" x2="594" y2="556" stroke="#334155" stroke-width="4"/>
  <line x1="174" y1="556" x2="174" y2="296" stroke="#334155" stroke-width="4"/>
  <path d="M218 472H374L514 364" stroke="#F97316" stroke-width="10" stroke-linecap="round"/>
  <rect x="218" y="472" width="156" height="84" fill="#93C5FD" opacity="0.9"/>
  <path d="M374 472H514V364Z" fill="#F59E0B" opacity="0.9"/>
  <text x="230" y="610" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Mission clock, t (s)</text>
  <text x="110" y="392" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22" transform="rotate(-90 110 392)">Pace, v (m/s)</text>
  <text x="228" y="452" fill="#1E3A8A" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Block area</text>
  <text x="392" y="332" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Triangle area</text>
  <text x="224" y="304" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Whole shaded region = total distance</text>
  <rect x="714" y="188" width="402" height="456" rx="28" fill="#ECFDF5" stroke="#86EFAC" stroke-width="4"/>
  <text x="746" y="236" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Same-area comparison</text>
  <rect x="780" y="322" width="108" height="132" fill="#60A5FA" opacity="0.85"/>
  <path d="M942 454H1034V322Z" fill="#34D399" opacity="0.85"/>
  <text x="758" y="516" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">Different shapes can still enclose</text>
  <text x="758" y="548" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">the same total area and distance.</text>
</svg>
