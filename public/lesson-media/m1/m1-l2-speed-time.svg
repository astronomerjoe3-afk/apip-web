<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Pace log: level tells speed now, slope tells change.</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Module 1 deepens F2 by separating speed-now from boost shift instead of letting both hide inside one graph shape.</text>
  <rect x="70" y="188" width="460" height="456" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="102" y="236" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Quest lane snapshot</text>
  <rect x="120" y="326" width="320" height="18" rx="9" fill="#1D4ED8"/>
  <circle cx="210" cy="335" r="26" fill="#F97316"/>
  <path d="M210 335L316 335" stroke="#16A34A" stroke-width="14" stroke-linecap="round"/>
  <path d="M316 335L286 315V355L316 335Z" fill="#16A34A"/>
  <text x="120" y="430" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Pace meter now = 8 m/s</text>
  <text x="120" y="476" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">
    <tspan x="120" dy="0">Fast now is not the same claim</tspan>
    <tspan x="120" dy="30">as speeding up now.</tspan>
  </text>
  <rect x="580" y="188" width="548" height="456" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="612" y="236" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Pace log</text>
  <line x1="668" y1="564" x2="1050" y2="564" stroke="#334155" stroke-width="4"/>
  <line x1="668" y1="564" x2="668" y2="286" stroke="#334155" stroke-width="4"/>
  <path d="M712 476H816" stroke="#0284C7" stroke-width="10" stroke-linecap="round"/>
  <path d="M816 476L930 358" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
  <path d="M930 358L1012 430" stroke="#DC2626" stroke-width="10" stroke-linecap="round"/>
  <text x="722" y="606" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Mission clock</text>
  <text x="582" y="378" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22" transform="rotate(-90 582 378)">Pace</text>
  <text x="714" y="512" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Flat above zero = constant speed</text>
  <text x="848" y="324" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Rising slope = positive acceleration</text>
  <text x="926" y="464" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Falling slope = braking</text>
</svg>
