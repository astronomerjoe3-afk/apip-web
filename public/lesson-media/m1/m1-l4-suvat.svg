<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <rect width="900" height="520" rx="28" fill="#ecfdf5"/>
  <rect x="24" y="24" width="852" height="472" rx="24" fill="#fff" stroke="#a7f3d0"/>
  <text x="56" y="70" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Constant-acceleration forecast board</text>
  <text x="56" y="102" font-family="Arial" font-size="18" fill="#475569">Choose the equation by known values, missing value, and the constant-a condition.</text>
  <rect x="68" y="148" width="178" height="86" rx="16" fill="#f0fdf4" stroke="#86efac"/>
  <text x="92" y="184" font-family="Arial" font-size="22" font-weight="700" fill="#166534">Known now</text>
  <text x="92" y="214" font-family="Arial" font-size="18" fill="#166534">u = 4, a = 3, t = 4</text>
  <rect x="68" y="256" width="178" height="86" rx="16" fill="#fefce8" stroke="#fde68a"/>
  <text x="92" y="292" font-family="Arial" font-size="22" font-weight="700" fill="#854d0e">Missing</text>
  <text x="92" y="322" font-family="Arial" font-size="18" fill="#854d0e">Find final velocity v</text>
  <rect x="282" y="148" width="228" height="86" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="304" y="182" font-family="Arial" font-size="20" font-weight="700" fill="#1d4ed8">Card 1</text>
  <text x="304" y="214" font-family="Arial" font-size="24" fill="#1d4ed8">v = u + at</text>
  <rect x="282" y="256" width="228" height="86" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="304" y="290" font-family="Arial" font-size="20" font-weight="700" fill="#334155">Card 2</text>
  <text x="304" y="322" font-family="Arial" font-size="24" fill="#334155">s = ut + 0.5at^2</text>
  <rect x="574" y="148" width="260" height="158" rx="18" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="184" font-family="Arial" font-size="21" font-weight="700" fill="#166534">Why Card 1 fits</text>
  <text x="598" y="218" font-family="Arial" font-size="18" fill="#166534">Known: u, a, t</text>
  <text x="598" y="246" font-family="Arial" font-size="18" fill="#166534">Unknown: v</text>
  <text x="598" y="274" font-family="Arial" font-size="18" fill="#166534">No need for s</text>
  <rect x="574" y="328" width="260" height="114" rx="18" fill="#fff7ed" stroke="#fdba74"/>
  <text x="600" y="364" font-family="Arial" font-size="21" font-weight="700" fill="#9a3412">Use only if</text>
  <text x="598" y="396" font-family="Arial" font-size="18" fill="#9a3412">acceleration stays constant</text>
  <text x="598" y="424" font-family="Arial" font-size="18" fill="#9a3412">Check units and story after solving.</text>
</svg>
