<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Constant-acceleration equations are forecast tools, not magic spells.</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Quest-Log reveals each equation as a compact summary of one steady boost pattern.</text>
  <rect x="78" y="194" width="344" height="438" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="110" y="244" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Knowns first</text>
  <text x="118" y="320" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">u = 4 m/s</text>
  <text x="118" y="368" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">a = 3 m/s^2</text>
  <text x="118" y="416" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">t = 4 s</text>
  <text x="118" y="504" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Unknown: v</text>
  <text x="118" y="560" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Best direct choice: v = u + at</text>
  <rect x="458" y="194" width="302" height="438" rx="28" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4"/>
  <text x="490" y="244" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Block + triangle</text>
  <rect x="520" y="468" width="152" height="82" fill="#93C5FD"/>
  <path d="M672 468L742 468L742 370Z" fill="#F59E0B"/>
  <text x="530" y="588" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="22">ut + 1/2at^2</text>
  <text x="510" y="340" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Rectangle = starting pace</text>
  <text x="518" y="312" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Triangle = added pace</text>
  <rect x="798" y="194" width="330" height="438" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="4"/>
  <text x="830" y="244" fill="#C2410C" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Condition check</text>
  <text x="842" y="330" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="24">Same boost each tick?</text>
  <rect x="842" y="372" width="112" height="54" rx="18" fill="#DCFCE7"/>
  <text x="882" y="407" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Yes</text>
  <rect x="974" y="372" width="112" height="54" rx="18" fill="#FEE2E2"/>
  <text x="1016" y="407" fill="#B91C1C" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">No</text>
  <text x="842" y="506" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Use the board only for the green case.</text>
</svg>
