<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <style>
    .title { fill: #0f172a; font: 700 34px 'Segoe UI', Arial, sans-serif; }
    .subtitle { fill: #475569; font: 400 22px 'Segoe UI', Arial, sans-serif; }
    .panel-title { fill: #0f172a; font: 700 28px 'Segoe UI', Arial, sans-serif; }
    .body { fill: #475569; font: 400 20px 'Segoe UI', Arial, sans-serif; }
  </style>
  <rect width="1200" height="720" rx="36" fill="#F8FAFC" />
  <rect x="40" y="32" width="1120" height="656" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <text x="74" y="88" class="title">Use the motion equations like a forecast board.</text>
  <text x="74" y="122" class="subtitle">Choose equations from the story: list the knowns, name the unknown,</text>
  <text x="74" y="150" class="subtitle">and check the constant-acceleration condition first.</text>

  <rect x="74" y="176" width="322" height="430" rx="28" fill="#ECFDF5" stroke="#86EFAC" stroke-width="3" />
  <text x="108" y="224" class="panel-title">Step 1: gather the story</text>
  <rect x="108" y="262" width="256" height="64" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2" />
  <text x="136" y="302" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Knowns: u, a, t</text>
  <rect x="108" y="346" width="256" height="64" rx="18" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2" />
  <text x="136" y="386" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Unknown: v</text>
  <rect x="108" y="430" width="256" height="116" rx="22" fill="#FFFFFF" stroke="#BBF7D0" stroke-width="2" />
  <text x="136" y="468" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Condition check</text>
  <text x="136" y="502" class="body">Is the acceleration steady for the whole interval?</text>
  <text x="136" y="532" class="body">If not, do not trust the compact suvat forecast directly.</text>

  <rect x="430" y="176" width="352" height="430" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3" />
  <text x="464" y="224" class="panel-title">Step 2: choose</text>
  <text x="464" y="256" class="panel-title">the direct relation</text>
  <rect x="464" y="276" width="284" height="94" rx="24" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2" />
  <text x="606" y="330" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle">v = u + at</text>
  <text x="464" y="408" class="body">Pick the equation that reaches the unknown</text>
  <text x="464" y="436" class="body">without introducing an unnecessary variable.</text>
  <text x="464" y="474" class="body">That is why equation choice is higher-level</text>
  <text x="464" y="502" class="body">than just recalling all four relations.</text>

  <rect x="816" y="176" width="310" height="430" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3" />
  <text x="850" y="224" class="panel-title">Step 3: connect</text>
  <text x="850" y="256" class="panel-title">algebra and graph</text>
  <line x1="864" y1="548" x2="1080" y2="548" stroke="#334155" stroke-width="4" />
  <line x1="864" y1="548" x2="864" y2="300" stroke="#334155" stroke-width="4" />
  <polygon points="864,548 864,436 1080,340 1080,548" fill="#BFDBFE" fill-opacity="0.55" />
  <polyline points="864,436 1080,340" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" />
  <text x="884" y="320" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Uniform slope means</text>
  <text x="884" y="344" fill="#B45309" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">uniform acceleration</text>
  <text x="844" y="584" class="body">When the graph keeps one acceleration pattern,</text>
  <text x="844" y="612" class="body">the algebra and the area story stay aligned.</text>

  <rect x="74" y="626" width="1052" height="36" rx="18" fill="#E0F2FE" />
  <text x="600" y="649" fill="#0C4A6E" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">Knowns + unknown + constant-acceleration check = deliberate equation choice.</text>
</svg>
