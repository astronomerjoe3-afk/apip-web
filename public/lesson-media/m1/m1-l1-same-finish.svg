<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <rect width="1200" height="720" rx="36" fill="#F8FAFC"/>
  <text x="70" y="88" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Same final progress does not force the same motion story.</text>
  <text x="70" y="132" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Two mission logs can finish at the same distance and time while telling different pace histories.</text>

  <rect x="84" y="188" width="492" height="454" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="122" y="236" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Run A: pause then sprint</text>
  <line x1="176" y1="554" x2="504" y2="554" stroke="#334155" stroke-width="4"/>
  <line x1="176" y1="554" x2="176" y2="298" stroke="#334155" stroke-width="4"/>
  <text x="260" y="606" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Mission clock, t (s)</text>
  <text x="108" y="448" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22" transform="rotate(-90 108 448)">Recorded progress, s (m)</text>
  <g fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <text x="170" y="580">0</text>
    <text x="250" y="580">2</text>
    <text x="330" y="580">4</text>
    <text x="410" y="580">6</text>
    <text x="488" y="580">8</text>
    <text x="136" y="554">0</text>
    <text x="122" y="490">12</text>
    <text x="122" y="426">24</text>
    <text x="122" y="362">36</text>
  </g>
  <path d="M176 554L256 474L336 474L496 346" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="496" cy="346" r="8" fill="#10B981"/>
  <text x="246" y="438" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">pause</text>
  <text x="342" y="322" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">finish: 32 m at 8 s</text>

  <rect x="624" y="188" width="492" height="454" rx="28" fill="#ECFDF5" stroke="#86EFAC" stroke-width="4"/>
  <text x="662" y="236" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Run B: steady climb</text>
  <line x1="716" y1="554" x2="1044" y2="554" stroke="#334155" stroke-width="4"/>
  <line x1="716" y1="554" x2="716" y2="298" stroke="#334155" stroke-width="4"/>
  <text x="800" y="606" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22">Mission clock, t (s)</text>
  <text x="648" y="448" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="22" transform="rotate(-90 648 448)">Recorded progress, s (m)</text>
  <g fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <text x="710" y="580">0</text>
    <text x="790" y="580">2</text>
    <text x="870" y="580">4</text>
    <text x="950" y="580">6</text>
    <text x="1028" y="580">8</text>
    <text x="676" y="554">0</text>
    <text x="662" y="490">12</text>
    <text x="662" y="426">24</text>
    <text x="662" y="362">36</text>
  </g>
  <path d="M716 554L1044 346" stroke="#10B981" stroke-width="10" stroke-linecap="round"/>
  <circle cx="1044" cy="346" r="8" fill="#10B981"/>
  <text x="814" y="408" fill="#0F766E" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">same finish: 32 m at 8 s</text>

  <text x="116" y="674" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="24">Run A and Run B share the same final point, but Run A includes a pause and a later sprint while Run B stays steady.</text>
</svg>
