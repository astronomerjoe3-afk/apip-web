<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" fill="none">
  <style>
    .title { fill: #0f172a; font: 700 34px 'Segoe UI', Arial, sans-serif; }
    .subtitle { fill: #475569; font: 400 22px 'Segoe UI', Arial, sans-serif; }
    .panel-title { fill: #0f172a; font: 700 28px 'Segoe UI', Arial, sans-serif; }
    .body { fill: #475569; font: 400 20px 'Segoe UI', Arial, sans-serif; }
    .axis { fill: #64748b; font: 400 18px 'Segoe UI', Arial, sans-serif; }
  </style>
  <rect width="1200" height="720" rx="36" fill="#F8FAFC" />
  <rect x="40" y="32" width="1120" height="656" rx="34" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <text x="74" y="88" class="title">Same finish, different motion history.</text>
  <text x="74" y="126" class="subtitle">Distance-time graphs can share the same ending point without describing the same speeds, pauses, or segment story.</text>

  <rect x="74" y="176" width="496" height="430" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="3" />
  <rect x="630" y="176" width="496" height="430" rx="28" fill="#ECFDF5" stroke="#86EFAC" stroke-width="3" />

  <text x="112" y="224" class="panel-title">Run A: pause then catch up</text>
  <text x="668" y="224" class="panel-title">Run B: one steady pace</text>

  <g stroke="#CBD5E1" stroke-width="2">
    <line x1="164" y1="536" x2="496" y2="536" />
    <line x1="164" y1="536" x2="164" y2="282" />
    <line x1="230" y1="536" x2="230" y2="282" />
    <line x1="296" y1="536" x2="296" y2="282" />
    <line x1="362" y1="536" x2="362" y2="282" />
    <line x1="428" y1="536" x2="428" y2="282" />
    <line x1="494" y1="536" x2="494" y2="282" />
    <line x1="164" y1="472" x2="496" y2="472" />
    <line x1="164" y1="408" x2="496" y2="408" />
    <line x1="164" y1="344" x2="496" y2="344" />
  </g>
  <g stroke="#CBD5E1" stroke-width="2">
    <line x1="720" y1="536" x2="1052" y2="536" />
    <line x1="720" y1="536" x2="720" y2="282" />
    <line x1="786" y1="536" x2="786" y2="282" />
    <line x1="852" y1="536" x2="852" y2="282" />
    <line x1="918" y1="536" x2="918" y2="282" />
    <line x1="984" y1="536" x2="984" y2="282" />
    <line x1="1050" y1="536" x2="1050" y2="282" />
    <line x1="720" y1="472" x2="1052" y2="472" />
    <line x1="720" y1="408" x2="1052" y2="408" />
    <line x1="720" y1="344" x2="1052" y2="344" />
  </g>
  <line x1="164" y1="536" x2="496" y2="536" stroke="#334155" stroke-width="4" />
  <line x1="164" y1="536" x2="164" y2="282" stroke="#334155" stroke-width="4" />
  <line x1="720" y1="536" x2="1052" y2="536" stroke="#334155" stroke-width="4" />
  <line x1="720" y1="536" x2="720" y2="282" stroke="#334155" stroke-width="4" />

  <polyline points="164,536 230,470 296,470 494,344" fill="none" stroke="#2563EB" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="720,536 1052,344" fill="none" stroke="#10B981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="494" cy="344" r="9" fill="#2563EB" />
  <circle cx="1052" cy="344" r="9" fill="#10B981" />
  <text x="314" y="454" fill="#92400E" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Pause keeps distance fixed</text>
  <text x="796" y="322" fill="#047857" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">One steady gradient all the way</text>
  <text x="224" y="578" class="axis">time, t (s)</text>
  <text x="780" y="578" class="axis">time, t (s)</text>
  <text x="122" y="450" class="axis" transform="rotate(-90 122 450)">distance, s (m)</text>
  <text x="678" y="450" class="axis" transform="rotate(-90 678 450)">distance, s (m)</text>

  <rect x="74" y="626" width="1052" height="40" rx="20" fill="#DBEAFE" />
  <text x="600" y="653" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Equal final distance and equal final time do not force equal speed at every moment.</text>
</svg>
