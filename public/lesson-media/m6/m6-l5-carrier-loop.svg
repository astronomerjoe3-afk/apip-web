<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="40" fill="#F8FBFF"/>
  <rect x="28" y="28" width="1144" height="704" rx="34" fill="#FFFFFF" stroke="#D7E6F8" stroke-width="4"/>
  <text x="72" y="98" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
    Carrier Loop convection moves the fluid itself
  </text>
  <text x="72" y="146" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="72" dy="0">Warm fluid rises because it becomes less dense.</tspan>
    <tspan x="72" dy="28">Cooler fluid sinks or moves in to complete the loop.</tspan>
  </text>

  <rect x="108" y="214" width="984" height="384" rx="30" fill="#ECFEFF" stroke="#67E8F9" stroke-width="5"/>
  <rect x="432" y="548" width="338" height="24" rx="12" fill="#F59E0B"/>
  <text x="490" y="538" fill="#B45309" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">heater</text>

  <path d="M396 488C316 420 308 322 404 254" fill="none" stroke="#EF4444" stroke-width="14" stroke-linecap="round"/>
  <path d="M404 254H772" fill="none" stroke="#F97316" stroke-width="14" stroke-linecap="round"/>
  <path d="M772 254C870 320 862 422 786 490" fill="none" stroke="#2563EB" stroke-width="14" stroke-linecap="round"/>
  <path d="M786 490H396" fill="none" stroke="#22C55E" stroke-width="14" stroke-linecap="round"/>

  <path d="M362 434L396 488L340 466" fill="#EF4444"/>
  <path d="M746 246L772 254L746 278" fill="#F97316"/>
  <path d="M820 458L786 490L842 482" fill="#2563EB"/>
  <path d="M430 520L396 490L452 496" fill="#22C55E"/>

  <text x="248" y="430" fill="#DC2626" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">warmer, less dense</text>
  <text x="768" y="430" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">cooler, denser</text>
  <text x="438" y="628" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="24">
    The transfer route is a moving loop, so convection belongs to fluids.
  </text>

  <rect x="96" y="646" width="1008" height="54" rx="22" fill="#EEF4FF"/>
  <text x="128" y="680" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    "Heat rises" is incomplete. What actually rises is the warmer fluid region.
  </text>
</svg>
