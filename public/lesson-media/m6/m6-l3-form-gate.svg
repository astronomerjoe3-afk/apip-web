<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="40" fill="#F8FBFF"/>
  <rect x="28" y="28" width="1144" height="704" rx="34" fill="#FFFFFF" stroke="#D7E6F8" stroke-width="4"/>
  <text x="72" y="88" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">
    <tspan x="72" dy="0">A Form Gate can absorb energy</tspan>
    <tspan x="72" dy="38">while the Warmth Level stays flat</tspan>
  </text>
  <text x="72" y="164" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="21">
    <tspan x="72" dy="0">The plateau does not mean the heater stopped.</tspan>
    <tspan x="72" dy="27">It means the energy is paying the Morph Fee for a change of state.</tspan>
  </text>

  <rect x="80" y="212" width="608" height="376" rx="30" fill="#EFF6FF" stroke="#93C5FD" stroke-width="5"/>
  <text x="116" y="256" fill="#1D4ED8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Heating curve in the Forge</text>
  <line x1="138" y1="520" x2="620" y2="520" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
  <line x1="138" y1="520" x2="282" y2="410" stroke="#3B82F6" stroke-width="10" stroke-linecap="round"/>
  <line x1="282" y1="410" x2="470" y2="410" stroke="#8B5CF6" stroke-width="10" stroke-linecap="round"/>
  <line x1="470" y1="410" x2="598" y2="320" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <text x="184" y="392" fill="#2563EB" font-family="Arial, Helvetica, sans-serif" font-size="22">warm-up</text>
  <text x="322" y="390" fill="#7C3AED" font-family="Arial, Helvetica, sans-serif" font-size="22">Form Gate plateau</text>
  <text x="514" y="302" fill="#15803D" font-family="Arial, Helvetica, sans-serif" font-size="22">new state warms</text>
  <text x="118" y="560" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="22">time or energy added</text>

  <rect x="736" y="212" width="378" height="376" rx="30" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="5"/>
  <text x="776" y="256" fill="#7E22CE" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Morph Fee meter</text>
  <rect x="812" y="306" width="228" height="44" rx="22" fill="#E9D5FF"/>
  <rect x="812" y="306" width="176" height="44" rx="22" fill="#9333EA"/>
  <rect x="812" y="384" width="228" height="44" rx="22" fill="#E9D5FF"/>
  <rect x="812" y="384" width="228" height="44" rx="22" fill="#22C55E"/>
  <text x="776" y="470" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="23">
    <tspan x="776" dy="0">The purple stage is Q = m L.</tspan>
    <tspan x="776" dy="32">Temperature stays constant</tspan>
    <tspan x="776" dy="32">while the state changes.</tspan>
  </text>

  <rect x="96" y="626" width="1008" height="74" rx="22" fill="#EEF4FF"/>
  <text x="126" y="672" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">
    Plateau means the energy is changing form, not raising temperature.
  </text>
</svg>
