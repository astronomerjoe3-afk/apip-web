<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="760" rx="40" fill="#F8FBFF"/>
  <rect x="28" y="28" width="1144" height="704" rx="34" fill="#FFFFFF" stroke="#D7E6F8" stroke-width="4"/>
  <text x="72" y="98" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">
    Warmth Level is temperature, while the Forge Ledger tracks transfer
  </text>
  <text x="72" y="146" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="22">
    <tspan x="72" dy="0">Two blocks can receive the same energy payment and still rise by different amounts.</tspan>
    <tspan x="72" dy="28">The meter and the payment record answer different questions.</tspan>
  </text>

  <rect x="84" y="202" width="462" height="390" rx="30" fill="#E0F2FE" stroke="#38BDF8" stroke-width="5"/>
  <rect x="654" y="202" width="462" height="390" rx="30" fill="#EEF2FF" stroke="#818CF8" stroke-width="5"/>

  <text x="122" y="250" fill="#0369A1" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Warmth Level meter</text>
  <rect x="158" y="296" width="96" height="214" rx="30" fill="#DBEAFE"/>
  <rect x="184" y="354" width="44" height="130" rx="18" fill="#2563EB"/>
  <text x="140" y="546" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="24">Temperature now</text>
  <text x="330" y="344" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="24">
    <tspan x="330" dy="0">Warmth Level answers:</tspan>
    <tspan x="330" dy="34">How hot is the block</tspan>
    <tspan x="330" dy="34">at this moment?</tspan>
  </text>
  <circle cx="372" cy="470" r="46" fill="#BFDBFE"/>
  <circle cx="462" cy="470" r="68" fill="#93C5FD"/>
  <text x="332" y="546" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="22">
    Same meter idea, different block sizes
  </text>

  <text x="692" y="250" fill="#4F46E5" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Forge Ledger</text>
  <rect x="718" y="292" width="332" height="84" rx="24" fill="#0F172A"/>
  <text x="758" y="344" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">+ 2400 J</text>
  <rect x="718" y="416" width="126" height="92" rx="24" fill="#C7D2FE"/>
  <rect x="878" y="416" width="172" height="92" rx="24" fill="#C7D2FE"/>
  <text x="744" y="470" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">small</text>
  <text x="914" y="470" fill="#312E81" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">large</text>
  <text x="716" y="556" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="24">
    <tspan x="716" dy="0">The payment can match,</tspan>
    <tspan x="716" dy="30">but the temperature rise can differ.</tspan>
  </text>

  <rect x="96" y="626" width="1008" height="74" rx="22" fill="#EEF4FF"/>
  <text x="128" y="672" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">
    Heat means transferred energy. Temperature means the current thermal level.
  </text>
</svg>
