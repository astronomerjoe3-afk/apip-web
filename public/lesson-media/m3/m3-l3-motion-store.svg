<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="540" rx="32" fill="#F8FBFF"/>
  <rect x="28" y="28" width="904" height="484" rx="28" fill="#FFFFFF" stroke="#D7E6F9" stroke-width="2"/>
  <text x="60" y="88" fill="#13213A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Motion Store rises sharply with speed</text>
  <text x="60" y="126" fill="#4B617C" font-family="Arial, sans-serif" font-size="22">Doubling pace does not just double the store. The speed term is squared.</text>

  <rect x="92" y="168" width="220" height="246" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="4"/>
  <text x="140" y="208" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="30" font-weight="700">2 kg at 4 m/s</text>
  <rect x="156" y="286" width="92" height="72" rx="18" fill="#3B82F6"/>
  <text x="178" y="330" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">16 J</text>

  <rect x="372" y="132" width="220" height="282" rx="28" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4"/>
  <text x="414" y="172" fill="#B45309" font-family="Arial, sans-serif" font-size="30" font-weight="700">2 kg at 8 m/s</text>
  <rect x="436" y="214" width="92" height="144" rx="18" fill="#F59E0B"/>
  <text x="458" y="302" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">64 J</text>

  <rect x="652" y="168" width="220" height="246" rx="28" fill="#F0FDF4" stroke="#86EFAC" stroke-width="4"/>
  <text x="692" y="208" fill="#166534" font-family="Arial, sans-serif" font-size="30" font-weight="700">4 kg at 4 m/s</text>
  <rect x="716" y="250" width="92" height="108" rx="18" fill="#22C55E"/>
  <text x="738" y="314" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="28" font-weight="700">32 J</text>

  <rect x="160" y="444" width="642" height="42" rx="18" fill="#EEF5FF"/>
  <text x="224" y="472" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Formal summary: E_k = 0.5mv^2</text>
</svg>
