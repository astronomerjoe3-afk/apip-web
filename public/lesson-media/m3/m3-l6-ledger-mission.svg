<svg width="960" height="540" viewBox="0 0 960 540" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="960" height="540" rx="32" fill="#F8FBFF"/>
  <rect x="28" y="28" width="904" height="484" rx="28" fill="#FFFFFF" stroke="#D7E6F9" stroke-width="2"/>
  <text x="60" y="88" fill="#13213A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Long energy questions are mission planners</text>
  <text x="60" y="126" fill="#4B617C" font-family="Arial, sans-serif" font-size="22">Choose the step order from the story: useful gain first, later leak next, final target check last.</text>

  <rect x="76" y="188" width="228" height="152" rx="28" fill="#DBEAFE" stroke="#60A5FA" stroke-width="4"/>
  <text x="112" y="236" fill="#1D4ED8" font-family="Arial, sans-serif" font-size="30" font-weight="700">Lift input</text>
  <text x="128" y="278" fill="#0F172A" font-family="Arial, sans-serif" font-size="26">1500 J at 60%</text>
  <text x="100" y="318" fill="#334155" font-family="Arial, sans-serif" font-size="22">First find useful Height Store</text>

  <rect x="364" y="164" width="232" height="176" rx="28" fill="#DCFCE7" stroke="#22C55E" stroke-width="4"/>
  <text x="398" y="212" fill="#166534" font-family="Arial, sans-serif" font-size="30" font-weight="700">Useful store</text>
  <text x="430" y="254" fill="#166534" font-family="Arial, sans-serif" font-size="28">900 J height</text>
  <text x="400" y="294" fill="#334155" font-family="Arial, sans-serif" font-size="22">Then apply the launch leak</text>

  <rect x="656" y="188" width="228" height="152" rx="28" fill="#ECFCCB" stroke="#84CC16" stroke-width="4"/>
  <text x="690" y="236" fill="#4D7C0F" font-family="Arial, sans-serif" font-size="30" font-weight="700">Gate check</text>
  <text x="702" y="278" fill="#4D7C0F" font-family="Arial, sans-serif" font-size="26">720 J vs 700 J</text>
  <text x="706" y="318" fill="#334155" font-family="Arial, sans-serif" font-size="22">Mission succeeds</text>

  <path d="M306 264H356" stroke="#2563EB" stroke-width="12" stroke-linecap="round"/>
  <polygon points="356,264 326,246 326,282" fill="#2563EB"/>
  <path d="M598 264H648" stroke="#22C55E" stroke-width="12" stroke-linecap="round"/>
  <polygon points="648,264 618,246 618,282" fill="#22C55E"/>

  <rect x="170" y="420" width="622" height="44" rx="18" fill="#EEF5FF"/>
  <text x="232" y="448" fill="#1E3A8A" font-family="Arial, sans-serif" font-size="22" font-weight="700">Planner rule: output of one stage can become the input to the next</text>
</svg>
