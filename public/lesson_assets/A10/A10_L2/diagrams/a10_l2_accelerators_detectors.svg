<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#eef6ff" stroke="#2563eb" stroke-width="3"/>

  <text x="700" y="96" fill="#1d4ed8" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Beam Preparation and Event Detection Work Together
  </text>
  <text x="700" y="140" fill="#1e40af" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Accelerators raise particle energy before collisions or probing. Detectors turn those invisible interactions into tracks and signals.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <rect x="126" y="226" width="1224" height="486" rx="30" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/>

  <rect x="162" y="384" width="154" height="128" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="239" y="442" fill="#1e40af" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">source</text>
  <text x="239" y="476" fill="#1e40af" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">particle gun</text>

  <line x1="316" y1="448" x2="474" y2="448" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <polygon points="474,448 444,432 444,464" fill="#0ea5e9"/>
  <rect x="474" y="356" width="222" height="184" rx="28" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
  <text x="585" y="408" fill="#1d4ed8" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">accelerator</text>
  <text x="585" y="444" fill="#1e40af" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">electric fields add energy</text>
  <text x="585" y="476" fill="#1e40af" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">before the interaction</text>

  <line x1="696" y1="448" x2="856" y2="448" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <polygon points="856,448 826,432 826,464" fill="#0ea5e9"/>

  <circle cx="964" cy="448" r="150" fill="none" stroke="#60a5fa" stroke-width="7"/>
  <circle cx="964" cy="448" r="106" fill="none" stroke="#93c5fd" stroke-width="7"/>
  <circle cx="964" cy="448" r="28" fill="#1d4ed8"/>
  <path d="M964 448 C1014 396, 1056 360, 1132 324" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
  <path d="M964 448 C1008 470, 1052 520, 1116 586" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
  <path d="M964 448 C916 406, 874 368, 830 322" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <text x="964" y="250" fill="#1d4ed8" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    detector layers around the event
  </text>
  <text x="1158" y="320" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">track shape</text>
  <text x="1148" y="592" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">energy deposit</text>
  <text x="798" y="310" fill="#b45309" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">timing / hit position</text>

  <rect x="314" y="608" width="998" height="68" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="813" y="648" fill="#1e40af" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    Different detector responses reveal different particle properties after the beam has been prepared.
  </text>
