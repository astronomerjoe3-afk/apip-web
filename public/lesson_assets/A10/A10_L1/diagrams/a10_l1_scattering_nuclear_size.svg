<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#fff5f5" stroke="#ef4444" stroke-width="3"/>

  <text x="700" y="96" fill="#991b1b" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Rutherford Scattering Reads the Whole Pattern
  </text>
  <text x="700" y="140" fill="#b91c1c" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Most alpha particles go straight through. A few large deflections reveal a tiny dense positively charged nucleus.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#fca5a5" stroke-width="3"/>
  <rect x="126" y="226" width="1232" height="486" rx="30" fill="#fff7f7" stroke="#fecaca" stroke-width="2.5"/>

  <circle cx="180" cy="470" r="42" fill="#fb7185"/>
  <text x="180" y="462" fill="#ffffff" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">alpha</text>
  <text x="180" y="490" fill="#ffffff" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">beam</text>
  <text x="180" y="548" fill="#991b1b" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">incident source</text>

  <line x1="232" y1="430" x2="638" y2="452" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
  <line x1="232" y1="470" x2="638" y2="470" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <line x1="232" y1="510" x2="638" y2="488" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
  <line x1="232" y1="556" x2="638" y2="520" stroke="#fca5a5" stroke-width="5" stroke-linecap="round"/>
  <text x="448" y="390" fill="#b91c1c" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    most pass through with little deflection
  </text>

  <line x1="664" y1="308" x2="664" y2="636" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <text x="664" y="676" fill="#b45309" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    gold foil
  </text>

  <circle cx="664" cy="470" r="18" fill="#dc2626"/>
  <text x="664" y="514" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    dense nucleus
  </text>

  <path d="M638 470 C710 446, 820 364, 1046 318" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <circle cx="968" cy="338" r="14" fill="#ef4444"/>
  <text x="1088" y="296" fill="#991b1b" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    scattered alpha particle
  </text>
  <text x="1088" y="328" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    new direction after close approach
  </text>

  <path d="M638 470 C610 430, 572 380, 528 356" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
  <text x="534" y="320" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">rare bounce-back</text>

  <path d="M682 470 C820 520, 920 590, 1054 616" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round"/>
  <text x="1066" y="646" fill="#b91c1c" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    few large deflections
  </text>

  <line x1="682" y1="470" x2="1112" y2="470" stroke="#94a3b8" stroke-width="5" stroke-dasharray="14 12"/>
  <path d="M762 470 A84 84 0 0 0 794 392" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <text x="846" y="412" fill="#7f1d1d" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">deflection angle</text>
  <text x="896" y="446" fill="#7f1d1d" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">measured from the dashed original path</text>
</svg>
