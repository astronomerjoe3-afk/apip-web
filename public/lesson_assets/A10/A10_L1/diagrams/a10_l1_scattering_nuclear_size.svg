<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="70" y="90" width="740" height="518" rx="36" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><rect x="106" y="132" width="668" height="94" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="440" y="170" fill="#991b1b" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Scattering and Nuclear Size</tspan></text><rect x="118" y="248" width="160" height="136" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="198" y="284" fill="#991b1b" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">Most particles</tspan><tspan x="198" dy="23">pass through with</tspan><tspan x="198" dy="23">little deflection.</tspan></text><rect x="326" y="248" width="160" height="136" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="406" y="284" fill="#991b1b" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">A few large</tspan><tspan x="406" dy="23">deflections reveal</tspan><tspan x="406" dy="23">concentrated</tspan><tspan x="406" dy="23">positive charge</tspan><tspan x="406" dy="23">and mass.</tspan></text><rect x="534" y="248" width="160" height="136" rx="28" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="614" y="284" fill="#991b1b" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">Scattering</tspan><tspan x="614" dy="23">evidence supports</tspan><tspan x="614" dy="23">a tiny dense</tspan><tspan x="614" dy="23">nucleus.</tspan></text><line x1="280" y1="316" x2="314" y2="316" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="316" x2="522" y2="316" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/><rect x="106" y="414" width="668" height="156" rx="28" fill="#f8fafc" stroke="#dc2626" stroke-width="2"/><text x="136" y="450" fill="#991b1b" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="486" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Read the overall pattern before you focus on one dramatic</tspan><tspan x="136" dy="31">track. The argument comes from the distribution of</tspan><tspan x="136" dy="31">outcomes.</tspan></text>
  <rect x="860" y="128" width="470" height="96" rx="24" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="890" y="156" fill="#991b1b" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="186" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Most particles pass through with</tspan><tspan x="890" dy="29">little deflection.</tspan></text><rect x="860" y="252" width="470" height="96" rx="24" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="890" y="280" fill="#991b1b" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="310" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">A few large deflections reveal</tspan><tspan x="890" dy="29">concentrated positive charge and</tspan><tspan x="890" dy="29">mass.</tspan></text><rect x="860" y="376" width="470" height="96" rx="24" fill="#ffffff" stroke="#dc2626" stroke-width="2"/><text x="890" y="404" fill="#991b1b" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="434" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Scattering evidence supports a</tspan><tspan x="890" dy="29">tiny dense nucleus.</tspan></text>
  <rect x="860" y="500" width="470" height="108" rx="28" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="890" y="534" fill="#991b1b" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="568" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Scattering evidence points to a tiny dense nucleus because only</tspan><tspan x="890" dy="31">a small fraction of particles undergo large deflections.</tspan></text>
</svg>