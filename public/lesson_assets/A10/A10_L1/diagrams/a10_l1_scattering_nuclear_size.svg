<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#fff8f8"/>
  <rect x="34" y="30" width="1332" height="760" rx="40" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="700" y="110" fill="#991b1b" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Scattering and Nuclear Size</text>
  <text x="700" y="154" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">Read Rutherford-style evidence from the whole pattern, not from one dramatic hit.</text>

  <rect x="108" y="214" width="1184" height="454" rx="36" fill="#ffffff" stroke="#f87171" stroke-width="3"/>
  <circle cx="220" cy="438" r="34" fill="#ef4444"/>
  <text x="220" y="446" fill="#ffffff" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">alpha</text>
  <text x="220" y="494" fill="#991b1b" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">source</text>

  <rect x="658" y="282" width="16" height="310" rx="8" fill="#f59e0b"/>
  <text x="666" y="620" fill="#92400e" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">foil</text>
  <circle cx="666" cy="438" r="18" fill="#dc2626"/>

  <path d="M 266 344 L 648 388" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M 266 396 L 648 420" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M 266 438 L 648 438" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M 266 480 L 648 458" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M 266 532 L 648 490" fill="none" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M 674 438 Q 838 360 1098 290" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <path d="M 674 438 Q 838 520 1098 586" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>
  <path d="M 674 438 Q 596 396 520 324" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round"/>

  <text x="454" y="266" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">most go nearly straight</text>
  <text x="960" y="238" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">few large deflections</text>
  <text x="494" y="304" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">rare bounce-back</text>

  <text x="700" y="714" fill="#991b1b" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">A tiny dense nucleus explains why most particles pass through but a few deflect strongly.</text>
</svg>
