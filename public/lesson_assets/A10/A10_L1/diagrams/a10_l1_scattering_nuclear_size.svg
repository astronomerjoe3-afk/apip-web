<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f8fbff"/>
  <rect x="30" y="28" width="1340" height="764" rx="40" fill="#fff7f7" stroke="#ef4444" stroke-width="3"/>

  <text x="700" y="94" fill="#991b1b" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Rutherford Scattering: Direction Is the Evidence
  </text>
  <text x="700" y="136" fill="#b91c1c" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Alpha particles arrive from the left. The direction after the foil is what reveals the tiny dense nucleus.
  </text>

  <rect x="94" y="184" width="1212" height="572" rx="34" fill="#ffffff" stroke="#fca5a5" stroke-width="3"/>

  <text x="204" y="244" fill="#b91c1c" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    beam from left
  </text>
  <circle cx="192" cy="430" r="40" fill="#fb7185"/>
  <text x="192" y="423" fill="#ffffff" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">alpha</text>
  <text x="192" y="449" fill="#ffffff" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">beam</text>

  <rect x="520" y="238" width="150" height="458" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <text x="595" y="282" fill="#b45309" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    gold foil
  </text>
  <line x1="595" y1="320" x2="595" y2="620" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="595" cy="430" r="18" fill="#dc2626"/>
  <circle cx="595" cy="430" r="42" fill="none" stroke="#fca5a5" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="595" y="486" fill="#991b1b" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    tiny dense nucleus
  </text>
  <text x="595" y="664" fill="#b45309" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    nuclei occupy very little space
  </text>

  <line x1="232" y1="318" x2="520" y2="318" stroke="#f97316" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <line x1="670" y1="318" x2="1146" y2="318" stroke="#f97316" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <text x="1110" y="236" fill="#9a3412" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Most continue forward
  </text>
  <text x="980" y="348" fill="#c2410c" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    little deflection means most of the atom is empty space
  </text>

  <line x1="232" y1="430" x2="520" y2="430" stroke="#f97316" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <line x1="670" y1="430" x2="1060" y2="430" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 10"/>
  <path d="M670 430 C738 420, 824 372, 900 282" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <path d="M746 430 A92 92 0 0 0 784 352" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round"/>
  <text x="984" y="486" fill="#991b1b" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Few turn sharply
  </text>
  <text x="984" y="518" fill="#b91c1c" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    large deflection means concentrated positive charge
  </text>
  <text x="698" y="250" fill="#7f1d1d" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">
    measured from the
  </text>
  <text x="698" y="274" fill="#7f1d1d" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">
    dashed forward path
  </text>

  <line x1="232" y1="560" x2="520" y2="560" stroke="#f97316" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <path d="M670 560 C612 548, 540 522, 442 470" fill="none" stroke="#fb7185" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-pink)"/>
  <text x="980" y="606" fill="#be123c" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Rare bounce-back
  </text>
  <text x="980" y="638" fill="#be123c" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    only a tiny dense center can reverse a particle so strongly
  </text>

  <text x="700" y="728" fill="#991b1b" font-size="27" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Straight through is common. Large turns are rare. Bounce-back is very rare.
  </text>
</svg>
