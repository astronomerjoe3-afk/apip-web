<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <marker id="arrow-orange" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#f97316"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#ec4899"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f8fbff"/>
  <rect x="30" y="28" width="1340" height="764" rx="38" fill="url(#bg)" stroke="#f97316" stroke-width="3"/>

  <text x="700" y="92" fill="#9a3412" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Rutherford Scattering: Read the Direction
  </text>
  <text x="700" y="134" fill="#7c2d12" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    One incoming alpha beam, then three clean outcomes: straight through, slight deflection, and rare bounce-back.
  </text>

  <rect x="88" y="180" width="1224" height="360" rx="32" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <circle cx="160" cy="360" r="40" fill="#fb7185"/>
  <text x="160" y="351" fill="#ffffff" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">alpha</text>
  <text x="160" y="376" fill="#ffffff" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">beam</text>
  <text x="160" y="432" fill="#9a3412" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    incoming from left
  </text>

  <line x1="208" y1="360" x2="610" y2="360" stroke="#f97316" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <text x="410" y="322" fill="#c2410c" font-size="25" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    incident direction
  </text>

  <rect x="620" y="238" width="96" height="244" rx="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <line x1="668" y1="268" x2="668" y2="452" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <circle cx="668" cy="360" r="17" fill="#b91c1c"/>
  <circle cx="668" cy="360" r="42" fill="none" stroke="#fca5a5" stroke-width="4" stroke-dasharray="10 10"/>
  <text x="668" y="214" fill="#b45309" font-size="27" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    gold foil
  </text>
  <text x="668" y="514" fill="#991b1b" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    tiny dense nucleus
  </text>

  <line x1="694" y1="360" x2="1112" y2="360" stroke="#94a3b8" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="934" y="392" fill="#64748b" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    original forward line
  </text>

  <line x1="694" y1="360" x2="1144" y2="360" stroke="#f97316" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  <rect x="1046" y="300" width="184" height="46" rx="23" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="1138" y="330" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    most: straight through
  </text>

  <path d="M694 360 C774 358, 898 330, 1078 254" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <line x1="760" y1="360" x2="832" y2="360" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
  <line x1="760" y1="360" x2="826" y2="334" stroke="#7f1d1d" stroke-width="4" stroke-linecap="round"/>
  <path d="M810 360 A50 50 0 0 0 810 339" fill="none" stroke="#7f1d1d" stroke-width="3"/>
  <text x="846" y="325" fill="#7f1d1d" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">
    small angle
  </text>
  <rect x="930" y="198" width="250" height="50" rx="25" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <text x="1055" y="231" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    some: slight deflection
  </text>

  <path d="M650 360 C610 345, 544 308, 392 218" fill="none" stroke="#ec4899" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow-pink)"/>
  <rect x="222" y="170" width="258" height="50" rx="25" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2"/>
  <text x="351" y="203" fill="#9d174d" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    very few: bounce back
  </text>

  <rect x="88" y="572" width="376" height="156" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
  <text x="276" y="620" fill="#9a3412" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    1. Straight through is common
  </text>
  <text x="276" y="658" fill="#c2410c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    Most alpha particles keep going
  </text>
  <text x="276" y="688" fill="#c2410c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    forward, so atoms are mostly
  </text>
  <text x="276" y="718" fill="#c2410c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    empty space.
  </text>

  <rect x="512" y="572" width="376" height="156" rx="28" fill="#fff1f2" stroke="#fda4af" stroke-width="3"/>
  <text x="700" y="620" fill="#991b1b" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    2. Small deflection matters
  </text>
  <text x="700" y="658" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    A slight turn means the alpha
  </text>
  <text x="700" y="688" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    particle felt electrostatic repulsion
  </text>
  <text x="700" y="718" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    from positive charge.
  </text>

  <rect x="936" y="572" width="376" height="156" rx="28" fill="#fdf2f8" stroke="#f472b6" stroke-width="3"/>
  <text x="1124" y="620" fill="#9d174d" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    3. Bounce-back is rare
  </text>
  <text x="1124" y="658" fill="#be185d" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    Reversal only happens when an
  </text>
  <text x="1124" y="688" fill="#be185d" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    alpha particle gets very close to
  </text>
  <text x="1124" y="718" fill="#be185d" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    a tiny concentrated nucleus.
  </text>

  <text x="700" y="772" fill="#7c2d12" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    The direction pattern is the clue: mostly forward, some small turns, almost no bounce-back.
  </text>
</svg>
