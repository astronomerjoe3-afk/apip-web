<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <marker id="incidentArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ea580c"/>
    </marker>
    <marker id="scatterArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#dc2626"/>
    </marker>
    <marker id="guideArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#fff8f8"/>
  <rect x="34" y="30" width="1332" height="760" rx="40" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
  <text x="700" y="110" fill="#991b1b" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Scattering and Nuclear Size</text>
  <text x="700" y="154" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">Read Rutherford-style evidence from the whole pattern, not from one dramatic hit.</text>

  <rect x="108" y="214" width="1184" height="454" rx="36" fill="#ffffff" stroke="#f87171" stroke-width="3"/>

  <circle cx="204" cy="438" r="38" fill="#fb7185"/>
  <text x="204" y="430" fill="#ffffff" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">alpha</text>
  <text x="204" y="458" fill="#ffffff" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">beam</text>
  <text x="204" y="510" fill="#991b1b" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">incident source</text>

  <rect x="666" y="276" width="16" height="316" rx="8" fill="#f59e0b"/>
  <text x="674" y="620" fill="#92400e" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">gold foil</text>
  <circle cx="674" cy="438" r="20" fill="#dc2626"/>
  <text x="674" y="472" fill="#991b1b" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">dense nucleus</text>

  <path d="M 256 362 L 658 406" fill="none" stroke="#fca5a5" stroke-width="5" stroke-linecap="round" marker-end="url(#incidentArrow)"/>
  <path d="M 256 402 L 658 424" fill="none" stroke="#fca5a5" stroke-width="5" stroke-linecap="round" marker-end="url(#incidentArrow)"/>
  <path d="M 256 474 L 658 454" fill="none" stroke="#fca5a5" stroke-width="5" stroke-linecap="round" marker-end="url(#incidentArrow)"/>
  <path d="M 256 518 L 658 486" fill="none" stroke="#fca5a5" stroke-width="5" stroke-linecap="round" marker-end="url(#incidentArrow)"/>

  <path d="M 256 438 L 672 438" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" marker-end="url(#incidentArrow)"/>
  <circle cx="516" cy="438" r="10" fill="#ea580c"/>
  <text x="414" y="340" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">incident alpha particle</text>
  <text x="414" y="372" fill="#c2410c" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">arrow shows the incoming direction</text>

  <path d="M 674 438 L 1118 438" fill="none" stroke="#94a3b8" stroke-width="5" stroke-dasharray="16 12" stroke-linecap="round" marker-end="url(#guideArrow)"/>
  <text x="1084" y="414" fill="#475569" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="end">original straight path</text>

  <path d="M 674 438 Q 824 350 1096 286" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" marker-end="url(#scatterArrow)"/>
  <circle cx="978" cy="318" r="11" fill="#dc2626"/>
  <text x="1042" y="238" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">scattered alpha particle</text>
  <text x="1042" y="268" fill="#b91c1c" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">new direction after a close approach</text>

  <path d="M 674 438 Q 794 510 1064 582" fill="none" stroke="#f87171" stroke-width="6" stroke-linecap="round" marker-end="url(#scatterArrow)"/>
  <text x="1016" y="610" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">few large deflections</text>

  <path d="M 674 438 Q 598 398 532 334" fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" marker-end="url(#scatterArrow)"/>
  <text x="518" y="304" fill="#991b1b" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">rare bounce-back</text>

  <path d="M 804 438 A 130 130 0 0 0 790 365" fill="none" stroke="#7f1d1d" stroke-width="4"/>
  <text x="858" y="386" fill="#7f1d1d" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">deflection angle</text>
  <text x="858" y="412" fill="#7f1d1d" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">measured from the dashed original path</text>

  <text x="334" y="270" fill="#991b1b" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">most pass through with little deviation</text>
  <text x="700" y="714" fill="#991b1b" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">A tiny dense nucleus explains why most particles pass through but a few deflect strongly.</text>
</svg>
