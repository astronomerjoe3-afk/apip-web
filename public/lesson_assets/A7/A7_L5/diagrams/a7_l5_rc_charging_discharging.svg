<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#eef6ff" stroke="#3b82f6" stroke-width="3"/>

  <text x="700" y="96" fill="#1d4ed8" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    RC Charging and Discharging Are Changing-Rate Processes
  </text>
  <text x="700" y="140" fill="#1e40af" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Current falls away while capacitor p.d. rises during charging, and both change exponentially rather than in straight lines.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <rect x="126" y="226" width="548" height="486" rx="30" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/>
  <rect x="726" y="226" width="548" height="486" rx="30" fill="#eff6ff" stroke="#93c5fd" stroke-width="2.5"/>

  <text x="400" y="268" fill="#1d4ed8" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Charging
  </text>
  <text x="1000" y="268" fill="#1d4ed8" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Discharging
  </text>

  <line x1="196" y1="622" x2="606" y2="622" stroke="#1e40af" stroke-width="4"/>
  <line x1="196" y1="336" x2="196" y2="622" stroke="#1e40af" stroke-width="4"/>
  <text x="614" y="630" fill="#1e40af" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">time</text>

  <path d="M220 592 C320 420, 420 366, 580 350" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M220 362 C320 378, 430 458, 580 598" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <line x1="378" y1="336" x2="378" y2="622" stroke="#93c5fd" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="378" y="324" fill="#1e40af" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">tau</text>
  <text x="468" y="390" fill="#047857" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Vc rises</text>
  <text x="468" y="528" fill="#b45309" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">I falls</text>

  <line x1="796" y1="622" x2="1206" y2="622" stroke="#1e40af" stroke-width="4"/>
  <line x1="796" y1="336" x2="796" y2="622" stroke="#1e40af" stroke-width="4"/>
  <text x="1214" y="630" fill="#1e40af" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">time</text>

  <path d="M820 350 C936 386, 1048 484, 1180 594" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <path d="M820 350 C936 386, 1048 484, 1180 594" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <line x1="980" y1="336" x2="980" y2="622" stroke="#93c5fd" stroke-width="3" stroke-dasharray="10 10"/>
  <text x="980" y="324" fill="#1e40af" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">tau</text>
  <text x="1048" y="440" fill="#047857" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Vc falls</text>
  <text x="1000" y="682" fill="#1e40af" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    The time constant sets the timescale, not a straight-line rate.
  </text>
</svg>
