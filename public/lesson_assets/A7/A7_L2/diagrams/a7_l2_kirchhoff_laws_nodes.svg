  <text x="990" y="586" fill="#15803d" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">lamp</text>

  <path d="M852 618 C928 648, 1048 648, 1124 618" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1124,618 1092,606 1102,634" fill="#f97316"/>
  <text x="990" y="680" fill="#1e40af" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
