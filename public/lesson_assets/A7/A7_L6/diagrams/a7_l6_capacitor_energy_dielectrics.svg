<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="70" y="56" width="180" height="40" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="160" y="82" fill="#1d4ed8" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="160" dy="0">A7 lesson board</tspan></text>
  <text x="70" y="144" fill="#0f172a" font-size="35" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="70" dy="0">Energy storage depends on charge</tspan><tspan x="70" dy="43">separation, voltage, and the</tspan><tspan x="70" dy="43">dielectric medium</tspan></text>
  <text x="70" y="202" fill="#475569" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="70" dy="0">The energy-storage board keeps field energy, capacitor geometry, and dielectric effect on</tspan><tspan x="70" dy="31">one frame so increased capacitance is linked to the physical medium.</tspan></text>
  <rect x="70" y="242" width="740" height="518" rx="36" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><rect x="106" y="284" width="668" height="94" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="440" y="322" fill="#1d4ed8" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Capacitor Energy and Dielectrics</tspan></text><rect x="118" y="400" width="160" height="136" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="198" y="436" fill="#1d4ed8" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">Capacitors store</tspan><tspan x="198" dy="23">energy in their</tspan><tspan x="198" dy="23">electric field.</tspan></text><rect x="326" y="400" width="160" height="136" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="406" y="436" fill="#1d4ed8" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">Energy depends on</tspan><tspan x="406" dy="23">capacitance and</tspan><tspan x="406" dy="23">voltage.</tspan></text><rect x="534" y="400" width="160" height="136" rx="28" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="614" y="436" fill="#1d4ed8" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">A dielectric</tspan><tspan x="614" dy="23">raises capacitance</tspan><tspan x="614" dy="23">by changing the</tspan><tspan x="614" dy="23">field response</tspan><tspan x="614" dy="23">between the</tspan><tspan x="614" dy="23">plates.</tspan></text><line x1="280" y1="468" x2="314" y2="468" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="468" x2="522" y2="468" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/><rect x="106" y="566" width="668" height="156" rx="28" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="136" y="602" fill="#1d4ed8" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="638" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Insert the dielectric before changing the voltage so the</tspan><tspan x="136" dy="31">material effect and the voltage effect do not blend</tspan><tspan x="136" dy="31">together.</tspan></text>
  <rect x="860" y="280" width="470" height="96" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="890" y="308" fill="#1d4ed8" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="338" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Capacitors store energy in their</tspan><tspan x="890" dy="29">electric field.</tspan></text><rect x="860" y="404" width="470" height="96" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="890" y="432" fill="#1d4ed8" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="462" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Energy depends on capacitance</tspan><tspan x="890" dy="29">and voltage.</tspan></text><rect x="860" y="528" width="470" height="96" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="890" y="556" fill="#1d4ed8" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="586" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">A dielectric raises capacitance</tspan><tspan x="890" dy="29">by changing the field response</tspan><tspan x="890" dy="29">between the plates.</tspan></text>
  <rect x="860" y="652" width="470" height="108" rx="28" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="890" y="686" fill="#1d4ed8" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="720" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Capacitor energy belongs to the electric field, and dielectric</tspan><tspan x="890" dy="31">insertion changes storage by increasing capacitance.</tspan></text>
</svg>