<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Compass sweep</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #0f172a, #020617); color: white; display: grid; place-items: center; min-height: 100vh; }
  .wrap { width: min(980px, 92vw); padding: 36px; border-radius: 28px; background: rgba(15, 23, 42, 0.84); border: 1px solid #334155; }
  .title { font-size: 40px; font-weight: 800; text-align: center; }
  .desc { margin-top: 14px; text-align: center; color: #cbd5e1; font-size: 21px; }
  .panel { margin-top: 30px; display: grid; place-items: center; min-height: 320px; border-radius: 24px; background: linear-gradient(135deg, #082f49, #0f766e); }
  .needle { width: 220px; height: 220px; border-radius: 50%; border: 6px solid rgba(255,255,255,0.28); position: relative; }
  .needle::before { content: ""; position: absolute; inset: 102px 24px; background: #f8fafc; transform-origin: center center; animation: sweep 5s ease-in-out infinite alternate; }
  .needle::after { content: ""; position: absolute; left: 110px; top: 30px; width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-bottom: 48px solid #22c55e; transform: translateX(-12px); animation: sweepArrow 5s ease-in-out infinite alternate; transform-origin: 12px 80px; }
  @keyframes sweep { from { transform: rotate(-48deg); } to { transform: rotate(48deg); } }
  @keyframes sweepArrow { from { transform: translateX(-12px) rotate(-48deg); } to { transform: translateX(-12px) rotate(48deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Compass sweep</div>
    <div class="desc">Compass flags rotate to match the local magnetic-field direction. Field mapping is about local direction, not hidden particle tracks.</div>
    <div class="panel"><div class="needle"></div></div>
  </div>
</body>
</html>
