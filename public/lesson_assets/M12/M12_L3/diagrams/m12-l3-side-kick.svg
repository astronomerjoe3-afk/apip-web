<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fdf4ff"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">A magnetic side-kick acts sideways to both field and current</text>
  <text x="640" y="110" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">The conductor is pushed perpendicular to the field and perpendicular to the current. Reversing current or field reverses the force.</text>

  <rect x="90" y="170" width="1100" height="420" rx="36" fill="#f3e8ff" stroke="#c084fc" stroke-width="6"/>
  <text x="134" y="220" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Field-current-force board</text>

  <path d="M190 330H540" stroke="#8b5cf6" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polygon points="548,330 526,318 526,342" fill="#8b5cf6"/>
  <path d="M190 430H540" stroke="#8b5cf6" stroke-width="8" stroke-dasharray="14 10" stroke-linecap="round"/>
  <polygon points="548,430 526,418 526,442" fill="#8b5cf6"/>
  <text x="206" y="304" font-family="Arial" font-size="20" fill="#6b21a8">magnetic field</text>

  <path d="M640 490L640 250" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <polygon points="640,232 624,264 656,264" fill="#2563eb"/>
  <text x="660" y="370" font-family="Arial" font-size="22" fill="#1d4ed8">current</text>

  <path d="M790 520L790 220" stroke="#10b981" stroke-width="12" stroke-linecap="round"/>
  <polygon points="790,202 774,234 806,234" fill="#10b981"/>
  <text x="812" y="372" font-family="Arial" font-size="22" fill="#047857">force</text>

  <circle cx="640" cy="330" r="12" fill="#0f172a"/>
  <circle cx="790" cy="330" r="12" fill="#0f172a"/>
  <path d="M640 330H790" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="842" y="276" font-family="Arial" font-size="20" fill="#334155">perpendicular to current</text>
  <text x="842" y="308" font-family="Arial" font-size="20" fill="#334155">and perpendicular to field</text>

  <rect x="872" y="346" width="268" height="148" rx="22" fill="#ffffff" stroke="#d8b4fe" stroke-width="3"/>
  <text x="896" y="386" font-family="Arial" font-size="20" font-weight="700" fill="#7c3aed">Reverse current</text>
  <text x="896" y="414" font-family="Arial" font-size="18" fill="#475569">and the force reverses.</text>
  <text x="896" y="450" font-family="Arial" font-size="20" font-weight="700" fill="#7c3aed">Reverse field</text>
  <text x="896" y="478" font-family="Arial" font-size="18" fill="#475569">and the force reverses.</text>
</svg>
