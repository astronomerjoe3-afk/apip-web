<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Force reversal</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #312e81, #0f172a); color: white; display: grid; place-items: center; min-height: 100vh; }
  .wrap { width: min(980px, 92vw); padding: 36px; border-radius: 28px; background: rgba(49, 46, 129, 0.8); border: 1px solid #c4b5fd; }
  .title { font-size: 40px; font-weight: 800; text-align: center; }
  .desc { margin-top: 14px; text-align: center; color: #ddd6fe; font-size: 21px; }
  .stage { margin-top: 28px; height: 320px; border-radius: 24px; background: rgba(255,255,255,0.06); position: relative; overflow: hidden; }
  .route { position: absolute; left: 48%; top: 16%; width: 14px; height: 68%; background: #60a5fa; border-radius: 999px; }
  .force { position: absolute; left: calc(48% + 40px); top: 16%; width: 10px; height: 68%; background: #34d399; border-radius: 999px; animation: flip 4s ease-in-out infinite; transform-origin: center center; }
  @keyframes flip { 0%, 40% { transform: scaleY(1); } 50%, 100% { transform: scaleY(-1); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Force reversal</div>
    <div class="desc">Reverse either the field or the current and the sideways magnetic force reverses too.</div>
    <div class="stage">
      <div class="route"></div>
      <div class="force"></div>
    </div>
  </div>
</body>
</html>
