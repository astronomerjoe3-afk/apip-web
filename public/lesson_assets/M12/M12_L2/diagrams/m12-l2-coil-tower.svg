<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#fffdf5"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Coil towers reinforce the weave into an electromagnet</text>
  <text x="640" y="110" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Turns, current, and a soft-iron core work together. The field becomes more concentrated and magnet-like than a single straight wire.</text>

