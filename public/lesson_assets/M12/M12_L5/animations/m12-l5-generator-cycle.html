<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Generator cycle</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: radial-gradient(circle at top, #14532d, #052e16); color: white; display: grid; place-items: center; min-height: 100vh; }
  .wrap { width: min(980px, 92vw); padding: 36px; border-radius: 28px; background: rgba(20, 83, 45, 0.82); border: 1px solid #86efac; }
  .title { font-size: 40px; font-weight: 800; text-align: center; }
  .desc { margin-top: 14px; text-align: center; color: #dcfce7; font-size: 21px; }
  .wave { margin-top: 30px; height: 260px; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; }
  .path { stroke-dasharray: 420; stroke-dashoffset: 420; animation: draw 4s linear infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Generator cycle</div>
    <div class="desc">Repeated flux change makes the induced emf reverse as the rotating system keeps cutting the magnetic field.</div>
    <div class="wave">
      <svg viewBox="0 0 820 260" aria-hidden="true">
        <path class="path" d="M30 130C90 60 150 60 210 130S330 200 390 130S510 60 570 130S690 200 790 130" fill="none" stroke="#93c5fd" stroke-width="10" />
      </svg>
    </div>
  </div>
</body>
</html>
