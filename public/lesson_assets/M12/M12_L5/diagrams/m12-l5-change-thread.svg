<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ecfdf5"/>
  <text x="640" y="72" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0f172a">Induction needs changing field-thread, not just a nearby field</text>
  <text x="640" y="110" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Move the magnet, move the coil, or rotate the loop. Static field alone does not keep inducing emf.</text>

  <rect x="78" y="166" width="540" height="456" rx="36" fill="#ffffff" stroke="#86efac" stroke-width="6"/>
  <text x="120" y="214" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Magnet through coil</text>
  <rect x="160" y="310" width="70" height="160" rx="18" fill="#ef4444"/>
  <text x="195" y="346" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#ffffff">N</text>
  <path d="M278 286c18 0 18 208 0 208" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M330 286c18 0 18 208 0 208" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M382 286c18 0 18 208 0 208" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M434 286c18 0 18 208 0 208" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M486 286c18 0 18 208 0 208" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <path d="M230 390H274" stroke="#10b981" stroke-width="9" stroke-linecap="round"/>
  <polygon points="278,390 258,378 258,402" fill="#10b981"/>
  <text x="172" y="516" font-family="Arial" font-size="20" fill="#334155">still magnet -> no sustained induced output</text>
  <text x="172" y="548" font-family="Arial" font-size="20" fill="#334155">moving magnet -> changing flux -> induced pulse</text>

  <rect x="664" y="166" width="540" height="456" rx="36" fill="#f8fafc" stroke="#a7f3d0" stroke-width="6"/>
  <text x="706" y="214" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Generator as repeated induction</text>
  <circle cx="824" cy="396" r="98" fill="none" stroke="#0f766e" stroke-width="12"/>
  <line x1="824" y1="396" x2="890" y2="332" stroke="#0f766e" stroke-width="12" stroke-linecap="round"/>
  <circle cx="824" cy="396" r="14" fill="#0f172a"/>
  <path d="M980 256V546" stroke="#475569" stroke-width="8" stroke-dasharray="10 10"/>
  <path d="M1018 476C1060 432 1102 432 1144 476" fill="none" stroke="#1d4ed8" stroke-width="8"/>
  <path d="M1018 476C1060 520 1102 520 1144 476" fill="none" stroke="#1d4ed8" stroke-width="8"/>
  <text x="1008" y="306" font-family="Arial" font-size="20" fill="#334155">rotating loop</text>
  <text x="998" y="356" font-family="Arial" font-size="20" fill="#334155">flux changes continuously</text>
  <text x="998" y="586" font-family="Arial" font-size="20" fill="#334155">alternating emf output</text>
</svg>
