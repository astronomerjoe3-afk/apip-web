<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Surface angle trap vs Guide Line conversion</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">20 deg to the surface becomes 70 deg to the Guide Line</text><line x1="716.80" y1="150.00" x2="716.80" y2="600.00" stroke="#93c5fd" stroke-width="8" /><text x="742.80" y="168.00" fill="#bfdbfe" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">mirror surface</text><line x1="536.80" y1="489.60" x2="536.80" y2="311.10" stroke="#22c55e" stroke-width="5" marker-end="url(#obj-arrow)" /><text x="536.80" y="523.60" fill="#86efac" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Object</text><line x1="506.80" y1="473.60" x2="926.80" y2="473.60" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8" /><text x="920.80" y="461.60" fill="#7dd3fc" text-anchor="end" font-size="16" font-family="Arial" font-weight="normal">Guide Line</text><line x1="536.80" y1="311.10" x2="716.80" y2="473.60" stroke="#fbbf24" stroke-width="4" marker-end="url(#ray-arrow)" /><line x1="716.80" y1="473.60" x2="70.00" y2="1057.52" stroke="#fbbf24" stroke-width="4" marker-end="url(#ray-arrow)" /><line x1="716.80" y1="473.60" x2="896.80" y2="311.10" stroke="#fbbf24" stroke-width="4" stroke-dasharray="10 8" /><path d="M 656.80 473.60 A 60.00 60.00 0 0 1 696.28 417.22" stroke="#22c55e" stroke-width="4" fill="none" /><path d="M 705.17 441.65 A 34.00 34.00 0 0 1 716.80 439.60" stroke="#ef4444" stroke-width="4" fill="none" /><text x="572.80" y="387.60" fill="#86efac" text-anchor="start" font-size="16" font-family="Arial" font-weight="bold">70 deg to Guide Line</text><text x="548.80" y="537.60" fill="#fca5a5" text-anchor="start" font-size="16" font-family="Arial" font-weight="bold">20 deg to surface</text><text x="744.80" y="577.60" fill="#cbd5e1" text-anchor="start" font-size="15" font-family="Arial" font-weight="normal">surface + Guide Line = 90 deg</text></svg>