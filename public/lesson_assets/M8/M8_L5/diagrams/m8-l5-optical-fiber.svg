<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Optical fiber lock-bounce path</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Repeated total internal reflection keeps the route inside the core</text><rect x="90.00" y="190.00" width="1100.00" height="340.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="116.00" y="228.00" fill="#93c5fd" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Optical fiber lock-bounce</text><rect x="158.00" y="233.00" width="964.00" height="254.00" rx="34" fill="#1f2937" stroke="#334155" stroke-width="3" /><rect x="210.00" y="285.00" width="860.00" height="150.00" rx="28" fill="#0f766e" stroke="#67e8f9" stroke-width="4" /><text x="640.00" y="211.00" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">cladding: lower index, faster escape zone</text><text x="640.00" y="513.00" fill="#99f6e4" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">core: higher index, slower route zone</text><path d="M 244 387 L 370 327 L 530 393 L 690 327 L 850 393 L 1010 327" stroke="#fbbf24" stroke-width="7" fill="none" /><line x1="850.00" y1="393.00" x2="1010.00" y2="327.00" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" marker-end="url(#wave-arrow)" /><line x1="370.00" y1="327.00" x2="370.00" y2="259.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><line x1="530.00" y1="393.00" x2="530.00" y2="461.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><text x="370.00" y="245.00" fill="#bae6fd" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">meet boundary above critical angle</text><text x="530.00" y="483.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">bounce stays inside core</text><text x="640.00" y="560.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Repeated total internal reflection keeps the route guided down the core.</text></svg>