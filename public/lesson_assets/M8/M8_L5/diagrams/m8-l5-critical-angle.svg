<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="wave-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Escape edge and critical-angle limit</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Below the limit light escapes, at the limit it skims, above the limit it lock-bounces</text><rect x="100.00" y="180.00" width="344.00" height="380.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="126.00" y="218.00" fill="#86efac" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Below critical</text><rect x="126.00" y="250.00" width="292.00" height="70.00" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2" /><rect x="126.00" y="302.00" width="292.00" height="284.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><line x1="134.00" y1="302.00" x2="410.00" y2="302.00" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" /><line x1="272.00" y1="222.00" x2="272.00" y2="518.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><path d="M 188 476 L 272.0 302" stroke="#fbbf24" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="286.00" y="288.00" fill="#bae6fd" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">normal</text><text x="162.00" y="292.00" fill="#dbeafe" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">faster medium</text><text x="162.00" y="532.00" fill="#bbf7d0" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">slower medium</text><path d="M 272.0 302 L 358 266" stroke="#34d399" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="272.00" y="492.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">incident &lt; critical angle</text><text x="272.00" y="520.00" fill="#cbd5e1" text-anchor="middle" font-size="17" font-family="Arial" font-weight="normal">escape: refracted route leaves the slower medium</text><rect x="468.00" y="180.00" width="344.00" height="380.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="494.00" y="218.00" fill="#fbbf24" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">At critical</text><rect x="494.00" y="250.00" width="292.00" height="70.00" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2" /><rect x="494.00" y="302.00" width="292.00" height="284.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><line x1="502.00" y1="302.00" x2="778.00" y2="302.00" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" /><line x1="640.00" y1="222.00" x2="640.00" y2="518.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><path d="M 556 476 L 640.0 302" stroke="#fbbf24" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="654.00" y="288.00" fill="#bae6fd" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">normal</text><text x="530.00" y="292.00" fill="#dbeafe" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">faster medium</text><text x="530.00" y="532.00" fill="#bbf7d0" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">slower medium</text><path d="M 640.0 302 L 772 302" stroke="#34d399" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="640.00" y="492.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">incident = critical angle</text><text x="640.00" y="520.00" fill="#cbd5e1" text-anchor="middle" font-size="17" font-family="Arial" font-weight="normal">skim: refracted route runs along the boundary</text><rect x="836.00" y="180.00" width="344.00" height="380.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="862.00" y="218.00" fill="#fda4af" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Above critical</text><rect x="862.00" y="250.00" width="292.00" height="70.00" rx="18" fill="#1f2937" stroke="#334155" stroke-width="2" /><rect x="862.00" y="302.00" width="292.00" height="284.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><line x1="870.00" y1="302.00" x2="1146.00" y2="302.00" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" /><line x1="1008.00" y1="222.00" x2="1008.00" y2="518.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><path d="M 924 476 L 1008.0 302" stroke="#fbbf24" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="1022.00" y="288.00" fill="#bae6fd" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">normal</text><text x="898.00" y="292.00" fill="#dbeafe" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">faster medium</text><text x="898.00" y="532.00" fill="#bbf7d0" text-anchor="start" font-size="16" font-family="Arial" font-weight="normal">slower medium</text><path d="M 1008.0 302 L 1092 476" stroke="#34d399" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="1008.00" y="492.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">incident &gt; critical angle</text><text x="1008.00" y="520.00" fill="#cbd5e1" text-anchor="middle" font-size="17" font-family="Arial" font-weight="normal">lock-bounce: no refracted route escapes</text></svg>