<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Bend Gate boundary turn</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Toward the Guide Line in a slower zone, away from it in a faster zone</text><rect x="90.00" y="180.00" width="1100.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="116.00" y="218.00" fill="#86efac" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Refraction in a new medium</text><rect x="130.00" y="230.00" width="560.00" height="260.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><rect x="690.00" y="230.00" width="410.00" height="260.00" rx="18" fill="#102a43" stroke="#334155" stroke-width="2" /><line x1="690.00" y1="240.00" x2="690.00" y2="500.00" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" /><line x1="510.00" y1="360.00" x2="870.00" y2="360.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><path d="M 320 250 L 690 360" stroke="#fbbf24" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><path d="M 690 360 L 1010 430" stroke="#34d399" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="330.00" y="220.00" fill="#bfdbfe" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">medium 1: faster</text><text x="1010.00" y="220.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">medium 2: slower</text><text x="930.00" y="470.00" fill="#86efac" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">lambda shorter</text><text x="640.00" y="560.00" fill="#cbd5e1" text-anchor="middle" font-size="21" font-family="Arial" font-weight="normal">Frequency stays source-set while speed and wavelength change in the new medium.</text></svg>