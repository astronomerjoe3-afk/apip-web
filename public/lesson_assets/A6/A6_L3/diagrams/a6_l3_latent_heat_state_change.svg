<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <rect x="70" y="56" width="180" height="40" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2"/><text x="160" y="82" fill="#7c2d12" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="160" dy="0">A6 lesson board</tspan></text>
  <text x="70" y="144" fill="#0f172a" font-size="35" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="70" dy="0">A flat temperature meter can still</tspan><tspan x="70" dy="43">hide an active state-change payment</tspan></text>
  <text x="70" y="202" fill="#475569" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="70" dy="0">The state-change board keeps a flat temperature line beside the growing energy payment so</tspan><tspan x="70" dy="31">learners stop treating a plateau as zero transfer.</tspan></text>
  <rect x="70" y="242" width="740" height="518" rx="36" fill="#ffffff" stroke="#f97316" stroke-width="2"/><rect x="106" y="284" width="668" height="94" rx="28" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="440" y="322" fill="#7c2d12" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Latent Heat and Change of State</tspan></text><rect x="118" y="400" width="160" height="136" rx="28" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="198" y="436" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">Latent heat</tspan><tspan x="198" dy="23">changes state</tspan><tspan x="198" dy="23">without changing</tspan><tspan x="198" dy="23">temperature.</tspan></text><rect x="326" y="400" width="160" height="136" rx="28" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="406" y="436" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">The energy goes</tspan><tspan x="406" dy="23">into particle</tspan><tspan x="406" dy="23">rearrangement.</tspan></text><rect x="534" y="400" width="160" height="136" rx="28" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="614" y="436" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">A heating plateau</tspan><tspan x="614" dy="23">can still mean</tspan><tspan x="614" dy="23">energy is</tspan><tspan x="614" dy="23">entering.</tspan></text><line x1="280" y1="468" x2="314" y2="468" stroke="#f97316" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="468" x2="522" y2="468" stroke="#f97316" stroke-width="8" stroke-linecap="round"/><rect x="106" y="566" width="668" height="156" rx="28" fill="#f8fafc" stroke="#f97316" stroke-width="2"/><text x="136" y="602" fill="#7c2d12" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="638" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Watch one temperature plateau while the energy bar keeps</tspan><tspan x="136" dy="31">growing. That is the key contradiction this lesson</tspan><tspan x="136" dy="31">resolves.</tspan></text>
  <rect x="860" y="280" width="470" height="96" rx="24" fill="#ffffff" stroke="#f97316" stroke-width="2"/><text x="890" y="308" fill="#7c2d12" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="338" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Latent heat changes state</tspan><tspan x="890" dy="29">without changing temperature.</tspan></text><rect x="860" y="404" width="470" height="96" rx="24" fill="#ffffff" stroke="#f97316" stroke-width="2"/><text x="890" y="432" fill="#7c2d12" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="462" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">The energy goes into particle</tspan><tspan x="890" dy="29">rearrangement.</tspan></text><rect x="860" y="528" width="470" height="96" rx="24" fill="#ffffff" stroke="#f97316" stroke-width="2"/><text x="890" y="556" fill="#7c2d12" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="586" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">A heating plateau can still mean</tspan><tspan x="890" dy="29">energy is entering.</tspan></text>
  <rect x="860" y="652" width="470" height="108" rx="28" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
  <text x="890" y="686" fill="#7c2d12" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="720" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Latent heat is the state-change payment, so constant temperature</tspan><tspan x="890" dy="31">does not mean zero energy transfer.</tspan></text>
</svg>