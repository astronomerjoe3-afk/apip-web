  </text>

  <rect x="878" y="308" width="118" height="170" rx="24" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <rect x="1000" y="308" width="118" height="170" rx="24" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <rect x="1122" y="308" width="118" height="170" rx="24" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>

  <circle cx="914" cy="344" r="14" fill="#f97316"/><circle cx="956" cy="344" r="14" fill="#f97316"/><circle cx="935" cy="382" r="14" fill="#f97316"/>
  <circle cx="914" cy="420" r="14" fill="#f97316"/><circle cx="956" cy="420" r="14" fill="#f97316"/><circle cx="935" cy="458" r="14" fill="#f97316"/>

  <circle cx="1034" cy="344" r="14" fill="#f97316"/><circle cx="1080" cy="350" r="14" fill="#f97316"/><circle cx="1050" cy="392" r="14" fill="#f97316"/>
  <circle cx="1092" cy="410" r="14" fill="#f97316"/><circle cx="1028" cy="448" r="14" fill="#f97316"/><circle cx="1074" cy="458" r="14" fill="#f97316"/>

  <circle cx="1146" cy="332" r="14" fill="#f97316"/><circle cx="1220" cy="346" r="14" fill="#f97316"/><circle cx="1178" cy="388" r="14" fill="#f97316"/>
  <circle cx="1148" cy="446" r="14" fill="#f97316"/><circle cx="1216" cy="456" r="14" fill="#f97316"/>

  <text x="937" y="510" fill="#7c2d12" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">solid</text>
  <text x="1059" y="510" fill="#7c2d12" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">plateau stage</text>
  <text x="1181" y="510" fill="#7c2d12" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">new state</text>

  <text x="1055" y="584" fill="#334155" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
