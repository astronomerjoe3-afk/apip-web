<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#fffaf5"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>

  <text x="700" y="96" fill="#7c2d12" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Latent Heat Pays for Rearrangement During a Plateau
  </text>
  <text x="700" y="140" fill="#9a3412" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    A flat temperature reading does not mean the heating stopped. During a state change, energy is still entering.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>

  <rect x="124" y="224" width="668" height="490" rx="30" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <text x="458" y="266" fill="#7c2d12" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Heating curve and energy input
  </text>

  <line x1="196" y1="626" x2="724" y2="626" stroke="#7c2d12" stroke-width="4"/>
  <line x1="196" y1="338" x2="196" y2="626" stroke="#7c2d12" stroke-width="4"/>
  <text x="732" y="634" fill="#7c2d12" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">energy in</text>
  <text x="134" y="346" fill="#7c2d12" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">temp</text>

  <path d="M228 586 L350 468 L510 468 L670 342" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="298" y="434" fill="#9a3412" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">warming</text>
  <text x="430" y="446" fill="#9a3412" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">plateau</text>
  <text x="610" y="318" fill="#9a3412" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">new state warming</text>

  <rect x="250" y="654" width="324" height="26" rx="13" fill="#f97316"/>
  <text x="412" y="672" fill="#fff7ed" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    plateau still means energy in
  </text>

  <rect x="834" y="224" width="442" height="490" rx="30" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <text x="1055" y="266" fill="#7c2d12" font-size="29" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
