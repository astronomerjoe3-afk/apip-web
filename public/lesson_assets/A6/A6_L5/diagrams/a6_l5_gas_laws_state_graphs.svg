<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#fffaf5"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>

  <text x="700" y="96" fill="#7c2d12" font-size="38" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Gas-Law Graphs Need the Fixed Quantity Named
  </text>
  <text x="700" y="140" fill="#9a3412" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    A curve or straight line is not enough by itself. You have to state what stays fixed while the other variables change.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#fb923c" stroke-width="3"/>

  <rect x="122" y="228" width="350" height="470" rx="30" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <rect x="526" y="228" width="350" height="470" rx="30" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
  <rect x="930" y="228" width="350" height="470" rx="30" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>

  <text x="297" y="268" fill="#7c2d12" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Isothermal</text>
  <text x="701" y="268" fill="#7c2d12" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Isobaric</text>
  <text x="1105" y="268" fill="#7c2d12" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Isochoric</text>

  <text x="297" y="300" fill="#334155" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">T fixed</text>
  <text x="701" y="300" fill="#334155" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">p fixed</text>
  <text x="1105" y="300" fill="#334155" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">V fixed</text>

  <line x1="188" y1="598" x2="404" y2="598" stroke="#7c2d12" stroke-width="4"/>
  <line x1="188" y1="354" x2="188" y2="598" stroke="#7c2d12" stroke-width="4"/>
  <text x="412" y="606" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">V</text>
  <text x="174" y="346" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">p</text>
  <path d="M220 570 C254 488, 292 438, 364 382" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="297" y="640" fill="#334155" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    p falls as V rises at fixed T
  </text>

  <line x1="592" y1="598" x2="808" y2="598" stroke="#7c2d12" stroke-width="4"/>
  <line x1="592" y1="354" x2="592" y2="598" stroke="#7c2d12" stroke-width="4"/>
  <text x="816" y="606" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">T</text>
  <text x="578" y="346" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">V</text>
  <path d="M620 568 L782 398" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="701" y="640" fill="#334155" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    V rises linearly with T at fixed p
  </text>

  <line x1="996" y1="598" x2="1212" y2="598" stroke="#7c2d12" stroke-width="4"/>
  <line x1="996" y1="354" x2="996" y2="598" stroke="#7c2d12" stroke-width="4"/>
  <text x="1220" y="606" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">T</text>
  <text x="982" y="346" fill="#7c2d12" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">p</text>
  <path d="M1024 570 L1186 392" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <text x="1105" y="640" fill="#334155" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    p rises linearly with T at fixed V
  </text>

  <text x="700" y="734" fill="#7c2d12" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    Name the fixed quantity first. That one habit keeps gas-law graphs tied to the chamber story.
  </text>
</svg>
