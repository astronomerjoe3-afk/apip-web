  <text x="392" y="430" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">field across gap</text>

  <rect x="338" y="364" width="156" height="176" rx="10" fill="none" stroke="#0ea5e9" stroke-width="7" transform="rotate(-24 416 452)"/>
  <circle cx="416" cy="452" r="12" fill="#1d4ed8"/>
  <path d="M498 338 C558 356, 592 402, 604 458" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
