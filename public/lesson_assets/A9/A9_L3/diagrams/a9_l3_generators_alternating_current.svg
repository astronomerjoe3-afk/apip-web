<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <rect x="70" y="56" width="180" height="40" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="160" y="82" fill="#115e59" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="160" dy="0">A9 lesson board</tspan></text>
  <text x="70" y="144" fill="#0f172a" font-size="35" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="70" dy="0">Repeated flux change turns rotation</tspan><tspan x="70" dy="43">into an alternating emf</tspan></text>
  <text x="70" y="202" fill="#475569" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="70" dy="0">The generator board keeps coil rotation, changing flux linkage, and the alternating output</tspan><tspan x="70" dy="31">trace on one frame so a.c. is seen as periodic induction.</tspan></text>
  <rect x="70" y="242" width="740" height="518" rx="36" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="106" y="284" width="668" height="94" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="440" y="322" fill="#115e59" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Generators and Alternating Current</tspan></text><rect x="118" y="400" width="160" height="136" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="198" y="436" fill="#115e59" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">A rotating coil</tspan><tspan x="198" dy="23">changes its flux</tspan><tspan x="198" dy="23">linkage</tspan><tspan x="198" dy="23">continuously.</tspan></text><rect x="326" y="400" width="160" height="136" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="406" y="436" fill="#115e59" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">That changing flux</tspan><tspan x="406" dy="23">induces an emf.</tspan></text><rect x="534" y="400" width="160" height="136" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="614" y="436" fill="#115e59" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">The output</tspan><tspan x="614" dy="23">alternates because</tspan><tspan x="614" dy="23">the coil</tspan><tspan x="614" dy="23">orientation keeps</tspan><tspan x="614" dy="23">reversing.</tspan></text><line x1="280" y1="468" x2="314" y2="468" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="468" x2="522" y2="468" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/><rect x="106" y="566" width="668" height="156" rx="28" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text x="136" y="602" fill="#115e59" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="638" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Follow one full turn first. The sign change in the emf</tspan><tspan x="136" dy="31">only makes sense when the orientation reversal is visible.</tspan></text>
  <rect x="860" y="280" width="470" height="96" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="890" y="308" fill="#115e59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="338" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">A rotating coil changes its flux</tspan><tspan x="890" dy="29">linkage continuously.</tspan></text><rect x="860" y="404" width="470" height="96" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="890" y="432" fill="#115e59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="462" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">That changing flux induces an</tspan><tspan x="890" dy="29">emf.</tspan></text><rect x="860" y="528" width="470" height="96" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="890" y="556" fill="#115e59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="586" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">The output alternates because</tspan><tspan x="890" dy="29">the coil orientation keeps</tspan><tspan x="890" dy="29">reversing.</tspan></text>
  <rect x="860" y="652" width="470" height="108" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="890" y="686" fill="#115e59" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="720" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">An alternating-current generator turns continuous flux change</tspan><tspan x="890" dy="31">from rotation into an alternating emf.</tspan></text>
</svg>