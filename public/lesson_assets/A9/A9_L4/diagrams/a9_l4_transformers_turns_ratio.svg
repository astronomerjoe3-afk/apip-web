<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>

  <text x="700" y="96" fill="#c2410c" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Transformers Share a Changing Flux Through the Core
  </text>
  <text x="700" y="140" fill="#9a3412" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Alternating current in the primary changes the core flux, and that changing flux induces voltage in the secondary.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <rect x="126" y="226" width="724" height="486" rx="30" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5"/>
  <rect x="882" y="226" width="392" height="486" rx="30" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5"/>

  <text x="488" y="268" fill="#c2410c" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Linked coils and core
  </text>
  <text x="1078" y="268" fill="#c2410c" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Turns ratio idea
  </text>

  <rect x="366" y="320" width="246" height="300" rx="24" fill="none" stroke="#9a3412" stroke-width="18"/>
  <path d="M258 360 C292 360, 292 430, 258 430 C224 430, 224 500, 258 500 C292 500, 292 570, 258 570" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <path d="M720 360 C686 360, 686 430, 720 430 C754 430, 754 500, 720 500 C686 500, 686 570, 720 570" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <line x1="236" y1="464" x2="178" y2="464" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
  <line x1="742" y1="464" x2="800" y2="464" stroke="#10b981" stroke-width="8" stroke-linecap="round"/>
  <text x="220" y="334" fill="#1e40af" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">primary coil</text>
  <text x="694" y="334" fill="#047857" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">secondary coil</text>
  <path d="M416 468 C472 432, 526 432, 562 468" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="562,468 534,452 534,484" fill="#f97316"/>
  <text x="488" y="430" fill="#c2410c" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">changing core flux</text>
  <text x="488" y="650" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    No changing flux: no transformer action.
  </text>

  <rect x="930" y="334" width="296" height="126" rx="24" fill="#ffffff" stroke="#fb923c" stroke-width="2.5"/>
  <text x="1078" y="374" fill="#c2410c" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Vp / Vs = Np / Ns
  </text>
  <text x="1078" y="410" fill="#9a3412" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <tspan x="1078" dy="0">more turns means</tspan>
    <tspan x="1078" dy="24">more induced voltage</tspan>
  </text>

  <rect x="930" y="484" width="296" height="164" rx="24" fill="#ffffff" stroke="#fb923c" stroke-width="2.5"/>
  <text x="1078" y="528" fill="#c2410c" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Example
  </text>
  <text x="1078" y="566" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    Np = 200, Ns = 600
  </text>
  <text x="1078" y="602" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    step-up by factor 3
  </text>
  <text x="1078" y="620" fill="#9a3412" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <tspan x="1078" dy="0">equal turns gives</tspan>
    <tspan x="1078" dy="18">equal voltage ratio</tspan>
  </text>
</svg>
