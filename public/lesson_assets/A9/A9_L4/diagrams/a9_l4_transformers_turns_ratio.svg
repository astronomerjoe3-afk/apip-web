<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <rect x="70" y="90" width="740" height="518" rx="36" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><rect x="106" y="132" width="668" height="94" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="440" y="170" fill="#115e59" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Transformers and Turns Ratio</tspan></text><rect x="118" y="248" width="160" height="136" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="198" y="284" fill="#115e59" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">Transformers need</tspan><tspan x="198" dy="23">changing current</tspan><tspan x="198" dy="23">in the primary.</tspan></text><rect x="326" y="248" width="160" height="136" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="406" y="284" fill="#115e59" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">The shared core</tspan><tspan x="406" dy="23">carries changing</tspan><tspan x="406" dy="23">magnetic flux.</tspan></text><rect x="534" y="248" width="160" height="136" rx="28" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text x="614" y="284" fill="#115e59" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">Voltage ratio</tspan><tspan x="614" dy="23">follows the turns</tspan><tspan x="614" dy="23">ratio.</tspan></text><line x1="280" y1="316" x2="314" y2="316" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="316" x2="522" y2="316" stroke="#0f766e" stroke-width="8" stroke-linecap="round"/><rect x="106" y="414" width="668" height="156" rx="28" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text x="136" y="450" fill="#115e59" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="486" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Use equal turns as the first case so the turns-ratio</tspan><tspan x="136" dy="31">effect has a clean reference point.</tspan></text>
  <rect x="860" y="128" width="470" height="96" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="890" y="156" fill="#115e59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="186" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Transformers need changing</tspan><tspan x="890" dy="29">current in the primary.</tspan></text><rect x="860" y="252" width="470" height="96" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="890" y="280" fill="#115e59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="310" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">The shared core carries changing</tspan><tspan x="890" dy="29">magnetic flux.</tspan></text><rect x="860" y="376" width="470" height="96" rx="24" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text x="890" y="404" fill="#115e59" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="434" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Voltage ratio follows the turns</tspan><tspan x="890" dy="29">ratio.</tspan></text>
  <rect x="860" y="500" width="470" height="108" rx="28" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="890" y="534" fill="#115e59" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="568" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">A transformer is a changing-flux bridge, and its voltage ratio</tspan><tspan x="890" dy="31">follows the turns ratio.</tspan></text>
</svg>