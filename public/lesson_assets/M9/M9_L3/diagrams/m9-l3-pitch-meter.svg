<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-l3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#f4f1ff" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-l3)" />
  <text x="88" y="88" fill="#0f172a" font-size="34" font-family="Arial, sans-serif" font-weight="700">Pitch follows frequency, not loudness</text>
  <text x="88" y="128" fill="#475569" font-size="20" font-family="Arial, sans-serif">In the same air, changing frequency mainly changes wavelength. Loudness answers a different question.</text>

  <rect x="76" y="176" width="1128" height="420" rx="30" fill="#ffffff" stroke="#c4b5fd" stroke-width="4" />

  <rect x="110" y="222" width="286" height="320" rx="26" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="140" y="266" fill="#4338ca" font-size="24" font-family="Arial, sans-serif" font-weight="700">Frequency meter</text>
  <text x="140" y="302" fill="#475569" font-size="17" font-family="Arial, sans-serif">340 Hz</text>
  <path d="M160 388 C190 330 230 446 260 388 C290 330 330 446 360 388" fill="none" stroke="#2563eb" stroke-width="6" />
  <text x="140" y="474" fill="#475569" font-size="17" font-family="Arial, sans-serif">longer wavelength</text>

  <rect x="436" y="222" width="286" height="320" rx="26" fill="#eef2ff" stroke="#c7d2fe" />
  <text x="466" y="266" fill="#4338ca" font-size="24" font-family="Arial, sans-serif" font-weight="700">Higher Ping Rate</text>
  <text x="466" y="302" fill="#475569" font-size="17" font-family="Arial, sans-serif">680 Hz</text>
  <path d="M486 388 C501 348 516 428 531 388 C546 348 561 428 576 388 C591 348 606 428 621 388 C636 348 651 428 666 388" fill="none" stroke="#2563eb" stroke-width="6" />
  <text x="466" y="474" fill="#475569" font-size="17" font-family="Arial, sans-serif">shorter wavelength</text>

  <rect x="762" y="222" width="408" height="320" rx="26" fill="#faf5ff" stroke="#ddd6fe" />
  <text x="792" y="266" fill="#6d28d9" font-size="24" font-family="Arial, sans-serif" font-weight="700">Keep these separate</text>
  <rect x="796" y="312" width="144" height="160" rx="24" fill="#ede9fe" />
  <text x="868" y="352" fill="#5b21b6" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Pitch</text>
  <text x="868" y="392" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">comes from</text>
  <text x="868" y="428" fill="#5b21b6" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" font-weight="700">frequency</text>
  <rect x="972" y="312" width="144" height="160" rx="24" fill="#dcfce7" />
  <text x="1044" y="352" fill="#047857" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Loudness</text>
  <text x="1044" y="392" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">tracks sound</text>
  <text x="1044" y="428" fill="#047857" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" font-weight="700">strength</text>

  <rect x="76" y="626" width="1128" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="108" y="662" fill="#0f172a" font-size="18" font-family="Arial, sans-serif" font-weight="700">Physics read:</text>
  <text x="238" y="662" fill="#475569" font-size="18" font-family="Arial, sans-serif">v = fλ, so with the same sound speed a higher f gives a shorter λ.</text>
</svg>
