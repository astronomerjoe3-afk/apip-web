<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="wave-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Flow tracker</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows how approaching and receding flow change the returned frequency.</text><rect x="90.00" y="180.00" width="500.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="116.00" y="218.00" fill="#86efac" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Toward the probe</text><rect x="160.00" y="320.00" width="90.00" height="90.00" rx="18" fill="#1d4ed8" /><circle cx="420.00" cy="360.00" r="34.00" fill="#0f172a" stroke="#e2e8f0" stroke-width="4" /><line x1="370.00" y1="360.00" x2="300.00" y2="360.00" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" marker-end="url(#wave-arrow)" /><text x="420.00" y="308.00" fill="#bbf7d0" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">3.002 MHz return</text><text x="340.00" y="452.00" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">higher returned frequency</text><rect x="690.00" y="180.00" width="500.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="716.00" y="218.00" fill="#fda4af" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Away from the probe</text><rect x="760.00" y="320.00" width="90.00" height="90.00" rx="18" fill="#1d4ed8" /><circle cx="1020.00" cy="360.00" r="34.00" fill="#0f172a" stroke="#e2e8f0" stroke-width="4" /><line x1="920.00" y1="360.00" x2="980.00" y2="360.00" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" marker-end="url(#wave-arrow)" /><text x="1020.00" y="308.00" fill="#fecdd3" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">2.998 MHz return</text><text x="940.00" y="452.00" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">lower returned frequency</text></svg>