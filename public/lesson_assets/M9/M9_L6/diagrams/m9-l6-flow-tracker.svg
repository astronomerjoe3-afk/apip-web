<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-l6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#fff6f8" />
    </linearGradient>
    <marker id="l6-arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#2563eb" />
    </marker>
    <marker id="l6-arrow-rose" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#e11d48" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-l6)" />
  <text x="88" y="88" fill="#0f172a" font-size="34" font-family="Arial, sans-serif" font-weight="700">Doppler compares returned frequency with transmitted frequency</text>
  <text x="88" y="128" fill="#475569" font-size="20" font-family="Arial, sans-serif">Read the shift sign first. A higher return points toward the probe; a lower return points away.</text>

  <rect x="76" y="176" width="530" height="420" rx="30" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />
  <text x="112" y="220" fill="#1d4ed8" font-size="26" font-family="Arial, sans-serif" font-weight="700">Toward the probe</text>
  <rect x="132" y="324" width="76" height="138" rx="22" fill="#2563eb" />
  <text x="170" y="492" fill="#1d4ed8" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">probe</text>
  <ellipse cx="454" cy="392" rx="64" ry="42" fill="#dbeafe" stroke="#60a5fa" stroke-width="4" />
  <line x1="208" y1="392" x2="378" y2="392" stroke="#2563eb" stroke-width="8" marker-end="url(#l6-arrow-blue)" />
  <line x1="382" y1="430" x2="208" y2="468" stroke="#0f766e" stroke-width="8" stroke-dasharray="12 10" marker-end="url(#l6-arrow-blue)" />
  <text x="420" y="320" fill="#166534" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700">return: 3.002 MHz</text>
  <text x="420" y="520" fill="#475569" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">higher than 3.000 MHz sent pulse</text>

  <rect x="674" y="176" width="530" height="420" rx="30" fill="#ffffff" stroke="#fda4af" stroke-width="4" />
  <text x="710" y="220" fill="#e11d48" font-size="26" font-family="Arial, sans-serif" font-weight="700">Away from the probe</text>
  <rect x="730" y="324" width="76" height="138" rx="22" fill="#2563eb" />
  <text x="768" y="492" fill="#1d4ed8" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">probe</text>
  <ellipse cx="1052" cy="392" rx="64" ry="42" fill="#ffe4e6" stroke="#fb7185" stroke-width="4" />
  <line x1="806" y1="392" x2="976" y2="392" stroke="#2563eb" stroke-width="8" marker-end="url(#l6-arrow-blue)" />
  <line x1="980" y1="430" x2="806" y2="468" stroke="#e11d48" stroke-width="8" stroke-dasharray="12 10" marker-end="url(#l6-arrow-rose)" />
  <text x="1018" y="320" fill="#be123c" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" font-weight="700">return: 2.998 MHz</text>
  <text x="1018" y="520" fill="#475569" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">lower than 3.000 MHz sent pulse</text>

  <rect x="344" y="614" width="592" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="640" y="650" fill="#0f172a" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">Physics read: compare f_return with f_sent before naming the motion.</text>
</svg>
