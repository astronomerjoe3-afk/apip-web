<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-l4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fbff" />
      <stop offset="100%" stop-color="#f5f3ff" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-l4)" />
  <text x="88" y="88" fill="#0f172a" font-size="34" font-family="Arial, sans-serif" font-weight="700">Audible sound and ultrasound share one wave family</text>
  <text x="88" y="128" fill="#475569" font-size="20" font-family="Arial, sans-serif">The classification changes at about 20 kHz. The wave remains sound on both sides of the boundary.</text>

  <rect x="76" y="176" width="1128" height="420" rx="30" fill="#ffffff" stroke="#c4b5fd" stroke-width="4" />
  <text x="112" y="220" fill="#6d28d9" font-size="26" font-family="Arial, sans-serif" font-weight="700">Hear Zone to Super-Scout scale</text>

  <line x1="150" y1="384" x2="1110" y2="384" stroke="#475569" stroke-width="8" stroke-linecap="round" />
  <rect x="150" y="346" width="454" height="76" rx="24" fill="#bfdbfe" />
  <rect x="604" y="346" width="506" height="76" rx="24" fill="#ddd6fe" />
  <line x1="604" y1="310" x2="604" y2="460" stroke="#0f172a" stroke-width="4" stroke-dasharray="10 10" />
  <text x="377" y="334" fill="#1d4ed8" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">audible range</text>
  <text x="856" y="334" fill="#6d28d9" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">ultrasound</text>
  <text x="604" y="494" fill="#475569" text-anchor="middle" font-size="18" font-family="Arial, sans-serif">about 20 kHz boundary</text>

  <circle cx="366" cy="384" r="16" fill="#2563eb" />
  <text x="366" y="536" fill="#1d4ed8" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">5 kHz</text>
  <text x="366" y="562" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">still inside hearing range</text>

  <circle cx="746" cy="384" r="16" fill="#7c3aed" />
  <text x="746" y="536" fill="#6d28d9" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">40 kHz</text>
  <text x="746" y="562" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">ultrasound</text>

  <circle cx="1000" cy="384" r="16" fill="#7c3aed" />
  <text x="1000" y="536" fill="#6d28d9" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">3 MHz</text>
  <text x="1000" y="562" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">medical probe range</text>

  <rect x="158" y="248" width="252" height="62" rx="18" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="284" y="286" fill="#1d4ed8" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">still sound in a medium</text>
  <rect x="866" y="248" width="262" height="62" rx="18" fill="#f5f3ff" stroke="#c4b5fd" />
  <text x="997" y="286" fill="#6d28d9" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">can still reflect from boundaries</text>

  <rect x="76" y="626" width="1128" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="108" y="662" fill="#0f172a" font-size="18" font-family="Arial, sans-serif" font-weight="700">Physics read:</text>
  <text x="238" y="662" fill="#475569" font-size="18" font-family="Arial, sans-serif">Ultrasound = sound above the normal upper hearing limit, not a new wave type.</text>
</svg>
