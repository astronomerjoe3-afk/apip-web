<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="wave-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Hear Zone scale</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows audible and ultrasound bands on one frequency line.</text><rect x="90.00" y="200.00" width="1100.00" height="320.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="116.00" y="238.00" fill="#93c5fd" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Audible range and ultrasound</text><line x1="160.00" y1="380.00" x2="1120.00" y2="380.00" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" /><rect x="160.00" y="354.00" width="700.00" height="52.00" rx="18" fill="#1d4ed8" /><rect x="860.00" y="354.00" width="260.00" height="52.00" rx="18" fill="#166534" /><text x="510.00" y="388.00" fill="#dbeafe" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">about 20 Hz to 20 kHz</text><text x="990.00" y="388.00" fill="#dcfce7" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">ultrasound</text><line x1="860.00" y1="310.00" x2="860.00" y2="450.00" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" /><text x="860.00" y="294.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">20 kHz boundary</text><text x="640.00" y="500.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Ultrasound is still sound. It simply sits above the usual hearing range.</text></svg>