<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg-l1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef4ff" />
    </linearGradient>
    <marker id="l1-arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#2563eb" />
    </marker>
    <marker id="l1-arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#0f766e" />
    </marker>
  </defs>
  <rect width="1280" height="720" fill="url(#bg-l1)" />
  <text x="92" y="88" fill="#0f172a" font-size="34" font-family="Arial, sans-serif" font-weight="700">Sound starts with a vibrating source</text>
  <text x="92" y="128" fill="#475569" font-size="20" font-family="Arial, sans-serif">The beacon launches the disturbance. The nearby air only begins the squeeze-release relay.</text>

  <rect x="74" y="172" width="324" height="424" rx="28" fill="#ffffff" stroke="#93c5fd" stroke-width="4" />
  <text x="104" y="218" fill="#1d4ed8" font-size="26" font-family="Arial, sans-serif" font-weight="700">1. Source job</text>
  <text x="104" y="248" fill="#475569" font-size="18" font-family="Arial, sans-serif">The Scout Beacon must oscillate first.</text>
  <rect x="168" y="308" width="84" height="170" rx="22" fill="#2563eb" />
  <line x1="142" y1="332" x2="142" y2="454" stroke="#f59e0b" stroke-width="5" marker-end="url(#l1-arrow-blue)" />
  <line x1="278" y1="454" x2="278" y2="332" stroke="#f59e0b" stroke-width="5" marker-end="url(#l1-arrow-blue)" />
  <text x="210" y="510" fill="#1d4ed8" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">vibrating beacon</text>
  <text x="210" y="538" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">300 oscillations each second</text>
  <rect x="102" y="558" width="268" height="74" rx="18" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="120" y="590" fill="#0f172a" font-size="17" font-family="Arial, sans-serif" font-weight="700">Key rule</text>
  <text x="120" y="616" fill="#475569" font-size="16" font-family="Arial, sans-serif">No wiggle, no new sound launch.</text>

  <rect x="430" y="172" width="776" height="424" rx="28" fill="#ffffff" stroke="#c7d2fe" stroke-width="4" />
  <text x="462" y="218" fill="#4338ca" font-size="26" font-family="Arial, sans-serif" font-weight="700">2. Medium job</text>
  <text x="462" y="248" fill="#475569" font-size="18" font-family="Arial, sans-serif">Compressions and rarefactions travel onward while particles stay local.</text>

  <rect x="498" y="290" width="108" height="198" rx="26" fill="#dbeafe" />
  <rect x="514" y="290" width="22" height="198" rx="11" fill="#60a5fa" />
  <rect x="542" y="290" width="22" height="198" rx="11" fill="#60a5fa" />
  <rect x="570" y="322" width="18" height="134" rx="9" fill="#cbd5e1" />
  <text x="552" y="264" fill="#1d4ed8" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">compression</text>

  <g fill="#94a3b8">
    <circle cx="700" cy="388" r="11" />
    <circle cx="754" cy="388" r="11" />
    <circle cx="808" cy="388" r="11" />
  </g>
  <text x="754" y="264" fill="#64748b" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">rarefaction</text>

  <rect x="914" y="290" width="108" height="198" rx="26" fill="#dcfce7" />
  <rect x="932" y="290" width="22" height="198" rx="11" fill="#10b981" />
  <rect x="960" y="290" width="22" height="198" rx="11" fill="#10b981" />
  <rect x="988" y="322" width="18" height="134" rx="9" fill="#bbf7d0" />
  <text x="968" y="264" fill="#047857" text-anchor="middle" font-size="18" font-family="Arial, sans-serif" font-weight="700">next compression</text>

  <line x1="632" y1="520" x2="1058" y2="520" stroke="#0f766e" stroke-width="6" marker-end="url(#l1-arrow-green)" />
  <text x="848" y="552" fill="#0f766e" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" font-weight="700">pressure pattern travels outward</text>
  <text x="848" y="580" fill="#475569" text-anchor="middle" font-size="16" font-family="Arial, sans-serif">The pattern moves to the listener; the air is not fired across the room.</text>

  <rect x="74" y="628" width="1132" height="56" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="104" y="663" fill="#0f172a" font-size="18" font-family="Arial, sans-serif" font-weight="700">Physics read:</text>
  <text x="232" y="663" fill="#475569" font-size="18" font-family="Arial, sans-serif">source frequency = sound frequency; source launches, medium relays.</text>
</svg>
