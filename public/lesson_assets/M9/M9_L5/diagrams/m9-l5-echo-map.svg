  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Echo map</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows a pulse leaving the probe, reflecting from a boundary, and returning to build a depth clue.</text><rect x="90.00" y="180.00" width="1100.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="116.00" y="218.00" fill="#93c5fd" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Pulse echo imaging</text><rect x="180.00" y="300.00" width="80.00" height="160.00" rx="18" fill="#1d4ed8" /><text x="220.00" y="500.00" fill="#dbeafe" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">probe</text><line x1="260.00" y1="370.00" x2="930.00" y2="370.00" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" marker-end="url(#wave-arrow)" /><line x1="930.00" y1="420.00" x2="260.00" y2="420.00" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#wave-arrow)" /><line x1="930.00" y1="270.00" x2="930.00" y2="490.00" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" /><text x="930.00" y="248.00" fill="#e2e8f0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">hidden boundary</text><line x1="400.00" y1="500.00" x2="920.00" y2="500.00" stroke="#86efac" stroke-width="5" stroke-linecap="round" marker-end="url(#wave-arrow)" /><text x="575.00" y="534.00" fill="#bbf7d0" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">round trip -&gt; divide by 2 for depth</text><rect x="980.00" y="230.00" width="150.00" height="180.00" rx="22" fill="#0f172a" stroke="#475569" stroke-width="3" /><text x="1055.00" y="280.00" fill="#f8fafc" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">scan</text><line x1="1015.00" y1="335.00" x2="1095.00" y2="3