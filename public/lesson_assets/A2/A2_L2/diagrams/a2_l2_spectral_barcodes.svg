<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 19px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Each Atom Has Its Own Line Barcode</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Line positions depend on the atom's allowed level spacings, so different atoms leave different spectral fingerprints.
  </text>

  <rect x="100" y="180" width="1080" height="470" rx="34" class="card"/>
  <rect x="132" y="230" width="470" height="350" rx="28" class="panel"/>
  <rect x="678" y="230" width="470" height="350" rx="28" class="panel"/>

  <text x="366" y="270" class="label" text-anchor="middle">Atom A</text>
  <text x="912" y="270" class="label" text-anchor="middle">Atom B</text>

  <rect x="186" y="316" width="362" height="78" rx="18" fill="#020617" stroke="#334155" stroke-width="2.5"/>
  <rect x="732" y="316" width="362" height="78" rx="18" fill="#020617" stroke="#334155" stroke-width="2.5"/>
  <rect x="186" y="436" width="362" height="78" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <rect x="732" y="436" width="362" height="78" rx="18" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>

  <line x1="256" y1="328" x2="256" y2="382" stroke="#f472b6" stroke-width="8"/>
  <line x1="344" y1="328" x2="344" y2="382" stroke="#fde047" stroke-width="8"/>
  <line x1="418" y1="328" x2="418" y2="382" stroke="#38bdf8" stroke-width="8"/>
  <line x1="500" y1="328" x2="500" y2="382" stroke="#a78bfa" stroke-width="8"/>

  <line x1="792" y1="328" x2="792" y2="382" stroke="#f97316" stroke-width="8"/>
  <line x1="878" y1="328" x2="878" y2="382" stroke="#22c55e" stroke-width="8"/>
  <line x1="950" y1="328" x2="950" y2="382" stroke="#38bdf8" stroke-width="8"/>
  <line x1="1030" y1="328" x2="1030" y2="382" stroke="#e879f9" stroke-width="8"/>

  <rect x="252" y="446" width="8" height="58" fill="#111827"/>
  <rect x="340" y="446" width="8" height="58" fill="#111827"/>
  <rect x="414" y="446" width="8" height="58" fill="#111827"/>
  <rect x="496" y="446" width="8" height="58" fill="#111827"/>

  <rect x="788" y="446" width="8" height="58" fill="#111827"/>
  <rect x="874" y="446" width="8" height="58" fill="#111827"/>
  <rect x="946" y="446" width="8" height="58" fill="#111827"/>
  <rect x="1026" y="446" width="8" height="58" fill="#111827"/>

  <text x="366" y="540" class="body" text-anchor="middle">Emission lines and absorption gaps</text>
  <text x="366" y="566" class="body" text-anchor="middle">line up for the same atom.</text>
  <text x="912" y="540" class="body" text-anchor="middle">Different level gaps create</text>
  <text x="912" y="566" class="body" text-anchor="middle">a different spectral barcode.</text>
</svg>
