<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 19px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">One Gap, Two Spectrum Views</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    The same atomic gap can appear as a bright emission line or as a missing absorption line.
  </text>

  <rect x="100" y="180" width="1080" height="470" rx="34" class="card"/>
  <rect x="132" y="220" width="470" height="390" rx="28" class="panel"/>
  <rect x="678" y="220" width="470" height="390" rx="28" class="panel"/>

  <text x="210" y="258" class="label">Emission view</text>
  <text x="756" y="258" class="label">Absorption view</text>

  <g transform="translate(0,4)">
    <line x1="258" y1="320" x2="258" y2="502" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="208" y1="480" x2="308" y2="480" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
    <line x1="208" y1="388" x2="308" y2="388" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="258" cy="480" r="13" fill="#f8fafc"/>
    <line x1="258" y1="404" x2="258" y2="454" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <polygon points="258,478 243,446 273,446" fill="#22c55e"/>
    <rect x="338" y="362" width="172" height="56" rx="18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
    <line x1="372" y1="392" x2="476" y2="392" stroke="#f472b6" stroke-width="6"/>
    <line x1="404" y1="392" x2="404" y2="392" stroke="#fde047" stroke-width="6"/>
    <line x1="438" y1="392" x2="438" y2="392" stroke="#38bdf8" stroke-width="6"/>
    <text x="424" y="440" class="small" text-anchor="middle">bright emitted line</text>
    <text x="208" y="560" class="body">Electron drops down and releases one photon packet.</text>
  </g>

  <g transform="translate(0,4)">
    <line x1="804" y1="320" x2="804" y2="502" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="754" y1="480" x2="854" y2="480" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
    <line x1="754" y1="388" x2="854" y2="388" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="804" cy="388" r="13" fill="#f8fafc"/>
    <line x1="804" y1="462" x2="804" y2="414" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <polygon points="804,388 789,420 819,420" fill="#f59e0b"/>
    <rect x="884" y="362" width="172" height="56" rx="18" fill="#1e293b" stroke="#94a3b8" stroke-width="3"/>
    <line x1="918" y1="392" x2="1022" y2="392" stroke="#f8fafc" stroke-width="6"/>
    <rect x="968" y="378" width="12" height="28" fill="#111827"/>
    <text x="970" y="440" class="small" text-anchor="middle">missing color</text>
    <text x="754" y="560" class="body">Electron absorbs a packet and climbs the same gap.</text>
  </g>
</svg>
