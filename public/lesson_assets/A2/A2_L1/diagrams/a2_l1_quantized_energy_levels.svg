<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 20px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 18px Arial, Helvetica, sans-serif; }
      .pill { fill: #1e293b; stroke: #475569; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Exact Packet, Exact Jump</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Atomic electrons occupy allowed floors, so only a packet that matches a gap can move the electron.
  </text>

  <rect x="100" y="180" width="1080" height="470" rx="34" class="card"/>
  <rect x="136" y="216" width="430" height="398" rx="26" class="panel"/>
  <rect x="606" y="216" width="538" height="186" rx="26" class="panel"/>
  <rect x="606" y="428" width="538" height="186" rx="26" class="panel"/>

  <text x="170" y="254" class="label">Allowed energy ladder</text>
  <line x1="318" y1="276" x2="318" y2="556" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="232" y1="520" x2="406" y2="520" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="232" y1="434" x2="406" y2="434" stroke="#7dd3fc" stroke-width="6" stroke-linecap="round"/>
  <line x1="232" y1="348" x2="406" y2="348" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
  <line x1="220" y1="268" x2="418" y2="268" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 10"/>
  <text x="176" y="274" class="small">ionisation edge</text>
  <text x="176" y="526" class="small">ground state</text>
  <text x="176" y="440" class="small">n = 2</text>
  <text x="176" y="354" class="small">n = 3</text>

  <circle cx="318" cy="520" r="17" fill="#f8fafc"/>
  <circle cx="318" cy="520" r="7" fill="#38bdf8"/>
  <text x="344" y="526" class="body">electron starts here</text>

  <line x1="318" y1="500" x2="318" y2="366" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <polygon points="318,338 303,372 333,372" fill="#22c55e"/>

  <rect x="438" y="354" width="94" height="52" rx="16" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
  <text x="485" y="386" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    E = gap
  </text>

  <text x="636" y="254" class="label">What the picture is teaching</text>
  <circle cx="650" cy="310" r="12" fill="#22c55e"/>
  <text x="676" y="317" class="body">A packet that matches a gap lands on the next allowed floor.</text>
  <circle cx="650" cy="352" r="12" fill="#f59e0b"/>
  <text x="676" y="359" class="body">A wrong-size packet does not leave the electron halfway.</text>
  <circle cx="650" cy="394" r="12" fill="#a78bfa"/>
  <text x="676" y="401" class="body">Higher transitions still end on allowed levels, not random heights.</text>

  <text x="636" y="466" class="label">Reading habit</text>
  <rect x="636" y="492" width="188" height="42" rx="18" class="pill"/>
  <text x="730" y="520" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    packet first
  </text>
  <rect x="840" y="492" width="264" height="42" rx="18" class="pill"/>
  <text x="972" y="520" fill="#86efac" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    then the landing floor
  </text>
  <text x="636" y="566" class="body">Quantization means the atom only accepts exact jump sizes.</text>
  <text x="636" y="594" class="small">No continuous ramp, no partial landing, no in-between state.</text>
</svg>
