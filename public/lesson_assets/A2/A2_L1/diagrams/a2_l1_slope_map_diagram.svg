<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .lane { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 19px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Packet Size Sets the Destination</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Compare three packet outcomes: too small does nothing, an exact gap excites, and a larger exact gap reaches a higher level.
  </text>

  <rect x="90" y="180" width="1100" height="470" rx="34" class="card"/>
  <rect x="120" y="220" width="320" height="390" rx="26" class="lane"/>
  <rect x="480" y="220" width="320" height="390" rx="26" class="lane"/>
  <rect x="840" y="220" width="320" height="390" rx="26" class="lane"/>

  <text x="280" y="258" class="label" text-anchor="middle">Too small</text>
  <text x="640" y="258" class="label" text-anchor="middle">Exact match</text>
  <text x="1000" y="258" class="label" text-anchor="middle">Larger exact gap</text>

  <g transform="translate(0,8)">
    <line x1="280" y1="312" x2="280" y2="526" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="510" x2="340" y2="510" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="418" x2="340" y2="418" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="280" cy="510" r="14" fill="#f8fafc"/>
    <rect x="190" y="360" width="90" height="48" rx="16" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
    <text x="235" y="390" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">below gap</text>
    <text x="280" y="564" class="body" text-anchor="middle">electron stays on the ground floor</text>
  </g>

  <g transform="translate(360,8)">
    <line x1="280" y1="312" x2="280" y2="526" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="510" x2="340" y2="510" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="418" x2="340" y2="418" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <circle cx="280" cy="418" r="14" fill="#f8fafc"/>
    <line x1="280" y1="490" x2="280" y2="442" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
    <polygon points="280,416 265,448 295,448" fill="#22c55e"/>
    <rect x="190" y="360" width="90" height="48" rx="16" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
    <text x="235" y="390" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">E = gap</text>
    <text x="280" y="564" class="body" text-anchor="middle">one exact packet lifts to n = 2</text>
  </g>

  <g transform="translate(720,8)">
    <line x1="280" y1="292" x2="280" y2="526" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="510" x2="340" y2="510" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="418" x2="340" y2="418" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
    <line x1="220" y1="326" x2="340" y2="326" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <circle cx="280" cy="326" r="14" fill="#f8fafc"/>
    <line x1="280" y1="490" x2="280" y2="350" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <polygon points="280,324 265,356 295,356" fill="#f59e0b"/>
    <rect x="180" y="360" width="110" height="48" rx="16" fill="#7c3aed" stroke="#c4b5fd" stroke-width="3"/>
    <text x="235" y="390" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      higher gap
    </text>
    <text x="280" y="564" class="body" text-anchor="middle">a different exact packet reaches n = 3</text>
  </g>
</svg>
