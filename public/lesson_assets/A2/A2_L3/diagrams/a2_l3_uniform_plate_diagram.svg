<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .lane { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Brightness Changes Count After Threshold</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Packet energy decides escape. Brightness changes how many packets arrive.
  </text>

  <rect x="90" y="180" width="1100" height="470" rx="34" class="card"/>
  <rect x="120" y="220" width="320" height="390" rx="26" class="lane"/>
  <rect x="480" y="220" width="320" height="390" rx="26" class="lane"/>
  <rect x="840" y="220" width="320" height="390" rx="26" class="lane"/>

  <text x="280" y="258" class="label" text-anchor="middle">Bright but low frequency</text>
  <text x="640" y="258" class="label" text-anchor="middle">Dim and above threshold</text>
  <text x="1000" y="258" class="label" text-anchor="middle">Bright and above threshold</text>

  <path d="M 162 334 C 206 304 250 364 294 334 C 338 304 382 364 426 334" fill="none" stroke="#f97316" stroke-width="7"/>
  <circle cx="234" cy="300" r="6" fill="#fb923c"/>
  <circle cx="280" cy="300" r="6" fill="#fb923c"/>
  <circle cx="326" cy="300" r="6" fill="#fb923c"/>
  <rect x="198" y="438" width="164" height="30" rx="14" fill="#475569"/>
  <text x="280" y="520" class="body" text-anchor="middle">many weak packets</text>
  <text x="280" y="548" class="body" text-anchor="middle">still no emission</text>

  <path d="M 540 314 C 584 276 628 352 676 314 C 724 276 756 352 792 314" fill="none" stroke="#a78bfa" stroke-width="7"/>
  <circle cx="612" cy="278" r="6" fill="#c4b5fd"/>
  <circle cx="640" cy="442" r="9" fill="#f8fafc"/>
  <line x1="648" y1="434" x2="706" y2="378" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <polygon points="724,360 692,376 712,398" fill="#22c55e"/>
  <rect x="558" y="438" width="164" height="30" rx="14" fill="#475569"/>
  <text x="640" y="520" class="body" text-anchor="middle">few strong packets</text>
  <text x="640" y="548" class="body" text-anchor="middle">some electrons escape</text>

  <path d="M 882 314 C 926 276 970 352 1018 314 C 1066 276 1100 352 1142 314" fill="none" stroke="#a78bfa" stroke-width="7"/>
  <circle cx="926" cy="278" r="6" fill="#c4b5fd"/>
  <circle cx="962" cy="278" r="6" fill="#c4b5fd"/>
  <circle cx="998" cy="278" r="6" fill="#c4b5fd"/>
  <circle cx="980" cy="442" r="9" fill="#f8fafc"/>
  <circle cx="1022" cy="432" r="9" fill="#f8fafc"/>
  <circle cx="1064" cy="446" r="9" fill="#f8fafc"/>
  <line x1="988" y1="434" x2="1036" y2="388" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <line x1="1030" y1="424" x2="1082" y2="370" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <line x1="1072" y1="438" x2="1118" y2="394" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <text x="1000" y="520" class="body" text-anchor="middle">more strong packets</text>
  <text x="1000" y="548" class="body" text-anchor="middle">higher emission rate</text>
</svg>
