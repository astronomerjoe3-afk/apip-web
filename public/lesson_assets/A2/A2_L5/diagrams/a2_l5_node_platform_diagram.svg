<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 19px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Higher Momentum, Shorter Wavelength</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Faster particles have tighter matter-wave spacing and a smaller diffraction spread.
  </text>

  <rect x="100" y="180" width="1080" height="470" rx="34" class="card"/>
  <rect x="132" y="220" width="470" height="390" rx="28" class="panel"/>
  <rect x="678" y="220" width="470" height="390" rx="28" class="panel"/>

  <text x="366" y="258" class="label" text-anchor="middle">Slower particle</text>
  <text x="912" y="258" class="label" text-anchor="middle">Faster particle</text>

  <line x1="184" y1="432" x2="548" y2="432" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 184 432 C 216 392 248 392 280 432 C 312 472 344 472 376 432 C 408 392 440 392 472 432 C 504 472 526 472 548 432"
        fill="none" stroke="#67e8f9" stroke-width="6"/>
  <circle cx="232" cy="334" r="14" fill="#f8fafc"/>
  <line x1="248" y1="334" x2="314" y2="334" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <polygon points="334,334 302,318 302,350" fill="#38bdf8"/>
  <text x="366" y="540" class="body" text-anchor="middle">longer wavelength and stronger spreading</text>

  <line x1="730" y1="432" x2="1094" y2="432" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 730 432 C 748 404 766 404 784 432 C 802 460 820 460 838 432 C 856 404 874 404 892 432 C 910 460 928 460 946 432 C 964 404 982 404 1000 432 C 1018 460 1036 460 1054 432 C 1072 404 1084 404 1094 432"
        fill="none" stroke="#a78bfa" stroke-width="6"/>
  <circle cx="778" cy="334" r="14" fill="#f8fafc"/>
  <line x1="794" y1="334" x2="868" y2="334" stroke="#f472b6" stroke-width="6" stroke-linecap="round"/>
  <polygon points="888,334 856,318 856,350" fill="#f472b6"/>
  <text x="912" y="540" class="body" text-anchor="middle">shorter wavelength and tighter diffraction envelope</text>
</svg>
