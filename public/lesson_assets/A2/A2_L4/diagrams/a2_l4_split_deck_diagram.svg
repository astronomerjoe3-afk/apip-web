<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 19px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 18px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">The Continuum Starts Above the Ladder</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Bound levels sit below the escape line. Once the packet crosses that line, the electron is free.
  </text>

  <rect x="100" y="180" width="1080" height="470" rx="34" class="card"/>
  <rect x="152" y="240" width="390" height="320" rx="28" class="panel"/>
  <rect x="604" y="240" width="524" height="320" rx="28" class="panel"/>

  <text x="196" y="278" class="label">Bound ladder</text>
  <text x="648" y="278" class="label">Continuum region</text>

  <line x1="320" y1="318" x2="320" y2="500" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="484" x2="390" y2="484" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="416" x2="390" y2="416" stroke="#7dd3fc" stroke-width="5" stroke-linecap="round"/>
  <line x1="250" y1="348" x2="390" y2="348" stroke="#c084fc" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="534" class="small" text-anchor="middle">discrete allowed levels</text>

  <line x1="648" y1="332" x2="1084" y2="332" stroke="#f59e0b" stroke-width="5" stroke-dasharray="14 10"/>
  <text x="1092" y="338" class="small">ionisation threshold</text>
  <circle cx="862" cy="268" r="12" fill="#f8fafc"/>
  <line x1="820" y1="468" x2="852" y2="362" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <line x1="852" y1="362" x2="916" y2="288" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
  <polygon points="934,270 902,286 924,306" fill="#f97316"/>
  <text x="862" y="442" class="body" text-anchor="middle">above the threshold, the electron is not tied to one level anymore</text>
</svg>
