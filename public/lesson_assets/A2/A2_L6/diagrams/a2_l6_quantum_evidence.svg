<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 17px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="270" r="350" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Quantum Evidence Board</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    The module is coherent when each experiment is tied to the clue it really contributes.
  </text>

  <rect x="100" y="180" width="1080" height="470" rx="34" class="card"/>
  <rect x="138" y="228" width="1004" height="312" rx="28" class="panel"/>
  <line x1="472" y1="252" x2="472" y2="516" stroke="#334155" stroke-width="2.5"/>
  <line x1="806" y1="252" x2="806" y2="516" stroke="#334155" stroke-width="2.5"/>

  <text x="306" y="270" class="label" text-anchor="middle">Experiment</text>
  <text x="640" y="270" class="label" text-anchor="middle">What it shows</text>
  <text x="974" y="270" class="label" text-anchor="middle">Shared quantum clue</text>

  <text x="174" y="334" class="body">Line spectra</text>
  <text x="174" y="396" class="body">Photoelectric effect</text>
  <text x="174" y="458" class="body">Diffraction of particles</text>

  <text x="508" y="334" class="body">Discrete colors and gaps</text>
  <text x="508" y="396" class="body">Threshold packet energy</text>
  <text x="508" y="458" class="body">Wave pattern with local hits</text>

  <text x="842" y="334" class="body">allowed levels</text>
  <text x="842" y="396" class="body">energy comes in packets</text>
  <text x="842" y="458" class="body">matter has wavelength</text>

  <rect x="248" y="570" width="784" height="42" rx="18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="640" y="597" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    Best synthesis: one quantum model explains several different experiments.
  </text>
</svg>
