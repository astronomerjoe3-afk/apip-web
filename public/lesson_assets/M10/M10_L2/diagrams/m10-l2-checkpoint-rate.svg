  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Checkpoint rate</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows current as carriers crossing one checkpoint per second.</text><rect x="110.00" y="200.00" width="480.00" height="340.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="138.00" y="240.00" fill="#86efac" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Charge amount</text><rect x="180.00" y="310.00" width="320.00" height="110.00" rx="24" fill="#0f172a" stroke="#475569" stroke-width="3" /><circle cx="230.00" cy="365.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="230.00" y="371.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><circle cx="320.00" cy="365.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="320.00" y="371.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><circle cx="410.00" cy="365.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="410.00" y="371.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><text x="350.00" y="462.00" fill="#bbf7d0" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Many carriers can still mean a small current.</text><rect x="680.00" y="200.00" width="500.00" height="340.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="708.00" y="240.00" fill="#fde68a" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Checkpoint rate</text><line x1="770.00" y1="365.00" x2="1100.00" y2="365.00" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" /><rect x="910.00" y="290.00" width="18.00" height="150.00" rx="8" fill="#fbbf24" /><line x1="790.00" y1="330.00" x2="900.00" y2="330.00" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#current-arrow)" /><line x1="790.00" y1="400.00" x2="860.00" y2="400.00" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#current-arrow)" /><text x="930.00" y="268.00" fill="#fde68a" text-anchor="middle" font-size="24" font-family="Arial" font-weight="normal">1 A = 1 C/s</text><text x="930.00" y="480.00" fill="#f8fafc" text-anchor="middle" font-size="32" font-family="Arial" font-weight="bold">I = Q / t</text></svg>