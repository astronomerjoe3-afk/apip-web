  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Lift station</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows the source giving each carrier an energy boost.</text><rect x="120.00" y="210.00" width="450.00" height="330.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="148.00" y="250.00" fill="#93c5fd" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">3 J/C source</text><circle cx="245.00" cy="360.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="245.00" y="366.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><line x1="280.00" y1="360.00" x2="430.00" y2="360.00" stroke="#34d399" stroke-width="6" stroke-linecap="round" marker-end="url(#energy-arrow)" /><text x="345.00" y="330.00" fill="#86efac" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">+3 J/C</text><text x="345.00" y="448.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">smaller boost per carrier</text><rect x="710.00" y="210.00" width="450.00" height="330.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="738.00" y="250.00" fill="#60a5fa" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">9 J/C source</text><circle cx="835.00" cy="360.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="835.00" y="366.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><line x1="870.00" y1="360.00" x2="1070.00" y2="360.00" stroke="#34d399" stroke-width="6" stroke-linecap="round" marker-end="url(#energy-arrow)" /><text x="970.00" y="330.00" fill="#86efac" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">+9 J/C</text><text x="970.00" y="448.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">larger boost per carrier</text><text x="640.00" y="600.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Voltage is energy transferred per charge, not stored current.</text></svg>