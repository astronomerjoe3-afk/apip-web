  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Route drag</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows how length, width, and roughness change the path difficulty.</text><rect x="90.00" y="190.00" width="500.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="118.00" y="230.00" fill="#86efac" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Lower resistance route</text><line x1="170.00" y1="330.00" x2="500.00" y2="330.00" stroke="#34d399" stroke-width="16" stroke-linecap="round" /><line x1="170.00" y1="420.00" x2="500.00" y2="420.00" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" /><text x="335.00" y="305.00" fill="#bbf7d0" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">short + wide</text><text x="335.00" y="470.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">easier path for carriers</text><rect x="690.00" y="190.00" width="500.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="718.00" y="230.00" fill="#fda4af" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Higher resistance route</text><line x1="760.00" y1="300.00" x2="1110.00" y2="300.00" stroke="#fb7185" stroke-width="8" stroke-linecap="round" /><line x1="760.00" y1="420.00" x2="1110.00" y2="420.00" stroke="#f97316" stroke-width="18" stroke-linecap="round" stroke-dasharray="10 8" /><text x="935.00" y="275.00" fill="#fecdd3" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">long + narrow + rough</text><text x="935.00" y="470.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">same source, smaller current</text></svg>