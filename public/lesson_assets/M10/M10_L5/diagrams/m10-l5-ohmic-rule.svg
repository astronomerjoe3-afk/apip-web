<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="current-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#fbbf24" />
    </marker>
    <marker id="energy-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Ohmic rule</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows current responding to voltage and resistance in a proportional way.</text><rect x="110.00" y="190.00" width="470.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="138.00" y="230.00" fill="#bfdbfe" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Fixed resistance</text><text x="345.00" y="270.00" fill="#dbeafe" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold">raise V -&gt; raise I</text><line x1="190.00" y1="380.00" x2="470.00" y2="380.00" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" /><line x1="190.00" y1="380.00" x2="190.00" y2="250.00" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" /><path d="M 210 360 L 450 280" stroke="#60a5fa" stroke-width="8" fill="none" /><text x="470.00" y="282.00" fill="#bfdbfe" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">ohmic line</text><rect x="700.00" y="190.00" width="470.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="728.00" y="230.00" fill="#fdba74" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Fixed voltage</text><text x="935.00" y="270.00" fill="#fed7aa" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold">raise R -&gt; lower I</text><rect x="790.00" y="340.00" width="110.00" height="90.00" rx="20" fill="#0f172a" stroke="#475569" stroke-width="3" /><rect x="980.00" y="300.00" width="110.00" height="130.00" rx="20" fill="#0f172a" stroke="#475569" stroke-width="3" /><text x="845.00" y="394.00" fill="#f8fafc" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">2 ohm</text><text x="1035.00" y="372.00" fill="#f8fafc" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">6 ohm</text><text x="845.00" y="452.00" fill="#fde68a" text-anchor="middle" font-size="21" font-family="Arial" font-weight="normal">larger I</text><text x="1035.00" y="452.00" fill="#fde68a" text-anchor="middle" font-size="21" font-family="Arial" font-weight="normal">smaller I</text><text x="640.00" y="606.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Ohm's law is a relationship between voltage, resistance, and current.</text></svg>