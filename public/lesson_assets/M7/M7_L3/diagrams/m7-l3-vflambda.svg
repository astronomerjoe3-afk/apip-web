<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Beat Rate, Pulse Gap, and Ripple Run</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows launch rate, front spacing, and front speed on one board.</text><rect x="90.00" y="180.00" width="1100.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="116.00" y="218.00" fill="#bfdbfe" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Wave speed relationship</text><rect x="130.00" y="250.00" width="280.00" height="210.00" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3" /><text x="270.00" y="306.00" fill="#93c5fd" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold">Frequency f</text><text x="270.00" y="362.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">launch rate</text><line x1="210.00" y1="404.00" x2="330.00" y2="404.00" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" marker-end="url(#wave-arrow)" /><rect x="500.00" y="250.00" width="280.00" height="210.00" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3" /><text x="640.00" y="306.00" fill="#86efac" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold">Wavelength lambda</text><text x="640.00" y="362.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">front spacing</text><line x1="560.00" y1="404.00" x2="720.00" y2="404.00" stroke="#86efac" stroke-width="4" stroke-linecap="round" marker-end="url(#wave-arrow)" /><rect x="870.00" y="250.00" width="280.00" height="210.00" rx="24" fill="#0f172a" stroke="#334155" stroke-width="3" /><text x="1010.00" y="306.00" fill="#fbbf24" text-anchor="middle" font-size="28" font-family="Arial" font-weight="bold">Speed v</text><text x="1010.00" y="362.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">pattern travel rate</text><line x1="930.00" y1="404.00" x2="1080.00" y2="404.00" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" marker-end="url(#wave-arrow)" /><rect x="440.00" y="90.00" width="400.00" height="70.00" rx="22" fill="#1e293b" stroke="#475569" stroke-width="3" /><text x="640.00" y="134.00" fill="#f8fafc" text-anchor="middle" font-size="36" font-family="Arial" font-weight="bold">v = f lambda</text></svg>