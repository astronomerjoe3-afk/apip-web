<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="wave-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Bounce Wall reflection</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows a front hitting a flat wall with the normal line and equal reflected geometry.</text><rect x="100.00" y="180.00" width="1080.00" height="360.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="126.00" y="218.00" fill="#93c5fd" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Reflection from a boundary</text><line x1="860.00" y1="240.00" x2="860.00" y2="500.00" stroke="#94a3b8" stroke-width="10" stroke-linecap="round" /><line x1="690.00" y1="380.00" x2="980.00" y2="380.00" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8" /><path d="M 360 260 L 860 380" stroke="#fbbf24" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><path d="M 860 380 L 360 500" stroke="#34d399" stroke-width="6" fill="none" marker-end="url(#wave-arrow)" /><text x="820.00" y="358.00" fill="#bae6fd" text-anchor="end" font-size="18" font-family="Arial" font-weight="normal">normal</text><text x="500.00" y="290.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">incident</text><text x="500.00" y="510.00" fill="#86efac" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">reflected</text><text x="720.00" y="560.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Equal angles are measured from the normal, not from the wall.</text></svg>