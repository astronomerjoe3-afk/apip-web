  <text x="1022" y="644" fill="#1e3a8a" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">higher toward infinity</text>

  <text x="700" y="714" fill="#1e3a8a" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Field strength and potential are linked, but they are not the same description.</text>
