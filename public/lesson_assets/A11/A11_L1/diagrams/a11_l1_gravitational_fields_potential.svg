  <text x="476" y="488" fill="#1e3a8a" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">stronger g closer in</text>

  <path d="M 770 286 C 822 328 864 426 926 514 C 982 594 1068 614 1182 614" fill="none" stroke="#2563eb" stroke-width="8" stroke-linecap="round"/>
