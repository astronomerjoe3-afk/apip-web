<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#04111c"/>
  <rect x="34" y="28" width="1332" height="764" rx="38" fill="#0f2131" stroke="#8b5cf6" stroke-width="3"/>
  <text x="700" y="96" fill="#f8fbff" font-size="40" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Parallax, Standard Candles, and the Distance Ladder</text>
  <text x="700" y="136" fill="#ddd6fe" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">Nearby stars can be triangulated. Farther targets need brightness-calibrated rungs on the same distance ladder.</text>

  <rect x="84" y="176" width="596" height="580" rx="34" fill="#14263a" stroke="#475569" stroke-width="3"/>
  <text x="142" y="226" fill="#c4b5fd" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">parallax for nearby stars</text>
  <circle cx="372" cy="418" r="54" fill="#fbbf24"/>
  <text x="372" y="428" fill="#1f2937" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Sun</text>
  <circle cx="196" cy="598" r="20" fill="#60a5fa"/>
  <circle cx="548" cy="598" r="20" fill="#60a5fa"/>
  <text x="196" y="640" fill="#bfdbfe" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">Earth 1</text>
  <text x="548" y="640" fill="#bfdbfe" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">Earth 2</text>
  <circle cx="372" cy="232" r="18" fill="#f8fafc"/>
  <text x="372" y="198" fill="#f8fafc" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">nearby star</text>
  <line x1="196" y1="598" x2="372" y2="232" stroke="#c084fc" stroke-width="4"/>
  <line x1="548" y1="598" x2="372" y2="232" stroke="#c084fc" stroke-width="4"/>
  <line x1="196" y1="598" x2="548" y2="598" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="372" y="584" fill="#fde68a" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">baseline from opposite sides of orbit</text>
  <circle cx="500" cy="270" r="8" fill="#94a3b8"/>
  <circle cx="538" cy="254" r="8" fill="#94a3b8"/>
  <circle cx="576" cy="274" r="8" fill="#94a3b8"/>
  <text x="508" y="218" fill="#cbd5e1" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">background stars</text>
  <text x="372" y="708" fill="#ddd6fe" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">Parallax shift is useful nearby, then the angle becomes too tiny.</text>

  <rect x="714" y="176" width="602" height="580" rx="34" fill="#14263a" stroke="#475569" stroke-width="3"/>
  <text x="772" y="226" fill="#c4b5fd" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">distance ladder for larger scales</text>
  <line x1="860" y1="664" x2="860" y2="300" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="832" y1="612" x2="888" y2="612" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="832" y1="524" x2="888" y2="524" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="832" y1="436" x2="888" y2="436" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round"/>
  <line x1="832" y1="348" x2="888" y2="348" stroke="#e9d5ff" stroke-width="8" stroke-linecap="round"/>
  <text x="922" y="356" fill="#f8fafc" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">galaxy-scale rungs</text>
  <text x="922" y="444" fill="#f8fafc" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">standard candles</text>
  <text x="922" y="532" fill="#f8fafc" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">parallax</text>
  <text x="922" y="620" fill="#f8fafc" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Solar System baseline</text>
  <circle cx="1140" cy="392" r="36" fill="#f59e0b"/>
  <circle cx="1140" cy="392" r="62" fill="none" stroke="#fb7185" stroke-width="6" stroke-dasharray="14 10"/>
  <text x="1140" y="400" fill="#fff7ed" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Cepheid</text>
  <rect x="1000" y="474" width="252" height="82" rx="20" fill="#2a173b" stroke="#fb7185" stroke-width="2"/>
  <text x="1126" y="508" fill="#f5d0fe" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">known luminosity plus</text>
  <text x="1126" y="534" fill="#f5d0fe" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">observed brightness</text>
  <text x="1128" y="684" fill="#ddd6fe" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">Different scales need different evidence methods.</text>
</svg>
