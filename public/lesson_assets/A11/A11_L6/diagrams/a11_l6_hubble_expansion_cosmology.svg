  <circle cx="556" cy="364" r="14" fill="#86efac"/>
  <text x="388" y="306" fill="#dcfce7" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">farther galaxies line up with larger redshift</text>

  <rect x="236" y="352" width="128" height="42" rx="14" fill="#111827" stroke="#4ade80" stroke-width="2"/>
  <rect x="446" y="274" width="128" height="42" rx="14" fill="#111827" stroke="#4ade80" stroke-width="2"/>
  <text x="300" y="380" fill="#d1fae5" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">small redshift</text>
  <text x="510" y="302" fill="#d1fae5" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">larger redshift</text>

