  <text x="886" y="520" fill="#d1fae5" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">same galaxies, later time, larger separations</text>

  <rect x="812" y="566" width="404" height="136" rx="28" fill="#123524" stroke="#4ade80" stroke-width="3"/>
  <text x="1014" y="618" fill="#f0fdf4" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">dark energy</text>
  <text x="1014" y="656" fill="#dcfce7" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">used in modern cosmology to describe</text>
  <text x="1014" y="686" fill="#dcfce7" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">accelerated expansion</text>
