  <text x="772" y="226" fill="#86efac" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">space itself stretches</text>
  <rect x="786" y="288" width="198" height="164" rx="24" fill="#0f172a" stroke="#64748b" stroke-width="3"/>
