<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#020617"/>
  <rect x="34" y="28" width="1332" height="764" rx="38" fill="#0d1b2a" stroke="#22c55e" stroke-width="3"/>
  <text x="700" y="96" fill="#f8fbff" font-size="40" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Hubble Expansion, Dark Energy, and Cosmology</text>
  <text x="700" y="136" fill="#bbf7d0" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">Farther galaxies show larger redshift, which points to an expanding universe and motivates modern cosmology.</text>

  <rect x="84" y="176" width="604" height="580" rx="34" fill="#10212f" stroke="#3f5e5b" stroke-width="3"/>
  <text x="144" y="226" fill="#86efac" font-size="26" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">Hubble trend</text>
  <line x1="164" y1="656" x2="622" y2="656" stroke="#d1fae5" stroke-width="4"/>
  <line x1="164" y1="656" x2="164" y2="286" stroke="#d1fae5" stroke-width="4"/>
  <text x="394" y="708" fill="#d1fae5" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">distance</text>
  <text x="120" y="470" fill="#d1fae5" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" transform="rotate(-90 120 470)" text-anchor="middle">recession and redshift</text>
  <line x1="196" y1="620" x2="580" y2="342" stroke="#22c55e" stroke-width="6" stroke-linecap="round"/>
  <circle cx="224" cy="598" r="14" fill="#86efac"/>
