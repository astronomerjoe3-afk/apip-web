<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 48px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Vector Resolution Decides Equilibrium</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    A diagonal force has to be split into components before you can tell whether the system is balanced.
  </text>

  <rect x="92" y="176" width="1096" height="478" rx="34" class="card"/>
  <rect x="126" y="226" width="304" height="370" rx="26" class="panel"/>
  <rect x="488" y="226" width="304" height="370" rx="26" class="panel"/>
  <rect x="850" y="226" width="304" height="370" rx="26" class="panel"/>

  <text x="278" y="268" class="label" text-anchor="middle">Given force</text>
  <text x="640" y="268" class="label" text-anchor="middle">Resolve it</text>
  <text x="1002" y="268" class="label" text-anchor="middle">Balance check</text>

  <line x1="182" y1="490" x2="182" y2="324" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="182" y1="490" x2="350" y2="490" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="182" y1="490" x2="334" y2="344" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <polygon points="334,344 300,352 324,376" fill="#60a5fa"/>
  <text x="272" y="332" class="small" text-anchor="middle">F</text>
  <text x="278" y="556" class="body" text-anchor="middle">one diagonal arrow hides two tests</text>

  <line x1="544" y1="490" x2="544" y2="324" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="544" y1="490" x2="712" y2="490" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="544" y1="490" x2="696" y2="344" stroke="#60a5fa" stroke-width="6" stroke-linecap="round"/>
  <line x1="544" y1="490" x2="696" y2="490" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="696,490 670,476 670,504" fill="#f59e0b"/>
  <line x1="544" y1="490" x2="544" y2="344" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <polygon points="544,344 530,370 558,370" fill="#34d399"/>
  <text x="622" y="472" class="small" text-anchor="middle">Fx</text>
  <text x="564" y="412" class="small">Fy</text>
  <text x="640" y="556" class="body" text-anchor="middle">compare x and y on shared axes</text>

  <line x1="900" y1="418" x2="1104" y2="418" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="1002" y1="324" x2="1002" y2="520" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="1002" y1="418" x2="1092" y2="418" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1092,418 1066,404 1066,432" fill="#f59e0b"/>
  <line x1="1002" y1="418" x2="912" y2="418" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="912,418 938,404 938,432" fill="#f59e0b"/>
  <line x1="1002" y1="418" x2="1002" y2="336" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1002,336 988,362 1016,362" fill="#34d399"/>
  <line x1="1002" y1="418" x2="1002" y2="500" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1002,500 988,474 1016,474" fill="#34d399"/>
  <text x="1002" y="548" class="body" text-anchor="middle">sum Fx = 0, sum Fy = 0</text>
</svg>
