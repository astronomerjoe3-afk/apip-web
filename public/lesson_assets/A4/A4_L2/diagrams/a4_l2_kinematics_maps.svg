<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 46px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Position, Velocity, and Acceleration Stay Separate</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Two-dimensional motion is safer when you keep the horizontal and vertical stories apart instead of blending them too early.
  </text>

  <rect x="96" y="176" width="1088" height="478" rx="34" class="card"/>
  <rect x="132" y="226" width="476" height="370" rx="26" class="panel"/>
  <rect x="672" y="226" width="476" height="370" rx="26" class="panel"/>

  <text x="370" y="268" class="label" text-anchor="middle">Horizontal story</text>
  <text x="910" y="268" class="label" text-anchor="middle">Vertical story</text>

  <line x1="186" y1="342" x2="548" y2="342" stroke="#475569" stroke-width="3"/>
  <circle cx="240" cy="342" r="8" fill="#60a5fa"/>
  <circle cx="330" cy="342" r="8" fill="#60a5fa"/>
  <circle cx="420" cy="342" r="8" fill="#60a5fa"/>
  <circle cx="510" cy="342" r="8" fill="#60a5fa"/>
  <text x="370" y="374" class="small" text-anchor="middle">x position changes evenly</text>
  <line x1="232" y1="448" x2="508" y2="448" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <polygon points="508,448 482,434 482,462" fill="#34d399"/>
  <text x="370" y="478" class="small" text-anchor="middle">vx stays constant</text>
  <line x1="320" y1="530" x2="420" y2="530" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <text x="370" y="560" class="small" text-anchor="middle">ax = 0 here</text>

  <line x1="718" y1="320" x2="718" y2="536" stroke="#475569" stroke-width="3"/>
  <circle cx="718" cy="320" r="8" fill="#60a5fa"/>
  <circle cx="780" cy="356" r="8" fill="#60a5fa"/>
  <circle cx="862" cy="418" r="8" fill="#60a5fa"/>
  <circle cx="968" cy="506" r="8" fill="#60a5fa"/>
  <text x="908" y="320" class="small">y position changes non-uniformly</text>
  <line x1="762" y1="360" x2="812" y2="390" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="846" y1="420" x2="924" y2="474" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <text x="914" y="394" class="small">vy changes</text>
  <line x1="1036" y1="330" x2="1036" y2="520" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  <polygon points="1036,520 1022,494 1050,494" fill="#f43f5e"/>
  <text x="1036" y="556" class="small" text-anchor="middle">ay downward</text>
</svg>
