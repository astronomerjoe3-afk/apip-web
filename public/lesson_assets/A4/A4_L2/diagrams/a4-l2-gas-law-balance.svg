<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 45px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">1D and 2D Need Different Bookkeeping</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    One-dimensional motion needs one axis. Two-dimensional motion needs separate x and y stories, even when one axis looks simpler.
  </text>

  <rect x="106" y="176" width="1068" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="448" height="370" rx="26" class="panel"/>
  <rect x="688" y="226" width="448" height="370" rx="26" class="panel"/>

  <text x="368" y="268" class="label" text-anchor="middle">One-dimensional case</text>
  <text x="912" y="268" class="label" text-anchor="middle">Two-dimensional case</text>

  <line x1="208" y1="420" x2="528" y2="420" stroke="#475569" stroke-width="3"/>
  <circle cx="240" cy="420" r="10" fill="#60a5fa"/>
  <circle cx="330" cy="420" r="10" fill="#60a5fa"/>
  <circle cx="420" cy="420" r="10" fill="#60a5fa"/>
  <circle cx="510" cy="420" r="10" fill="#60a5fa"/>
  <text x="368" y="476" class="body" text-anchor="middle">one axis is enough: x, vx, ax</text>

  <line x1="760" y1="330" x2="760" y2="520" stroke="#475569" stroke-width="3"/>
  <line x1="760" y1="520" x2="1070" y2="520" stroke="#475569" stroke-width="3"/>
  <circle cx="804" cy="372" r="9" fill="#60a5fa"/>
  <circle cx="884" cy="408" r="9" fill="#60a5fa"/>
  <circle cx="966" cy="454" r="9" fill="#60a5fa"/>
  <circle cx="1048" cy="510" r="9" fill="#60a5fa"/>
  <text x="1004" y="350" class="small">x keeps changing</text>
  <text x="1006" y="388" class="small">y changes too</text>
  <text x="912" y="560" class="body" text-anchor="middle">full motion = x story + y story</text>
</svg>
