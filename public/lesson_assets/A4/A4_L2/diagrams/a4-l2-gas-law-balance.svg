<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="thermal-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Chamber balance rule</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show pV and nRT as two sides of the same Bounce-Chamber balance.</text><rect x="120.00" y="190.00" width="350.00" height="280.00" rx="24" fill="#111827" stroke="#38bdf8" stroke-width="4" /><rect x="810.00" y="190.00" width="350.00" height="280.00" rx="24" fill="#111827" stroke="#22c55e" stroke-width="4" /><text x="295.00" y="285.00" fill="#bae6fd" text-anchor="middle" font-size="72" font-family="Arial" font-weight="bold">pV</text><text x="985.00" y="285.00" fill="#bbf7d0" text-anchor="middle" font-size="72" font-family="Arial" font-weight="bold">nRT</text><text x="295.00" y="350.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">wall-hit load x room size</text><text x="985.00" y="350.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">crowd count x dash level</text><line x1="470.00" y1="300.00" x2="810.00" y2="300.00" stroke="#facc15" stroke-width="8" marker-end="url(#thermal-arrow)" /><text x="640.00" y="272.00" fill="#fde68a" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">balance rule</text><text x="190.00" y="540.00" fill="#93c5fd" text-anchor="start" font-size="20" font-family="Arial" font-weight="normal">Increase T or n at fixed V -&gt; pressure rises</text><text x="190.00" y="575.00" fill="#93c5fd" text-anchor="start" font-size="20" font-family="Arial" font-weight="normal">Increase V at fixed n and T -&gt; pressure falls</text><text x="985.00" y="540.00" fill="#86efac" text-anchor="middle" font-size="24" font-family="Arial" font-weight="normal">Ideal gas law: pV = nRT</text></svg>