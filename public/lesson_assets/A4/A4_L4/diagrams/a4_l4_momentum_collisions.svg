<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 47px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Momentum Ledger Comes First</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Before deciding what kind of collision happened, compare the total momentum before and after the impact.
  </text>

  <rect x="96" y="176" width="1088" height="478" rx="34" class="card"/>
  <rect x="132" y="226" width="476" height="370" rx="26" class="panel"/>
  <rect x="672" y="226" width="476" height="370" rx="26" class="panel"/>

  <text x="370" y="268" class="label" text-anchor="middle">Before impact</text>
  <text x="910" y="268" class="label" text-anchor="middle">After impact</text>

  <rect x="198" y="420" width="116" height="48" rx="12" fill="#60a5fa"/>
  <rect x="454" y="420" width="82" height="48" rx="12" fill="#f59e0b"/>
  <line x1="208" y1="396" x2="332" y2="396" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <polygon points="332,396 306,382 306,410" fill="#34d399"/>
  <line x1="526" y1="396" x2="438" y2="396" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  <polygon points="438,396 464,382 464,410" fill="#f43f5e"/>
  <text x="256" y="488" class="small" text-anchor="middle">2 kg at 4 m/s</text>
  <text x="494" y="488" class="small" text-anchor="middle">1 kg at 2 m/s left</text>
  <text x="370" y="546" class="body" text-anchor="middle">total p before = 8 - 2 = 6 kg m/s right</text>

  <rect x="796" y="420" width="190" height="48" rx="12" fill="#a78bfa"/>
  <line x1="810" y1="396" x2="934" y2="396" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>
  <polygon points="934,396 908,382 908,410" fill="#34d399"/>
  <text x="892" y="488" class="small" text-anchor="middle">3 kg together at 2 m/s</text>
  <text x="910" y="546" class="body" text-anchor="middle">total p after = 6 kg m/s right</text>
  <text x="640" y="620" class="body" text-anchor="middle">Momentum is conserved for the full system even though kinetic energy can change.</text>
</svg>
