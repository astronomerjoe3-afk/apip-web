<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 45px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Impulse Is the Momentum Change</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    A short large force and a longer smaller force can give the same impulse if the area under the force-time graph matches.
  </text>

  <rect x="106" y="176" width="1068" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="448" height="370" rx="26" class="panel"/>
  <rect x="688" y="226" width="448" height="370" rx="26" class="panel"/>

  <text x="368" y="268" class="label" text-anchor="middle">Force-time view</text>
  <text x="912" y="268" class="label" text-anchor="middle">Momentum view</text>

  <line x1="212" y1="520" x2="520" y2="520" stroke="#475569" stroke-width="3"/>
  <line x1="212" y1="520" x2="212" y2="318" stroke="#475569" stroke-width="3"/>
  <polygon points="252,520 252,404 340,404 340,520" fill="#60a5fa" fill-opacity="0.28" stroke="#60a5fa" stroke-width="4"/>
  <polygon points="386,520 386,454 490,454 490,520" fill="#34d399" fill-opacity="0.28" stroke="#34d399" stroke-width="4"/>
  <text x="296" y="390" class="small" text-anchor="middle">large F, short t</text>
  <text x="438" y="440" class="small" text-anchor="middle">small F, longer t</text>
  <text x="368" y="556" class="body" text-anchor="middle">area under each block is the impulse</text>

  <line x1="770" y1="432" x2="1038" y2="432" stroke="#475569" stroke-width="3"/>
  <rect x="780" y="404" width="94" height="56" rx="12" fill="#60a5fa"/>
  <line x1="892" y1="432" x2="992" y2="432" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="992,432 966,418 966,446" fill="#f59e0b"/>
  <rect x="1000" y="380" width="104" height="104" rx="14" fill="#a78bfa"/>
  <text x="832" y="492" class="small" text-anchor="middle">before</text>
  <text x="1052" y="506" class="small" text-anchor="middle">after</text>
  <text x="912" y="556" class="body" text-anchor="middle">delta p = impulse</text>
</svg>
