<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 46px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Stress and Strain Normalize the Stretch</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Springs use force and extension directly, but material comparisons become safer when force and extension are normalized.
  </text>

  <rect x="92" y="176" width="1096" height="478" rx="34" class="card"/>
  <rect x="126" y="226" width="304" height="370" rx="26" class="panel"/>
  <rect x="488" y="226" width="304" height="370" rx="26" class="panel"/>
  <rect x="850" y="226" width="304" height="370" rx="26" class="panel"/>

  <text x="278" y="268" class="label" text-anchor="middle">Spring view</text>
  <text x="640" y="268" class="label" text-anchor="middle">Stress</text>
  <text x="1002" y="268" class="label" text-anchor="middle">Strain</text>

  <line x1="278" y1="324" x2="278" y2="356" stroke="#f8fafc" stroke-width="6"/>
  <path d="M 278 356 L 256 372 L 300 388 L 256 404 L 300 420 L 256 436 L 300 452 L 278 468"
        fill="none" stroke="#60a5fa" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="278" y1="468" x2="278" y2="500" stroke="#f8fafc" stroke-width="6"/>
  <rect x="254" y="500" width="48" height="36" rx="10" fill="#f59e0b"/>
  <text x="278" y="556" class="body" text-anchor="middle">F = kx in the proportional region</text>

  <rect x="576" y="330" width="128" height="180" rx="18" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-width="4"/>
  <line x1="540" y1="420" x2="576" y2="420" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <polygon points="576,420 550,406 550,434" fill="#f59e0b"/>
  <text x="640" y="542" class="body" text-anchor="middle">stress = force divided by area</text>

  <line x1="948" y1="330" x2="948" y2="510" stroke="#f8fafc" stroke-width="8"/>
  <line x1="1056" y1="330" x2="1056" y2="550" stroke="#f8fafc" stroke-width="8"/>
  <line x1="948" y1="522" x2="1056" y2="522" stroke="#34d399" stroke-width="6"/>
  <line x1="948" y1="536" x2="948" y2="508" stroke="#34d399" stroke-width="5"/>
  <line x1="1056" y1="536" x2="1056" y2="508" stroke="#34d399" stroke-width="5"/>
  <text x="1002" y="490" class="small" text-anchor="middle">delta L</text>
  <text x="1002" y="568" class="body" text-anchor="middle">strain = delta L / L0</text>
</svg>
