<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="thermal-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Option count and spread score</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Compare low-option and high-option chamber states so entropy becomes a count story rather than a stylistic label.</text><text x="640.00" y="160.00" fill="#93c5fd" text-anchor="middle" font-size="24" font-family="Arial" font-weight="normal">Same visible total, very different hidden option counts</text><line x1="180.00" y1="500.00" x2="1100.00" y2="500.00" stroke="#475569" stroke-width="4" /><line x1="180.00" y1="250.00" x2="180.00" y2="500.00" stroke="#475569" stroke-width="4" /><rect x="270.00" y="450.00" width="120" height="50.00" rx="18" fill="#64748b" /><text x="330.00" y="530.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">all left</text><rect x="500.00" y="390.00" width="120" height="110.00" rx="18" fill="#60a5fa" /><text x="560.00" y="530.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">uneven split</text><rect x="730.00" y="220.00" width="120" height="280.00" rx="18" fill="#22c55e" /><text x="790.00" y="530.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">evener spread</text><text x="156.00" y="258.00" fill="#f8fafc" text-anchor="middle" font-size="30" font-family="Arial" font-weight="bold">W</text><text x="910.00" y="255.00" fill="#fbbf24" text-anchor="middle" font-size="42" font-family="Arial" font-weight="bold">S = k ln W</text><text x="910.00" y="308.00" fill="#fde68a" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">larger W -&gt; larger entropy</text><text x="640.00" y="590.00" fill="#93c5fd" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">Entropy is strongest as an option-count and dispersal idea, not just a 'messiness' slogan.</text></svg>