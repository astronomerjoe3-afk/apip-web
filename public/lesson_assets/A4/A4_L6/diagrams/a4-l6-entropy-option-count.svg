<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 44px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Force-Extension Curves Need Region Labels</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    A straight-line region supports Hooke’s law. Once the graph bends away from that line, the proportional rule is no longer valid.
  </text>

  <rect x="108" y="176" width="1064" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="992" height="370" rx="26" class="panel"/>

  <line x1="212" y1="548" x2="1032" y2="548" stroke="#475569" stroke-width="3"/>
  <line x1="212" y1="548" x2="212" y2="292" stroke="#475569" stroke-width="3"/>
  <path d="M 212 548 L 388 450 L 548 356" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
  <path d="M 548 356 C 650 300 762 300 860 344 C 926 376 982 430 1032 520"
        fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="548" cy="356" r="10" fill="#f8fafc"/>
  <text x="356" y="424" class="small">straight proportional region</text>
  <text x="610" y="328" class="small">limit of proportionality</text>
  <text x="836" y="316" class="small">non-linear region</text>
  <text x="1036" y="576" class="small" text-anchor="end">extension</text>
  <text x="190" y="308" class="small" text-anchor="end">force</text>
  <text x="640" y="620" class="body" text-anchor="middle">Young modulus and spring constant should be taken from the straight elastic region, not the bent part of the graph.</text>
</svg>
