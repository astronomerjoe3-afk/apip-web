<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 45px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Speed and Radius Set the Inward Requirement</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Faster motion or a tighter turn demands a larger centripetal acceleration, because a_c = v squared over r.
  </text>

  <rect x="106" y="176" width="1068" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="448" height="370" rx="26" class="panel"/>
  <rect x="688" y="226" width="448" height="370" rx="26" class="panel"/>

  <text x="368" y="268" class="label" text-anchor="middle">Slow and wide</text>
  <text x="912" y="268" class="label" text-anchor="middle">Fast and tight</text>

  <circle cx="368" cy="412" r="122" fill="none" stroke="#475569" stroke-width="4"/>
  <circle cx="448" cy="320" r="12" fill="#f8fafc"/>
  <line x1="448" y1="320" x2="542" y2="320" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <polygon points="542,320 516,306 516,334" fill="#34d399"/>
  <line x1="448" y1="320" x2="392" y2="382" stroke="#f43f5e" stroke-width="5" stroke-linecap="round"/>
  <polygon points="392,382 398,350 422,372" fill="#f43f5e"/>
  <text x="368" y="556" class="body" text-anchor="middle">smaller inward arrow</text>

  <circle cx="912" cy="412" r="88" fill="none" stroke="#475569" stroke-width="4"/>
  <circle cx="968" cy="342" r="12" fill="#f8fafc"/>
  <line x1="968" y1="342" x2="1084" y2="342" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1084,342 1058,328 1058,356" fill="#34d399"/>
  <line x1="968" y1="342" x2="884" y2="426" stroke="#f43f5e" stroke-width="8" stroke-linecap="round"/>
  <polygon points="884,426 892,392 916,416" fill="#f43f5e"/>
  <text x="912" y="556" class="body" text-anchor="middle">larger inward arrow</text>
</svg>
