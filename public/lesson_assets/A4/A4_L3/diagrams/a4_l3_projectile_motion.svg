<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#26446b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 47px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #4a6891; stroke-width: 3; }
      .panel { fill: #172742; stroke: #55769d; stroke-width: 2.5; }
      .label { fill: #f8fafc; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Projectile Motion Splits into Components</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    The path looks curved only after the steady horizontal story and the gravity-driven vertical story are recombined.
  </text>

  <rect x="92" y="176" width="1096" height="478" rx="34" class="card"/>
  <rect x="126" y="226" width="304" height="370" rx="26" class="panel"/>
  <rect x="488" y="226" width="304" height="370" rx="26" class="panel"/>
  <rect x="850" y="226" width="304" height="370" rx="26" class="panel"/>

  <text x="278" y="268" class="label" text-anchor="middle">Launch split</text>
  <text x="640" y="268" class="label" text-anchor="middle">Horizontal motion</text>
  <text x="1002" y="268" class="label" text-anchor="middle">Vertical motion</text>

  <line x1="182" y1="500" x2="350" y2="500" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="182" y1="500" x2="182" y2="332" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="182" y1="500" x2="328" y2="364" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
  <polygon points="328,364 294,372 318,396" fill="#60a5fa"/>
  <line x1="182" y1="500" x2="322" y2="500" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <polygon points="322,500 296,486 296,514" fill="#34d399"/>
  <line x1="182" y1="500" x2="182" y2="364" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <polygon points="182,364 168,390 196,390" fill="#f59e0b"/>
  <text x="272" y="556" class="body" text-anchor="middle">launch gives vx and vy</text>

  <line x1="534" y1="500" x2="748" y2="500" stroke="#475569" stroke-width="3"/>
  <circle cx="546" cy="500" r="9" fill="#60a5fa"/>
  <circle cx="610" cy="500" r="9" fill="#60a5fa"/>
  <circle cx="674" cy="500" r="9" fill="#60a5fa"/>
  <circle cx="738" cy="500" r="9" fill="#60a5fa"/>
  <line x1="546" y1="432" x2="610" y2="432" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="610" y1="432" x2="674" y2="432" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <line x1="674" y1="432" x2="738" y2="432" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <text x="640" y="556" class="body" text-anchor="middle">equal time, even x spacing</text>

  <line x1="906" y1="324" x2="906" y2="520" stroke="#475569" stroke-width="3"/>
  <circle cx="906" cy="324" r="9" fill="#60a5fa"/>
  <circle cx="952" cy="372" r="9" fill="#60a5fa"/>
  <circle cx="996" cy="442" r="9" fill="#60a5fa"/>
  <circle cx="1040" cy="534" r="9" fill="#60a5fa"/>
  <line x1="956" y1="352" x2="984" y2="398" stroke="#f43f5e" stroke-width="6" stroke-linecap="round"/>
  <line x1="998" y1="418" x2="1036" y2="486" stroke="#f43f5e" stroke-width="7" stroke-linecap="round"/>
  <text x="1002" y="556" class="body" text-anchor="middle">gravity keeps changing vy</text>
</svg>
