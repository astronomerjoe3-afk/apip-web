  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Microscopic bridge to the gas law</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show wall momentum change, the kinetic-theory bridge, and the gas-law comparison on one board.</text><rect x="90.00" y="190.00" width="410.00" height="280.00" rx="24" fill="#111827" stroke="#60a5fa" stroke-width="4" /><text x="295.00" y="165.00" fill="#bae6fd" text-anchor="middle" font-size="24" font-family="Arial" font-weight="normal">Microscopic collision story</text><circle cx="163.00" cy="280.00" r="9.00" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" /><line x1="163.00" y1="280.00" x2="182.20" y2="268.00" stroke="#38bdf8" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="229.00" cy="280.00" r="9.00" fill="#60a5fa" stroke="#60a5fa" stroke-width="0" /><line x1="229.00" y1="280.00" x2="200.20" y2="298.00" stroke="#60a5fa" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="295.00" cy="280.00" r="9.00" fill="#22c55e" stroke="#22c55e" stroke-width="0" /><line x1="295.00" y1="280.00" x2="333.40" y2="304.00" stroke="#22c55e" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="361.00" cy="280.00" r="9.00" fill="#facc15" stroke="#facc15" stroke-width="0" /><line x1="361.00" y1="280.00" x2="341.80" y2="250.00" stroke="#facc15" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="427.00" cy="280.00" r="9.00" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" /><line x1="427.00" y1="280.00" x2="455.80" y2="292.00" stroke="#38bdf8" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="163.00" cy="380.00" r="9.00" fill="#60a5fa" stroke="#60a5fa" stroke-width="0" /><line x1="163.00" y1="380.00" x2="124.60" y2="398.00" stroke="#60a5fa" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="229.00" cy="380.00" r="9.00" fill="#22c55e" stroke="#22c55e" stroke-width="0" /><line x1="229.00" y1="380.00" x2="248.20" y2="356.00" stroke="#22c55e" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="295.00" cy="380.00" r="9.00" fill="#facc15" stroke="#facc15" stroke-width="0" /><line x1="295.00" y1="380.00" x2="266.20" y2="410.00" stroke="#facc15" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="361.00" cy="380.00" r="9.00" fill="#38bdf8" stroke="#38bdf8" stroke-width="0" /><line x1="361.00" y1="380.00" x2="399.40" y2="392.00" stroke="#38bdf8" stroke-width="3" marker-end="url(#thermal-arrow)" /><circle cx="427.00" cy="380.00" r="9.00" fill="#60a5fa" stroke="#60a5fa" stroke-width="0" /><line x1="427.00" y1="380.00" x2="407.80" y2="362.00" stroke="#60a5fa" stroke-width="3" marker-end="url(#thermal-arrow)" /><line x1="488.00" y1="332.00" x2="570.00" y2="332.00" stroke="#f97316" stroke-width="6" marker-end="url(#thermal-arrow)" /><text x="610.00" y="338.00" fill="#fdba74" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">Delta p at wall</text><rect x="630.00" y="175.00" width="560.00" height="320.00" rx="24" fill="#111827" stroke="#334155" stroke-width="3" /><text x="910.00" y="250.00" fill="#f8fafc" text-anchor="middle" font-size="38" font-family="Arial" font-weight="bold">pV = (1/3) N m &lt;c^2&gt;</text><text x="910.00" y="318.00" fill="#cbd5e1" text-anchor="middle" font-size="28" font-family="Arial" font-weight="normal">Compare with pV = NkT</text><text x="910.00" y="382.00" fill="#86efac" text-anchor="middle" font-size="38" font-family="Arial" font-weight="bold">&lt;Ek&gt; = (3/2) kT</text><text x="910.00" y="436.00" fill="#93c5fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Gas law is the chamber summary rule.</text><text x="910.00" y="468.00" fill="#93c5fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Kinetic theory is the molecular explanation.</text></svg>