  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Escape Signals</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows alpha, beta-minus, and gamma side by side with count change, shielding, and penetration.</text><rect x="60.00" y="180.00" width="340.00" height="300.00" rx="18" fill="#111827" stroke="#f97316" stroke-width="3" /><text x="230.00" y="222.00" fill="white" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">Chunk Burst</text><text x="230.00" y="248.00" fill="#cbd5e1" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">alpha radiation</text><text x="230.00" y="274.00" fill="#f97316" text-anchor="middle" font-size="16" font-family="Arial" font-weight="bold">count change: A -4, Z -2</text><circle cx="166.00" cy="344.00" r="54.00" fill="#1f2937" stroke="#475569" stroke-width="4" /><text x="166.00" y="350.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">vault</text><line x1="224.00" y1="344.00" x2="316.00" y2="344.00" stroke="#f97316" stroke-width="7" marker-end="url(#radio-arrow)" /><text x="334.00" y="350.00" fill="#f97316" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">alpha</text><rect x="142.00" y="398.00" width="176.00" height="32.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><text x="230.00" y="420.00" fill="#fde68a" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">stopped by paper / skin</text><text x="230.00" y="456.00" fill="#cbd5e1" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">lowest penetration</text><rect x="470.00" y="180.00" width="340.00" height="300.00" rx="18" fill="#111827" stroke="#38bdf8" stroke-width="3" /><text x="640.00" y="222.00" fill="white" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">Switch Spark</text><text x="640.00" y="248.00" fill="#cbd5e1" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">beta-minus radiation</text><text x="640.00" y="274.00" fill="#38bdf8" text-anchor="middle" font-size="16" font-family="Arial" font-weight="bold">count change: A same, Z +1</text><circle cx="576.00" cy="344.00" r="54.00" fill="#1f2937" stroke="#475569" stroke-width="4" /><text x="576.00" y="350.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">vault</text><line x1="634.00" y1="344.00" x2="726.00" y2="344.00" stroke="#38bdf8" stroke-width="7" marker-end="url(#radio-arrow)" /><text x="744.00" y="350.00" fill="#38bdf8" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">beta-</text><rect x="552.00" y="398.00" width="176.00" height="32.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><text x="640.00" y="420.00" fill="#fde68a" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">stopped by foil / plastic</text><text x="640.00" y="456.00" fill="#cbd5e1" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">medium penetration</text><rect x="880.00" y="180.00" width="340.00" height="300.00" rx="18" fill="#111827" stroke="#a78bfa" stroke-width="3" /><text x="1050.00" y="222.00" fill="white" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">Glow Flash</text><text x="1050.00" y="248.00" fill="#cbd5e1" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">gamma radiation</text><text x="1050.00" y="274.00" fill="#a78bfa" text-anchor="middle" font-size="16" font-family="Arial" font-weight="bold">count change: A same, Z same</text><circle cx="986.00" cy="344.00" r="54.00" fill="#1f2937" stroke="#475569" stroke-width="4" /><text x="986.00" y="350.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">vault</text><line x1="1044.00" y1="344.00" x2="1136.00" y2="344.00" stroke="#a78bfa" stroke-width="7" marker-end="url(#radio-arrow)" /><text x="1154.00" y="350.00" fill="#a78bfa" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">gamma</text><rect x="962.00" y="398.00" width="176.00" height="32.00" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2" /><text x="1050.00" y="420.00" fill="#fde68a" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">needs dense shielding</text><text x="1050.00" y="456.00" fill="#cbd5e1" text-anchor="middle" font-size="16" font-family="Arial" font-weight="normal">highest penetration</text><text x="640.00" y="140.00" fill="#93c5fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Each escape signal changes the vault counts and shielding story differently.</text></svg>
