<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="radio-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Vault Ledger</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows alpha, beta-minus, and gamma count balancing side by side in one decay ledger.</text><text x="640.00" y="146.00" fill="#93c5fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Vault Ledger: badge count and total core-piece count must balance across the arrow.</text><text x="126.00" y="238.00" fill="#f97316" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold">alpha</text><rect x="220.00" y="208.00" width="256.00" height="58.00" rx="18" fill="#111827" stroke="#334155" stroke-width="2" /><text x="348.00" y="244.00" fill="white" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">badges 84 | total 210</text><line x1="490.00" y1="236.00" x2="620.00" y2="236.00" stroke="#38bdf8" stroke-width="5" marker-end="url(#radio-arrow)" /><rect x="650.00" y="208.00" width="256.00" height="58.00" rx="18" fill="#111827" stroke="#334155" stroke-width="2" /><text x="778.00" y="244.00" fill="white" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">badges 82 | total 206</text><text x="1080.00" y="244.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">-2 badges, -4 total</text><text x="126.00" y="348.00" fill="#38bdf8" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold">beta-</text><rect x="220.00" y="318.00" width="256.00" height="58.00" rx="18" fill="#111827" stroke="#334155" stroke-width="2" /><text x="348.00" y="354.00" fill="white" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">badges 6 | total 14</text><line x1="490.00" y1="346.00" x2="620.00" y2="346.00" stroke="#38bdf8" stroke-width="5" marker-end="url(#radio-arrow)" /><rect x="650.00" y="318.00" width="256.00" height="58.00" rx="18" fill="#111827" stroke="#334155" stroke-width="2" /><text x="778.00" y="354.00" fill="white" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">badges 7 | total 14</text><text x="1080.00" y="354.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">+1 badge, total same</text><text x="126.00" y="458.00" fill="#a78bfa" text-anchor="middle" font-size="22" font-family="Arial" font-weight="bold">gamma</text><rect x="220.00" y="428.00" width="256.00" height="58.00" rx="18" fill="#111827" stroke="#334155" stroke-width="2" /><text x="348.00" y="464.00" fill="white" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">badges 27 | total 60</text><line x1="490.00" y1="456.00" x2="620.00" y2="456.00" stroke="#38bdf8" stroke-width="5" marker-end="url(#radio-arrow)" /><rect x="650.00" y="428.00" width="256.00" height="58.00" rx="18" fill="#111827" stroke="#334155" stroke-width="2" /><text x="778.00" y="464.00" fill="white" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">badges 27 | total 60</text><text x="1080.00" y="464.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">counts same, energy drops</text><text x="640.00" y="656.00" fill="#e2e8f0" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">Alpha changes both counts, beta-minus changes badge count only, gamma keeps the counts the same while energy changes.</text></svg>
