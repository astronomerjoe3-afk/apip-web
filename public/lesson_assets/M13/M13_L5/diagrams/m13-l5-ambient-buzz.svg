<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="radio-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Ambient Buzz</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Shows a detector surrounded by environmental background sources.</text><rect x="550.00" y="292.00" width="180.00" height="172.00" rx="18" fill="#111827" stroke="#93c5fd" stroke-width="3" /><text x="640.00" y="342.00" fill="white" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">Detector</text><text x="640.00" y="388.00" fill="#fde68a" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Ambient Buzz</text><text x="640.00" y="424.00" fill="#f8fafc" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">12 counts / min</text><text x="200.00" y="178.00" fill="#bfdbfe" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">cosmic rays</text><line x1="230.00" y1="190.00" x2="544.00" y2="314.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#radio-arrow)" /><text x="205.00" y="492.00" fill="#bfdbfe" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">rocks and soil</text><line x1="250.00" y1="476.00" x2="544.00" y2="446.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#radio-arrow)" /><text x="1070.00" y="186.00" fill="#bfdbfe" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">food and body</text><line x1="1018.00" y1="196.00" x2="736.00" y2="336.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#radio-arrow)" /><text x="1060.00" y="492.00" fill="#bfdbfe" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">air and buildings</text><line x1="1000.00" y1="476.00" x2="736.00" y2="452.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#radio-arrow)" /><text x="640.00" y="138.00" fill="#93c5fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">A detector is rarely silent because background radiation is always present.</text></svg>