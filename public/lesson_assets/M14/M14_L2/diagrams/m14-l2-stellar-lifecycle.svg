<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0b1020"/>
  <text x="640" y="70" fill="#ffffff" text-anchor="middle" font-size="38" font-family="Arial" font-weight="700">Stellar Lifecycle Branches by Mass</text>
  <text x="640" y="110" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">Stars share an early path, then split into different later routes depending on mass.</text>

  <rect x="90" y="188" width="180" height="78" rx="22" fill="#1d4ed8" stroke="#93c5fd" stroke-width="3"/>
  <rect x="332" y="188" width="190" height="78" rx="22" fill="#7c3aed" stroke="#c4b5fd" stroke-width="3"/>
  <rect x="584" y="188" width="236" height="78" rx="22" fill="#0f766e" stroke="#99f6e4" stroke-width="3"/>
  <text x="180" y="236" fill="#ffffff" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">Nebula</text>
  <text x="427" y="236" fill="#ffffff" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">Protostar</text>
  <text x="702" y="236" fill="#ffffff" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">Main-sequence star</text>
  <line x1="270" y1="227" x2="332" y2="227" stroke="#38bdf8" stroke-width="6"/>
  <line x1="522" y1="227" x2="584" y2="227" stroke="#38bdf8" stroke-width="6"/>

  <text x="806" y="322" fill="#fdba74" text-anchor="end" font-size="20" font-family="Arial" font-weight="700">lower-mass path</text>
  <line x1="820" y1="227" x2="896" y2="312" stroke="#38bdf8" stroke-width="6"/>
  <rect x="900" y="280" width="190" height="72" rx="20" fill="#ea580c" stroke="#fdba74" stroke-width="3"/>
  <text x="995" y="324" fill="#ffffff" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">Red giant</text>
  <line x1="1090" y1="316" x2="1160" y2="316" stroke="#38bdf8" stroke-width="6"/>
  <rect x="1140" y="280" width="110" height="72" rx="20" fill="#475569" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1195" y="310" fill="#ffffff" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">Planetary</text>
  <text x="1195" y="332" fill="#ffffff" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">nebula</text>
  <line x1="995" y1="352" x2="995" y2="430" stroke="#38bdf8" stroke-width="6"/>
  <rect x="900" y="430" width="190" height="72" rx="20" fill="#64748b" stroke="#e2e8f0" stroke-width="3"/>
  <text x="995" y="474" fill="#ffffff" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">White dwarf</text>

  <text x="806" y="560" fill="#fecaca" text-anchor="end" font-size="20" font-family="Arial" font-weight="700">higher-mass path</text>
  <line x1="820" y1="227" x2="900" y2="548" stroke="#38bdf8" stroke-width="6"/>
  <rect x="900" y="516" width="190" height="72" rx="20" fill="#b91c1c" stroke="#fecaca" stroke-width="3"/>
  <text x="995" y="560" fill="#ffffff" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">Red supergiant</text>
  <line x1="1090" y1="552" x2="1160" y2="552" stroke="#38bdf8" stroke-width="6"/>
  <rect x="1140" y="516" width="110" height="72" rx="20" fill="#dc2626" stroke="#fecaca" stroke-width="3"/>
  <text x="1195" y="560" fill="#ffffff" text-anchor="middle" font-size="20" font-family="Arial" font-weight="700">Supernova</text>
  <line x1="1195" y1="588" x2="1195" y2="636" stroke="#38bdf8" stroke-width="6"/>
  <rect x="1035" y="620" width="230" height="66" rx="20" fill="#111827" stroke="#cbd5e1" stroke-width="3"/>
  <text x="1150" y="649" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">Neutron star</text>
  <text x="1150" y="671" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">or black hole</text>

  <rect x="108" y="614" width="710" height="66" rx="22" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="463" y="654" fill="#ffffff" text-anchor="middle" font-size="23" font-family="Arial">Mass changes the later branch, so not all stars end the same way.</text>
</svg>
