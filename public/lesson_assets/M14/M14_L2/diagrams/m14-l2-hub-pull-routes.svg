<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="astro-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Hub pull and ring routes</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show how gravity and forward motion cooperate to shape an orbit without any physical rail in space.</text><circle cx="320.00" cy="360.00" r="44.00" fill="#facc15" stroke="#fde68a" stroke-width="5" /><line x1="320.00" y1="321.50" x2="320.00" y2="290.00" stroke="#fbbf24" stroke-width="5" /><line x1="353.00" y1="338.00" x2="380.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="361.25" y1="360.00" x2="395.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="353.00" y1="382.00" x2="380.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="320.00" y1="398.50" x2="320.00" y2="430.00" stroke="#fbbf24" stroke-width="5" /><line x1="287.00" y1="382.00" x2="260.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="278.75" y1="360.00" x2="245.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="287.00" y1="338.00" x2="260.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><ellipse cx="320.00" cy="360.00" rx="170.00" ry="108.00" fill="none" stroke="#475569" stroke-width="3" /><circle cx="490.00" cy="360.00" r="16.00" fill="#60a5fa" stroke="#60a5fa" stroke-width="0" /><text x="490.00" y="496.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">world rider</text><line x1="456.00" y1="304.00" x2="372.00" y2="342.00" stroke="#f97316" stroke-width="6" marker-end="url(#astro-arrow)" /><text x="534.00" y="286.00" fill="#fdba74" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">hub pull = gravity</text><line x1="432.00" y1="442.00" x2="484.00" y2="442.00" stroke="#38bdf8" stroke-width="5" marker-end="url(#astro-arrow)" /><text x="580.00" y="448.00" fill="#bae6fd" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">forward motion</text><text x="925.00" y="260.00" fill="#f8fafc" text-anchor="middle" font-size="24" font-family="Arial" font-weight="normal">Ring routes are pull-guided paths, not metal tracks.</text><text x="925.00" y="304.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Gravity keeps planets orbiting the Sun and moons orbiting planets.</text><text x="925.00" y="346.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Orbit shape comes from hub pull plus continuing forward motion.</text></svg>