<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="astro-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
  <text x="640" y="70" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Spin for daylight</text>
  <text x="640" y="105" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">Show one lit half, one dark half, and the spin axis so the daily cycle stays tied to rotation.</text>

  <circle cx="220" cy="360" r="48" fill="#facc15" stroke="#fde68a" stroke-width="5" />
  <line x1="220" y1="321.5" x2="220" y2="290" stroke="#fbbf24" stroke-width="5" />
  <line x1="253" y1="338" x2="280" y2="320" stroke="#fbbf24" stroke-width="5" />
  <line x1="261.25" y1="360" x2="295" y2="360" stroke="#fbbf24" stroke-width="5" />
  <line x1="253" y1="382" x2="280" y2="400" stroke="#fbbf24" stroke-width="5" />
  <line x1="220" y1="398.5" x2="220" y2="430" stroke="#fbbf24" stroke-width="5" />
  <line x1="187" y1="382" x2="160" y2="400" stroke="#fbbf24" stroke-width="5" />
  <line x1="178.75" y1="360" x2="145" y2="360" stroke="#fbbf24" stroke-width="5" />
  <line x1="187" y1="338" x2="160" y2="320" stroke="#fbbf24" stroke-width="5" />
  <line x1="288" y1="360" x2="648" y2="360" stroke="#facc15" stroke-width="8" />

  <circle cx="760" cy="360" r="110" fill="#2563eb" stroke="#93c5fd" stroke-width="4" />
  <rect x="650" y="250" width="110" height="220" fill="#1e293b" />
  <line x1="760" y1="214" x2="760" y2="506" stroke="#f8fafc" stroke-width="4" />
  <text x="760" y="196" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial">spin axis</text>
  <line x1="842" y1="236" x2="842" y2="486" stroke="#38bdf8" stroke-width="5" marker-end="url(#astro-arrow)" />

  <text x="726" y="236" fill="#fde68a" text-anchor="middle" font-size="20" font-family="Arial">day side</text>
  <text x="850" y="504" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">night side</text>
  <circle cx="718" cy="350" r="10" fill="#ef4444" />

  <rect x="920" y="254" width="286" height="156" rx="24" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="1063" y="304" fill="#f8fafc" text-anchor="middle" font-size="28" font-family="Arial" font-weight="700">Spin makes day and night.</text>
  <text x="1063" y="344" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">A place rotates into sunlight</text>
  <text x="1063" y="370" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">and later rotates out again.</text>
  <text x="1063" y="398" fill="#93c5fd" text-anchor="middle" font-size="18" font-family="Arial">Rotation, not orbit, causes the daily cycle.</text>
</svg>
