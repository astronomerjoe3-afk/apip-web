<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0b1020"/>
  <text x="640" y="72" fill="#ffffff" text-anchor="middle" font-size="38" font-family="Arial" font-weight="700">Stretch-Red Drift from Expansion</text>
  <text x="640" y="112" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">As space stretches during travel, the arriving light is observed at longer, redder wavelengths.</text>
  <text x="302" y="194" fill="#bfdbfe" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700">emitted wavelength</text>
  <text x="954" y="194" fill="#fca5a5" text-anchor="middle" font-size="26" font-family="Arial" font-weight="700">stretched observed wavelength</text>
  <rect x="166" y="244" width="32" height="182" rx="8" fill="#38bdf8"/>
  <rect x="214" y="244" width="32" height="182" rx="8" fill="#60a5fa"/>
  <rect x="262" y="244" width="32" height="182" rx="8" fill="#818cf8"/>
  <rect x="310" y="244" width="32" height="182" rx="8" fill="#a78bfa"/>
  <rect x="358" y="244" width="32" height="182" rx="8" fill="#f472b6"/>
  <rect x="406" y="244" width="32" height="182" rx="8" fill="#fb7185"/>
  <rect x="764" y="244" width="46" height="182" rx="8" fill="#38bdf8"/>
  <rect x="826" y="244" width="46" height="182" rx="8" fill="#60a5fa"/>
  <rect x="888" y="244" width="46" height="182" rx="8" fill="#818cf8"/>
  <rect x="950" y="244" width="46" height="182" rx="8" fill="#a78bfa"/>
  <rect x="1012" y="244" width="46" height="182" rx="8" fill="#f472b6"/>
  <rect x="1074" y="244" width="46" height="182" rx="8" fill="#fb7185"/>
  <line x1="462" y1="334" x2="710" y2="334" stroke="#fbbf24" stroke-width="8"/>
  <polygon points="710,334 674,316 674,352" fill="#fbbf24"/>
  <text x="586" y="302" fill="#fde68a" text-anchor="middle" font-size="22" font-family="Arial">space expands while light travels</text>
  <text x="302" y="476" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial">nearer city = smaller stretch</text>
  <text x="954" y="476" fill="#fca5a5" text-anchor="middle" font-size="22" font-family="Arial">farther city = larger redshift</text>
  <rect x="210" y="544" width="860" height="66" rx="20" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="640" y="586" fill="#ffffff" text-anchor="middle" font-size="23" font-family="Arial">Redshift is evidence that the universe is expanding because the wavelength is stretched during travel.</text>
</svg>
