<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="100%" height="100%" fill="#0b1020" />
  <text x="640" y="70" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Moon face challenge</text>
  <text x="640" y="105" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">Show Earth, Moon, and the Sun so the visible phase is read from geometry rather than from shadow.</text>

  <circle cx="180" cy="360" r="42" fill="#facc15" stroke="#fde68a" stroke-width="5" />
  <line x1="180" y1="321.5" x2="180" y2="290" stroke="#fbbf24" stroke-width="5" />
  <line x1="213" y1="338" x2="240" y2="320" stroke="#fbbf24" stroke-width="5" />
  <line x1="221.25" y1="360" x2="255" y2="360" stroke="#fbbf24" stroke-width="5" />
  <line x1="213" y1="382" x2="240" y2="400" stroke="#fbbf24" stroke-width="5" />
  <line x1="180" y1="398.5" x2="180" y2="430" stroke="#fbbf24" stroke-width="5" />
  <line x1="147" y1="382" x2="120" y2="400" stroke="#fbbf24" stroke-width="5" />
  <line x1="138.75" y1="360" x2="105" y2="360" stroke="#fbbf24" stroke-width="5" />
  <line x1="147" y1="338" x2="120" y2="320" stroke="#fbbf24" stroke-width="5" />
  <line x1="240" y1="360" x2="570" y2="360" stroke="#facc15" stroke-width="6" />

  <circle cx="700" cy="360" r="74" fill="#2563eb" stroke="#93c5fd" stroke-width="4" />
  <ellipse cx="700" cy="360" rx="150" ry="150" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 8" />
  <line x1="700" y1="360" x2="700" y2="220" stroke="#38bdf8" stroke-width="3" />
  <text x="700" y="366" fill="#f8fafc" text-anchor="middle" font-size="20" font-family="Arial">Earth</text>

  <circle cx="700" cy="220" r="24" fill="#64748b" stroke="#cbd5e1" stroke-width="2" />
  <rect x="676" y="196" width="24" height="48" rx="12" fill="#f8fafc" />
  <text x="700" y="186" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial">Moon</text>

  <rect x="878" y="216" width="362" height="190" rx="24" fill="#172033" stroke="#334155" stroke-width="2"/>
  <text x="1059" y="264" fill="#f8fafc" text-anchor="middle" font-size="25" font-family="Arial" font-weight="700">Visible phase comes</text>
  <text x="1059" y="294" fill="#f8fafc" text-anchor="middle" font-size="25" font-family="Arial" font-weight="700">from geometry.</text>
  <text x="1059" y="332" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">The Moon is always half lit by the Sun.</text>
  <text x="1059" y="364" fill="#fde68a" text-anchor="middle" font-size="20" font-family="Arial">Shown here: a quarter Moon.</text>
  <text x="1059" y="392" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">Earth's shadow matters only</text>
  <text x="1059" y="416" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial">during a lunar eclipse.</text>
</svg>
