<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0b1020"/>
  <text x="640" y="72" fill="#ffffff" text-anchor="middle" font-size="38" font-family="Arial" font-weight="700">Signal-Year Distance Scale</text>
  <text x="640" y="112" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">A light-year is a distance unit, used because ordinary units become too small for cosmic scales.</text>
  <line x1="134" y1="354" x2="1146" y2="354" stroke="#64748b" stroke-width="6"/>
  <circle cx="134" cy="354" r="12" fill="#f8fafc"/>
  <circle cx="414" cy="354" r="18" fill="#38bdf8" stroke="#bfdbfe" stroke-width="3"/>
  <circle cx="740" cy="354" r="18" fill="#a78bfa" stroke="#ddd6fe" stroke-width="3"/>
  <circle cx="1098" cy="354" r="24" fill="#f97316" stroke="#fdba74" stroke-width="3"/>
  <text x="134" y="306" fill="#e2e8f0" text-anchor="middle" font-size="18" font-family="Arial">local start</text>
  <text x="414" y="306" fill="#e2e8f0" text-anchor="middle" font-size="18" font-family="Arial">a few light-years</text>
  <text x="740" y="306" fill="#e2e8f0" text-anchor="middle" font-size="18" font-family="Arial">hundreds of light-years</text>
  <text x="1098" y="306" fill="#e2e8f0" text-anchor="middle" font-size="18" font-family="Arial">about 100,000 light-years</text>
  <text x="134" y="410" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">nearby comparison</text>
  <text x="414" y="410" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">nearby star</text>
  <text x="740" y="410" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">star-forming region</text>
  <text x="1098" y="410" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial">Milky Way width scale</text>
  <rect x="228" y="492" width="824" height="108" rx="24" fill="#111827" stroke="#334155" stroke-width="3"/>
  <text x="640" y="542" fill="#ffffff" text-anchor="middle" font-size="30" font-family="Arial" font-weight="700">1 light-year = distance light travels in one year</text>
  <text x="640" y="584" fill="#93c5fd" text-anchor="middle" font-size="24" font-family="Arial">It answers a distance question, not a time question.</text>
</svg>
