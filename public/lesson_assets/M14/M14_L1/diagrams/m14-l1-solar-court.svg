<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Build the Solar Court</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show the Solar System as one Sun-centered family with several classes of bodies.</text><circle cx="350.00" cy="360.00" r="48.00" fill="#facc15" stroke="#fde68a" stroke-width="5" /><line x1="350.00" y1="321.50" x2="350.00" y2="290.00" stroke="#fbbf24" stroke-width="5" /><line x1="383.00" y1="338.00" x2="410.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="391.25" y1="360.00" x2="425.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="383.00" y1="382.00" x2="410.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="350.00" y1="398.50" x2="350.00" y2="430.00" stroke="#fbbf24" stroke-width="5" /><line x1="317.00" y1="382.00" x2="290.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="308.75" y1="360.00" x2="275.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="317.00" y1="338.00" x2="290.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><text x="350.00" y="368.00" fill="#0f172a" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">Sun</text><ellipse cx="350.00" cy="360.00" rx="130.00" ry="90.00" fill="none" stroke="#475569" stroke-width="3" /><ellipse cx="350.00" cy="360.00" rx="230.00" ry="150.00" fill="none" stroke="#475569" stroke-width="3" /><ellipse cx="350.00" cy="360.00" rx="340.00" ry="220.00" fill="none" stroke="#475569" stroke-width="3" /><circle cx="480.00" cy="360.00" r="14.00" fill="#60a5fa" stroke="#60a5fa" stroke-width="0" /><text x="480.00" y="484.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">planet</text><circle cx="188.00" cy="476.00" r="10.00" fill="#a78bfa" stroke="#a78bfa" stroke-width="0" /><text x="188.00" y="510.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">dwarf planet</text><circle cx="394.00" cy="140.00" r="8.00" fill="#cbd5e1" stroke="#cbd5e1" stroke-width="0" /><text x="394.00" y="166.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">moon</text><circle cx="364.00" cy="206.00" r="6.00" fill="#f97316" stroke="#f97316" stroke-width="0" /><text x="476.00" y="182.00" fill="#fdba74" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">rock swarm</text><line x1="572.00" y1="166.00" x2="514.00" y2="206.00" stroke="#f97316" stroke-width="3" /><ellipse cx="970.00" cy="310.00" rx="125.00" ry="70.00" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8" /><circle cx="1088.00" cy="282.00" r="10.00" fill="#bae6fd" stroke="#bae6fd" stroke-width="0" /><text x="1050.00" y="220.00" fill="#bae6fd" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">ice visitor</text><line x1="1026.00" y1="232.00" x2="1082.00" y2="274.00" stroke="#38bdf8" stroke-width="3" /><text x="920.00" y="130.00" fill="#fde68a" text-anchor="middle" font-size="24" font-family="Arial" font-weight="normal">One Great Lantern lights the whole court.</text><text x="920.00" y="168.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Planets, dwarf planets, moons, asteroids, and comets all belong to one Sun-centered family.</text></svg>