<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#f3f0ff" stroke="#7c3aed" stroke-width="3"/>

  <text x="700" y="96" fill="#5b21b6" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Potential Maps and Equipotential Routes
  </text>
  <text x="700" y="140" fill="#6d28d9" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Potential tells you electric height. Field arrows show the steepest downhill direction across that map.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
  <rect x="126" y="226" width="676" height="486" rx="30" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2.5"/>
  <rect x="834" y="226" width="440" height="486" rx="30" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2.5"/>

  <text x="464" y="268" fill="#6d28d9" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Equipotential map
  </text>
  <text x="1054" y="268" fill="#6d28d9" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Reading rules
  </text>

  <circle cx="366" cy="468" r="38" fill="#7c3aed"/>
  <text x="366" y="478" fill="#ffffff" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <circle cx="366" cy="468" r="98" fill="none" stroke="#a78bfa" stroke-width="5"/>
  <circle cx="366" cy="468" r="168" fill="none" stroke="#a78bfa" stroke-width="5"/>
  <circle cx="366" cy="468" r="236" fill="none" stroke="#a78bfa" stroke-width="5"/>

  <path d="M462 468 C520 468, 576 468, 622 468" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <polygon points="622,468 592,452 592,484" fill="#16a34a"/>
  <text x="640" y="458" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">field arrow</text>
  <text x="640" y="486" fill="#166534" font-size="20" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600">points toward lower V</text>

  <path d="M198 468 C198 404, 250 350, 318 332" fill="none" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="318,332 286,324 296,352" fill="#f97316"/>
  <text x="196" y="386" fill="#c2410c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">walk along</text>
  <text x="196" y="414" fill="#c2410c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">same V route</text>

  <line x1="470" y1="398" x2="560" y2="318" stroke="#0f766e" stroke-width="7" stroke-linecap="round"/>
  <polygon points="560,318 530,322 542,348" fill="#0f766e"/>
  <text x="580" y="320" fill="#0f766e" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">crossing is at 90 deg</text>

  <rect x="878" y="304" width="352" height="108" rx="24" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="1054" y="342" fill="#5b21b6" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <tspan x="1054" dy="0">Potential = energy</tspan>
    <tspan x="1054" dy="28">per unit charge</tspan>
  </text>
  <text x="1054" y="388" fill="#6d28d9" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <tspan x="1054" dy="0">It is a location property,</tspan>
    <tspan x="1054" dy="24">not a route arrow.</tspan>
  </text>

  <rect x="878" y="446" width="352" height="108" rx="24" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="1054" y="484" fill="#5b21b6" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <tspan x="1054" dy="0">Stay on one contour:</tspan>
    <tspan x="1054" dy="28">dV = 0</tspan>
  </text>
  <text x="1054" y="530" fill="#6d28d9" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <tspan x="1054" dy="0">Cross contours and the</tspan>
    <tspan x="1054" dy="24">electric height changes.</tspan>
  </text>

  <rect x="878" y="588" width="352" height="108" rx="24" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
  <text x="1054" y="626" fill="#5b21b6" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <tspan x="1054" dy="0">Field lines cut</tspan>
    <tspan x="1054" dy="28">equipotentials squarely</tspan>
  </text>
  <text x="1054" y="672" fill="#6d28d9" font-size="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    <tspan x="1054" dy="0">Direction comes from slope,</tspan>
    <tspan x="1054" dy="24">not from the contour itself.</tspan>
  </text>
</svg>
