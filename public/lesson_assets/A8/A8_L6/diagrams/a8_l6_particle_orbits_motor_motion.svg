  <text x="402" y="268" fill="#1d4ed8" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Charged particle orbit
  </text>
  <text x="998" y="268" fill="#1d4ed8" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Motor turning effect
  </text>

  <text x="188" y="360" fill="#1e40af" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
