  <text x="308" y="430" fill="#1e40af" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="188" y="500" fill="#1e40af" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="248" y="500" fill="#1e40af" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="308" y="500" fill="#1e40af" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="238" y="560" fill="#1e40af" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">B into page</text>

  <circle cx="430" cy="476" r="132" fill="none" stroke="#0ea5e9" stroke-width="7"/>
  <circle cx="430" cy="344" r="18" fill="#2563eb"/>
  <text x="430" y="352" fill="#ffffff" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <line x1="430" y1="326" x2="430" y2="278" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <polygon points="430,278 414,306 446,306" fill="#16a34a"/>
