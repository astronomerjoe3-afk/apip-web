  <text x="1088" y="338" fill="#b45309" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">force up</text>
  <path d="M998 618 C1058 610, 1128 584, 1162 528" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1162,528 1138,538 1166,556" fill="#ef4444"/>
  <text x="998" y="642" fill="#1e40af" font-size="21" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <tspan x="998" dy="0">Opposite forces on the two sides</tspan>
    <tspan x="998" dy="26">create a turning moment.</tspan>
  </text>
