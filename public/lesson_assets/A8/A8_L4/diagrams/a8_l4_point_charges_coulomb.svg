<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>

  <text x="700" y="96" fill="#c2410c" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Coulomb Force Depends on Charge Size and Separation
  </text>
  <text x="700" y="140" fill="#9a3412" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    Attraction versus repulsion comes from charge sign. Strength comes from charge product and weakens with one over r squared.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#fdba74" stroke-width="3"/>
  <rect x="126" y="226" width="552" height="486" rx="30" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5"/>
  <rect x="722" y="226" width="552" height="486" rx="30" fill="#fff7ed" stroke="#fed7aa" stroke-width="2.5"/>

  <text x="402" y="268" fill="#c2410c" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Sign sets direction
  </text>
  <text x="998" y="268" fill="#c2410c" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Size and separation set strength
  </text>

  <circle cx="250" cy="430" r="42" fill="#2563eb"/>
  <text x="250" y="442" fill="#ffffff" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <circle cx="550" cy="430" r="42" fill="#2563eb"/>
  <text x="550" y="442" fill="#ffffff" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <line x1="316" y1="430" x2="404" y2="430" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <polygon points="316,430 344,414 344,446" fill="#ef4444"/>
  <line x1="484" y1="430" x2="396" y2="430" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <polygon points="484,430 456,414 456,446" fill="#ef4444"/>
  <text x="400" y="388" fill="#b91c1c" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    like charges repel
  </text>

  <circle cx="250" cy="584" r="42" fill="#2563eb"/>
  <text x="250" y="596" fill="#ffffff" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <circle cx="550" cy="584" r="42" fill="#f97316"/>
  <text x="550" y="596" fill="#ffffff" font-size="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">-</text>
  <line x1="316" y1="584" x2="396" y2="584" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <polygon points="396,584 368,568 368,600" fill="#16a34a"/>
  <line x1="484" y1="584" x2="404" y2="584" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>
  <polygon points="404,584 432,568 432,600" fill="#16a34a"/>
  <text x="400" y="642" fill="#166534" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    unlike charges attract
  </text>

  <rect x="806" y="332" width="388" height="128" rx="28" fill="#ffffff" stroke="#fb923c" stroke-width="2.5"/>
  <text x="1000" y="378" fill="#c2410c" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    F grows with bigger q1 and q2
  </text>
  <text x="1000" y="414" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    More source charge means a stronger electric interaction.
  </text>

  <rect x="806" y="492" width="388" height="170" rx="28" fill="#ffffff" stroke="#fb923c" stroke-width="2.5"/>
  <line x1="854" y1="578" x2="1146" y2="578" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="904" cy="578" r="22" fill="#2563eb"/>
  <text x="904" y="586" fill="#ffffff" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <circle cx="1096" cy="578" r="22" fill="#f97316"/>
  <text x="1096" y="586" fill="#ffffff" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">-</text>
  <text x="1000" y="534" fill="#c2410c" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Double r and force drops by four
  </text>
  <text x="1000" y="620" fill="#9a3412" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle">
    That is the inverse-square part of Coulomb's law.
  </text>
</svg>
