<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="70" y="56" width="180" height="40" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="160" y="82" fill="#5b21b6" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="160" dy="0">A8 lesson board</tspan></text>
  <text x="70" y="144" fill="#0f172a" font-size="35" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="70" dy="0">Charge size and separation both</tspan><tspan x="70" dy="43">control the radial force landscape</tspan></text>
  <text x="70" y="202" fill="#475569" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start"><tspan x="70" dy="0">The radial-force board keeps source size, separation, and attraction-versus-repulsion</tspan><tspan x="70" dy="31">together so inverse-square reasoning is read geometrically.</tspan></text>
  <rect x="70" y="242" width="740" height="518" rx="36" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><rect x="106" y="284" width="668" height="94" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="440" y="322" fill="#5b21b6" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Point Charges and Coulomb's Law</tspan></text><rect x="118" y="400" width="160" height="136" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="198" y="436" fill="#5b21b6" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">Like charges repel</tspan><tspan x="198" dy="23">and unlike charges</tspan><tspan x="198" dy="23">attract.</tspan></text><rect x="326" y="400" width="160" height="136" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="406" y="436" fill="#5b21b6" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">Force depends on</tspan><tspan x="406" dy="23">both charge</tspan><tspan x="406" dy="23">values.</tspan></text><rect x="534" y="400" width="160" height="136" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="614" y="436" fill="#5b21b6" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">Force falls with</tspan><tspan x="614" dy="23">the square of</tspan><tspan x="614" dy="23">separation.</tspan></text><line x1="280" y1="468" x2="314" y2="468" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="468" x2="522" y2="468" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><rect x="106" y="566" width="668" height="156" rx="28" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/><text x="136" y="602" fill="#5b21b6" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="638" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Change the separation before you change the charge size.</tspan><tspan x="136" dy="31">That makes the inverse-square effect easier to spot.</tspan></text>
  <rect x="860" y="280" width="470" height="96" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="890" y="308" fill="#5b21b6" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="338" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Like charges repel and unlike</tspan><tspan x="890" dy="29">charges attract.</tspan></text><rect x="860" y="404" width="470" height="96" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="890" y="432" fill="#5b21b6" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="462" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Force depends on both charge</tspan><tspan x="890" dy="29">values.</tspan></text><rect x="860" y="528" width="470" height="96" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="890" y="556" fill="#5b21b6" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="586" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Force falls with the square of</tspan><tspan x="890" dy="29">separation.</tspan></text>
  <rect x="860" y="652" width="470" height="108" rx="28" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="890" y="686" fill="#5b21b6" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="720" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Coulomb's law is a radial charge-and-distance rule with</tspan><tspan x="890" dy="31">inverse-square weakening.</tspan></text>
</svg>