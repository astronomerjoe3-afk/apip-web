<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <rect x="24" y="24" width="1352" height="772" rx="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="70" y="90" width="740" height="518" rx="36" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><rect x="106" y="132" width="668" height="94" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="440" y="170" fill="#5b21b6" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle"><tspan x="440" dy="0">Uniform Fields and Parallel Plates</tspan></text><rect x="118" y="248" width="160" height="136" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="198" y="284" fill="#5b21b6" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="198" dy="0">A uniform field</tspan><tspan x="198" dy="23">has the same size</tspan><tspan x="198" dy="23">and direction</tspan><tspan x="198" dy="23">throughout the</tspan><tspan x="198" dy="23">central gap.</tspan></text><rect x="326" y="248" width="160" height="136" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="406" y="284" fill="#5b21b6" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="406" dy="0">Field strength in</tspan><tspan x="406" dy="23">the gap is delta V</tspan><tspan x="406" dy="23">divided by</tspan><tspan x="406" dy="23">separation.</tspan></text><rect x="534" y="248" width="160" height="136" rx="28" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="614" y="284" fill="#5b21b6" font-size="18" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle"><tspan x="614" dy="0">Smaller plate</tspan><tspan x="614" dy="23">spacing means a</tspan><tspan x="614" dy="23">steeper electric</tspan><tspan x="614" dy="23">slope at fixed</tspan><tspan x="614" dy="23">voltage.</tspan></text><line x1="280" y1="316" x2="314" y2="316" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><line x1="488" y1="316" x2="522" y2="316" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/><rect x="106" y="414" width="668" height="156" rx="28" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/><text x="136" y="450" fill="#5b21b6" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="136" dy="0">Try it in action</tspan></text><text x="136" y="486" fill="#334155" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="start"><tspan x="136" dy="0">Hold the voltage fixed and shrink the gap. That one</tspan><tspan x="136" dy="31">comparison shows why E = delta V divided by d is an</tspan><tspan x="136" dy="31">electric-slope story.</tspan></text>
  <rect x="860" y="128" width="470" height="96" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="890" y="156" fill="#5b21b6" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 1</tspan></text><text x="890" y="186" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">A uniform field has the same</tspan><tspan x="890" dy="29">size and direction throughout</tspan><tspan x="890" dy="29">the central gap.</tspan></text><rect x="860" y="252" width="470" height="96" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="890" y="280" fill="#5b21b6" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 2</tspan></text><text x="890" y="310" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Field strength in the gap is</tspan><tspan x="890" dy="29">delta V divided by separation.</tspan></text><rect x="860" y="376" width="470" height="96" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text x="890" y="404" fill="#5b21b6" font-size="15" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Key 3</tspan></text><text x="890" y="434" fill="#334155" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Smaller plate spacing means a</tspan><tspan x="890" dy="29">steeper electric slope at fixed</tspan><tspan x="890" dy="29">voltage.</tspan></text>
  <rect x="860" y="500" width="470" height="108" rx="28" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text x="890" y="534" fill="#5b21b6" font-size="16" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="start"><tspan x="890" dy="0">Lesson takeaway</tspan></text>
  <text x="890" y="568" fill="#334155" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="start"><tspan x="890" dy="0">Uniform-field strength is the potential drop per unit distance</tspan><tspan x="890" dy="31">between the plates.</tspan></text>
</svg>