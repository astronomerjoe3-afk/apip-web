<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#fcfbff"/>
  <rect x="34" y="30" width="1332" height="760" rx="40" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
  <text x="700" y="110" fill="#5b21b6" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Electric Field and Test Charges</text>
  <text x="700" y="154" fill="#6d28d9" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">The field belongs to the location. A test charge only samples what is already there.</text>

  <rect x="118" y="214" width="1164" height="450" rx="36" fill="#ffffff" stroke="#a78bfa" stroke-width="3"/>
  <circle cx="460" cy="438" r="54" fill="#7c3aed"/>
  <text x="460" y="448" fill="#ffffff" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <text x="460" y="520" fill="#5b21b6" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">source charge</text>

  <line x1="460" y1="438" x2="320" y2="338" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <polygon points="320,338 336,362 348,338" fill="#8b5cf6"/>
  <line x1="460" y1="438" x2="632" y2="332" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <polygon points="632,332 604,330 618,354" fill="#8b5cf6"/>
  <line x1="460" y1="438" x2="650" y2="438" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <polygon points="650,438 622,426 622,450" fill="#8b5cf6"/>
  <line x1="460" y1="438" x2="330" y2="554" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <polygon points="330,554 358,552 344,530" fill="#8b5cf6"/>
  <line x1="460" y1="438" x2="622" y2="566" stroke="#8b5cf6" stroke-width="8" stroke-linecap="round"/>
  <polygon points="622,566 610,540 592,560" fill="#8b5cf6"/>

  <circle cx="840" cy="332" r="26" fill="#22c55e"/>
  <text x="840" y="341" fill="#ffffff" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <text x="910" y="326" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">small test charge</text>
  <path d="M 838 358 Q 828 420 838 486" fill="none" stroke="#16a34a" stroke-width="6" stroke-dasharray="12 10" stroke-linecap="round"/>
  <text x="932" y="434" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">move the probe,</text>
  <text x="932" y="466" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">do not redefine the field</text>

  <text x="700" y="714" fill="#5b21b6" font-size="28" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">Field lines map direction. They are not literal particle tracks.</text>
</svg>
