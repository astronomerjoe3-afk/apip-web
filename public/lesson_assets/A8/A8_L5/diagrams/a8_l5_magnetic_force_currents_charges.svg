<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f7fbff"/>
  <rect x="28" y="26" width="1344" height="768" rx="40" fill="#effcf6" stroke="#16a34a" stroke-width="3"/>

  <text x="700" y="96" fill="#15803d" font-size="42" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Magnetic Force Acts Sideways to B and Motion
  </text>
  <text x="700" y="140" fill="#166534" font-size="23" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="500" text-anchor="middle">
    A magnetic field bends a moving charge or current path at right angles. It steers instead of pushing forward along B.
  </text>

  <rect x="84" y="186" width="1232" height="566" rx="34" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <rect x="126" y="226" width="590" height="486" rx="30" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2.5"/>
  <rect x="748" y="226" width="526" height="486" rx="30" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2.5"/>

  <text x="421" y="268" fill="#15803d" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Moving charge
  </text>
  <text x="1011" y="268" fill="#15803d" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    Current direction test
  </text>

  <text x="224" y="360" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="286" y="360" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="348" y="360" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="224" y="438" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="286" y="438" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="348" y="438" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="224" y="516" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="286" y="516" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="348" y="516" fill="#166534" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">x</text>
  <text x="248" y="578" fill="#166534" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">B into page</text>

  <circle cx="440" cy="438" r="34" fill="#2563eb"/>
  <text x="440" y="450" fill="#ffffff" font-size="30" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">+</text>
  <line x1="490" y1="438" x2="618" y2="438" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <polygon points="618,438 590,422 590,454" fill="#0ea5e9"/>
  <text x="554" y="420" fill="#0369a1" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">v</text>
  <line x1="440" y1="388" x2="440" y2="292" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <polygon points="440,292 424,320 456,320" fill="#ef4444"/>
  <text x="462" y="318" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">F</text>
  <text x="422" y="646" fill="#166534" font-size="24" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    Force is perpendicular to both v and B.
  </text>

  <rect x="804" y="326" width="414" height="142" rx="28" fill="#ffffff" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="858" y1="398" x2="1018" y2="398" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1018,398 990,382 990,414" fill="#0ea5e9"/>
  <text x="938" y="378" fill="#0369a1" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">I right</text>
  <line x1="938" y1="398" x2="938" y2="318" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <polygon points="938,318 922,346 954,346" fill="#ef4444"/>
  <text x="962" y="346" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">F up</text>
  <text x="1094" y="360" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">same B into page</text>
  <text x="1094" y="396" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">use field + current</text>
  <text x="1094" y="432" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">to predict force</text>

  <rect x="804" y="500" width="414" height="142" rx="28" fill="#ffffff" stroke="#4ade80" stroke-width="2.5"/>
  <line x1="1018" y1="572" x2="858" y2="572" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <polygon points="858,572 886,556 886,588" fill="#0ea5e9"/>
  <text x="938" y="552" fill="#0369a1" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">reverse I</text>
  <line x1="938" y1="572" x2="938" y2="652" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
  <polygon points="938,652 922,624 954,624" fill="#ef4444"/>
  <text x="962" y="626" fill="#b91c1c" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">F down</text>
  <text x="1094" y="552" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">reversing field or current</text>
  <text x="1094" y="588" fill="#166534" font-size="22" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700">flips the magnetic force</text>
</svg>
