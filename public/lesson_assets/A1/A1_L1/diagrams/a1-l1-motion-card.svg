<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f8fbff"/>
  <text x="52" y="74" fill="#16213e" font-family="Georgia, serif" font-size="54" font-weight="700">The Five-Slot Motion Card</text>
  <text x="52" y="126" fill="#475569" font-family="Georgia, serif" font-size="28">Use one card for one constant-acceleration story, then choose the relation that matches the known slots.</text>
  <rect x="48" y="176" width="1104" height="446" rx="36" fill="#edf6ff" stroke="#93c5fd" stroke-width="6"/>
  <g font-family="Georgia, serif">
    <rect x="90" y="250" width="180" height="190" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
    <text x="124" y="314" fill="#1d4ed8" font-size="48" font-weight="700">u</text>
    <text x="124" y="368" fill="#334155" font-size="28">start pace</text>
    <rect x="300" y="250" width="180" height="190" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
    <text x="334" y="314" fill="#1d4ed8" font-size="48" font-weight="700">v</text>
    <text x="334" y="368" fill="#334155" font-size="28">end pace</text>
    <rect x="510" y="250" width="180" height="190" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
    <text x="544" y="314" fill="#1d4ed8" font-size="48" font-weight="700">s</text>
    <text x="544" y="368" fill="#334155" font-size="28">run span</text>
    <rect x="720" y="250" width="180" height="190" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
    <text x="754" y="314" fill="#1d4ed8" font-size="48" font-weight="700">a</text>
    <text x="754" y="368" fill="#334155" font-size="28">steady shift</text>
    <rect x="930" y="250" width="180" height="190" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="4"/>
    <text x="964" y="314" fill="#1d4ed8" font-size="48" font-weight="700">t</text>
    <text x="964" y="368" fill="#334155" font-size="28">clock count</text>
  </g>
  <path d="M180 474H1018" stroke="#2563eb" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 14"/>
  <text x="138" y="530" fill="#1e3a8a" font-family="Georgia, serif" font-size="34" font-weight="700">One event, one lane, one constant acceleration</text>
  <text x="138" y="576" fill="#475569" font-family="Georgia, serif" font-size="30">SUVAT works because these quantities belong to the same steady-push story.</text>
</svg>
