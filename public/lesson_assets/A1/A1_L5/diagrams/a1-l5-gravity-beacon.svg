<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f7f7fb"/>
  <text x="58" y="74" fill="#1f2a56" font-size="56" font-family="Georgia, serif" font-weight="700">Gravity Beacon Zone</text>
  <text x="58" y="128" fill="#496489" font-size="28" font-family="Georgia, serif">A mass beacon sets a radial pull map that weakens with distance.</text>

  <rect x="54" y="174" width="1070" height="458" rx="32" fill="#eef2ff" stroke="#cbd5e1" stroke-width="6"/>
  <circle cx="596" cy="408" r="54" fill="#334155"/>
  <circle cx="596" cy="408" r="112" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.45"/>
  <circle cx="596" cy="408" r="188" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.3"/>
  <circle cx="596" cy="408" r="262" fill="none" stroke="#94a3b8" stroke-width="4" opacity="0.18"/>

  <line x1="596" y1="176" x2="596" y2="292" stroke="#0f766e" stroke-width="12"/>
  <polygon points="596,176 578,208 614,208" fill="#0f766e"/>
  <line x1="878" y1="408" x2="762" y2="408" stroke="#0f766e" stroke-width="12"/>
  <polygon points="762,408 794,388 794,428" fill="#0f766e"/>
  <line x1="596" y1="640" x2="596" y2="524" stroke="#0f766e" stroke-width="12"/>
  <polygon points="596,524 578,556 614,556" fill="#0f766e"/>
  <line x1="314" y1="408" x2="430" y2="408" stroke="#0f766e" stroke-width="12"/>
  <polygon points="430,408 398,388 398,428" fill="#0f766e"/>

  <circle cx="782" cy="408" r="14" fill="#7c3aed"/>
  <circle cx="862" cy="408" r="14" fill="#7c3aed"/>
  <text x="736" y="330" fill="#0f766e" font-size="28" font-family="Georgia, serif" font-weight="700">field points inward</text>

  <text x="138" y="564" fill="#1f2a56" font-size="28" font-family="Georgia, serif" font-weight="700">Same field point, same pull per kilogram.</text>
  <text x="138" y="602" fill="#496489" font-size="24" font-family="Georgia, serif">A heavier test probe feels more force there,</text>
  <text x="138" y="630" fill="#496489" font-size="24" font-family="Georgia, serif">but the field strength at that location is the same.</text>
</svg>
