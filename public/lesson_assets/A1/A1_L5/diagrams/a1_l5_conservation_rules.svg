<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#16213e"/>
  <text x="78" y="76" fill="#ffffff" font-size="38" font-family="Arial" font-weight="700">Conservation Rules</text>
  <text x="78" y="118" fill="#dbeafe" font-size="20" font-family="Arial">Before and after a particle event, the charge, baryon number, and lepton number ledgers must all balance.</text>

  <rect x="70" y="172" width="532" height="454" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="102" y="198" width="170" height="38" rx="18" fill="#16a34a"/>
  <text x="187" y="223" fill="#ecfeff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">ALLOWED EVENT</text>
  <text x="102" y="292" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Ledger closes</text>
  <text x="102" y="332" fill="#dbeafe" font-size="19" font-family="Arial">Example: neutron beta decay</text>
  <text x="102" y="382" fill="#ffffff" font-size="20" font-family="Arial" font-weight="700">n -&gt; p + e- + anti-nu</text>
  <rect x="102" y="420" width="440" height="58" rx="18" fill="#24324a"/>
  <rect x="102" y="494" width="440" height="58" rx="18" fill="#24324a"/>
  <rect x="102" y="568" width="440" height="58" rx="18" fill="#24324a"/>
  <rect x="102" y="420" width="170" height="58" rx="18" fill="#86efac"/>
  <rect x="102" y="494" width="170" height="58" rx="18" fill="#86efac"/>
  <rect x="102" y="568" width="170" height="58" rx="18" fill="#86efac"/>
  <text x="187" y="456" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">charge</text>
  <text x="187" y="530" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">baryon #</text>
  <text x="187" y="604" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">lepton #</text>
  <text x="340" y="456" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">0 -&gt; 0</text>
  <text x="340" y="530" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">1 -&gt; 1</text>
  <text x="340" y="604" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">0 -&gt; 0</text>
  <text x="466" y="456" fill="#dbeafe" text-anchor="middle" font-size="18" font-family="Arial">balanced</text>
  <text x="466" y="530" fill="#dbeafe" text-anchor="middle" font-size="18" font-family="Arial">balanced</text>
  <text x="466" y="604" fill="#dbeafe" text-anchor="middle" font-size="18" font-family="Arial">balanced</text>

  <rect x="678" y="172" width="532" height="454" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="710" y="198" width="170" height="38" rx="18" fill="#fb923c"/>
  <text x="795" y="223" fill="#fff7ed" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">REJECT EVENT</text>
  <text x="710" y="292" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Ledger breaks</text>
  <text x="710" y="332" fill="#dbeafe" font-size="19" font-family="Arial">Looks close, but one rule fails</text>
  <text x="710" y="382" fill="#ffffff" font-size="20" font-family="Arial" font-weight="700">n -&gt; p + e-</text>
  <rect x="710" y="420" width="440" height="58" rx="18" fill="#24324a"/>
  <rect x="710" y="494" width="440" height="58" rx="18" fill="#24324a"/>
  <rect x="710" y="568" width="440" height="58" rx="18" fill="#24324a"/>
  <rect x="710" y="420" width="170" height="58" rx="18" fill="#86efac"/>
  <rect x="710" y="494" width="170" height="58" rx="18" fill="#86efac"/>
  <rect x="710" y="568" width="170" height="58" rx="18" fill="#fdba74"/>
  <text x="795" y="456" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">charge</text>
  <text x="795" y="530" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">baryon #</text>
  <text x="795" y="604" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">lepton #</text>
  <text x="948" y="456" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">0 -&gt; 0</text>
  <text x="948" y="530" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">1 -&gt; 1</text>
  <text x="948" y="604" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">0 -&gt; 1</text>
  <text x="1074" y="456" fill="#dbeafe" text-anchor="middle" font-size="18" font-family="Arial">balanced</text>
  <text x="1074" y="530" fill="#dbeafe" text-anchor="middle" font-size="18" font-family="Arial">balanced</text>
  <text x="1074" y="604" fill="#fed7aa" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">fails</text>

  <rect x="78" y="648" width="1122" height="46" rx="20" fill="#2d5be3"/>
  <text x="639" y="678" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">A particle event is only allowed when charge, baryon number, and lepton number all agree before and after.</text>
</svg>
