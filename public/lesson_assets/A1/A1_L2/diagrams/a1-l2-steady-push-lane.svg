<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f6fffe"/>
  <text x="52" y="74" fill="#16213e" font-family="Georgia, serif" font-size="54" font-weight="700">Steady-Push Lane</text>
  <text x="52" y="126" fill="#475569" font-family="Georgia, serif" font-size="28">Equal time steps create equal changes in the motion arrow.</text>
  <rect x="58" y="180" width="1084" height="450" rx="36" fill="#ecfeff" stroke="#67e8f9" stroke-width="6"/>
  <line x1="120" y1="452" x2="1078" y2="452" stroke="#94a3b8" stroke-width="18" stroke-linecap="round"/>
  <line x1="182" y1="338" x2="362" y2="338" stroke="#2563eb" stroke-width="18" stroke-linecap="round"/>
  <polygon points="362,338 334,322 334,354" fill="#2563eb"/>
  <text x="140" y="298" fill="#1d4ed8" font-family="Georgia, serif" font-size="36" font-weight="700">start pace</text>
  <line x1="182" y1="266" x2="478" y2="266" stroke="#0f766e" stroke-width="18" stroke-linecap="round"/>
  <polygon points="478,266 450,250 450,282" fill="#0f766e"/>
  <text x="140" y="226" fill="#0f766e" font-family="Georgia, serif" font-size="36" font-weight="700">end pace</text>
  <line x1="656" y1="484" x2="656" y2="272" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>
  <polygon points="656,272 640,300 672,300" fill="#f97316"/>
  <text x="686" y="364" fill="#c2410c" font-family="Georgia, serif" font-size="34" font-weight="700">steady shift</text>
  <text x="134" y="556" fill="#1f2937" font-family="Georgia, serif" font-size="34" font-weight="700">Keep sign, size, and time visible together.</text>
  <text x="134" y="602" fill="#475569" font-family="Georgia, serif" font-size="30">Negative acceleration is a direction statement, not automatically a slowing-down label.</text>
</svg>
