<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="640" cy="360" r="202" fill="url(#glow)"/>

  <rect x="46" y="64" width="1188" height="576"
        rx="34" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="4"/>

  <text x="640" y="138" fill="white" text-anchor="middle"
        font-size="56" font-family="Arial" font-weight="bold">Quarks, Baryons and Mesons</text>
  <text x="640" y="188" fill="#cbd5e1" text-anchor="middle"
        font-size="24" font-family="Arial">Visualise quark packing inside the Particle-Port Exchange Model.</text>

  <rect x="360" y="226" width="560" height="94" rx="24"
        fill="#111827" fill-opacity="0.92" stroke="#38bdf8" stroke-width="3"/>
  <text x="640" y="264" fill="#7dd3fc" text-anchor="middle"
        font-size="28" font-family="Arial" font-weight="bold">Cargo pieces = quarks or antiquarks</text>
  <circle cx="488" cy="286" r="18" fill="#facc15"/>
  <circle cx="548" cy="286" r="18" fill="#38bdf8"/>
  <circle cx="608" cy="286" r="18" fill="#a78bfa"/>
  <circle cx="708" cy="286" r="18" fill="#f472b6"/>
  <text x="488" y="292" fill="#0f172a" text-anchor="middle"
        font-size="17" font-family="Arial" font-weight="bold">q</text>
  <text x="548" y="292" fill="#0f172a" text-anchor="middle"
        font-size="17" font-family="Arial" font-weight="bold">q</text>
  <text x="608" y="292" fill="#0f172a" text-anchor="middle"
        font-size="17" font-family="Arial" font-weight="bold">q</text>
  <text x="708" y="292" fill="#0f172a" text-anchor="middle"
        font-size="14" font-family="Arial" font-weight="bold">anti-q</text>
  <text x="818" y="292" fill="#e2e8f0" text-anchor="middle"
        font-size="20" font-family="Arial">Count the pieces before naming the hadron family.</text>

  <line x1="512" y1="320" x2="402" y2="384" stroke="#38bdf8" stroke-width="4"/>
  <line x1="768" y1="320" x2="878" y2="384" stroke="#a78bfa" stroke-width="4"/>

  <rect x="118" y="382" width="442" height="180" rx="28"
        fill="#111827" fill-opacity="0.92" stroke="#facc15" stroke-width="3"/>
  <text x="339" y="426" fill="#fde68a" text-anchor="middle"
        font-size="34" font-family="Arial" font-weight="bold">Three-pack crate</text>
  <text x="339" y="462" fill="#f8fafc" text-anchor="middle"
        font-size="30" font-family="Arial">(baryon)</text>
  <circle cx="258" cy="512" r="22" fill="#facc15"/>
  <circle cx="339" cy="512" r="22" fill="#38bdf8"/>
  <circle cx="420" cy="512" r="22" fill="#a78bfa"/>
  <text x="258" y="519" fill="#0f172a" text-anchor="middle"
        font-size="18" font-family="Arial" font-weight="bold">q</text>
  <text x="339" y="519" fill="#0f172a" text-anchor="middle"
        font-size="18" font-family="Arial" font-weight="bold">q</text>
  <text x="420" y="519" fill="#0f172a" text-anchor="middle"
        font-size="18" font-family="Arial" font-weight="bold">q</text>
  <text x="339" y="550" fill="#e2e8f0" text-anchor="middle"
        font-size="22" font-family="Arial">Three quarks means baryon.</text>

  <rect x="720" y="382" width="442" height="180" rx="28"
        fill="#111827" fill-opacity="0.92" stroke="#a78bfa" stroke-width="3"/>
  <text x="941" y="426" fill="#c4b5fd" text-anchor="middle"
        font-size="34" font-family="Arial" font-weight="bold">Pair parcel</text>
  <text x="941" y="462" fill="#f8fafc" text-anchor="middle"
        font-size="30" font-family="Arial">(meson)</text>
  <circle cx="886" cy="512" r="22" fill="#38bdf8"/>
  <circle cx="996" cy="512" r="22" fill="#f472b6"/>
  <text x="886" y="519" fill="#0f172a" text-anchor="middle"
        font-size="18" font-family="Arial" font-weight="bold">q</text>
  <text x="996" y="519" fill="#0f172a" text-anchor="middle"
        font-size="14" font-family="Arial" font-weight="bold">anti-q</text>
  <text x="941" y="550" fill="#e2e8f0" text-anchor="middle"
        font-size="22" font-family="Arial">Quark plus antiquark means meson.</text>

  <rect x="422" y="592" width="436" height="42" rx="16"
        fill="#111827" fill-opacity="0.9" stroke="#475569" stroke-width="2"/>
  <text x="640" y="619" fill="#e2e8f0" text-anchor="middle"
        font-size="20" font-family="Arial">Family stamp = hadron classification</text>
</svg>
