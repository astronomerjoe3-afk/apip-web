<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Antiparticles, Pair Production and Annihilation motion</title>
<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at center, #0f172a, #020617);
    color: white;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 1280px;
    min-height: 720px;
    padding: 48px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 28px;
  }
  .title {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
  }
  .desc {
    text-align: center;
    font-size: 22px;
    color: #cbd5e1;
  }
  .card, .ladder, .compare {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    min-height: 360px;
  }
  .ladder {
    flex-direction: column;
  }
  .big {
    font-size: 72px;
    font-weight: 900;
  }
  .arrow, .vs {
    font-size: 48px;
    color: #38bdf8;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    animation: drift 8s infinite ease-in-out;
  }
  .step {
    width: 320px;
    padding: 24px;
    text-align: center;
    border-radius: 18px;
    font-size: 32px;
    font-weight: 800;
  }
  .top { background: #1d4ed8; }
  .middle { background: #166534; }
  .bottom { background: #9a3412; }
  .connector {
    width: 10px;
    height: 80px;
    background: linear-gradient(#38bdf8, #86efac);
    border-radius: 999px;
    animation: pulse 8s infinite ease-in-out;
  }
  .box {
    width: 300px;
    height: 180px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 34px;
    font-weight: 800;
  }
  .low { background: #3f3f46; }
  .high { background: #1d4ed8; }
  .pulse {
    animation: pulse 8s infinite ease-in-out;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.90; }
    50% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); opacity: 0.90; }
  }
  @keyframes drift {
    0% { transform: translateY(0); }
    50% { transform: translateY(8px); }
    100% { transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">Antiparticles, Pair Production and Annihilation motion</div>
    <div class="desc">Animate the antiparticles, pair production and annihilation idea so the changing pattern stays visible over time.</div>
    
    <div class="card">
      <div class="big pulse">Concept animation</div>
    </div>
    
  </div>
</body>
</html>
