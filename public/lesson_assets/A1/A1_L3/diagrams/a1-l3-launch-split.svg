  <text x="650" y="302" fill="#b91c1c" font-family="Georgia, serif" font-size="34" font-weight="700">drop field still acts here</text>
  <text x="130" y="602" fill="#475569" font-family="Georgia, serif" font-size="30">At the top of the path, vertical velocity can be zero for an instant while downward acceleration remains.</text>
