  <path d="M136 536 Q370 160 612 250 T1060 536" fill="none" stroke="#2563eb" stroke-width="10"/>
  <line x1="136" y1="536" x2="350" y2="412" stroke="#1d4ed8" stroke-width="16" stroke-linecap="round"/>
  <polygon points="350,412 320,402 334,432" fill="#1d4ed8"/>
  <line x1="136" y1="536" x2="314" y2="536" stroke="#0f766e" stroke-width="10" stroke-dasharray="12 10"/>
  <line x1="314" y1="536" x2="314" y2="336" stroke="#f97316" stroke-width="10" stroke-dasharray="12 10"/>
  <text x="346" y="530" fill="#0f766e" font-family="Georgia, serif" font-size="34" font-weight="700">u_x constant</text>
  <text x="336" y="332" fill="#c2410c" font-family="Georgia, serif" font-size="34" font-weight="700">u_y changes under g</text>
  <line x1="618" y1="250" x2="618" y2="326" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
