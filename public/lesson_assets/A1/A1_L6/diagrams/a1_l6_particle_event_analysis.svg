<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#16213e"/>
  <text x="78" y="76" fill="#ffffff" font-size="38" font-family="Arial" font-weight="700">Particle Event Analysis</text>
  <text x="78" y="116" fill="#dbeafe" font-size="20" font-family="Arial">Do not guess from one dramatic product. Compare particle identity, the interaction clue, and the conservation ledger together.</text>

  <rect x="78" y="152" width="1122" height="118" rx="26" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="108" y="180" width="170" height="38" rx="18" fill="#334155"/>
  <text x="193" y="205" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">OBSERVED EVENT</text>
  <text x="108" y="240" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">incoming particle -&gt; several outgoing products</text>
  <text x="108" y="274" fill="#dbeafe" font-size="19" font-family="Arial">Analysis habit: identify the products first, then test which event story fits all the evidence.</text>

  <rect x="78" y="312" width="340" height="300" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="108" y="340" width="188" height="38" rx="18" fill="#14b8a6"/>
  <text x="202" y="365" fill="#ecfeff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">CHECK 1</text>
  <text x="108" y="418" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Classify the particles</text>
  <text x="108" y="458" fill="#dbeafe" font-size="18" font-family="Arial">Name the incoming and outgoing</text>
  <text x="108" y="482" fill="#dbeafe" font-size="18" font-family="Arial">particles and sort their families.</text>
  <circle cx="156" cy="536" r="30" fill="#fde68a" stroke="#facc15" stroke-width="4"/>
  <circle cx="240" cy="536" r="30" fill="#f9a8d4" stroke="#ec4899" stroke-width="4"/>
  <circle cx="324" cy="536" r="30" fill="#d8b4fe" stroke="#8b5cf6" stroke-width="4"/>
  <text x="156" y="545" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">p</text>
  <text x="240" y="545" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">e-</text>
  <text x="324" y="528" fill="#111827" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700">anti</text>
  <text x="324" y="548" fill="#111827" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700">nu</text>
  <text x="108" y="586" fill="#dbeafe" font-size="16" font-family="Arial">Identity clue: the particle list already</text>
  <text x="108" y="608" fill="#dbeafe" font-size="16" font-family="Arial">narrows the channel.</text>

  <rect x="470" y="312" width="340" height="300" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="500" y="340" width="188" height="38" rx="18" fill="#3b82f6"/>
  <text x="594" y="365" fill="#eff6ff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">CHECK 2</text>
  <text x="500" y="418" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Read the interaction clue</text>
  <text x="500" y="458" fill="#dbeafe" font-size="18" font-family="Arial">Ask whether the event looks more like</text>
  <text x="500" y="482" fill="#dbeafe" font-size="18" font-family="Arial">decay or scattering before choosing.</text>
  <rect x="530" y="518" width="108" height="48" rx="20" fill="#bfdbfe" stroke="#60a5fa" stroke-width="3"/>
  <rect x="656" y="518" width="132" height="48" rx="20" fill="#dbeafe" stroke="#38bdf8" stroke-width="3"/>
  <text x="584" y="549" fill="#1e3a8a" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">decay</text>
  <text x="722" y="549" fill="#0f172a" text-anchor="middle" font-size="17" font-family="Arial" font-weight="700">scattering</text>
  <text x="500" y="586" fill="#dbeafe" font-size="16" font-family="Arial">Event clue: the overall story matters</text>
  <text x="500" y="608" fill="#dbeafe" font-size="16" font-family="Arial">as much as one product.</text>

  <rect x="862" y="312" width="338" height="300" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="892" y="340" width="188" height="38" rx="18" fill="#f59e0b"/>
  <text x="986" y="365" fill="#fff7ed" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">CHECK 3</text>
  <text x="892" y="418" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Close the ledger</text>
  <text x="892" y="458" fill="#dbeafe" font-size="18" font-family="Arial">Test charge, baryon number, and lepton</text>
  <text x="892" y="482" fill="#dbeafe" font-size="18" font-family="Arial">number before accepting the story.</text>
  <rect x="932" y="518" width="198" height="58" rx="18" fill="#24324a"/>
  <text x="1031" y="544" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">charge  baryon #  lepton #</text>
  <text x="1031" y="568" fill="#dbeafe" text-anchor="middle" font-size="16" font-family="Arial">all three checks must still balance</text>
  <text x="892" y="586" fill="#dbeafe" font-size="16" font-family="Arial">Ledger clue: one failed total</text>
  <text x="892" y="608" fill="#dbeafe" font-size="16" font-family="Arial">rejects the channel.</text>

  <rect x="78" y="648" width="1122" height="46" rx="20" fill="#2d5be3"/>
  <text x="639" y="678" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">Best-fit answer = the channel that matches particle identity, interaction type, and conservation together.</text>
</svg>
