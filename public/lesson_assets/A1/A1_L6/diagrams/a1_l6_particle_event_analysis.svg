<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c38"/>
    </linearGradient>
    <linearGradient id="teal-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="blue-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="gold-band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="footer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <style>
      .title { font: 700 42px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 20px Arial, sans-serif; fill: #cbd5e1; }
      .chip { font: 700 16px Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .panelTitle { font: 700 30px Arial, sans-serif; fill: #f8fafc; }
      .body { font: 20px Arial, sans-serif; fill: #dbeafe; }
      .small { font: 18px Arial, sans-serif; fill: #cbd5e1; }
      .event { font: 700 28px Arial, sans-serif; fill: #f8fafc; }
      .nodeText { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .checkTitle { font: 700 22px Arial, sans-serif; fill: #f8fafc; }
      .footerText { font: 700 20px Arial, sans-serif; fill: #f8fafc; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="80" y="76" class="title">Particle Event Analysis</text>
  <text x="80" y="112" class="subtitle">
    <tspan x="80" dy="0">Do not guess the event from one dramatic product. Compare the particle identities, the interaction clue,</tspan>
    <tspan x="80" dy="26">and the conservation ledger together before naming the best channel.</tspan>
  </text>

  <rect x="80" y="154" width="1120" height="138" rx="28" fill="url(#panel)" stroke="#334155" stroke-width="3"/>
  <rect x="112" y="180" width="170" height="34" rx="17" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="197" y="202" text-anchor="middle" class="chip">OBSERVED EVENT</text>
  <text x="114" y="248" class="event">incoming particle  -&gt;  several outgoing products</text>
  <text x="114" y="278" class="small">Analysis habit: identify the products first, then test which event story fits all the evidence.</text>

  <rect x="80" y="326" width="350" height="286" rx="28" fill="url(#panel)" stroke="#334155" stroke-width="3"/>
  <rect x="465" y="326" width="350" height="286" rx="28" fill="url(#panel)" stroke="#334155" stroke-width="3"/>
  <rect x="850" y="326" width="350" height="286" rx="28" fill="url(#panel)" stroke="#334155" stroke-width="3"/>

  <rect x="108" y="350" width="180" height="34" rx="17" fill="url(#teal-band)"/>
  <text x="198" y="372" text-anchor="middle" class="chip">CHECK 1</text>
  <text x="108" y="420" class="panelTitle">Classify the particles</text>
  <text x="108" y="456" class="body">
    <tspan x="108" dy="0">Name the incoming and outgoing</tspan>
    <tspan x="108" dy="24">particles and sort their families.</tspan>
  </text>
  <circle cx="158" cy="540" r="28" fill="#fde68a" stroke="#facc15" stroke-width="4"/>
  <text x="158" y="547" text-anchor="middle" class="nodeText">p</text>
  <circle cx="238" cy="540" r="28" fill="#f9a8d4" stroke="#ec4899" stroke-width="4"/>
  <text x="238" y="547" text-anchor="middle" class="nodeText">e-</text>
  <circle cx="318" cy="540" r="28" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="4"/>
  <text x="318" y="533" text-anchor="middle" class="nodeText">anti</text>
  <text x="318" y="554" text-anchor="middle" class="nodeText">nu</text>
  <text x="108" y="592" class="small">Identity clue: the particle list already narrows the channel.</text>

  <rect x="493" y="350" width="180" height="34" rx="17" fill="url(#blue-band)"/>
  <text x="583" y="372" text-anchor="middle" class="chip">CHECK 2</text>
  <text x="493" y="420" class="panelTitle">Read the interaction clue</text>
  <text x="493" y="456" class="body">
    <tspan x="493" dy="0">Ask whether the event looks more like decay</tspan>
    <tspan x="493" dy="24">or scattering before choosing the channel.</tspan>
  </text>
  <rect x="523" y="520" width="108" height="50" rx="18" fill="#bfdbfe" stroke="#60a5fa" stroke-width="3"/>
  <text x="577" y="551" text-anchor="middle" class="nodeText">decay</text>
  <rect x="648" y="520" width="124" height="50" rx="18" fill="#bae6fd" stroke="#38bdf8" stroke-width="3"/>
  <text x="710" y="551" text-anchor="middle" class="nodeText">scattering</text>
  <text x="493" y="592" class="small">Event clue: the overall story matters as much as one product.</text>

  <rect x="878" y="350" width="180" height="34" rx="17" fill="url(#gold-band)"/>
  <text x="968" y="372" text-anchor="middle" class="chip">CHECK 3</text>
  <text x="878" y="420" class="panelTitle">Close the ledger</text>
  <text x="878" y="456" class="body">
    <tspan x="878" dy="0">Test charge, baryon number, and lepton number</tspan>
    <tspan x="878" dy="24">before accepting the event story.</tspan>
  </text>
  <rect x="908" y="515" width="232" height="66" rx="20" fill="#1e293b"/>
  <text x="930" y="543" class="checkTitle">charge   baryon #   lepton #</text>
  <text x="930" y="570" class="small">all three checks must still balance</text>
  <text x="878" y="592" class="small">Ledger clue: one failed total rejects the channel.</text>

  <rect x="80" y="632" width="1120" height="44" rx="18" fill="url(#footer)"/>
  <text x="640" y="660" text-anchor="middle" class="footerText">Best-fit answer = the channel that matches particle identity, interaction type, and conservation together.</text>
</svg>
