<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#16213e"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12243a"/>
      <stop offset="100%" stop-color="#223a78"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>

  <text x="78" y="74" fill="#ffffff" font-size="38" font-family="Arial" font-weight="700">Interactions and Exchange Particles</text>
  <text x="78" y="116" fill="#dbeafe" font-size="19" font-family="Arial">Read the interaction from what the messenger does: strong binds matter together,</text>
  <text x="78" y="142" fill="#dbeafe" font-size="19" font-family="Arial">while weak lets one particle story change into another.</text>

  <rect x="430" y="128" width="420" height="44" rx="18" fill="#334155" stroke="#475569" stroke-width="2"/>
  <text x="640" y="157" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">EXCHANGE PARTICLE = THE INTERACTION MESSENGER</text>

  <rect x="66" y="196" width="540" height="392" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="98" y="224" width="184" height="38" rx="18" fill="#14b8a6"/>
  <text x="190" y="249" fill="#ecfeff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">BINDING STORY</text>
  <text x="98" y="308" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Strong interaction</text>
  <text x="98" y="348" fill="#dbeafe" font-size="19" font-family="Arial">The exchange messenger keeps quarks</text>
  <text x="98" y="374" fill="#dbeafe" font-size="19" font-family="Arial">or nucleons tied together.</text>
  <circle cx="196" cy="468" r="58" fill="#fde68a" stroke="#facc15" stroke-width="4"/>
  <text x="196" y="462" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">matter</text>
  <text x="196" y="488" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial">bundle A</text>
  <rect x="278" y="430" width="150" height="76" rx="18" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
  <text x="353" y="460" fill="#ecfeff" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">gluon</text>
  <text x="353" y="486" fill="#ecfeff" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">exchange</text>
  <circle cx="482" cy="468" r="58" fill="#bfdbfe" stroke="#60a5fa" stroke-width="4"/>
  <text x="482" y="462" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">matter</text>
  <text x="482" y="488" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial">bundle B</text>
  <rect x="246" y="460" width="30" height="16" rx="8" fill="#5eead4"/>
  <polygon points="276,452 318,468 276,484" fill="#5eead4"/>
  <rect x="404" y="460" width="30" height="16" rx="8" fill="#5eead4"/>
  <polygon points="404,452 362,468 404,484" fill="#5eead4"/>
  <text x="98" y="544" fill="#bfdbfe" font-size="17" font-family="Arial">Messenger clue: gluons carry the strong interaction.</text>
  <text x="98" y="572" fill="#dbeafe" font-size="17" font-family="Arial">Event clue: the story is binding matter together,</text>
  <text x="98" y="596" fill="#dbeafe" font-size="17" font-family="Arial">not changing the particle family.</text>

  <rect x="674" y="196" width="540" height="392" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <rect x="706" y="224" width="184" height="38" rx="18" fill="#3b82f6"/>
  <text x="798" y="249" fill="#eff6ff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">CHANGE STORY</text>
  <text x="706" y="308" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Weak interaction</text>
  <text x="706" y="348" fill="#dbeafe" font-size="19" font-family="Arial">The exchange messenger allows one</text>
  <text x="706" y="374" fill="#dbeafe" font-size="19" font-family="Arial">particle description to change.</text>
  <rect x="736" y="420" width="126" height="92" rx="24" fill="#bfdbfe" stroke="#60a5fa" stroke-width="4"/>
  <text x="799" y="472" fill="#111827" text-anchor="middle" font-size="24" font-family="Arial" font-weight="700">n</text>
  <text x="799" y="496" fill="#334155" text-anchor="middle" font-size="16" font-family="Arial">start</text>
  <rect x="858" y="458" width="40" height="16" rx="8" fill="#7dd3fc"/>
  <polygon points="898,448 940,466 898,484" fill="#7dd3fc"/>
  <rect x="914" y="426" width="132" height="84" rx="20" fill="#1d4ed8" stroke="#60a5fa" stroke-width="4"/>
  <text x="980" y="463" fill="#eff6ff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">W boson</text>
  <text x="980" y="489" fill="#dbeafe" text-anchor="middle" font-size="16" font-family="Arial" font-weight="700">token</text>
  <polygon points="1038,462 1080,396 1098,406 1058,468" fill="#7dd3fc"/>
  <polygon points="1038,458 1100,458 1100,474 1038,474" fill="#7dd3fc"/>
  <polygon points="1038,470 1080,536 1098,526 1058,464" fill="#7dd3fc"/>
  <circle cx="1122" cy="382" r="42" fill="#fde68a" stroke="#facc15" stroke-width="4"/>
  <text x="1122" y="391" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">p</text>
  <circle cx="1202" cy="466" r="42" fill="#f9a8d4" stroke="#ec4899" stroke-width="4"/>
  <text x="1202" y="475" fill="#111827" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">e-</text>
  <circle cx="1122" cy="550" r="42" fill="#d8b4fe" stroke="#a855f7" stroke-width="4"/>
  <text x="1122" y="540" fill="#111827" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700">anti</text>
  <text x="1122" y="562" fill="#111827" text-anchor="middle" font-size="15" font-family="Arial" font-weight="700">nu</text>
  <text x="706" y="544" fill="#bfdbfe" font-size="17" font-family="Arial">Messenger clue: W bosons mark weak, particle-changing events.</text>
  <text x="706" y="572" fill="#dbeafe" font-size="17" font-family="Arial">Event clue: a neutron can become a proton, an electron,</text>
  <text x="706" y="596" fill="#dbeafe" font-size="17" font-family="Arial">and an anti-neutrino.</text>

  <rect x="78" y="626" width="1122" height="48" rx="20" fill="#2d5be3"/>
  <text x="639" y="657" fill="#ffffff" text-anchor="middle" font-size="18" font-family="Arial" font-weight="700">Ask the event question first: if it binds matter, think strong; if it changes the particle story, think weak.</text>
</svg>
