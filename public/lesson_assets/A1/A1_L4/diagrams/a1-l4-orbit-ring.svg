<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f7f7ff"/>
  <text x="52" y="74" fill="#16213e" font-family="Georgia, serif" font-size="54" font-weight="700">Orbit Ring</text>
  <text x="52" y="126" fill="#475569" font-family="Georgia, serif" font-size="28">Constant speed does not mean constant velocity when the motion arrow keeps turning.</text>
  <rect x="58" y="178" width="1082" height="452" rx="36" fill="#eef2ff" stroke="#a5b4fc" stroke-width="6"/>
  <circle cx="600" cy="402" r="190" fill="none" stroke="#93c5fd" stroke-width="12"/>
  <circle cx="600" cy="402" r="26" fill="#1e293b"/>
  <circle cx="790" cy="402" r="16" fill="#2563eb"/>
  <line x1="790" y1="402" x2="790" y2="286" stroke="#0f766e" stroke-width="14" stroke-linecap="round"/>
  <polygon points="790,286 774,314 806,314" fill="#0f766e"/>
  <line x1="790" y1="402" x2="620" y2="402" stroke="#f97316" stroke-width="14" stroke-linecap="round"/>
  <polygon points="620,402 648,386 648,418" fill="#f97316"/>
  <text x="820" y="308" fill="#0f766e" font-family="Georgia, serif" font-size="34" font-weight="700">tangent velocity</text>
  <text x="658" y="378" fill="#c2410c" font-family="Georgia, serif" font-size="34" font-weight="700">center pull</text>
  <text x="134" y="582" fill="#1f2937" font-family="Georgia, serif" font-size="34" font-weight="700">Turning is acceleration.</text>
  <text x="134" y="624" fill="#475569" font-family="Georgia, serif" font-size="30">The required force and acceleration point inward, not outward.</text>
</svg>
