<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#1b2750"/>
  <rect x="120" y="120" width="980" height="454" rx="28" fill="#172033" stroke="#334155" stroke-width="3"/>
  <text x="640" y="96" fill="#ffffff" text-anchor="middle" font-size="34" font-family="Arial" font-weight="700">Orbit ring: tangent velocity vs inward pull</text>
  <text x="640" y="136" fill="#dbeafe" text-anchor="middle" font-size="20" font-family="Arial">Show the motion arrow and the inward acceleration arrow on the same moving probe.</text>

  <circle cx="330" cy="345" r="44" fill="#facc15"/>
  <circle cx="660" cy="340" r="30" fill="#38bdf8"/>
  <circle cx="872" cy="464" r="24" fill="#a78bfa"/>
  <line x1="374" y1="345" x2="630" y2="290" stroke="#38bdf8" stroke-width="5"/>
  <line x1="688" y1="358" x2="846" y2="454" stroke="#a78bfa" stroke-width="5"/>

  <text x="206" y="212" fill="#ffffff" font-size="28" font-family="Arial" font-weight="700">Turned path picture</text>
  <text x="206" y="250" fill="#cbd5e1" font-size="18" font-family="Arial">Circular motion needs a sideways speed</text>
  <text x="206" y="274" fill="#cbd5e1" font-size="18" font-family="Arial">and a separate inward pull.</text>

  <circle cx="428" cy="382" r="176" fill="none" stroke="#60a5fa" stroke-width="8"/>
  <circle cx="428" cy="382" r="30" fill="#1f2937"/>
  <circle cx="604" cy="382" r="16" fill="#2563eb"/>
  <line x1="604" y1="382" x2="466" y2="382" stroke="#f97316" stroke-width="10"/>
  <polygon points="466,382 492,366 492,398" fill="#f97316"/>
  <text x="546" y="352" fill="#f97316" font-size="20" font-family="Arial" font-weight="700">center pull</text>
  <line x1="604" y1="382" x2="604" y2="260" stroke="#0f766e" stroke-width="10"/>
  <polygon points="604,260 588,286 620,286" fill="#0f766e"/>
  <text x="640" y="274" fill="#0f766e" font-size="20" font-family="Arial" font-weight="700">tangent velocity</text>

  <rect x="182" y="498" width="496" height="54" rx="20" fill="#1f2c46" stroke="#475569" stroke-width="2"/>
  <text x="430" y="532" fill="#f8fafc" text-anchor="middle" font-size="19" font-family="Arial">Turning is acceleration, so the needed force points inward.</text>
</svg>
