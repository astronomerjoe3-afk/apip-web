<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="36" fill="#fff7f7"/>
  <text x="64" y="92" fill="#0f172a" font-size="54" font-weight="700">Guard Links, Fault Bridges, and Safety</text>
  <text x="64" y="146" fill="#475569" font-size="24">Short circuits and overloads matter because low resistance can drive dangerous current and rapid heating.</text>
  <rect x="88" y="218" width="490" height="388" rx="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="6"/>
  <rect x="702" y="218" width="490" height="388" rx="34" fill="#fef2f2" stroke="#fca5a5" stroke-width="6"/>
  <text x="126" y="270" fill="#1e3a8a" font-size="34" font-weight="700">Protected loop</text>
  <text x="740" y="270" fill="#b91c1c" font-size="34" font-weight="700">Fault bridge</text>
  <path d="M138 422H244" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="244" y="392" width="64" height="60" rx="14" fill="#bbf7d0"/>
  <path d="M308 422H468" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="468" y="376" width="84" height="92" rx="18" fill="#dbeafe"/>
  <text x="252" y="430" fill="#166534" font-size="22" font-weight="700">guard</text>
  <text x="492" y="432" fill="#1e3a8a" font-size="22" font-weight="700">load</text>
  <path d="M752 422H856" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="856" y="392" width="64" height="60" rx="14" fill="#fecaca"/>
  <path d="M920 422H1080" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="1080" y="376" width="84" height="92" rx="18" fill="#dbeafe"/>
  <path d="M752 422C850 300 1010 300 1112 422" stroke="#dc2626" stroke-width="14" stroke-linecap="round" stroke-dasharray="16 12" fill="none"/>
  <text x="820" y="334" fill="#b91c1c" font-size="28" font-weight="700">low-resistance shortcut</text>
  <text x="828" y="562" fill="#475569" font-size="24">guard link must open the unsafe current path</text>
  <rect x="160" y="626" width="964" height="50" rx="24" fill="#ffffff" opacity="0.92"/>
  <text x="212" y="660" fill="#0f172a" font-size="28" font-weight="700">Safety rule: guard links interrupt unsafe current, while insulation blocks unsafe contact.</text>
