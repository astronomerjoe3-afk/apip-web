<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="32" fill="#fff7f7"/>
  <text x="64" y="82" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="48" font-weight="700">Guard Links, Fault Bridges, and Safety</text>
  <text x="64" y="128" fill="#4a5d7a" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24">The danger is the low-resistance shortcut and the large current it drives, not a mysterious extra store of current inside the battery.</text>

  <rect x="64" y="176" width="544" height="376" rx="28" fill="#eef6ff" stroke="#93c5fd" stroke-width="4"/>
  <rect x="672" y="176" width="544" height="376" rx="28" fill="#fff1f2" stroke="#fca5a5" stroke-width="4"/>

  <text x="96" y="220" fill="#1d4ed8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="30" font-weight="700">Protected loop</text>
  <path d="M126 356H236" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="236" y="324" width="72" height="64" rx="16" fill="#bbf7d0" stroke="#22c55e" stroke-width="3"/>
  <path d="M308 356H466" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="466" y="304" width="86" height="104" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <text x="244" y="364" fill="#166534" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">Fuse</text>
  <text x="486" y="360" fill="#1d4ed8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">Load</text>
  <text x="132" y="290" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Normal path: 12 V across 6 ohm</text>
  <text x="132" y="318" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Current = 2 A, below the guard rating</text>
  <rect x="126" y="446" width="396" height="78" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
  <text x="152" y="482" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" font-weight="700">Insulation is a separate protection:</text>
  <text x="152" y="512" fill="#42526b" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">it blocks unsafe contact instead of opening the loop.</text>

  <text x="704" y="220" fill="#b91c1c" font-family="Trebuchet MS, Verdana, sans-serif" font-size="30" font-weight="700">Fault bridge</text>
  <path d="M734 356H844" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="844" y="324" width="72" height="64" rx="16" fill="#fecaca" stroke="#ef4444" stroke-width="3"/>
  <path d="M916 356H1074" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="1074" y="304" width="86" height="104" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <path d="M734 356C860 222 1020 222 1146 356" stroke="#dc2626" stroke-width="14" stroke-dasharray="14 10" fill="none" stroke-linecap="round"/>
  <text x="810" y="264" fill="#b91c1c" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" font-weight="700">Fault path: 1 ohm shortcut</text>
  <text x="748" y="448" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">12 V / 1 ohm -> 12 A</text>
  <text x="748" y="478" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Large current means rapid heating risk</text>
  <text x="748" y="508" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">The guard link must open this unsafe path</text>

  <rect x="64" y="590" width="1152" height="82" rx="24" fill="#ffffff" stroke="#fecaca" stroke-width="3"/>
  <text x="96" y="626" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="26" font-weight="700">Safety reading</text>
  <text x="96" y="656" fill="#42526b" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Low resistance is dangerous because it can drive large current. Fuses and breakers interrupt that current; insulation prevents unsafe touch.</text>
</svg>
