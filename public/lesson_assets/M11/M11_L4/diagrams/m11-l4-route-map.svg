<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="32" fill="#f8fafc"/>
  <text x="64" y="82" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="48" font-weight="700">Route Maps Show Connection Logic</text>
  <text x="64" y="128" fill="#4a5d7a" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">
    <tspan x="64" dy="0">A schematic strips away furniture layout so you can read shared junctions,</tspan>
    <tspan x="64" dy="28">valid branches, and the first reduction step clearly.</tspan>
  </text>

  <rect x="64" y="176" width="356" height="426" rx="28" fill="#eef6ff" stroke="#93c5fd" stroke-width="4"/>
  <rect x="462" y="176" width="356" height="426" rx="28" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="4"/>
  <rect x="860" y="176" width="356" height="426" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="4"/>

  <text x="96" y="220" fill="#1d4ed8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700">1. Hardware view</text>
  <rect x="130" y="286" width="72" height="136" rx="16" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/>
  <rect x="250" y="258" width="76" height="164" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/>
  <rect x="250" y="470" width="76" height="84" rx="16" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="3"/>
  <path d="M202 354H250" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <path d="M326 340H372V286H388" stroke="#2563eb" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M326 504H372V554H388" stroke="#2563eb" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M388 286V554" stroke="#94a3b8" stroke-width="6" stroke-dasharray="10 8"/>
  <text x="124" y="548" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18">Physical layout changes.</text>
  <text x="124" y="572" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18">The key question is</text>
  <text x="124" y="596" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18">which points connect.</text>

  <text x="494" y="220" fill="#6d28d9" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700">2. Schematic view</text>
  <circle cx="540" cy="354" r="10" fill="#2563eb"/>
  <circle cx="740" cy="354" r="10" fill="#2563eb"/>
  <path d="M540 354H606V260H742V354" stroke="#16a34a" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M540 354H606V448H742V354" stroke="#7c3aed" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="516" y="330" fill="#1d4ed8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20" font-weight="700">Junction A</text>
  <text x="682" y="330" fill="#1d4ed8" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20" font-weight="700">Junction B</text>
  <text x="618" y="248" fill="#166534" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">Upper branch</text>
  <text x="618" y="480" fill="#6d28d9" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">Lower branch</text>
  <text x="500" y="548" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18">Shared junctions show</text>
  <text x="500" y="572" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18">this block is parallel,</text>
  <text x="500" y="596" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="18">even if hardware moves.</text>

  <text x="892" y="220" fill="#15803d" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700">3. Calculation clue</text>
  <rect x="910" y="274" width="258" height="106" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="936" y="316" fill="#166534" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" font-weight="700">First move:</text>
  <text x="936" y="346" fill="#42526b" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20">Mark the two shared junctions,</text>
  <text x="936" y="372" fill="#42526b" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20">then reduce that branch block.</text>
  <rect x="910" y="420" width="258" height="120" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="3"/>
  <text x="936" y="462" fill="#166534" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" font-weight="700">Key warning</text>
  <text x="936" y="490" fill="#42526b" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20">Do not decide series or parallel</text>
  <text x="936" y="516" fill="#42526b" font-family="Trebuchet MS, Verdana, sans-serif" font-size="20">from page shape alone.</text>

  <rect x="64" y="612" width="1152" height="76" rx="22" fill="#ffffff" stroke="#dbeafe" stroke-width="3"/>
  <text x="640" y="646" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Read junctions and paths first.</text>
  <text x="640" y="674" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Let the algebra follow the connection logic, not the page layout.</text>
</svg>
