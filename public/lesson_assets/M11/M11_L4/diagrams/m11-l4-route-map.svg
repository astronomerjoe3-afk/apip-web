<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="36" fill="#f8fafc"/>
  <text x="64" y="92" fill="#0f172a" font-size="54" font-weight="700">Route Maps Show Connection Logic</text>
  <text x="64" y="146" fill="#475569" font-size="24">A schematic is a symbolic map of the network, not a realistic picture of the classroom layout.</text>
  <rect x="88" y="224" width="490" height="368" rx="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="6"/>
  <rect x="702" y="224" width="490" height="368" rx="34" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="6"/>
  <text x="126" y="274" fill="#1e3a8a" font-size="34" font-weight="700">Physical layout</text>
  <text x="740" y="274" fill="#6d28d9" font-size="34" font-weight="700">Route map</text>
  <rect x="176" y="346" width="86" height="148" rx="16" fill="#dbeafe"/>
  <rect x="390" y="346" width="86" height="148" rx="16" fill="#bfdbfe"/>
  <line x1="262" y1="420" x2="390" y2="420" stroke="#2563eb" stroke-width="14" stroke-linecap="round"/>
  <text x="178" y="528" fill="#475569" font-size="24">hardware view</text>
  <line x1="762" y1="420" x2="1112" y2="420" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <circle cx="762" cy="420" r="10" fill="#2563eb"/>
  <circle cx="1112" cy="420" r="10" fill="#2563eb"/>
  <rect x="864" y="390" width="74" height="60" rx="14" fill="#ddd6fe"/>
  <rect x="966" y="390" width="74" height="60" rx="14" fill="#c4b5fd"/>
  <text x="792" y="534" fill="#475569" font-size="24">same connection logic, cleaner reading</text>
  <rect x="136" y="612" width="1008" height="52" rx="24" fill="#ffffff" opacity="0.92"/>
  <text x="172" y="648" fill="#0f172a" font-size="28" font-weight="700">First move: mark the junctions and trace the paths. Series and parallel are connection rules, not picture-shape rules.</text>
</svg>
