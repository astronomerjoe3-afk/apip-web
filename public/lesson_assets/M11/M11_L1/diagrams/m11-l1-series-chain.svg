  <rect x="320" y="366" width="124" height="112" rx="22" fill="#c7d2fe"/>
  <text x="366" y="431" fill="#1e3a8a" font-size="34" font-weight="700">R1</text>
  <path d="M444 422H584" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
  <rect x="584" y="366" width="124" height="112" rx="22" fill="#bfdbfe"/>
  <text x="630" y="431" fill="#1d4ed8" font-size="34" font-weight="700">R2</text>
