  <text x="64" y="92" fill="#0f172a" font-size="54" font-weight="700">One-Lane Chain: Same Current, Shared Voltage</text>
  <text x="64" y="146" fill="#475569" font-size="24">Every carrier visits every station because there is only one path.</text>
