  <text x="876" y="560" fill="#2563eb" font-size="28" font-weight="700">same current</text>
  <rect x="174" y="266" width="934" height="58" rx="24" fill="#ffffff" opacity="0.9"/>
  <text x="212" y="304" fill="#0f172a" font-size="28" font-weight="700">Series rule: one path -> one common current. The source voltage is shared across the stations.</text>
