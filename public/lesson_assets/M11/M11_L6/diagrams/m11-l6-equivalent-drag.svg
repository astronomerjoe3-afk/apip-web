<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="36" fill="#faf7ff"/>
  <text x="64" y="92" fill="#0f172a" font-size="54" font-weight="700">Equivalent Drag and Step-by-Step Reduction</text>
  <text x="64" y="146" fill="#475569" font-size="24">Reduce one valid series or parallel block at a time until one total resistance remains.</text>
  <rect x="88" y="220" width="520" height="382" rx="34" fill="#eef2ff" stroke="#a5b4fc" stroke-width="6"/>
  <rect x="676" y="220" width="516" height="382" rx="34" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="6"/>
  <text x="124" y="272" fill="#4338ca" font-size="34" font-weight="700">Mixed network</text>
  <text x="712" y="272" fill="#6d28d9" font-size="34" font-weight="700">Reduced network</text>
  <rect x="152" y="394" width="82" height="56" rx="14" fill="#ddd6fe"/>
  <path d="M234 422H320" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <path d="M320 422V336H482V422" stroke="#16a34a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M320 422V508H482V422" stroke="#7c3aed" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M482 422H564" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <text x="148" y="374" fill="#5b21b6" font-size="24" font-weight="700">series block</text>
  <text x="372" y="320" fill="#166534" font-size="24" font-weight="700">parallel A</text>
  <text x="372" y="540" fill="#6d28d9" font-size="24" font-weight="700">parallel B</text>
  <rect x="752" y="394" width="82" height="56" rx="14" fill="#ddd6fe"/>
  <path d="M834 422H962" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="962" y="394" width="106" height="56" rx="14" fill="#e9d5ff"/>
  <text x="978" y="430" fill="#6d28d9" font-size="24" font-weight="700">Req branch</text>
  <text x="752" y="512" fill="#475569" font-size="24">parallel pair -> one equivalent drag</text>
  <text x="736" y="558" fill="#475569" font-size="24">then add the remaining series drag</text>
  <rect x="150" y="628" width="974" height="50" rx="24" fill="#ffffff" opacity="0.92"/>
  <text x="198" y="662" fill="#0f172a" font-size="28" font-weight="700">Reduction rule: identify a valid block, reduce it, redraw the network, and repeat until one total resistance remains.</text>
</svg>
