<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" rx="32" fill="#faf7ff"/>
  <text x="64" y="82" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="48" font-weight="700">Equivalent Drag and Step-by-Step Reduction</text>
  <text x="64" y="128" fill="#4a5d7a" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24">Reduce one valid block, redraw the network, and only then use the final total resistance to work out the source current.</text>

  <rect x="64" y="176" width="350" height="410" rx="28" fill="#eef2ff" stroke="#a5b4fc" stroke-width="4"/>
  <rect x="464" y="176" width="350" height="410" rx="28" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="4"/>
  <rect x="864" y="176" width="352" height="410" rx="28" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="4"/>

  <text x="96" y="220" fill="#4338ca" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700">1. Original network</text>
  <rect x="120" y="338" width="84" height="58" rx="14" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="3"/>
  <path d="M204 366H270" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <path d="M270 366V284H380V366" stroke="#16a34a" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M270 366V448H380V366" stroke="#7c3aed" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M380 366H470" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <text x="122" y="324" fill="#5b21b6" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">4 ohm series</text>
  <text x="280" y="268" fill="#166534" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">8 ohm</text>
  <text x="280" y="478" fill="#6d28d9" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">8 ohm</text>
  <text x="96" y="542" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Mark the shared junctions first.</text>

  <text x="496" y="220" fill="#6d28d9" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700">2. First valid reduction</text>
  <rect x="520" y="338" width="84" height="58" rx="14" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="3"/>
  <path d="M604 366H730" stroke="#2563eb" stroke-width="12" stroke-linecap="round"/>
  <rect x="730" y="338" width="102" height="58" rx="14" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/>
  <text x="522" y="324" fill="#5b21b6" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">4 ohm series</text>
  <text x="742" y="324" fill="#7c3aed" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">Req = 4 ohm</text>
  <text x="496" y="458" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">8 ohm || 8 ohm becomes one 4 ohm block.</text>
  <text x="496" y="490" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Now the remaining structure is a series chain.</text>

  <text x="896" y="220" fill="#7e22ce" font-family="Trebuchet MS, Verdana, sans-serif" font-size="28" font-weight="700">3. Final equivalent</text>
  <rect x="932" y="338" width="122" height="58" rx="14" fill="#e9d5ff" stroke="#c084fc" stroke-width="3"/>
  <text x="950" y="324" fill="#7e22ce" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22" font-weight="700">Req total = 8 ohm</text>
  <text x="918" y="454" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Series step: 4 ohm + 4 ohm = 8 ohm</text>
  <text x="918" y="486" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">With a 16 V source, total current = 2 A</text>
  <text x="918" y="518" fill="#475569" font-family="Trebuchet MS, Verdana, sans-serif" font-size="22">Only now is the full source-current step ready.</text>

  <rect x="64" y="618" width="1152" height="56" rx="22" fill="#ffffff" stroke="#ddd6fe" stroke-width="3"/>
  <text x="98" y="654" fill="#10213f" font-family="Trebuchet MS, Verdana, sans-serif" font-size="24" font-weight="700">Reduction workflow: identify a valid block -> redraw -> identify the next valid block -> finish with one total resistance.</text>
</svg>
