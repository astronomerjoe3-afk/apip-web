<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="current-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#fbbf24" />
    </marker>
    <marker id="energy-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#34d399" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">One picture connects current, power, heating, and protection.</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show two same-voltage devices with different currents and label the higher-power case next to a fuse warning path.</text><rect x="100.00" y="200.00" width="460.00" height="340.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="128.00" y="240.00" fill="#fbbf24" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Same voltage, different current</text><rect x="150.00" y="300.00" width="120.00" height="160.00" rx="18" fill="#1d4ed8" /><rect x="360.00" y="270.00" width="120.00" height="190.00" rx="18" fill="#f97316" /><text x="210.00" y="286.00" fill="#dbeafe" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">2 A</text><text x="420.00" y="256.00" fill="#ffedd5" text-anchor="middle" font-size="24" font-family="Arial" font-weight="bold">5 A</text><text x="210.00" y="495.00" fill="#bfdbfe" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">lower power</text><text x="420.00" y="495.00" fill="#fdba74" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">higher power</text><rect x="660.00" y="200.00" width="520.00" height="340.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="688.00" y="240.00" fill="#fca5a5" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Protection path</text><line x1="760.00" y1="360.00" x2="1080.00" y2="360.00" stroke="#ef4444" stroke-width="10" stroke-linecap="round" /><line x1="900.00" y1="300.00" x2="940.00" y2="420.00" stroke="#f8fafc" stroke-width="8" stroke-linecap="round" /><rect x="840.00" y="270.00" width="160.00" height="180.00" rx="24" fill="#111827" stroke="#475569" stroke-width="3" /><text x="920.00" y="340.00" fill="#f8fafc" text-anchor="middle" font-size="26" font-family="Arial" font-weight="bold">Fuse / breaker</text><text x="920.00" y="388.00" fill="#fca5a5" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">opens if current</text><text x="920.00" y="420.00" fill="#fca5a5" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">becomes unsafe</text><text x="640.00" y="610.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Power is an energy-transfer rate. Protection stops dangerous current.</text></svg>