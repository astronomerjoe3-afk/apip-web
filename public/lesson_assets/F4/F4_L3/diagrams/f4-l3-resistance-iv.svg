<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">The graph links algebraic resistance to visual slope reasoning.</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show two I-V lines with different steepness and label the lower-resistance line clearly.</text><rect x="90.00" y="180.00" width="470.00" height="380.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="118.00" y="220.00" fill="#fdba74" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">Route response</text><line x1="170.00" y1="300.00" x2="430.00" y2="300.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><polyline points="430.00,300.00 448.00,282.00 466.00,318.00 484.00,282.00 502.00,318.00 520.00,282.00 520.00,300.00" fill="none" stroke="#f97316" stroke-width="5" /><line x1="170.00" y1="440.00" x2="370.00" y2="440.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><polyline points="370.00,440.00 388.00,422.00 406.00,458.00 424.00,422.00 442.00,458.00 460.00,422.00 520.00,440.00" fill="none" stroke="#fb7185" stroke-width="5" /><line x1="210.00" y1="268.00" x2="330.00" y2="268.00" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#current-arrow)" /><line x1="210.00" y1="408.00" x2="280.00" y2="408.00" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" marker-end="url(#current-arrow)" /><text x="308.00" y="242.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">low R -&gt; larger I</text><text x="290.00" y="482.00" fill="#fda4af" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">high R -&gt; smaller I</text><rect x="650.00" y="180.00" width="540.00" height="380.00" rx="26" fill="#111827" stroke="#334155" stroke-width="3" /><text x="678.00" y="220.00" fill="#93c5fd" text-anchor="start" font-size="24" font-family="Arial" font-weight="bold">I-V view</text><line x1="740.00" y1="500.00" x2="1110.00" y2="500.00" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" /><line x1="740.00" y1="500.00" x2="740.00" y2="250.00" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" /><path d="M 760 470 L 1030 300" stroke="#60a5fa" stroke-width="8" fill="none" /><path d="M 760 470 L 920 330" stroke="#fb7185" stroke-width="8" fill="none" /><text x="1040.00" y="300.00" fill="#bfdbfe" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">lower resistance</text><text x="930.00" y="330.00" fill="#fecdd3" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">higher resistance</text><text x="1116.00" y="510.00" fill="#cbd5e1" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">V</text><text x="730.00" y="244.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">I</text></svg>