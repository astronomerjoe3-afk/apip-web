<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">One loop picture shows charge conservation and energy-per-charge change together.</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show a cell increasing electrical energy per coulomb and a lamp decreasing it for the same charge.</text><line x1="170.00" y1="230.00" x2="760.00" y2="230.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><polyline points="760.00,230.00 778.00,212.00 796.00,248.00 814.00,212.00 832.00,248.00 850.00,212.00 960.00,230.00" fill="none" stroke="#f97316" stroke-width="5" /><line x1="960.00" y1="230.00" x2="1110.00" y2="230.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><line x1="1110.00" y1="230.00" x2="1110.00" y2="540.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><line x1="1110.00" y1="540.00" x2="170.00" y2="540.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><line x1="170.00" y1="540.00" x2="170.00" y2="450.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><line x1="170.00" y1="254.00" x2="170.00" y2="357.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><line x1="170.00" y1="413.00" x2="170.00" y2="516.00" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" /><line x1="152.00" y1="367.00" x2="188.00" y2="367.00" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" /><line x1="162.00" y1="403.00" x2="178.00" y2="403.00" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" /><circle cx="300.00" cy="230.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="300.00" y="236.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><circle cx="520.00" cy="230.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="520.00" y="236.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><circle cx="1040.00" cy="230.00" r="18.00" fill="#0f172a" stroke="#22c55e" stroke-width="4" /><text x="1040.00" y="236.00" fill="#bbf7d0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">q</text><line x1="230.00" y1="146.00" x2="520.00" y2="146.00" stroke="#34d399" stroke-width="5" stroke-linecap="round" marker-end="url(#energy-arrow)" /><text x="315.00" y="122.00" fill="#86efac" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">+6 J/C at the cell</text><line x1="760.00" y1="314.00" x2="1040.00" y2="314.00" stroke="#f87171" stroke-width="5" stroke-linecap="round" marker-end="url(#current-arrow)" /><text x="900.00" y="348.00" fill="#fca5a5" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">-6 J/C at the resistor</text><text x="860.00" y="184.00" fill="#fdba74" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Resistor</text><text x="140.00" y="391.00" fill="#93c5fd" text-anchor="end" font-size="18" font-family="Arial" font-weight="normal">Cell</text><text x="640.00" y="596.00" fill="#cbd5e1" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Potential difference = energy transferred per coulomb.</text></svg>