<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Spin Makes Day and Night</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Rotation carries places into and out of sunlight.</text><circle cx="220.00" cy="360.00" r="48.00" fill="#facc15" stroke="#fde68a" stroke-width="5" /><line x1="220.00" y1="321.50" x2="220.00" y2="290.00" stroke="#fbbf24" stroke-width="5" /><line x1="253.00" y1="338.00" x2="280.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="261.25" y1="360.00" x2="295.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="253.00" y1="382.00" x2="280.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="220.00" y1="398.50" x2="220.00" y2="430.00" stroke="#fbbf24" stroke-width="5" /><line x1="187.00" y1="382.00" x2="160.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="178.75" y1="360.00" x2="145.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="187.00" y1="338.00" x2="160.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="288.00" y1="360.00" x2="676.00" y2="360.00" stroke="#facc15" stroke-width="8" /><circle cx="770.00" cy="360.00" r="112.00" fill="#2563eb" stroke="#93c5fd" stroke-width="4" /><rect x="658.00" y="248.00" width="112.00" height="224.00" rx="0" fill="#1e293b" stroke="none" stroke-width="0" /><line x1="770.00" y1="212.00" x2="770.00" y2="508.00" stroke="#f8fafc" stroke-width="4" /><text x="770.00" y="194.00" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">spin rod</text><line x1="850.00" y1="228.00" x2="850.00" y2="492.00" stroke="#38bdf8" stroke-width="5" marker-end="url(#astro-arrow)" /><text x="730.00" y="230.00" fill="#fde68a" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">day-face</text><text x="832.00" y="504.00" fill="#cbd5e1" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">night-face</text><circle cx="722.00" cy="350.00" r="10.00" fill="#ef4444" stroke="#ef4444" stroke-width="0" /><text x="1000.00" y="308.00" fill="#f8fafc" text-anchor="middle" font-size="26" font-family="Arial" font-weight="normal">Spin makes day and night.</text><text x="1000.00" y="350.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">A place moves into and out of sunlight because the world rotates.</text></svg>