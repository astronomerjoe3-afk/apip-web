<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="astro-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Tilt Makes Seasons</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Tilt plus orbit position changes the sunlight angle.</text><circle cx="270.00" cy="360.00" r="52.00" fill="#facc15" stroke="#fde68a" stroke-width="5" /><line x1="270.00" y1="321.50" x2="270.00" y2="290.00" stroke="#fbbf24" stroke-width="5" /><line x1="303.00" y1="338.00" x2="330.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="311.25" y1="360.00" x2="345.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="303.00" y1="382.00" x2="330.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="270.00" y1="398.50" x2="270.00" y2="430.00" stroke="#fbbf24" stroke-width="5" /><line x1="237.00" y1="382.00" x2="210.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="228.75" y1="360.00" x2="195.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="237.00" y1="338.00" x2="210.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="346.00" y1="296.00" x2="650.00" y2="214.00" stroke="#facc15" stroke-width="4" /><line x1="346.00" y1="424.00" x2="650.00" y2="506.00" stroke="#facc15" stroke-width="4" /><circle cx="760.00" cy="250.00" r="66.00" fill="#2563eb" stroke="#93c5fd" stroke-width="4" /><circle cx="760.00" cy="470.00" r="66.00" fill="#2563eb" stroke="#93c5fd" stroke-width="4" /><line x1="712.00" y1="362.00" x2="808.00" y2="138.00" stroke="#f8fafc" stroke-width="4" /><line x1="712.00" y1="582.00" x2="808.00" y2="358.00" stroke="#f8fafc" stroke-width="4" /><text x="760.00" y="158.00" fill="#bbf7d0" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">June position</text><text x="760.00" y="574.00" fill="#fecaca" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">December position</text><text x="900.00" y="208.00" fill="#94a3b8" text-anchor="start" font-size="14" font-family="Arial" font-weight="bold">AXIS READ</text><text x="900.00" y="240.00" fill="#f8fafc" text-anchor="start" font-size="22" font-family="Arial" font-weight="bold">tilt rod ~ 23.4 deg</text><text x="900.00" y="288.00" fill="#cbd5e1" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">The axis keeps the same leaning</text><text x="900.00" y="312.00" fill="#cbd5e1" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">direction in space.</text><text x="900.00" y="362.00" fill="#cbd5e1" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">One hemisphere tilts toward the</text><text x="900.00" y="386.00" fill="#cbd5e1" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">lantern, then away half a year later.</text><text x="900.00" y="452.00" fill="#fde68a" text-anchor="start" font-size="18" font-family="Arial" font-weight="bold">Seasons come from tilt and sunlight</text><text x="900.00" y="476.00" fill="#fde68a" text-anchor="start" font-size="18" font-family="Arial" font-weight="bold">angle, not distance changes.</text></svg>