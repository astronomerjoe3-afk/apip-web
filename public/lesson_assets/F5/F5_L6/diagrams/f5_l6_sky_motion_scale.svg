<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Apparent Sky Motion and Scale</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Farther ring reach usually means a longer year lap.</text><circle cx="270.00" cy="360.00" r="46.00" fill="#facc15" stroke="#fde68a" stroke-width="5" /><line x1="270.00" y1="321.50" x2="270.00" y2="290.00" stroke="#fbbf24" stroke-width="5" /><line x1="303.00" y1="338.00" x2="330.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="311.25" y1="360.00" x2="345.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="303.00" y1="382.00" x2="330.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="270.00" y1="398.50" x2="270.00" y2="430.00" stroke="#fbbf24" stroke-width="5" /><line x1="237.00" y1="382.00" x2="210.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="228.75" y1="360.00" x2="195.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="237.00" y1="338.00" x2="210.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><ellipse cx="270.00" cy="360.00" rx="130.00" ry="92.00" fill="none" stroke="#22c55e" stroke-width="3" /><ellipse cx="270.00" cy="360.00" rx="260.00" ry="176.00" fill="none" stroke="#60a5fa" stroke-width="3" /><circle cx="400.00" cy="360.00" r="12.00" fill="#22c55e" stroke="#22c55e" stroke-width="0" /><text x="400.00" y="486.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">inner world</text><circle cx="530.00" cy="360.00" r="16.00" fill="#60a5fa" stroke="#60a5fa" stroke-width="0" /><text x="530.00" y="548.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">outer world</text><text x="900.00" y="248.00" fill="#bbf7d0" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">shorter year lap</text><text x="900.00" y="370.00" fill="#bae6fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">longer year lap</text><line x1="734.00" y1="260.00" x2="854.00" y2="260.00" stroke="#22c55e" stroke-width="5" marker-end="url(#astro-arrow)" /><line x1="860.00" y1="380.00" x2="736.00" y2="380.00" stroke="#60a5fa" stroke-width="5" marker-end="url(#astro-arrow)" /><text x="930.00" y="452.00" fill="#fde68a" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Farther ring reach usually means a longer orbital period.</text><text x="930.00" y="492.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">This is the qualitative year-lap idea behind Kepler's third law.</text></svg>