<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="24" y="24" width="1232" height="672" rx="32" fill="#ffffff" stroke="#dbeafe" stroke-width="4"/>

  <text x="70" y="96" fill="#0f172a" font-family="Arial, sans-serif" font-size="52" font-weight="700">Moon Phases and Eclipses</text>
  <text x="70" y="140" fill="#475569" font-family="Arial, sans-serif" font-size="26">
    <tspan x="70" dy="0">The Moon stays half lit at all times.</tspan>
    <tspan x="70" dy="34">Phases come from viewpoint; eclipses need a special line-up.</tspan>
  </text>

  <circle cx="150" cy="360" r="54" fill="#facc15" stroke="#f59e0b" stroke-width="6"/>
  <text x="150" y="372" fill="#0f172a" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle">Sun</text>

  <circle cx="468" cy="360" r="50" fill="#2563eb" stroke="#93c5fd" stroke-width="5"/>
  <text x="468" y="440" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle">Earth</text>

  <circle cx="468" cy="360" r="180" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="648" cy="360" r="24" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <text x="648" y="410" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">full view</text>

  <circle cx="468" cy="180" r="24" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <path d="M468 156 A24 24 0 0 1 468 204" fill="#111827"/>
  <text x="468" y="226" fill="#334155" font-family="Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">quarter</text>

  <circle cx="288" cy="360" r="24" fill="#e2e8f0" stroke="#64748b" stroke-width="4"/>
  <ellipse cx="298" cy="360" rx="10" ry="22" fill="#111827"/>
  <text x="288" y="410" fill="#334155" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">crescent</text>

  <line x1="206" y1="360" x2="624" y2="360" stroke="#fbbf24" stroke-width="6"/>
  <line x1="150" y1="360" x2="770" y2="360" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="12 10"/>

  <rect x="822" y="184" width="352" height="336" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="4"/>
  <text x="864" y="240" fill="#1d4ed8" font-family="Arial, sans-serif" font-size="24" font-weight="700">Reading guide</text>
  <text x="864" y="294" fill="#0f172a" font-family="Arial, sans-serif" font-size="24">
    <tspan x="864" dy="0">Phases: how much of the</tspan>
    <tspan x="864" dy="32">sunlit half we can see.</tspan>
    <tspan x="864" dy="42">Eclipse: a special line-up</tspan>
    <tspan x="864" dy="32">where one body enters</tspan>
    <tspan x="864" dy="32">another body's shadow.</tspan>
    <tspan x="864" dy="42">Monthly phases are not</tspan>
    <tspan x="864" dy="32">caused by Earth's shadow.</tspan>
  </text>

  <rect x="78" y="594" width="1124" height="66" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="640" y="636" fill="#475569" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">
    Keep the lit half constant and change the Earth view first; save shadow language for eclipse cases only.
  </text>
</svg>
