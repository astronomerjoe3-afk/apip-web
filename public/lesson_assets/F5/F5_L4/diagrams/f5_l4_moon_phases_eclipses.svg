<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Moon Phases and Eclipses</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Viewing angle changes the phase; special alignment creates eclipses.</text><circle cx="180.00" cy="360.00" r="42.00" fill="#facc15" stroke="#fde68a" stroke-width="5" /><line x1="180.00" y1="321.50" x2="180.00" y2="290.00" stroke="#fbbf24" stroke-width="5" /><line x1="213.00" y1="338.00" x2="240.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="221.25" y1="360.00" x2="255.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="213.00" y1="382.00" x2="240.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="180.00" y1="398.50" x2="180.00" y2="430.00" stroke="#fbbf24" stroke-width="5" /><line x1="147.00" y1="382.00" x2="120.00" y2="400.00" stroke="#fbbf24" stroke-width="5" /><line x1="138.75" y1="360.00" x2="105.00" y2="360.00" stroke="#fbbf24" stroke-width="5" /><line x1="147.00" y1="338.00" x2="120.00" y2="320.00" stroke="#fbbf24" stroke-width="5" /><line x1="240.00" y1="360.00" x2="574.00" y2="360.00" stroke="#facc15" stroke-width="6" /><circle cx="700.00" cy="360.00" r="74.00" fill="#2563eb" stroke="#93c5fd" stroke-width="4" /><ellipse cx="700.00" cy="360.00" rx="150.00" ry="150.00" fill="none" stroke="#475569" stroke-width="3" stroke-dasharray="10 8" /><circle cx="700.00" cy="220.00" r="24.00" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" /><line x1="700.00" y1="360.00" x2="700.00" y2="220.00" stroke="#38bdf8" stroke-width="3" /><text x="700.00" y="366.00" fill="#f8fafc" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">Earth</text><text x="700.00" y="186.00" fill="#f8fafc" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Moon</text><text x="1030.00" y="246.00" fill="#f8fafc" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Companion-face phase depends on view, not shadow.</text><text x="1030.00" y="288.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">The Moon is always half lit by the Sun.</text><text x="1030.00" y="326.00" fill="#fde68a" text-anchor="middle" font-size="20" font-family="Arial" font-weight="normal">Shown phase: first quarter</text><text x="1030.00" y="364.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Earth's shadow matters only during a lunar eclipse.</text></svg>