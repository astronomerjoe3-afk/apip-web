<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 48px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Path Difference Predicts Interference</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Compare the two routes first. A whole-wavelength difference reinforces, while a half-wavelength offset cancels.
  </text>

  <rect x="102" y="176" width="1076" height="478" rx="34" class="card"/>
  <rect x="140" y="226" width="460" height="370" rx="26" class="panel"/>
  <rect x="680" y="226" width="460" height="370" rx="26" class="panel"/>

  <text x="370" y="268" class="label" text-anchor="middle">Constructive case</text>
  <text x="910" y="268" class="label" text-anchor="middle">Destructive case</text>

  <circle cx="234" cy="414" r="20" fill="#fbbf24"/>
  <circle cx="522" cy="414" r="20" fill="#22c55e"/>
  <path d="M 252 404 C 304 350 358 330 432 352" fill="none" stroke="#67e8f9" stroke-width="7"/>
  <path d="M 252 424 C 304 478 358 498 432 476" fill="none" stroke="#a78bfa" stroke-width="7"/>
  <path d="M 432 352 L 442 344 L 452 352" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  <path d="M 432 476 L 442 484 L 452 476" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <text x="370" y="334" class="small" text-anchor="middle">top route = 3 lambda</text>
  <text x="370" y="520" class="small" text-anchor="middle">bottom route = 2 lambda</text>
  <line x1="286" y1="564" x2="454" y2="564" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
  <text x="370" y="586" class="body" text-anchor="middle">difference = 1 lambda, bright fringe</text>

  <circle cx="774" cy="414" r="20" fill="#fbbf24"/>
  <circle cx="1062" cy="414" r="20" fill="#22c55e"/>
  <path d="M 792 396 C 850 336 912 320 980 346" fill="none" stroke="#67e8f9" stroke-width="7"/>
  <path d="M 792 432 C 850 492 912 506 980 476" fill="none" stroke="#f97316" stroke-width="7"/>
  <path d="M 980 346 L 990 338 L 1000 346" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  <path d="M 980 476 L 990 484 L 1000 476" fill="none" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <text x="910" y="334" class="small" text-anchor="middle">top route = 2.5 lambda</text>
  <text x="910" y="520" class="small" text-anchor="middle">bottom route = 2 lambda</text>
  <line x1="826" y1="564" x2="994" y2="564" stroke="#f8fafc" stroke-width="4" stroke-dasharray="12 12" stroke-linecap="round"/>
  <text x="910" y="586" class="body" text-anchor="middle">difference = 0.5 lambda, dark fringe</text>
  <text x="640" y="624" class="body" text-anchor="middle">Route difference is the geometry clue that turns into a phase outcome.</text>
</svg>
