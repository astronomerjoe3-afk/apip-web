<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="field-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
    <marker id="induced-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f97316" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Many linked windows strengthen the effect</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal"><tspan x="640.00" dy="0">Show a multi-turn coil sharing the same field so the</tspan><tspan x="640.00" dy="22">total linkage becomes visible.</tspan></text><text x="640.00" y="223.00" fill="#bae6fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">More linked turns mean a larger total thread score</text><line x1="222.22" y1="220.00" x2="222.22" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="306.67" y1="220.00" x2="306.67" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="391.11" y1="220.00" x2="391.11" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="475.56" y1="220.00" x2="475.56" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="560.00" y1="220.00" x2="560.00" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="644.44" y1="220.00" x2="644.44" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="728.89" y1="220.00" x2="728.89" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="813.33" y1="220.00" x2="813.33" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="897.78" y1="220.00" x2="897.78" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><circle cx="240.00" cy="390.00" r="20.00" fill="none" stroke="#a78bfa" stroke-width="4" /><circle cx="310.00" cy="390.00" r="20.00" fill="none" stroke="#a78bfa" stroke-width="4" /><circle cx="380.00" cy="390.00" r="20.00" fill="none" stroke="#a78bfa" stroke-width="4" /><circle cx="450.00" cy="390.00" r="20.00" fill="none" stroke="#a78bfa" stroke-width="4" /><circle cx="520.00" cy="390.00" r="20.00" fill="none" stroke="#a78bfa" stroke-width="4" /><text x="640.00" y="275.00" fill="#ddd6fe" text-anchor="middle" font-size="20" font-family="Arial" font-weight="bold">5 turns</text><text x="640.00" y="476.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal"><tspan x="640.00" dy="0">Flux linkage N Phi multiplies the through-thread score</tspan><tspan x="640.00" dy="22">by the number of turns in the coil.</tspan></text><line x1="260.00" y1="330.00" x2="260.00" y2="260.00" stroke="#facc15" stroke-width="5" /><text x="260.00" y="245.00" fill="#fde68a" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Phi on each turn</text><line x1="730.00" y1="330.00" x2="730.00" y2="260.00" stroke="#f97316" stroke-width="5" /><text x="730.00" y="245.00" fill="#fdba74" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">N Phi total</text></svg>
