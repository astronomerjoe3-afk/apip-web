<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 52px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 19px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 17px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Superposition Adds Displacement</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    Read both waves at the same place and time, then add the displacements to get the overlap result.
  </text>

  <rect x="92" y="178" width="1096" height="474" rx="34" class="card"/>
  <rect x="126" y="222" width="304" height="330" rx="26" class="panel"/>
  <rect x="488" y="222" width="304" height="330" rx="26" class="panel"/>
  <rect x="850" y="222" width="304" height="330" rx="26" class="panel"/>

  <text x="278" y="262" class="label" text-anchor="middle">Wave A</text>
  <text x="640" y="262" class="label" text-anchor="middle">Wave B</text>
  <text x="1002" y="262" class="label" text-anchor="middle">Combined wave</text>

  <line x1="158" y1="394" x2="398" y2="394" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 158 394 C 188 350 218 350 248 394 C 278 438 308 438 338 394 C 368 350 388 350 398 394"
        fill="none" stroke="#67e8f9" stroke-width="7"/>
  <text x="278" y="490" class="body" text-anchor="middle">positive displacement here</text>

  <line x1="520" y1="394" x2="760" y2="394" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 520 394 C 550 350 580 350 610 394 C 640 438 670 438 700 394 C 730 350 750 350 760 394"
        fill="none" stroke="#a78bfa" stroke-width="7"/>
  <text x="640" y="490" class="body" text-anchor="middle">another positive contribution</text>

  <line x1="882" y1="394" x2="1122" y2="394" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 882 394 C 912 322 942 322 972 394 C 1002 466 1032 466 1062 394 C 1092 322 1112 322 1122 394"
        fill="none" stroke="#22c55e" stroke-width="8"/>
  <text x="1002" y="486" class="body" text-anchor="middle">larger sum from two positive inputs</text>

  <rect x="210" y="578" width="860" height="42" rx="18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="640" y="606" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    Safe rule: same-place, same-time displacements add algebraically.
  </text>
</svg>
