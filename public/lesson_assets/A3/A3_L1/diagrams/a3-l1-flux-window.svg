      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
    <marker id="induced-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f97316" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Field threads through the window loop</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Show how field strength, window size, and tilt change the through-thread score.</text><line x1="200.00" y1="150.00" x2="200.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="240.00" y1="150.00" x2="240.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="280.00" y1="150.00" x2="280.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="320.00" y1="150.00" x2="320.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="360.00" y1="150.00" x2="360.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="400.00" y1="150.00" x2="400.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="440.00" y1="150.00" x2="440.00" y2="470.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><g transform="rotate(18.00 640.00 380.00)"><rect x="545.00" y="310.00" width="190.00" height="140.00" rx="18" fill="none" stroke="#f8fafc" stroke-width="7" /></g><line x1="640.00" y1="370.00" x2="640.00" y2="260.00" stroke="#facc15" stroke-width="5" marker-end="url(#field-arrow)" /><text x="686.00" y="264.00" fill="#fde68a" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">window normal</text><text x="640.00" y="215.00" fill="#bae6fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Face-on catches the maximum thread count</text><text x="640.00" y="516.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal"><tspan x="640.00" dy="0">Flux is field through the window,</tspan><tspan x="640.00" dy="22">not field strength alone</tspan></text><text x="226.00" y="500.00" fill="#38bdf8" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">stronger B</text><text x="414.00" y="500.00" fill="#e2e8f0" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">same window</text></svg>
