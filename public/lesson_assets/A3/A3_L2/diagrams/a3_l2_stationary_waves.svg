<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 50px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 22px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="86" class="title" text-anchor="middle">Standing Waves Hold Nodes Fixed</text>
  <text x="640" y="126" class="subtitle" text-anchor="middle">
    The pattern oscillates, but the nodes stay at zero displacement because opposite-traveling waves keep cancelling there.
  </text>

  <rect x="96" y="182" width="1088" height="470" rx="34" class="card"/>
  <rect x="132" y="228" width="660" height="372" rx="26" class="panel"/>
  <rect x="832" y="228" width="316" height="372" rx="26" class="panel"/>

  <text x="462" y="268" class="label" text-anchor="middle">Second harmonic example</text>
  <text x="990" y="268" class="label" text-anchor="middle">Reading clues</text>

  <line x1="184" y1="416" x2="740" y2="416" stroke="#475569" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 184 416 C 230 356 276 356 322 416 C 368 476 414 476 460 416 C 506 356 552 356 598 416 C 644 476 690 476 740 416"
        fill="none" stroke="#67e8f9" stroke-width="8"/>
  <circle cx="184" cy="416" r="9" fill="#f8fafc"/>
  <circle cx="462" cy="416" r="9" fill="#f8fafc"/>
  <circle cx="740" cy="416" r="9" fill="#f8fafc"/>
  <text x="184" y="454" class="small" text-anchor="middle">node</text>
  <text x="462" y="454" class="small" text-anchor="middle">node</text>
  <text x="740" y="454" class="small" text-anchor="middle">node</text>
  <text x="322" y="344" class="small" text-anchor="middle">antinode</text>
  <text x="598" y="344" class="small" text-anchor="middle">antinode</text>
  <text x="462" y="544" class="body" text-anchor="middle">Nodes stay quiet while the antinodes swing the most.</text>

  <circle cx="866" cy="336" r="10" fill="#22c55e"/>
  <text x="892" y="343" class="body">nodes are fixed zero points</text>
  <circle cx="866" cy="392" r="10" fill="#67e8f9"/>
  <text x="892" y="399" class="body">antinodes have maximum motion</text>
  <circle cx="866" cy="448" r="10" fill="#a78bfa"/>
  <text x="892" y="455" class="body">only boundary-fitting modes survive</text>
</svg>
