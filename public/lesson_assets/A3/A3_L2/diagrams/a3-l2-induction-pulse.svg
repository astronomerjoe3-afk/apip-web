<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 48px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 17px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Only Boundary-Fitting Harmonics Work</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Whole-number mode shapes fit the fixed ends cleanly, so the string can sustain them as stationary patterns.
  </text>

  <rect x="106" y="176" width="1068" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="292" height="374" rx="26" class="panel"/>
  <rect x="494" y="226" width="292" height="374" rx="26" class="panel"/>
  <rect x="844" y="226" width="292" height="374" rx="26" class="panel"/>

  <text x="290" y="266" class="label" text-anchor="middle">n = 1</text>
  <text x="640" y="266" class="label" text-anchor="middle">n = 2</text>
  <text x="990" y="266" class="label" text-anchor="middle">n = 3</text>

  <path d="M 186 430 C 238 330 342 330 394 430" fill="none" stroke="#67e8f9" stroke-width="8"/>
  <line x1="186" y1="430" x2="394" y2="430" stroke="#475569" stroke-width="2.5" stroke-dasharray="10 10"/>
  <text x="290" y="522" class="body" text-anchor="middle">one antinode</text>

  <path d="M 536 430 C 572 350 608 350 640 430 C 672 510 708 510 744 430" fill="none" stroke="#a78bfa" stroke-width="8"/>
  <line x1="536" y1="430" x2="744" y2="430" stroke="#475569" stroke-width="2.5" stroke-dasharray="10 10"/>
  <text x="640" y="522" class="body" text-anchor="middle">two antinodes</text>

  <path d="M 886 430 C 910 362 934 362 958 430 C 982 498 1006 498 1030 430 C 1054 362 1078 362 1094 430"
        fill="none" stroke="#22c55e" stroke-width="8"/>
  <line x1="886" y1="430" x2="1094" y2="430" stroke="#475569" stroke-width="2.5" stroke-dasharray="10 10"/>
  <text x="990" y="522" class="body" text-anchor="middle">three antinodes</text>
</svg>
