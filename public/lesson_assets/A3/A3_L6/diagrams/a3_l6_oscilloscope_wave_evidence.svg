<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 47px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Oscilloscope Traces Are Graphs Against Time</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    The screen is not a map of the wave moving through space. It is a graph showing signal level changing with time.
  </text>

  <rect x="94" y="176" width="1092" height="478" rx="34" class="card"/>
  <rect x="132" y="226" width="716" height="372" rx="26" class="panel"/>
  <rect x="878" y="226" width="270" height="372" rx="26" class="panel"/>

  <text x="490" y="268" class="label" text-anchor="middle">Reading one clean trace</text>
  <text x="1013" y="268" class="label" text-anchor="middle">What to read</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="200" y1="300" x2="200" y2="540"/>
    <line x1="292" y1="300" x2="292" y2="540"/>
    <line x1="384" y1="300" x2="384" y2="540"/>
    <line x1="476" y1="300" x2="476" y2="540"/>
    <line x1="568" y1="300" x2="568" y2="540"/>
    <line x1="660" y1="300" x2="660" y2="540"/>
    <line x1="752" y1="300" x2="752" y2="540"/>
    <line x1="200" y1="300" x2="752" y2="300"/>
    <line x1="200" y1="360" x2="752" y2="360"/>
    <line x1="200" y1="420" x2="752" y2="420"/>
    <line x1="200" y1="480" x2="752" y2="480"/>
    <line x1="200" y1="540" x2="752" y2="540"/>
  </g>
  <line x1="200" y1="420" x2="752" y2="420" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 200 420 C 240 340 280 340 320 420 C 360 500 400 500 440 420 C 480 340 520 340 560 420 C 600 500 640 500 680 420 C 720 340 744 340 752 420"
        fill="none" stroke="#67e8f9" stroke-width="8"/>
  <line x1="260" y1="420" x2="260" y2="340" stroke="#fbbf24" stroke-width="4"/>
  <line x1="248" y1="340" x2="272" y2="340" stroke="#fbbf24" stroke-width="4"/>
  <line x1="248" y1="420" x2="272" y2="420" stroke="#fbbf24" stroke-width="4"/>
  <text x="228" y="384" class="small" text-anchor="end">amplitude</text>
  <line x1="320" y1="560" x2="560" y2="560" stroke="#22c55e" stroke-width="4"/>
  <line x1="320" y1="548" x2="320" y2="572" stroke="#22c55e" stroke-width="4"/>
  <line x1="560" y1="548" x2="560" y2="572" stroke="#22c55e" stroke-width="4"/>
  <text x="440" y="590" class="small" text-anchor="middle">one period T</text>

  <text x="922" y="338" class="body">vertical axis = signal</text>
  <text x="922" y="392" class="body">horizontal axis = time</text>
  <text x="922" y="446" class="body">height gives amplitude</text>
  <text x="922" y="500" class="body">spacing gives period</text>
  <text x="922" y="554" class="body">frequency = 1 divided by T</text>
</svg>
