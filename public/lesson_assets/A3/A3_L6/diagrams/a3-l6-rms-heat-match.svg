<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 46px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Compare Height and Spacing Separately</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    On an oscilloscope, taller traces mean larger amplitude and tighter spacing means higher frequency. Do not mix the two readings.
  </text>

  <rect x="108" y="176" width="1064" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="448" height="372" rx="26" class="panel"/>
  <rect x="688" y="226" width="448" height="372" rx="26" class="panel"/>

  <text x="368" y="268" class="label" text-anchor="middle">Higher amplitude</text>
  <text x="912" y="268" class="label" text-anchor="middle">Higher frequency</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="196" y1="320" x2="540" y2="320"/>
    <line x1="196" y1="396" x2="540" y2="396"/>
    <line x1="196" y1="472" x2="540" y2="472"/>
    <line x1="196" y1="548" x2="540" y2="548"/>
    <line x1="196" y1="320" x2="196" y2="548"/>
    <line x1="282" y1="320" x2="282" y2="548"/>
    <line x1="368" y1="320" x2="368" y2="548"/>
    <line x1="454" y1="320" x2="454" y2="548"/>
    <line x1="540" y1="320" x2="540" y2="548"/>
  </g>
  <line x1="196" y1="434" x2="540" y2="434" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 196 434 C 232 366 268 366 304 434 C 340 502 376 502 412 434 C 448 366 484 366 520 434"
        fill="none" stroke="#67e8f9" stroke-width="8"/>
  <line x1="250" y1="434" x2="250" y2="366" stroke="#fbbf24" stroke-width="4"/>
  <line x1="238" y1="366" x2="262" y2="366" stroke="#fbbf24" stroke-width="4"/>
  <line x1="238" y1="434" x2="262" y2="434" stroke="#fbbf24" stroke-width="4"/>
  <text x="368" y="574" class="body" text-anchor="middle">same spacing, taller peaks</text>

  <g stroke="#334155" stroke-width="2">
    <line x1="740" y1="320" x2="1084" y2="320"/>
    <line x1="740" y1="396" x2="1084" y2="396"/>
    <line x1="740" y1="472" x2="1084" y2="472"/>
    <line x1="740" y1="548" x2="1084" y2="548"/>
    <line x1="740" y1="320" x2="740" y2="548"/>
    <line x1="826" y1="320" x2="826" y2="548"/>
    <line x1="912" y1="320" x2="912" y2="548"/>
    <line x1="998" y1="320" x2="998" y2="548"/>
    <line x1="1084" y1="320" x2="1084" y2="548"/>
  </g>
  <line x1="740" y1="434" x2="1084" y2="434" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <path d="M 740 434 C 762 386 784 386 806 434 C 828 482 850 482 872 434 C 894 386 916 386 938 434 C 960 482 982 482 1004 434 C 1026 386 1048 386 1070 434"
        fill="none" stroke="#22c55e" stroke-width="8"/>
  <line x1="780" y1="526" x2="888" y2="526" stroke="#f472b6" stroke-width="4"/>
  <line x1="780" y1="514" x2="780" y2="538" stroke="#f472b6" stroke-width="4"/>
  <line x1="888" y1="514" x2="888" y2="538" stroke="#f472b6" stroke-width="4"/>
  <text x="912" y="564" class="body" text-anchor="middle">same height, tighter spacing</text>
</svg>
