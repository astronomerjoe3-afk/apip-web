<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 47px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Spacing Controls the Angular Spread</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    With the same wavelength, tighter grating spacing gives larger diffraction angles. Wider spacing keeps the orders closer in.
  </text>

  <rect x="108" y="176" width="1064" height="478" rx="34" class="card"/>
  <rect x="144" y="226" width="448" height="372" rx="26" class="panel"/>
  <rect x="688" y="226" width="448" height="372" rx="26" class="panel"/>

  <text x="368" y="268" class="label" text-anchor="middle">Small d, wider spread</text>
  <text x="912" y="268" class="label" text-anchor="middle">Large d, tighter spread</text>

  <rect x="306" y="314" width="14" height="188" rx="7" fill="#cbd5e1"/>
  <line x1="314" y1="328" x2="314" y2="488" stroke="#0f172a" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="120" y1="408" x2="306" y2="408" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <line x1="320" y1="408" x2="504" y2="320" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
  <line x1="320" y1="408" x2="504" y2="496" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
  <text x="474" y="304" class="small">larger theta</text>
  <text x="474" y="530" class="small">larger theta</text>

  <rect x="850" y="314" width="14" height="188" rx="7" fill="#cbd5e1"/>
  <line x1="858" y1="328" x2="858" y2="488" stroke="#0f172a" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="664" y1="408" x2="850" y2="408" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <line x1="864" y1="408" x2="1040" y2="354" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
  <line x1="864" y1="408" x2="1040" y2="462" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
  <text x="1010" y="338" class="small">smaller theta</text>
  <text x="1010" y="492" class="small">smaller theta</text>

  <text x="640" y="624" class="body" text-anchor="middle">For one wavelength, smaller slit spacing pushes each allowed order farther from the center line.</text>
</svg>
