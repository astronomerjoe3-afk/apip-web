<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="field-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#38bdf8" />
    </marker>
    <marker id="induced-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#f97316" />
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#0b1020" />
<text x="640.00" y="70.00" fill="white" text-anchor="middle" font-size="34" font-family="Arial" font-weight="bold">Oppose-turn rule for changing flux</text><text x="640.00" y="105.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal"><tspan x="640.00" dy="0">Show a changing thread pattern through a loop, then compare</tspan><tspan x="640.00" dy="22">the induced response that resists the change.</tspan></text><text x="640.00" y="223.00" fill="#bae6fd" text-anchor="middle" font-size="22" font-family="Arial" font-weight="normal">Lenz's law opposes the change, not the field itself</text><line x1="286.67" y1="220.00" x2="286.67" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="320.00" y1="220.00" x2="320.00" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="353.33" y1="220.00" x2="353.33" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="386.67" y1="220.00" x2="386.67" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="420.00" y1="220.00" x2="420.00" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><line x1="453.33" y1="220.00" x2="453.33" y2="460.00" stroke="#38bdf8" stroke-width="4" marker-end="url(#field-arrow)" /><g transform="rotate(18.00 640.00 390.00)"><rect x="545.00" y="320.00" width="190.00" height="140.00" rx="18" fill="none" stroke="#f8fafc" stroke-width="7" /></g><path d="M 530.00 455.00 Q 640.00 540.00 750.00 455.00" stroke="#f97316" stroke-width="7" fill="none" marker-end="url(#induced-arrow)" /><text x="640.00" y="575.00" fill="#cbd5e1" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Incoming flux falls</text><text x="640.00" y="605.00" fill="#fdba74" text-anchor="middle" font-size="18" font-family="Arial" font-weight="normal">Induced field pushes back against the change</text><line x1="640.00" y1="370.00" x2="640.00" y2="270.00" stroke="#f97316" stroke-width="6" marker-end="url(#induced-arrow)" /><text x="688.00" y="274.00" fill="#fdba74" text-anchor="start" font-size="18" font-family="Arial" font-weight="normal">induced field</text></svg>
