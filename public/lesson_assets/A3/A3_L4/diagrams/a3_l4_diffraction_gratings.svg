<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 48px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Diffraction Gratings Produce Discrete Orders</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    A grating does not spray light everywhere. It selects special angles where the path difference lines up.
  </text>

  <rect x="92" y="176" width="1096" height="478" rx="34" class="card"/>
  <rect x="130" y="226" width="1018" height="372" rx="26" class="panel"/>

  <rect x="602" y="286" width="18" height="252" rx="9" fill="#cbd5e1"/>
  <line x1="610" y1="302" x2="610" y2="522" stroke="#0f172a" stroke-width="5" stroke-dasharray="10 10"/>
  <text x="610" y="562" class="body" text-anchor="middle">grating</text>

  <line x1="200" y1="412" x2="602" y2="412" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <polygon points="602,412 568,394 568,430" fill="#fbbf24"/>
  <text x="262" y="388" class="body">incoming beam</text>

  <line x1="620" y1="412" x2="1030" y2="412" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
  <line x1="620" y1="412" x2="1008" y2="304" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>
  <line x1="620" y1="412" x2="1008" y2="520" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>

  <circle cx="1060" cy="304" r="18" fill="#a78bfa"/>
  <circle cx="1088" cy="412" r="18" fill="#67e8f9"/>
  <circle cx="1060" cy="520" r="18" fill="#22c55e"/>
  <text x="1028" y="282" class="small">m = 1</text>
  <text x="1118" y="418" class="small">m = 0</text>
  <text x="1028" y="550" class="small">m = -1</text>

  <path d="M 676 412 A 86 86 0 0 1 748 350" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="760" y="356" class="small">theta</text>
  <path d="M 676 412 A 86 86 0 0 0 748 474" fill="none" stroke="#94a3b8" stroke-width="3"/>
  <text x="760" y="492" class="small">theta</text>

  <rect x="196" y="486" width="280" height="72" rx="20" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="336" y="518" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle">
    allowed directions satisfy
  </text>
  <text x="336" y="546" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    d sin theta = m lambda
  </text>
</svg>
