<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 47px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #0f172a; stroke: #334155; stroke-width: 3; }
      .panel { fill: #111b34; stroke: #334155; stroke-width: 2.5; }
      .label { fill: #e2e8f0; font: 700 22px Arial, Helvetica, sans-serif; }
      .body { fill: #cbd5e1; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #94a3b8; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="260" r="340" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Critical Angle Is the Last Escape Case</text>
  <text x="640" y="122" class="subtitle" text-anchor="middle">
    Start in the slower medium. Below critical the ray escapes, at critical it grazes the boundary, and beyond it reflects internally.
  </text>

  <rect x="90" y="176" width="1100" height="478" rx="34" class="card"/>
  <rect x="124" y="226" width="320" height="372" rx="26" class="panel"/>
  <rect x="480" y="226" width="320" height="372" rx="26" class="panel"/>
  <rect x="836" y="226" width="320" height="372" rx="26" class="panel"/>

  <text x="284" y="268" class="label" text-anchor="middle">Below critical</text>
  <text x="640" y="268" class="label" text-anchor="middle">At critical</text>
  <text x="996" y="268" class="label" text-anchor="middle">Beyond critical</text>

  <rect x="156" y="334" width="256" height="10" rx="5" fill="#cbd5e1"/>
  <line x1="284" y1="290" x2="284" y2="536" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="216" y1="484" x2="284" y2="344" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <line x1="284" y1="344" x2="362" y2="272" stroke="#67e8f9" stroke-width="7" stroke-linecap="round"/>
  <text x="284" y="558" class="body" text-anchor="middle">refracts out</text>

  <rect x="512" y="334" width="256" height="10" rx="5" fill="#cbd5e1"/>
  <line x1="640" y1="290" x2="640" y2="536" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="572" y1="484" x2="640" y2="344" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <line x1="640" y1="344" x2="742" y2="344" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
  <text x="640" y="558" class="body" text-anchor="middle">grazes along boundary</text>

  <rect x="868" y="334" width="256" height="10" rx="5" fill="#cbd5e1"/>
  <line x1="996" y1="290" x2="996" y2="536" stroke="#64748b" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="928" y1="484" x2="996" y2="344" stroke="#fbbf24" stroke-width="7" stroke-linecap="round"/>
  <line x1="996" y1="344" x2="1064" y2="484" stroke="#f472b6" stroke-width="7" stroke-linecap="round"/>
  <text x="996" y="558" class="body" text-anchor="middle">total internal reflection</text>
</svg>
