<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#173659"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="56%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { fill: #ffffff; font: 700 46px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #47627f; stroke-width: 3; }
      .panel { fill: #16243a; stroke: #537392; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 24px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
      .tag { fill: #8ec5ff; font: 700 18px Arial, Helvetica, sans-serif; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="640" cy="250" r="330" fill="url(#glow)"/>

  <text x="640" y="84" class="title" text-anchor="middle">Oscillation About Equilibrium</text>
  <text x="640" y="121" class="subtitle" text-anchor="middle">
    Repeated motion becomes an oscillation story only when a restoring effect points back toward the balance position.
  </text>

  <rect x="92" y="164" width="1096" height="500" rx="34" class="card"/>
  <text x="160" y="212" class="tag">RESTORING TENDENCY</text>

  <rect x="130" y="236" width="1020" height="200" rx="28" class="panel"/>
  <line x1="204" y1="334" x2="1076" y2="334" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="640" y1="274" x2="640" y2="394" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="640" y="264" class="small" text-anchor="middle">equilibrium</text>

  <circle cx="372" cy="334" r="30" fill="#fbbf24"/>
  <circle cx="640" cy="334" r="30" fill="#38bdf8"/>
  <circle cx="908" cy="334" r="30" fill="#34d399"/>

  <line x1="432" y1="302" x2="570" y2="302" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="570,302 540,286 540,318" fill="#f97316"/>
  <line x1="848" y1="366" x2="710" y2="366" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="710,366 740,350 740,382" fill="#f97316"/>

  <line x1="640" y1="410" x2="372" y2="410" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 9"/>
  <line x1="640" y1="410" x2="908" y2="410" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 9"/>
  <text x="506" y="398" class="small" text-anchor="middle">displacement x</text>
  <text x="774" y="398" class="small" text-anchor="middle">amplitude A at the turning point</text>

  <text x="372" y="284" class="body" text-anchor="middle">left displacement</text>
  <text x="908" y="284" class="body" text-anchor="middle">right displacement</text>
  <text x="500" y="286" class="small" text-anchor="middle">restoring direction</text>
  <text x="780" y="350" class="small" text-anchor="middle">restoring direction</text>

  <rect x="140" y="478" width="300" height="142" rx="24" class="panel"/>
  <rect x="490" y="478" width="300" height="142" rx="24" class="panel"/>
  <rect x="840" y="478" width="300" height="142" rx="24" class="panel"/>

  <text x="290" y="520" class="label" text-anchor="middle">Equilibrium</text>
  <text x="290" y="556" class="body" text-anchor="middle">The balance position is the center</text>
  <text x="290" y="582" class="body" text-anchor="middle">the oscillator moves about.</text>

  <text x="640" y="520" class="label" text-anchor="middle">Displacement</text>
  <text x="640" y="556" class="body" text-anchor="middle">Displacement tells how far and which</text>
  <text x="640" y="582" class="body" text-anchor="middle">side of equilibrium the object sits.</text>

  <text x="990" y="520" class="label" text-anchor="middle">Amplitude</text>
  <text x="990" y="556" class="body" text-anchor="middle">Amplitude is the maximum displacement,</text>
  <text x="990" y="582" class="body" text-anchor="middle">not the restoring force itself.</text>

  <text x="640" y="648" class="subtitle" text-anchor="middle">
    If the push back toward center disappears, the motion may still repeat but it is not the same oscillation model.
  </text>
</svg>
