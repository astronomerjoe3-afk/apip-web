<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="60" y="90" fill="#0f172a" font-family="Georgia, serif" font-size="58" font-weight="700">Threshold beats brightness at the release gate</text>
  <text x="60" y="150" fill="#475569" font-family="Arial, sans-serif" font-size="28">A low-grade bright beam can still fail. One strong enough photon can succeed immediately.</text>
  <rect x="70" y="220" width="1060" height="500" rx="34" fill="#e0ecff" stroke="#93c5fd" stroke-width="5"/>
  <text x="120" y="275" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Low-grade bright beam</text>
  <text x="760" y="275" fill="#166534" font-family="Arial, sans-serif" font-size="34" font-weight="700">High-grade beam above threshold</text>
  <line x1="595" y1="310" x2="595" y2="655" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="620" y1="310" x2="620" y2="655" stroke="#38bdf8" stroke-width="5" stroke-dasharray="12 10"/>
  <text x="650" y="370" fill="#0f172a" font-family="Arial, sans-serif" font-size="28">Release gate</text>
  <text x="650" y="410" fill="#475569" font-family="Arial, sans-serif" font-size="24">Unlock toll is paid per photon.</text>
  <g stroke="#ef4444" stroke-width="16" stroke-linecap="round">
    <line x1="160" y1="360" x2="470" y2="360"/>
    <line x1="160" y1="420" x2="470" y2="420"/>
    <line x1="160" y1="480" x2="470" y2="480"/>
    <line x1="160" y1="540" x2="470" y2="540"/>
  </g>
  <g stroke="#22c55e" stroke-width="16" stroke-linecap="round">
    <line x1="720" y1="360" x2="1030" y2="360"/>
    <line x1="720" y1="420" x2="1030" y2="420"/>
    <line x1="720" y1="480" x2="1030" y2="480"/>
  </g>
  <g stroke="#22c55e" stroke-width="10" stroke-linecap="round">
    <line x1="1035" y1="360" x2="1090" y2="330"/>
    <line x1="1035" y1="420" x2="1090" y2="390"/>
    <line x1="1035" y1="480" x2="1090" y2="450"/>
  </g>
  <text x="120" y="630" fill="#1e293b" font-family="Arial, sans-serif" font-size="26">More packets do not help if each one is below threshold.</text>
  <text x="720" y="630" fill="#1e293b" font-family="Arial, sans-serif" font-size="26">Above threshold, emission starts at once.</text>
</svg>
