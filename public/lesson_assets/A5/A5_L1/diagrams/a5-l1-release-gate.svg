<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1222"/>
      <stop offset="100%" stop-color="#1c3c61"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 45px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 20px Arial, Helvetica, sans-serif; }
      .card { fill: #101a2d; stroke: #4c6887; stroke-width: 3; }
      .panel { fill: #18263c; stroke: #587797; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 25px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">Return Arrows Tell You If Motion Can Oscillate</text>
  <text x="640" y="119" class="subtitle" text-anchor="middle">
    Check the displaced position first: the key question is always whether the system points back toward equilibrium.
  </text>

  <rect x="88" y="160" width="1104" height="468" rx="34" class="card"/>
  <rect x="128" y="208" width="476" height="308" rx="28" class="panel"/>
  <rect x="676" y="208" width="476" height="308" rx="28" class="panel"/>

  <text x="366" y="252" class="label" text-anchor="middle">Displaced to the left</text>
  <text x="914" y="252" class="label" text-anchor="middle">Displaced to the right</text>

  <line x1="182" y1="372" x2="550" y2="372" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="730" y1="372" x2="1098" y2="372" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>

  <line x1="366" y1="296" x2="366" y2="444" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="914" y1="296" x2="914" y2="444" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="366" y="286" class="small" text-anchor="middle">equilibrium</text>
  <text x="914" y="286" class="small" text-anchor="middle">equilibrium</text>

  <circle cx="262" cy="372" r="28" fill="#fbbf24"/>
  <circle cx="1018" cy="372" r="28" fill="#34d399"/>

  <line x1="308" y1="330" x2="462" y2="330" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
  <polygon points="462,330 430,312 430,348" fill="#f97316"/>
  <line x1="972" y1="414" x2="818" y2="414" stroke="#f97316" stroke-width="9" stroke-linecap="round"/>
  <polygon points="818,414 850,396 850,432" fill="#f97316"/>

  <text x="366" y="432" class="small" text-anchor="middle">restoring arrow points right</text>
  <text x="366" y="454" class="small" text-anchor="middle">back toward equilibrium</text>
  <text x="914" y="432" class="small" text-anchor="middle">restoring arrow points left</text>
  <text x="914" y="454" class="small" text-anchor="middle">back toward equilibrium</text>

  <line x1="366" y1="470" x2="262" y2="470" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="914" y1="470" x2="1018" y2="470" stroke="#60a5fa" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="314" y="494" class="small" text-anchor="middle">negative x</text>
  <text x="966" y="494" class="small" text-anchor="middle">positive x</text>

  <rect x="188" y="548" width="904" height="56" rx="18" fill="#0f2138" stroke="#4c6887" stroke-width="2"/>
  <text x="640" y="583" class="body" text-anchor="middle">
    Restoring direction flips with the sign of displacement, but in both cases it aims back toward equilibrium.
  </text>
</svg>
