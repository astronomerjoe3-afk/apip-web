<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08101e"/>
      <stop offset="100%" stop-color="#18385d"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 41px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 20px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #47627f; stroke-width: 3; }
      .panel { fill: #16243a; stroke: #577796; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 24px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">Period and Frequency Come From Cycle Spacing</text>
  <text x="640" y="119" class="subtitle" text-anchor="middle">
    A shorter period means more cycles fit into the same time window, so the frequency is higher.
  </text>

  <rect x="96" y="164" width="1088" height="486" rx="34" class="card"/>
  <rect x="132" y="212" width="660" height="392" rx="28" class="panel"/>
  <rect x="824" y="212" width="324" height="392" rx="28" class="panel"/>

  <text x="462" y="252" class="label" text-anchor="middle">Compare cycle spacing</text>
  <text x="986" y="252" class="label" text-anchor="middle">Reading rule</text>

  <line x1="182" y1="356" x2="744" y2="356" stroke="#526b85" stroke-width="2"/>
  <line x1="182" y1="488" x2="744" y2="488" stroke="#526b85" stroke-width="2"/>
  <path d="M196 356 C246 300, 296 300, 346 356 S446 412, 496 356 S596 300, 646 356" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>
  <path d="M196 488 C228 430, 260 430, 292 488 S356 546, 388 488 S452 430, 484 488 S548 546, 580 488 S644 430, 676 488" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round"/>

  <line x1="196" y1="282" x2="496" y2="282" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="196" y1="292" x2="196" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="496" y1="292" x2="496" y2="340" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="346" y="274" class="body" text-anchor="middle">longer period T</text>

  <line x1="196" y1="414" x2="388" y2="414" stroke="#e2e8f0" stroke-width="3"/>
  <line x1="196" y1="424" x2="196" y2="472" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="388" y1="424" x2="388" y2="472" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="292" y="406" class="body" text-anchor="middle">shorter period T</text>

  <text x="986" y="330" class="body" text-anchor="middle">Frequency counts cycles per second.</text>
  <text x="986" y="392" class="body" text-anchor="middle">If T gets smaller, more cycles fit into</text>
  <text x="986" y="420" class="body" text-anchor="middle">the same time window, so f gets larger.</text>
  <text x="986" y="494" class="body" text-anchor="middle">If T gets larger, fewer cycles fit into</text>
  <text x="986" y="522" class="body" text-anchor="middle">the same time window, so f gets smaller.</text>
  <text x="986" y="562" class="small" text-anchor="middle">Use the repeating spacing first, then translate to frequency.</text>
</svg>
