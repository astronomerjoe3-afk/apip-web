<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1120"/>
      <stop offset="100%" stop-color="#18395d"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 45px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 20px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #486480; stroke-width: 3; }
      .panel { fill: #16243a; stroke: #577796; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 24px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">Position and Energy Curves Tell the Same SHM Story</text>
  <text x="640" y="119" class="subtitle" text-anchor="middle">
    Potential energy grows toward the extremes, kinetic energy peaks at the center, and the total remains flat in the ideal model.
  </text>

  <rect x="96" y="162" width="1088" height="500" rx="34" class="card"/>
  <rect x="132" y="210" width="712" height="404" rx="28" class="panel"/>
  <rect x="876" y="210" width="272" height="404" rx="28" class="panel"/>

  <text x="488" y="250" class="label" text-anchor="middle">Energy versus displacement</text>
  <text x="1012" y="250" class="label" text-anchor="middle">Interpretation</text>

  <line x1="204" y1="534" x2="772" y2="534" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="284" y1="294" x2="284" y2="556" stroke="#cbd5e1" stroke-width="4"/>
  <text x="780" y="540" class="small">displacement x</text>
  <text x="292" y="302" class="small">energy</text>

  <path d="M244 500 Q488 250 732 500" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>
  <path d="M244 332 Q488 582 732 332" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
  <line x1="228" y1="332" x2="748" y2="332" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>

  <text x="664" y="286" class="body">potential energy</text>
  <text x="618" y="590" class="body">kinetic energy</text>
  <text x="566" y="322" class="body">total energy</text>

  <text x="1012" y="332" class="body" text-anchor="middle">At x equals 0 the kinetic curve is highest.</text>
  <text x="1012" y="406" class="body" text-anchor="middle">At the extremes the potential curve is highest.</text>
  <text x="1012" y="480" class="body" text-anchor="middle">The flat total line shows energy is trading form,</text>
  <text x="1012" y="508" class="body" text-anchor="middle">not disappearing.</text>
  <text x="1012" y="578" class="small" text-anchor="middle">That is why equilibrium is the fastest point, not an energy gap.</text>
</svg>
