<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="60" y="90" fill="#0f172a" font-family="Georgia, serif" font-size="58" font-weight="700">Tighter core bundles release binding credit</text>
  <text x="60" y="150" fill="#475569" font-family="Arial, sans-serif" font-size="28">Binding-energy change and mass defect describe one nuclear-energy story.</text>
  <rect x="80" y="220" width="1040" height="500" rx="34" fill="#eef2ff" stroke="#c4b5fd" stroke-width="5"/>
  <text x="185" y="290" fill="#1e293b" font-family="Arial, sans-serif" font-size="34" font-weight="700">Before</text>
  <text x="785" y="290" fill="#1e293b" font-family="Arial, sans-serif" font-size="34" font-weight="700">After</text>
  <g fill="#93c5fd">
    <circle cx="220" cy="430" r="28"/><circle cx="280" cy="360" r="28"/><circle cx="340" cy="440" r="28"/><circle cx="260" cy="500" r="28"/><circle cx="360" cy="360" r="28"/><circle cx="410" cy="440" r="28"/>
  </g>
  <g fill="#60a5fa">
    <circle cx="760" cy="420" r="28"/><circle cx="810" cy="370" r="28"/><circle cx="860" cy="420" r="28"/><circle cx="810" cy="470" r="28"/><circle cx="915" cy="420" r="28"/><circle cx="865" cy="470" r="28"/>
  </g>
  <text x="505" y="430" fill="#0f766e" font-family="Arial, sans-serif" font-size="34" font-weight="700">Delta E = Delta m c^2</text>
  <text x="160" y="625" fill="#475569" font-family="Arial, sans-serif" font-size="26">Looser bundle: higher energy state</text>
  <text x="730" y="625" fill="#475569" font-family="Arial, sans-serif" font-size="26">Tighter bundle: lower mass-energy state</text>
</svg>
