<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#17385d"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 45px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #46627f; stroke-width: 3; }
      .panel { fill: #16243a; stroke: #557597; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 23px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">SHM Swaps Energy Without Losing the Total</text>
  <text x="640" y="119" class="subtitle" text-anchor="middle">
    At the ends the stored energy is largest. At equilibrium the motion energy is largest. In the ideal model the total stays fixed.
  </text>

  <rect x="86" y="164" width="1108" height="500" rx="34" class="card"/>
  <rect x="122" y="214" width="320" height="328" rx="28" class="panel"/>
  <rect x="480" y="214" width="320" height="328" rx="28" class="panel"/>
  <rect x="838" y="214" width="320" height="328" rx="28" class="panel"/>

  <text x="282" y="252" class="label" text-anchor="middle">Left extreme</text>
  <text x="640" y="252" class="label" text-anchor="middle">Equilibrium</text>
  <text x="998" y="252" class="label" text-anchor="middle">Right extreme</text>

  <line x1="178" y1="320" x2="386" y2="320" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="536" y1="320" x2="744" y2="320" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="894" y1="320" x2="1102" y2="320" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <circle cx="212" cy="320" r="22" fill="#fbbf24"/>
  <circle cx="640" cy="320" r="22" fill="#38bdf8"/>
  <circle cx="1068" cy="320" r="22" fill="#34d399"/>

  <rect x="170" y="388" width="80" height="92" rx="12" fill="#34d399"/>
  <rect x="274" y="348" width="80" height="132" rx="12" fill="#fbbf24"/>
  <text x="210" y="500" class="small" text-anchor="middle">small KE</text>
  <text x="314" y="500" class="small" text-anchor="middle">large PE</text>

  <rect x="528" y="332" width="80" height="148" rx="12" fill="#34d399"/>
  <rect x="632" y="412" width="80" height="68" rx="12" fill="#fbbf24"/>
  <text x="568" y="500" class="small" text-anchor="middle">large KE</text>
  <text x="672" y="500" class="small" text-anchor="middle">small PE</text>

  <rect x="886" y="388" width="80" height="92" rx="12" fill="#34d399"/>
  <rect x="990" y="348" width="80" height="132" rx="12" fill="#fbbf24"/>
  <text x="926" y="500" class="small" text-anchor="middle">small KE</text>
  <text x="1030" y="500" class="small" text-anchor="middle">large PE</text>

  <rect x="168" y="582" width="944" height="32" rx="16" fill="#38bdf8" opacity="0.85"/>
  <text x="640" y="573" class="body" text-anchor="middle">Total energy stays constant across the whole ideal cycle.</text>
</svg>
