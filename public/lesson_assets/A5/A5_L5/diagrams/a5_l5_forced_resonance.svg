<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#16385d"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 46px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #486480; stroke-width: 3; }
      .panel { fill: #16243a; stroke: #567797; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 24px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">Resonance Appears Near Natural-Frequency Match</text>
  <text x="640" y="121" class="subtitle" text-anchor="middle">
    A driven oscillator responds most strongly when the driving rhythm lines up with the system's own natural timing.
  </text>

  <rect x="90" y="164" width="1100" height="496" rx="34" class="card"/>
  <rect x="126" y="212" width="708" height="400" rx="28" class="panel"/>
  <rect x="868" y="212" width="286" height="400" rx="28" class="panel"/>

  <text x="480" y="252" class="label" text-anchor="middle">Response amplitude versus driving frequency</text>
  <text x="1011" y="252" class="label" text-anchor="middle">What changes the peak</text>

  <line x1="194" y1="544" x2="778" y2="544" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="242" y1="292" x2="242" y2="564" stroke="#cbd5e1" stroke-width="4"/>
  <text x="748" y="572" class="small" text-anchor="end">driving frequency</text>
  <text x="250" y="300" class="small">amplitude</text>

  <line x1="514" y1="292" x2="514" y2="544" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="514" y="278" class="body" text-anchor="middle">natural frequency</text>

  <path d="M254 530 C344 520, 410 438, 470 304 S620 304, 766 530" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M254 530 C354 522, 430 462, 486 390 S602 390, 766 530" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linecap="round"/>

  <text x="698" y="348" class="body">light damping</text>
  <text x="652" y="430" class="body">heavier damping</text>

  <text x="1011" y="324" class="body" text-anchor="middle">The external driver</text>
  <text x="1011" y="350" class="body" text-anchor="middle">keeps feeding energy.</text>
  <text x="1011" y="402" class="body" text-anchor="middle">The tallest response comes</text>
  <text x="1011" y="428" class="body" text-anchor="middle">near the natural frequency.</text>
  <text x="1011" y="486" class="body" text-anchor="middle">More damping lowers</text>
  <text x="1011" y="512" class="body" text-anchor="middle">the peak and spreads it out.</text>
  <text x="1011" y="560" class="small" text-anchor="middle">Resonance is a match condition, not a new force.</text>
</svg>
