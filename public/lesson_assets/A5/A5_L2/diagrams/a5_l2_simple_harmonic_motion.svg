<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1323"/>
      <stop offset="100%" stop-color="#163a5c"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 42px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 21px Arial, Helvetica, sans-serif; }
      .card { fill: #101b2f; stroke: #46627f; stroke-width: 3; }
      .panel { fill: #16263c; stroke: #577796; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 25px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">SHM Uses a Proportional Restoring Acceleration</text>
  <text x="640" y="121" class="subtitle" text-anchor="middle">
    Acceleration grows with displacement size and always points back toward equilibrium.
  </text>

  <rect x="90" y="162" width="1100" height="488" rx="34" class="card"/>
  <rect x="126" y="208" width="520" height="368" rx="28" class="panel"/>
  <rect x="676" y="208" width="476" height="368" rx="28" class="panel"/>

  <text x="386" y="252" class="label" text-anchor="middle">Acceleration versus displacement</text>
  <text x="914" y="252" class="label" text-anchor="middle">Three position checks</text>

  <line x1="206" y1="516" x2="566" y2="516" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="386" y1="292" x2="386" y2="536" stroke="#cbd5e1" stroke-width="4"/>
  <text x="576" y="522" class="small">+x</text>
  <text x="188" y="522" class="small">-x</text>
  <text x="394" y="300" class="small">+a</text>
  <text x="394" y="548" class="small">-a</text>

  <line x1="236" y1="338" x2="536" y2="494" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="296" cy="370" r="9" fill="#f8fafc"/>
  <circle cx="386" cy="416" r="9" fill="#f8fafc"/>
  <circle cx="476" cy="462" r="9" fill="#f8fafc"/>
  <text x="386" y="562" class="body" text-anchor="middle">larger |x| gives larger |a|</text>
  <text x="386" y="586" class="body" text-anchor="middle">and the sign is opposite</text>

  <rect x="710" y="286" width="120" height="220" rx="20" fill="#0f2138" stroke="#4f7092" stroke-width="2"/>
  <rect x="854" y="286" width="120" height="220" rx="20" fill="#0f2138" stroke="#4f7092" stroke-width="2"/>
  <rect x="998" y="286" width="120" height="220" rx="20" fill="#0f2138" stroke="#4f7092" stroke-width="2"/>

  <text x="770" y="320" class="small" text-anchor="middle">x less than 0</text>
  <text x="914" y="320" class="small" text-anchor="middle">x equals 0</text>
  <text x="1058" y="320" class="small" text-anchor="middle">x greater than 0</text>

  <line x1="770" y1="384" x2="808" y2="384" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="808,384 780,368 780,400" fill="#f97316"/>
  <circle cx="748" cy="384" r="18" fill="#fbbf24"/>
  <text x="770" y="430" class="small" text-anchor="middle">a points right</text>
  <text x="770" y="452" class="small" text-anchor="middle">toward center</text>

  <circle cx="914" cy="384" r="18" fill="#38bdf8"/>
  <text x="914" y="438" class="small" text-anchor="middle">a equals 0</text>
  <text x="914" y="460" class="small" text-anchor="middle">at equilibrium</text>

  <line x1="1058" y1="384" x2="1020" y2="384" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="1020,384 1048,368 1048,400" fill="#f97316"/>
  <circle cx="1080" cy="384" r="18" fill="#34d399"/>
  <text x="1058" y="430" class="small" text-anchor="middle">a points left</text>
  <text x="1058" y="452" class="small" text-anchor="middle">toward center</text>

  <text x="914" y="552" class="body" text-anchor="middle">A compact SHM rule: acceleration is proportional to minus displacement.</text>
</svg>
