<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09111f"/>
      <stop offset="100%" stop-color="#17365a"/>
    </linearGradient>
    <style>
      .title { fill: #ffffff; font: 700 44px Arial, Helvetica, sans-serif; }
      .subtitle { fill: #dbeafe; font: 20px Arial, Helvetica, sans-serif; }
      .card { fill: #101a2d; stroke: #496683; stroke-width: 3; }
      .panel { fill: #17263b; stroke: #567595; stroke-width: 2.4; }
      .label { fill: #f8fafc; font: 700 24px Arial, Helvetica, sans-serif; }
      .body { fill: #dbeafe; font: 18px Arial, Helvetica, sans-serif; }
      .small { fill: #bfdbfe; font: 16px Arial, Helvetica, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="640" y="84" class="title" text-anchor="middle">Equal Displacements Give Equal Restoring Pull</text>
  <text x="640" y="119" class="subtitle" text-anchor="middle">
    Compare the same distance on opposite sides of equilibrium: the acceleration flips direction but keeps the same magnitude.
  </text>

  <rect x="102" y="164" width="1076" height="488" rx="34" class="card"/>
  <rect x="136" y="214" width="1008" height="238" rx="28" class="panel"/>

  <line x1="218" y1="334" x2="1062" y2="334" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>
  <line x1="640" y1="256" x2="640" y2="412" stroke="#e2e8f0" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="640" y="246" class="small" text-anchor="middle">equilibrium</text>

  <circle cx="412" cy="334" r="28" fill="#fbbf24"/>
  <circle cx="640" cy="334" r="20" fill="#38bdf8"/>
  <circle cx="868" cy="334" r="28" fill="#34d399"/>

  <line x1="462" y1="288" x2="578" y2="288" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="578,288 548,272 548,304" fill="#f97316"/>
  <line x1="818" y1="380" x2="702" y2="380" stroke="#f97316" stroke-width="8" stroke-linecap="round"/>
  <polygon points="702,380 732,364 732,396" fill="#f97316"/>

  <line x1="412" y1="430" x2="640" y2="430" stroke="#60a5fa" stroke-width="4" stroke-dasharray="9 8"/>
  <line x1="640" y1="430" x2="868" y2="430" stroke="#60a5fa" stroke-width="4" stroke-dasharray="9 8"/>
  <text x="526" y="420" class="small" text-anchor="middle">same |x|</text>
  <text x="754" y="420" class="small" text-anchor="middle">same |x|</text>

  <rect x="152" y="490" width="300" height="118" rx="24" class="panel"/>
  <rect x="490" y="490" width="300" height="118" rx="24" class="panel"/>
  <rect x="828" y="490" width="300" height="118" rx="24" class="panel"/>

  <text x="302" y="530" class="label" text-anchor="middle">Left side</text>
  <text x="302" y="566" class="body" text-anchor="middle">negative displacement</text>
  <text x="302" y="590" class="body" text-anchor="middle">positive acceleration</text>

  <text x="640" y="530" class="label" text-anchor="middle">Center</text>
  <text x="640" y="566" class="body" text-anchor="middle">zero displacement</text>
  <text x="640" y="590" class="body" text-anchor="middle">zero restoring acceleration</text>

  <text x="978" y="530" class="label" text-anchor="middle">Right side</text>
  <text x="978" y="566" class="body" text-anchor="middle">positive displacement</text>
  <text x="978" y="590" class="body" text-anchor="middle">negative acceleration</text>
</svg>
