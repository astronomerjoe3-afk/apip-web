<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="60" y="90" fill="#0f172a" font-family="Georgia, serif" font-size="58" font-weight="700">Pay the work-function toll, then keep the kick</text>
  <text x="60" y="150" fill="#475569" font-family="Arial, sans-serif" font-size="28">Read hf = phi + Kmax as one clean energy budget for one emitted electron event.</text>
  <rect x="80" y="220" width="1040" height="500" rx="34" fill="#eff6ff" stroke="#93c5fd" stroke-width="5"/>
  <text x="190" y="300" fill="#0369a1" font-family="Arial, sans-serif" font-size="34" font-weight="700">Photon energy hf</text>
  <rect x="140" y="340" width="160" height="250" rx="24" fill="#38bdf8"/>
  <text x="160" y="635" fill="#1e293b" font-family="Arial, sans-serif" font-size="26">Incoming packet energy</text>
  <text x="455" y="300" fill="#c2410c" font-family="Arial, sans-serif" font-size="34" font-weight="700">Work function phi</text>
  <rect x="430" y="390" width="160" height="200" rx="24" fill="#fb923c"/>
  <text x="430" y="635" fill="#1e293b" font-family="Arial, sans-serif" font-size="26">Unlock toll</text>
  <text x="790" y="300" fill="#15803d" font-family="Arial, sans-serif" font-size="34" font-weight="700">Maximum kick Kmax</text>
  <rect x="760" y="470" width="160" height="120" rx="24" fill="#22c55e"/>
  <text x="740" y="635" fill="#1e293b" font-family="Arial, sans-serif" font-size="26">Leftover kinetic energy</text>
  <text x="420" y="430" fill="#0f172a" font-family="Arial, sans-serif" font-size="24">Threshold case: Kmax = 0</text>
  <text x="420" y="470" fill="#475569" font-family="Arial, sans-serif" font-size="24">All photon energy is used freeing the electron.</text>
</svg>
